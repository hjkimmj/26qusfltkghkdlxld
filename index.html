 실질적으로 저촉되는 판단을 하는 것은 구 특허법 제163조가 정한 일사부재 리 원칙의 취지에 비추어 허용되지 아니한다고 할 것이나, 전에 확정된 심결의 증거를 그 심결에서 판단하지 아니하였던 사항에 관한 증거로 들어 판단하거나 그 증거의 선행기술을 확정된 심결의 결론을 번복할 만한 유력한 증거의 선행기술에 추가적, 보충적으로 결합하여 판단하는 경우 등과 같이 후행 심판청구에 대한 판단 내용이 확정된 심결의 기본이 된 이유와 실질적으로 저촉된다고 할 수 없는 경우에는, 확정된 심결과 그 결론이 결과적으로 달라졌다고 하더라도 일사부재리 원칙에 반한다고 할 수 없다."}]},{"section":"특허심판 - 일사부재리 및 중복심판금지 원칙","question":"확정심결에 새로운 청구원인이 추가된 경우 대법원 2017. 1. 19. 선고 2013후37 전원합의체 판결 특허나 실용신안의 등록무효심판청구에 관하여 종전에 확정된 심결이 있으나 종전 심판에서 청구원인이 된 무효사유 외에 다른 무효사유가 추가된 경우, 새로운 심판청구가 일사부재리의 원칙에 위배되는지 여부(소극) 및 이 경우 종전 심결과 다른 결론을 내리기 위해서는 종전에 확정된 심결에서 판단이 이루어진 청구원인과 공통되는 부분에 대해서 확정된 심결을 번복할 수 있을 정도로 유력한 증거가 새로 제출되어야 하는지 여부(적극)","answer":"특허나 실용신안의 등록무효심판청구에 관하여 종전에 확정된 심결이 있더라도 종전 심판에서 청구원 인이 된 무효사유 외에 다른 무효사유가 추가된 경우에는 새로운 심판청구는 그 자체로 동일사실에 의한 것 이 아니어서 일사부재리의 원칙에 위배되지는 아니한다. 그러나 모순 저촉되는 복수의 심결이 발생하는 것을 방지하고자 하는 일사부재리 제도의 취지를 고려하면, 위와 같은 경우에도 종전에 확정된 심결에서 판단이 이루어진 청구원인과 공통되는 부분에 대해서는 일사 부재리의 원칙 위배 여부의 관점에서 그 확정된 심결을 번복할 수 있을 정도로 유력한 증거가 새로이 제출되 었는지를 따져 종전 심결에서와 다른 결론을 내릴 것인지를 판단하여야 한다. 각하심결의 일사부재리 효력","slides":[{"label":"판시사항","text":"확정심결에 새로운 청구원인이 추가된 경우 대법원 2017. 1. 19. 선고 2013후37 전원합의체 판결 특허나 실용신안의 등록무효심판청구에 관하여 종전에 확정된 심결이 있으나 종전 심판에서 청구원인이 된 무효사유 외에 다른 무효사유가 추가된 경우, 새로운 심판청구가 일사부재리의 원칙에 위배되는지 여부(소극) 및 이 경우 종전 심결과 다른 결론을 내리기 위해서는 종전에 확정된 심결에서 판단이 이루어진 청구원인과 공통되는 부분에 대해서 확정된 심결을 번복할 수 있을 정도로 유력한 증거가 새로 제출되어야 하는지 여부(적극)"},{"label":"판결요지","text":"특허나 실용신안의 등록무효심판청구에 관하여 종전에 확정된 심결이 있더라도 종전 심판에서 청구원 인이 된 무효사유 외에 다른 무효사유가 추가된 경우에는 새로운 심판청구는 그 자체로 동일사실에 의한 것 이 아니어서 일사부재리의 원칙에 위배되지는 아니한다. 그러나 모순 저촉되는 복수의 심결이 발생하는 것을 방지하고자 하는 일사부재리 제도의 취지를 고려하면, 위와 같은 경우에도 종전에 확정된 심결에서 판단이 이루어진 청구원인과 공통되는 부분에 대해서는 일사 부재리의 원칙 위배 여부의 관점에서 그 확정된 심결을 번복할 수 있을 정도로 유력한 증거가 새로이 제출되 었는지를 따져 종전 심결에서와 다른 결론을 내릴 것인지를 판단하여야 한다. 각하심결의 일사부재리 효력"}]},{"section":"특허심판 - 일사부재리 및 중복심판금지 원칙","question":"각하심결의 일사부재리 효력 – 동일 증거 판단이 이루어진 경우 대법원 2021. 6. 3. 선고 2021후10077 판결 확정된 심결이 각하심결인 경우에는 일사부재리의 효력이 없다고 정한 특허법 제163조 단서 규정이 새로 제출된 증거가 선행 확정 심결을 번복할 수 있을 만큼 유력한 증거인지에 관한 심리ㆍ판단이 이루어진 후 선행 확정 심결과 동일 증거에 의한 심판청구라는 이유로 각하된 심결인 경우에도 적용되는지 여부(적극)","answer":"확정된 심결이 심판 청구의 적법요건을 갖추지 못하여 각하된 심결인 경우에는 특허법 제163조 단서에 따라 일사부재리의 효력이 없다. 다음과 같은 점을 고려하면, 위 단서 규정은 새로 제출된 증거가 선행 확정 심결을 번복할 수 있을 만큼 유 력한 증거인지에 관한 심리․판단이 이루어진 후 선행 확정 심결과 동일 증거에 의한 심판청구라는 이유로 각 하된 심결인 경우에도 동일하게 적용된다고 보아야 한다.","slides":[{"label":"판시사항","text":"각하심결의 일사부재리 효력 – 동일 증거 판단이 이루어진 경우 대법원 2021. 6. 3. 선고 2021후10077 판결 확정된 심결이 각하심결인 경우에는 일사부재리의 효력이 없다고 정한 특허법 제163조 단서 규정이 새로 제출된 증거가 선행 확정 심결을 번복할 수 있을 만큼 유력한 증거인지에 관한 심리ㆍ판단이 이루어진 후 선행 확정 심결과 동일 증거에 의한 심판청구라는 이유로 각하된 심결인 경우에도 적용되는지 여부(적극)"},{"label":"판결요지","text":"확정된 심결이 심판 청구의 적법요건을 갖추지 못하여 각하된 심결인 경우에는 특허법 제163조 단서에 따라 일사부재리의 효력이 없다. 다음과 같은 점을 고려하면, 위 단서 규정은 새로 제출된 증거가 선행 확정 심결을 번복할 수 있을 만큼 유 력한 증거인지에 관한 심리․판단이 이루어진 후 선행 확정 심결과 동일 증거에 의한 심판청구라는 이유로 각 하된 심결인 경우에도 동일하게 적용된다고 보아야 한다."}]},{"section":"특허심판 - 일사부재리 및 중복심판금지 원칙","question":"일사부재리 원칙 기준시점 – 선행심결의 확정여부 대법원 2012. 1. 19. 선고 2009후2234 전원합의체 판결 판시 구 특허법 제163조에서 정한 일사부재리의 원칙에 따라 심판청구가 부적법하게 되는지 판단하는 기준 시 사항 점(=심판 청구시)","answer":"일사부재리의 원칙에 따라 심판청구가 부적법하게 되는지 여부를 판단하는 기준시점은 심판청구를 제기하 던 당시로 보아야 할 것이고, 심판청구 후에 비로소 동일사실 및 동일증거에 의한 다른 심판의 심결이 확정 등록된 경우에는 당해 심판청구를 일사부재리의 원칙에 의하여부적법하다고 할 수 없다.","slides":[{"label":"판시사항","text":"일사부재리 원칙 기준시점 – 선행심결의 확정여부 대법원 2012. 1. 19. 선고 2009후2234 전원합의체 판결 판시 구 특허법 제163조에서 정한 일사부재리의 원칙에 따라 심판청구가 부적법하게 되는지 판단하는 기준 시 사항 점(=심판 청구시)"},{"label":"판결요지","text":"일사부재리의 원칙에 따라 심판청구가 부적법하게 되는지 여부를 판단하는 기준시점은 심판청구를 제기하 던 당시로 보아야 할 것이고, 심판청구 후에 비로소 동일사실 및 동일증거에 의한 다른 심판의 심결이 확정 등록된 경우에는 당해 심판청구를 일사부재리의 원칙에 의하여부적법하다고 할 수 없다."}]},{"section":"특허심판 - 일사부재리 및 중복심판금지 원칙","question":"일사부재리 원칙 기준시점 – 동일증거 사실여부 대법원 2020. 4. 9. 선고 2018후11360 판결 특허심판원이 심판청구가 선행 확정 심결과 동일한 사실 증거에 기초한 것이어서 특허법 제163조에서 판시 정한 ‘일사부재리 원칙’에 위반되는지를 판단하는 기준 시점(=심결 시) / 일사부재리 원칙 위반을 이유로 사항 등록무효 심판청구를 각하한 심결에 대한 취소소송에서도 심결 시를 기준으로 동일 사실 및 증거 제출 여부를 심리하여 일사부재리 원칙 위반 여부를 판단하여야 하는지 여부(적극)","answer":"심판청구인은 심판청구서를 제출한 후 그 요지를 변경할 수 없으나 청구의 이유를 보정하는 것은 허 용된다(특허법 제140조 제2항 참조). 따라서 특허심판원은 심판청구 후 심결 시까지 보정된 사실과 이에 대한 증거를 모두 고려하여 심결 시를 기준으로 심판청구가 선행 확정 심결과 동일한 사실 증거에 기초한 것 이라서 일사부재리 원칙에 위반되는지 여부를 판단하여야 한다. 대법원 2012. 1. 19. 선고 2009후2234 전원합의체 판결은 ‘일사부재리의 원칙에 따라 심판청구가 부적법하게 되는지 여부를 판단하는 기준 시점은 심판청구를 제기하던 당시로 보아야 한다.’고 하였는데, 이는 선 행 심결의 확정을 판단하는 기준 시점이 쟁점이 된 사안에서 특허법상 일사부재리 원칙의 대세효로 제3자의 권리 제한을 최소화하기 위하여부득이하게 선행 심결의 확정과 관련해서만 그 기준 시점을 심결 시에서 심판청구 시로 변경한 것이다.","slides":[{"label":"판시사항","text":"일사부재리 원칙 기준시점 – 동일증거 사실여부 대법원 2020. 4. 9. 선고 2018후11360 판결 특허심판원이 심판청구가 선행 확정 심결과 동일한 사실 증거에 기초한 것이어서 특허법 제163조에서 판시 정한 ‘일사부재리 원칙’에 위반되는지를 판단하는 기준 시점(=심결 시) / 일사부재리 원칙 위반을 이유로 사항 등록무효 심판청구를 각하한 심결에 대한 취소소송에서도 심결 시를 기준으로 동일 사실 및 증거 제출 여부를 심리하여 일사부재리 원칙 위반 여부를 판단하여야 하는지 여부(적극)"},{"label":"판결요지","text":"심판청구인은 심판청구서를 제출한 후 그 요지를 변경할 수 없으나 청구의 이유를 보정하는 것은 허 용된다(특허법 제140조 제2항 참조). 따라서 특허심판원은 심판청구 후 심결 시까지 보정된 사실과 이에 대한 증거를 모두 고려하여 심결 시를 기준으로 심판청구가 선행 확정 심결과 동일한 사실 증거에 기초한 것 이라서 일사부재리 원칙에 위반되는지 여부를 판단하여야 한다. 대법원 2012. 1. 19. 선고 2009후2234 전원합의체 판결은 ‘일사부재리의 원칙에 따라 심판청구가 부적법하게 되는지 여부를 판단하는 기준 시점은 심판청구를 제기하던 당시로 보아야 한다.’고 하였는데, 이는 선 행 심결의 확정을 판단하는 기준 시점이 쟁점이 된 사안에서 특허법상 일사부재리 원칙의 대세효로 제3자의 권리 제한을 최소화하기 위하여부득이하게 선행 심결의 확정과 관련해서만 그 기준 시점을 심결 시에서 심판청구 시로 변경한 것이다."}]},{"section":"특허심판 - 일사부재리 및 중복심판금지 원칙","question":"중복심판금지 원칙 기준시점 – 심결시 대법원 2020. 4. 29. 선고 2016후2317 판결 판시 특허심판원에 계속 중인 심판에 대하여 동일한 당사자가 동일한 심판을 다시 청구한 경우, 후심판이 중복 사항 심판청구 금지에 위반되는지 판단하는 기준 시점(=후심판의 심결 시)","answer":"특허심판원에 계속 중인 심판(이하 ‘전심판’이라 한다)에 대하여 동일한 당사자가 동일한 심판을 다시 청구한 경우(이하 ‘후심판’이라 한다), 후심판의 심결 시를 기준으로 한 전심판의 심판계속 여부에 따라 후심판의 적법 여부를 판단하여야 한다. ","slides":[{"label":"판시사항","text":"중복심판금지 원칙 기준시점 – 심결시 대법원 2020. 4. 29. 선고 2016후2317 판결 판시 특허심판원에 계속 중인 심판에 대하여 동일한 당사자가 동일한 심판을 다시 청구한 경우, 후심판이 중복 사항 심판청구 금지에 위반되는지 판단하는 기준 시점(=후심판의 심결 시)"},{"label":"판결요지","text":"특허심판원에 계속 중인 심판(이하 ‘전심판’이라 한다)에 대하여 동일한 당사자가 동일한 심판을 다시 청구한 경우(이하 ‘후심판’이라 한다), 후심판의 심결 시를 기준으로 한 전심판의 심판계속 여부에 따라 후심판의 적법 여부를 판단하여야 한다. 2 특허취소신청"}]},{"section":"특허심판 - 특허취소신청","question":"특허취소신청 요건 및 정정청구에 따른 심리 특허법원 2025. 5. 1. 선고 2024허14292 판결 특허공보에 게재 등록된 선행기술 외에 다른 선행기술을 추가하여 취소신청의 근거로 삼더라도, 특허법 제132조의2 제2항에 위반되지 않는지 여부 (적극) 및 특허취소신청 절차에서 정정청구가 있는 경우, 그 정정의 인정 여부가 무효 취소 여부와 함께 확정되고 정정청구만 따로 확정되지 않는지 여부 (적극)","answer":"특허법 제132조의2 제2항의 객관적 문언과 입법취지 등 다음과 같은 사정들을 모두 종합하여 보면, ‘특허공보에 게재된 제87조 제3항 제7호에 따른 선행기술’이란, 이 사건 특허발명의 심사 과정에서 거절이 유로 심사되어 특허공보에 게재 등록 공고된 선행기술만을 의미한다고 해석함이 타당하고, 이 사건 취소신청은 위와 같이 특허공보에 게재 등록된 선행기술인 선행발명 1, 3 외에도 선행발명 2를 추가하여 이를 근거 로 한 신청이므로 특허법 제132조의2 제2항을 위반한 것으로 볼 수 없다. ... 1) 특허무효심판절차에 정정청구가 있는 경우, 정정의 인정 여부는 무효심판절차에서 함께 심리되는 것 이므로 독립된 정정심판청구의 경우와 달리 정정청구 부분은 따로 확정되지 아니하고 무효심판의 심결이 확정되는 때에 함께 확정된다(대법원 2011. 2. 10. 선고 2010후2698 판결). 또한 특허무효 여부는 청구항 별로 판단하더라도 특허무효심판절차에서의 정정청구는 특별한 사정이 없는 한 불가분의 관계에 있어 일체 로서 허용 여부를 판단하여야 하며(대법원 2009. 1. 15. 선고 2007후1053 판결 등 참조), 이와 같은 법리는 특허취소신청절차에서 정정청구가 있는 경우에도 적용된다(대법원 2008. 6. 26. 선고 2006후 2912 판결의 취지 참조). 특허취소신청의 심리범위","slides":[{"label":"판시사항","text":"특허취소신청 요건 및 정정청구에 따른 심리 특허법원 2025. 5. 1. 선고 2024허14292 판결 특허공보에 게재 등록된 선행기술 외에 다른 선행기술을 추가하여 취소신청의 근거로 삼더라도, 특허법 제132조의2 제2항에 위반되지 않는지 여부 (적극) 및 특허취소신청 절차에서 정정청구가 있는 경우, 그 정정의 인정 여부가 무효 취소 여부와 함께 확정되고 정정청구만 따로 확정되지 않는지 여부 (적극)"},{"label":"판결요지","text":"특허법 제132조의2 제2항의 객관적 문언과 입법취지 등 다음과 같은 사정들을 모두 종합하여 보면, ‘특허공보에 게재된 제87조 제3항 제7호에 따른 선행기술’이란, 이 사건 특허발명의 심사 과정에서 거절이 유로 심사되어 특허공보에 게재 등록 공고된 선행기술만을 의미한다고 해석함이 타당하고, 이 사건 취소신청은 위와 같이 특허공보에 게재 등록된 선행기술인 선행발명 1, 3 외에도 선행발명 2를 추가하여 이를 근거 로 한 신청이므로 특허법 제132조의2 제2항을 위반한 것으로 볼 수 없다. ... 1) 특허무효심판절차에 정정청구가 있는 경우, 정정의 인정 여부는 무효심판절차에서 함께 심리되는 것 이므로 독립된 정정심판청구의 경우와 달리 정정청구 부분은 따로 확정되지 아니하고 무효심판의 심결이 확정되는 때에 함께 확정된다(대법원 2011. 2. 10. 선고 2010후2698 판결). 또한 특허무효 여부는 청구항 별로 판단하더라도 특허무효심판절차에서의 정정청구는 특별한 사정이 없는 한 불가분의 관계에 있어 일체 로서 허용 여부를 판단하여야 하며(대법원 2009. 1. 15. 선고 2007후1053 판결 등 참조), 이와 같은 법리는 특허취소신청절차에서 정정청구가 있는 경우에도 적용된다(대법원 2008. 6. 26. 선고 2006후 2912 판결의 취지 참조). 특허취소신청의 심리범위"}]},{"section":"특허심판 - 판결의 취지 참조).","question":"특허취소신청의 심리범위 – 제132조의2 제2항과의 관계 특허법원 2020. 12. 4. 선고 2019허8118 판결 이 사건 결정이 특허취소신청에 관한 심리범위를 벗어난 것인지 여부","answer":"나) 특허법 제132조의2 제2항은 ‘특허공보에 게재된 제87조 제3항 제7호에 따른 선행기술에 기초한 이 유로는 특허취소신청을 할 수 없다’고 하여 특허취소신청인의 신청사유를 제한하고 있을 뿐이다 같은 법 제132조의10 제1항은 ‘심판관은 특허취소신청에 관하여 특허취소신청인, 특허권자 또는 참가인이 제출하지 아니한 이유에 대해서도 심리할 수 있다’고 규정하고 있고, 같은 조 제2항은 ‘심판관은 특허취소 신청에 관하여 특허취소신청인이 신청하지 아니한 청구항에 대해서는 심리할 수 없다’고 규정하고 있 으며 그밖에 달리 특허취소신청에 관한 심리범위에 대한 제한을 두고 있지 않다. 이와 다른 전제에 선 원고의 주장 즉 같은 법 제132조의2에서 들고 있는 한계 내에서만 특허심판원이 특허취소신청에 관한 직권심리를 할 수 있다고 보아야 한다는 법률적 주장은 받아들이기 어렵다.","slides":[{"label":"판시사항","text":"특허취소신청의 심리범위 – 제132조의2 제2항과의 관계 특허법원 2020. 12. 4. 선고 2019허8118 판결 이 사건 결정이 특허취소신청에 관한 심리범위를 벗어난 것인지 여부"},{"label":"판결요지","text":"나) 특허법 제132조의2 제2항은 ‘특허공보에 게재된 제87조 제3항 제7호에 따른 선행기술에 기초한 이 유로는 특허취소신청을 할 수 없다’고 하여 특허취소신청인의 신청사유를 제한하고 있을 뿐이다 같은 법 제132조의10 제1항은 ‘심판관은 특허취소신청에 관하여 특허취소신청인, 특허권자 또는 참가인이 제출하지 아니한 이유에 대해서도 심리할 수 있다’고 규정하고 있고, 같은 조 제2항은 ‘심판관은 특허취소 신청에 관하여 특허취소신청인이 신청하지 아니한 청구항에 대해서는 심리할 수 없다’고 규정하고 있 으며 그밖에 달리 특허취소신청에 관한 심리범위에 대한 제한을 두고 있지 않다. 이와 다른 전제에 선 원고의 주장 즉 같은 법 제132조의2에서 들고 있는 한계 내에서만 특허심판원이 특허취소신청에 관한 직권심리를 할 수 있다고 보아야 한다는 법률적 주장은 받아들이기 어렵다."}]},{"section":"특허심판 - 거절결정불복심판","question":"거절결정불복심판의 심리절차 – 의견서제출기회부여요부 대법원 2007. 7. 26. 선고 2006후1766 판결 판시 거절사정에 대한 심판청구를 기각하는 심결 이유가 주된 취지에서 거절사정의 이유와 부합하는 경우, 새 사항 로이 거절이유를 통지하여 의견서 제출의 기회를 주어야 하는지 여부(소극)","answer":"거절사정에 대한 심판에서 그 거절사정의 이유와 다른 거절이유를 발견한 경우에는 거절이유의 통지를 하 여 특허출원인에게 새로운 거절이유에 대한 의견서 제출의 기회를 주어야 하지만, 거절사정에 대한 심판청구를 기각하는 심결 이유가 그 주된 취지에서 거절사정의 이유와 부합하는 경우에는 거절사정의 이유와 다른 별개의 새로운 이유로 심결을 한 것으로 볼 수 없으므로, 이러한 경우에까지 특허출원인에게 새로이 거절이 유를 통지하여 그에 대한 의견서 제출의 기회를 주어야 하는 것은 아니다.","slides":[{"label":"판시사항","text":"거절결정불복심판의 심리절차 – 의견서제출기회부여요부 대법원 2007. 7. 26. 선고 2006후1766 판결 판시 거절사정에 대한 심판청구를 기각하는 심결 이유가 주된 취지에서 거절사정의 이유와 부합하는 경우, 새 사항 로이 거절이유를 통지하여 의견서 제출의 기회를 주어야 하는지 여부(소극)"},{"label":"판결요지","text":"거절사정에 대한 심판에서 그 거절사정의 이유와 다른 거절이유를 발견한 경우에는 거절이유의 통지를 하 여 특허출원인에게 새로운 거절이유에 대한 의견서 제출의 기회를 주어야 하지만, 거절사정에 대한 심판청구를 기각하는 심결 이유가 그 주된 취지에서 거절사정의 이유와 부합하는 경우에는 거절사정의 이유와 다른 별개의 새로운 이유로 심결을 한 것으로 볼 수 없으므로, 이러한 경우에까지 특허출원인에게 새로이 거절이 유를 통지하여 그에 대한 의견서 제출의 기회를 주어야 하는 것은 아니다."}]},{"section":"특허심판 - 거절결정불복심판","question":"거절결정불복심판의 심리절차 – 보정각하 사유 특허법원 2023. 5. 11. 선고 2022허4765 판결 보정각하결정에서 다루지 않은 사유를 내세워 보정이 부적법하다고 판단할 수 있는지 여부(적극)","answer":"심결취소소송 단계에 이르러 특허청이 보정각하결정이나 심판절차에서 다루지 아니한 다른 사유를 내세워 보정이 부적법함을 주장하더라도 출원인으로서는 이에 대응하여 소송절차에서 그 심리의 방 식에 따라 충분히 그 다른 사유와 관련하여 보정의 적법 여부에 관하여 다툴 수 있으므로 출원인의 방 어권 또는 절차적 이익이 침해된다고 할 수 없어서, 특허청은 거절결정에 대한 심결취소소송 단계에서 보정각하결정에 붙이거나 심판절차에서 다루어지지 아니한 새로운 이유를 추가하여 보정의 부적법을 주장할 수 있다고 보아야 한다. 그리고 이러한 법리는 거절결정불복심판단계에도 적용되어 특허심판원이 출원인인 심판청구인에게 의견 진술의 기회를 주지 아니한 채 보정각하결정에 기재되지 아니한 새로운 보정각하사유를 들어 보정각하결정 이 정당한 것으로 판단하였다고 할지라도 그 심결을 취소하여야할 위법이 있다고 할 수 없다.","slides":[{"label":"판시사항","text":"거절결정불복심판의 심리절차 – 보정각하 사유 특허법원 2023. 5. 11. 선고 2022허4765 판결 보정각하결정에서 다루지 않은 사유를 내세워 보정이 부적법하다고 판단할 수 있는지 여부(적극)"},{"label":"판결요지","text":"심결취소소송 단계에 이르러 특허청이 보정각하결정이나 심판절차에서 다루지 아니한 다른 사유를 내세워 보정이 부적법함을 주장하더라도 출원인으로서는 이에 대응하여 소송절차에서 그 심리의 방 식에 따라 충분히 그 다른 사유와 관련하여 보정의 적법 여부에 관하여 다툴 수 있으므로 출원인의 방 어권 또는 절차적 이익이 침해된다고 할 수 없어서, 특허청은 거절결정에 대한 심결취소소송 단계에서 보정각하결정에 붙이거나 심판절차에서 다루어지지 아니한 새로운 이유를 추가하여 보정의 부적법을 주장할 수 있다고 보아야 한다. 그리고 이러한 법리는 거절결정불복심판단계에도 적용되어 특허심판원이 출원인인 심판청구인에게 의견 진술의 기회를 주지 아니한 채 보정각하결정에 기재되지 아니한 새로운 보정각하사유를 들어 보정각하결정 이 정당한 것으로 판단하였다고 할지라도 그 심결을 취소하여야할 위법이 있다고 할 수 없다."}]},{"section":"특허심판 - 거절결정불복심판","question":"거절결정이유와의 관계 CASE1 대법원 2010. 4. 29. 선고 2009후4285 판결 특허거절결정의 이유 중에 심사관이 통지하지 않은 거절이유가 일부 포함되어 있다 하더라도, 특허거절 결정에 대한 심판청구를 기각하는 심결이유가 심사관이 통지하지 않은 거절이유를 들어 특허거절결정을 유지하는 것이 아닌 경우, 그와 같은 사유만으로 심결을 위법하다고 할 수 있는지 여부(소극)","answer":"구 특허법(2007. 1. 3. 법률 제8197호로 개정되기 전의 것. 이하 같다) 제63조 본문은 심사관은 제62조 의 규정에 의하여 특허거절결정을 하고자 할 때에는 그 특허출원인에게 거절이유를 통지하고 기간을 정하여 의견서를 제출할 수 있는 기회를 주어야 한다고 정하고 있다. 그러나 심사관이 특허출원인에게 거 절이유를 통지하여 의견서를 제출할 수 있는 기회를 주지 아니하고 특허거절결정을 하였고 또 그 거절결정의 중에 심사관이 통지하지 아니한 거절이유가 일부 포함되어 있다 하더라도, 후에 특허거절결정에 대한 심판청구를 기각하는 심결이 있는 경우에 그 심결이 위 규정상의 통지를 하지 아니한 거절이유를 들어 특허 거절결정을 유지한 것이 아니라면, 위와 같은 통지 흠결의 사유만으로 그 심결을 위법하다고 할 수 없다.","slides":[{"label":"판시사항","text":"거절결정이유와의 관계 CASE1 대법원 2010. 4. 29. 선고 2009후4285 판결 특허거절결정의 이유 중에 심사관이 통지하지 않은 거절이유가 일부 포함되어 있다 하더라도, 특허거절 결정에 대한 심판청구를 기각하는 심결이유가 심사관이 통지하지 않은 거절이유를 들어 특허거절결정을 유지하는 것이 아닌 경우, 그와 같은 사유만으로 심결을 위법하다고 할 수 있는지 여부(소극)"},{"label":"판결요지","text":"구 특허법(2007. 1. 3. 법률 제8197호로 개정되기 전의 것. 이하 같다) 제63조 본문은 심사관은 제62조 의 규정에 의하여 특허거절결정을 하고자 할 때에는 그 특허출원인에게 거절이유를 통지하고 기간을 정하여 의견서를 제출할 수 있는 기회를 주어야 한다고 정하고 있다. 그러나 심사관이 특허출원인에게 거 절이유를 통지하여 의견서를 제출할 수 있는 기회를 주지 아니하고 특허거절결정을 하였고 또 그 거절결정의 중에 심사관이 통지하지 아니한 거절이유가 일부 포함되어 있다 하더라도, 후에 특허거절결정에 대한 심판청구를 기각하는 심결이 있는 경우에 그 심결이 위 규정상의 통지를 하지 아니한 거절이유를 들어 특허 거절결정을 유지한 것이 아니라면, 위와 같은 통지 흠결의 사유만으로 그 심결을 위법하다고 할 수 없다."}]},{"section":"특허심판 - 거절결정불복심판","question":"거절결정이유와의 관계 CASE2 대법원 2020. 11. 12. 선고 2017후1779 판결 상표출원에 대한 심사 단계에서 미리 거절이유를 통지한 사유라도 그 사유를 거절결정에서 거절이유로 삼지 않은 경우, 거절결정에 대한 심판절차에서 이를 심결의 이유로 하기 위해서는 구 상표법 제81조, 제 23조에 따라 다시 그 사유에 대해 거절이유를 통지하여야 하는지 여부(원칙적 적극) 및 위 규정에 따라 거 절이유 통지를 하지 아니한 채 거절결정의 이유와 다른 거절이유를 들어서 거절결정이 결과에 있어 정당 하다는 이유로 거절결정불복심판청구를 기각할 수 있는지 여부(소극)","answer":"심사 단계에서 미리 거절이유를 통지한 사유라고 하더라도 그 사유를 거절결정에서 거절이유로 삼지 않았다 면 이와 같은 사유는 거절결정에 대한 심판절차에서는 ‘거절결정의 이유와 다른 거절이유’에 해당하므로, 심판단계에서 심판청구인이 위 사유에 대해 실질적으로 의견서 제출 및 보정의 기회를 부여받았다고 볼만한 특별한 사정이 없는 한 이를 심결의 이유로 하기 위해서는 구 상표법 제81조, 제23조에 따라 다시 그 사유에 대해 거절이유를 통지하여야 한다. 위 규정은 거절이유를 미리 통지함으로써 그에 대한 의견서 제출 및 보정의 기회를 부여하여 출원인 또는 심판청구인의 절차적 권리를 보호하고, 심사 및 심판의 적정을 기하여 심 사 및 심판 제도의 신용을 유지하기 위한 공익상의 요구에 따른 강행규정이다. 따라서 위 규정에 따라 거절 통지를 하지 아니한 채 거절결정의 이유와 다른 거절이유를 들어서 거절결정이 결과에 있어 정당하다는 로 거절결정불복심판청구를 기각한 심결은 위법하다. ","slides":[{"label":"판시사항","text":"거절결정이유와의 관계 CASE2 대법원 2020. 11. 12. 선고 2017후1779 판결 상표출원에 대한 심사 단계에서 미리 거절이유를 통지한 사유라도 그 사유를 거절결정에서 거절이유로 삼지 않은 경우, 거절결정에 대한 심판절차에서 이를 심결의 이유로 하기 위해서는 구 상표법 제81조, 제 23조에 따라 다시 그 사유에 대해 거절이유를 통지하여야 하는지 여부(원칙적 적극) 및 위 규정에 따라 거 절이유 통지를 하지 아니한 채 거절결정의 이유와 다른 거절이유를 들어서 거절결정이 결과에 있어 정당 하다는 이유로 거절결정불복심판청구를 기각할 수 있는지 여부(소극)"},{"label":"판결요지","text":"심사 단계에서 미리 거절이유를 통지한 사유라고 하더라도 그 사유를 거절결정에서 거절이유로 삼지 않았다 면 이와 같은 사유는 거절결정에 대한 심판절차에서는 ‘거절결정의 이유와 다른 거절이유’에 해당하므로, 심판단계에서 심판청구인이 위 사유에 대해 실질적으로 의견서 제출 및 보정의 기회를 부여받았다고 볼만한 특별한 사정이 없는 한 이를 심결의 이유로 하기 위해서는 구 상표법 제81조, 제23조에 따라 다시 그 사유에 대해 거절이유를 통지하여야 한다. 위 규정은 거절이유를 미리 통지함으로써 그에 대한 의견서 제출 및 보정의 기회를 부여하여 출원인 또는 심판청구인의 절차적 권리를 보호하고, 심사 및 심판의 적정을 기하여 심 사 및 심판 제도의 신용을 유지하기 위한 공익상의 요구에 따른 강행규정이다. 따라서 위 규정에 따라 거절 통지를 하지 아니한 채 거절결정의 이유와 다른 거절이유를 들어서 거절결정이 결과에 있어 정당하다는 로 거절결정불복심판청구를 기각한 심결은 위법하다. 4 특허무효심판"}]},{"section":"특허심판 - 특허무효심판","question":"공유자 지분에 대한 특허무효심판 청구 대법원 2015. 1. 15. 선고 2012후2432 판결 판시 수인(數人)을 공유자로 하여 등록된 특허에 대한 특허무효심판에서 공유자 지분에 따라 특허를 분할하여 사항 일부 지분만의 무효심판을 청구할 수 있는지 여부(소극)","answer":"특허처분은 하나의 특허출원에 대하여 하나의 특허권을 부여하는 단일한 행정행위이므로, 설령 그러한 특허 처분에 의하여 수인을 공유자로 하는 특허등록이 이루어졌다고 하더라도, 그 특허처분 자체에 대한 무효를 청구하는 제도인 특허무효심판에서 그 공유자 지분에 따라 특허를 분할하여 일부 지분만의 무효심판을 청구 하는 것은 허용할 수 없다.","slides":[{"label":"판시사항","text":"공유자 지분에 대한 특허무효심판 청구 대법원 2015. 1. 15. 선고 2012후2432 판결 판시 수인(數人)을 공유자로 하여 등록된 특허에 대한 특허무효심판에서 공유자 지분에 따라 특허를 분할하여 사항 일부 지분만의 무효심판을 청구할 수 있는지 여부(소극)"},{"label":"판결요지","text":"특허처분은 하나의 특허출원에 대하여 하나의 특허권을 부여하는 단일한 행정행위이므로, 설령 그러한 특허 처분에 의하여 수인을 공유자로 하는 특허등록이 이루어졌다고 하더라도, 그 특허처분 자체에 대한 무효를 청구하는 제도인 특허무효심판에서 그 공유자 지분에 따라 특허를 분할하여 일부 지분만의 무효심판을 청구 하는 것은 허용할 수 없다."}]},{"section":"특허심판 - 특허무효심판","question":"실시계약을 체결한 자의 특허무효심판 청구 대법원 2019. 2. 21. 선고 2017후2819 전원합의체 판결 구 특허법 제133조 제1항 전문에서 정한 ‘이해관계인’의 의미 및 당해 특허발명과 같은 종류의 물품을 제 판시 조 판매하거나 제조 판매할 사람도 이에 포함되는지 여부(적극) / 특허권의 실시권자가 특허권자로부터 사항 권리의 대항을 받거나 받을 염려가 없다는 이유로 무효심판을 청구할 수 있는 이해관계가 소멸되었다고 볼 수 있는지 여부(원칙적 소극)","answer":"여기서 말하는 이해관계인이란 당해 특허발명의 권리존속으로 인하여 법률상 어떠한 불이익을 받거나 받 을 우려가 있어 그 소멸에 관하여 직접적이고도 현실적인 이해관계를 가진 사람을 말하고, 이에는 당해 특허발명과 같은 종류의 물품을 제조 판매하거나 제조 판매할 사람도 포함된다. 이러한 법리에 의하면 특별 한 사정이 없는 한 특허권의 실시권자가 특허권자로부터 권리의 대항을 받거나 받을 염려가 없다는 이유만으 로 무효심판을 청구할 수 있는 이해관계가 소멸되었다고 볼 수 없다.","slides":[{"label":"판시사항","text":"실시계약을 체결한 자의 특허무효심판 청구 대법원 2019. 2. 21. 선고 2017후2819 전원합의체 판결 구 특허법 제133조 제1항 전문에서 정한 ‘이해관계인’의 의미 및 당해 특허발명과 같은 종류의 물품을 제 판시 조 판매하거나 제조 판매할 사람도 이에 포함되는지 여부(적극) / 특허권의 실시권자가 특허권자로부터 사항 권리의 대항을 받거나 받을 염려가 없다는 이유로 무효심판을 청구할 수 있는 이해관계가 소멸되었다고 볼 수 있는지 여부(원칙적 소극)"},{"label":"판결요지","text":"여기서 말하는 이해관계인이란 당해 특허발명의 권리존속으로 인하여 법률상 어떠한 불이익을 받거나 받 을 우려가 있어 그 소멸에 관하여 직접적이고도 현실적인 이해관계를 가진 사람을 말하고, 이에는 당해 특허발명과 같은 종류의 물품을 제조 판매하거나 제조 판매할 사람도 포함된다. 이러한 법리에 의하면 특별 한 사정이 없는 한 특허권의 실시권자가 특허권자로부터 권리의 대항을 받거나 받을 염려가 없다는 이유만으 로 무효심판을 청구할 수 있는 이해관계가 소멸되었다고 볼 수 없다."}]},{"section":"특허심판 - 특허무효심판","question":"무권리자 출원에 대한 특허무효심판 청구 대법원 2025. 1. 9. 선고 2022후10814 판결 청구인 적격이 없는 자가 특허무효심판을 청구한 경우, 무효사유에 대하여 판단할 필요 없이 심판청구를 각하하여야 하는지 여부(적극) 및 심판청구인이 무권리자의 출원을 무효사유로 한 특허무효심판을 청구할 수 있는 특허를 받을 수 있는 권리를 가지는 정당한 권리자에 해당하는지 판단하는 기준 시점(=심결 시)","answer":"특허를 받을 수 있는 권리를 가지는 정당한 권리자 또는 심사관만이 무권리자의 출원을 무효사유로 한 특허무효심판의 청구인 적격이 있다. 청구인 적격이 없는 자가 제기한 특허의 무효심판청구는 부적법하므로 무효사유에 대하여 판단할 필요 없이 그 심판청구를 각하하여야 한다(대법원 1997. 6. 27. 선고 97후235 판결 등 참조). 심판청구인이 무권리자의 출원을 무효사유로 한 특허무효심판을 청구할 수 있는 특허를 받을 수 있는 권리를 가지는 정당한 권리자에 해당하는지 여부는 심결 당시를 기준으로 판단하여야 한다(대법원 2009. 9. 10. 선고 2007후4625 판결 등 참조).","slides":[{"label":"판시사항","text":"무권리자 출원에 대한 특허무효심판 청구 대법원 2025. 1. 9. 선고 2022후10814 판결 청구인 적격이 없는 자가 특허무효심판을 청구한 경우, 무효사유에 대하여 판단할 필요 없이 심판청구를 각하하여야 하는지 여부(적극) 및 심판청구인이 무권리자의 출원을 무효사유로 한 특허무효심판을 청구할 수 있는 특허를 받을 수 있는 권리를 가지는 정당한 권리자에 해당하는지 판단하는 기준 시점(=심결 시)"},{"label":"판결요지","text":"특허를 받을 수 있는 권리를 가지는 정당한 권리자 또는 심사관만이 무권리자의 출원을 무효사유로 한 특허무효심판의 청구인 적격이 있다. 청구인 적격이 없는 자가 제기한 특허의 무효심판청구는 부적법하므로 무효사유에 대하여 판단할 필요 없이 그 심판청구를 각하하여야 한다(대법원 1997. 6. 27. 선고 97후235 판결 등 참조). 심판청구인이 무권리자의 출원을 무효사유로 한 특허무효심판을 청구할 수 있는 특허를 받을 수 있는 권리를 가지는 정당한 권리자에 해당하는지 여부는 심결 당시를 기준으로 판단하여야 한다(대법원 2009. 9. 10. 선고 2007후4625 판결 등 참조)."}]},{"section":"특허심판 - 특허무효심판","question":"특허무효와 실시계약 및 실시료 대법원 2014. 11. 13. 선고 2012다42666,42673 판결 특허발명 실시계약 체결 이후 계약 대상인 특허가 무효로 확정된 경우, 특허권자가 실시권자로부터 이미 지급받은 특허실시료 중 특허발명 실시계약이 유효하게 존재하는 기간에 상응하는 부분을 부당이득으로 반환할 의무가 있는지 여부(원칙적 소극)","answer":"특허발명 실시계약 체결 이후에 특허가 무효로 확정되었더라도 앞서 본 바와 같이 특허발명 실시계약이 원시 적으로 이행불능 상태에 있었다거나 그 밖에 특허발명 실시계약 자체에 별도의 무효사유가 없는 한 특허권자 가 특허발명 실시계약에 따라 실시권자로부터 이미 지급받은 특허실시료 중 특허발명 실시계약이 유효하게 존재하는 기간에 상응하는 부분을 실시권자에게 부당이득으로 반환할 의무가 있다고 할 수 없다.","slides":[{"label":"판시사항","text":"특허무효와 실시계약 및 실시료 대법원 2014. 11. 13. 선고 2012다42666,42 기간 동안 실시료의 지급을 청구할 수 있다."}]},{"section":"특허심판 - 특허무효심판","question":"특허무효와 실시금지계약 대법원 2024. 11. 20. 선고 2024다270105 판결 특허발명 실시계약 체결 이후 계약 대상인 특허가 무효로 확정된 경우, 특허가 무효로 확정되기 전까지 유 효하게 존속하던 특허발명 실시금지계약에 위반하여 특허발명을 실시한 계약상대방에 대하여, 특허권자 가 채무불이행에 따른 손해배상을 청구할 수 있는지 여부 (원칙적 적극) 및 계약상대방의 실시 형태가 자 유실시기술(공지기술로부터 쉽게 실시 가능한 기술)에 해당하더라도, 특허발명 실시금지계약의 구속력 을 부정할 수 있는지 여부 (소극)","answer":"특허권자와 계약상대방 사이에 특허권자의 허락 없는 특허발명 실시를 금지하는 내용의 계약(이하 ‘특허발명 실시금지계약’이라 한다)이 체결된 이후에 그 특허가 무효로 확정되었다고 하더라도 특허발명 실시금지계약이 계약 체결 당시부터 원시적으로 이행불능 상태에 있었다고 볼 수는 없고, 다만 그 특허가 무효로 확정된 때부터 특허발명 실시금지계약은 이행불능 상태에 빠지게 될 뿐이다(대법원 2014. 11. 13. 선 고 2012다42666, 42673 판결 등 참조). 따라서 특허발명 실시금지계약 자체에 별도의 무효사유가 없는 한 특허권자는 원칙적으로 위 계약에 따른 특허발명 실시금지의무가 유효하게 존재하는 기간 동안 특허발명 을 실시한 계약상대방에 대하여 채무불이행에 따른 손해배상을 청구할 수 있다(대법원 2019. 4. 25. 선고 2018다287362 판결 등 참조). 이때 계약상대방이 특허발명을 실시한 구체적인 형태가 그 기술분야에서 통상의 지식을 가진 사람이 공지기술로부터 쉽게 실시할 수 있는 이른바 자유실시기술에 해당한다고 하 더라도, 그러한 사정만으로 계약상대방이 특허권자와의 의사 합치에 따른 특허발명 실시금지계약의 구속력 에서 벗어나게 된다고 볼 수는 없다. ","slides":[{"label":"판시사항","text":"특허무효와 실시금지계약 대법원 2024. 11. 20. 선고 2024다270105 판결 특허발명 실시계약 체결 이후 계약 대상인 특허가 무효로 확정된 경우, 특허가 무효로 확정되기 전까지 유 효하게 존속하던 특허발명 실시금지계약에 위반하여 특허발명을 실시한 계약상대방에 대하여, 특허권자 가 채무불이행에 따른 손해배상을 청구할 수 있는지 여부 (원칙적 적극) 및 계약상대방의 실시 형태가 자 유실시기술(공지기술로부터 쉽게 실시 가능한 기술)에 해당하더라도, 특허발명 실시금지계약의 구속력 을 부정할 수 있는지 여부 (소극)"},{"label":"판결요지","text":"특허권자와 계약상대방 사이에 특허권자의 허락 없는 특허발명 실시를 금지하는 내용의 계약(이하 ‘특허발명 실시금지계약’이라 한다)이 체결된 이후에 그 특허가 무효로 확정되었다고 하더라도 특허발명 실시금지계약이 계약 체결 당시부터 원시적으로 이행불능 상태에 있었다고 볼 수는 없고, 다만 그 특허가 무효로 확정된 때부터 특허발명 실시금지계약은 이행불능 상태에 빠지게 될 뿐이다(대법원 2014. 11. 13. 선 고 2012다42666, 42673 판결 등 참조). 따라서 특허발명 실시금지계약 자체에 별도의 무효사유가 없는 한 특허권자는 원칙적으로 위 계약에 따른 특허발명 실시금지의무가 유효하게 존재하는 기간 동안 특허발명 을 실시한 계약상대방에 대하여 채무불이행에 따른 손해배상을 청구할 수 있다(대법원 2019. 4. 25. 선고 2018다287362 판결 등 참조). 이때 계약상대방이 특허발명을 실시한 구체적인 형태가 그 기술분야에서 통상의 지식을 가진 사람이 공지기술로부터 쉽게 실시할 수 있는 이른바 자유실시기술에 해당한다고 하 더라도, 그러한 사정만으로 계약상대방이 특허권자와의 의사 합치에 따른 특허발명 실시금지계약의 구속력 에서 벗어나게 된다고 볼 수는 없다. 5 권리범위확인심판"}]},{"section":"특허심판 - 권리범위확인심판","question":"소극적 권리범위확인심판의 이해관계인 대법원 2025. 5. 15. 선고 2022후10746 판결 판시 소극적 권리범위확인심판의 이해관계인에, 현재 침해 우려가 있는 자뿐만 아니라 업무의 성질상 장래에 사항 대상물을 제조 판매 사용할 가능성이 있는 자도 포함되는지 여부 (적극)","answer":"특허권의 소극적 권리범위 확인심판을 청구할 수 있는 이해관계인은 특허권자 등으로부터 권리의 대항을 받 아 업무상 손해를 받고 있거나 손해를 받을 염려가 있는 자를 말한다. 이러한 이해관계인에는 특허권의 권리범위에 속하는지 여부에 관하여 분쟁이 생길 염려가 있는 대상물을 제조 판매 사용하는 것을 업으로 하고 있는 사람뿐만 아니라, 그 업무의 성질상 장래에 그러한 물품을 업으로 제조 판매 사용하리라고 예상되는 사람도 포함된다(대법원 2000. 4. 11. 선고 97후3241 판결 등 참조).","slides":[{"label":"판시사항","text":"소극적 권리범위확인심판의 이해관계인 대법원 2025. 5. 15. 선고 2022후10746 판결 판시 소극적 권리범위확인심판의 이해관계인에, 현재 침해 우려가 있는 자뿐만 아니라 업무의 성질상 장래에 사항 대상물을 제조 판매 사용할 가능성이 있는 자도 포함되는지 여부 (적극)"},{"label":"판결요지","text":"특허권의 소극적 권리범위 확인심판을 청구할 수 있는 이해관계인은 특허권자 등으로부터 권리의 대항을 받 아 업무상 손해를 받고 있거나 손해를 받을 염려가 있는 자를 말한다. 이러한 이해관계인에는 특허권의 권리범위에 속하는지 여부에 관하여 분쟁이 생길 염려가 있는 대상물을 제조 판매 사용하는 것을 업으로 하고 있는 사람뿐만 아니라, 그 업무의 성질상 장래에 그러한 물품을 업으로 제조 판매 사용하리라고 예상되는 사람도 포함된다(대법원 2000. 4. 11. 선고 97후3241 판결 등 참조)."}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명의 특정정도 및 법적취급 대법원 2005. 4. 29. 선고 2003후656 판결 [1] 특허발명의 권리범위확인심판을 청구함에 있어 심판청구의 대상이 되는 확인대상발명의 특정정도 판시 [2] 확인대상발명이 특허발명과 대비할 수 있을 정도로 구체적으로 특정되어 있지 않은 경우 특허심판원 사항 이 취해야 할 조치 및 확인대상발명의 특정 여부가 특허심판의 적법요건으로서 직권조사 사항인지 여부 (적극)","answer":"특허발명의 권리범위확인심판을 청구함에 있어 심판청구의 대상이 되는 확인대상발명은 당해 특허발명 과 서로 대비할 수 있을 만큼 구체적으로 특정되어야 하는 것인바, 그 특정을 위하여 대상물의 구체적인 구성 을 전부 기재할 필요는 없다고 하더라도 특허발명의 구성요건에 대응하는 부분의 구체적인 구성을 기재하여야 하며, 그 구체적인 구성의 기재는 특허발명의 구성요건에 대비하여 그 차이점을 판단함에 필요한 정도는 되어야 할 것이고, 만약 확인대상발명이 불명확하여 특허발명과 대비대상이 될 수 있을 정도로 구체적으로 특정되어 있지 않다면, 특허심판원으로서는 요지변경이 되지 아니하는 범위 내에서 확인대상발명의 설명서 및 도면에 대한 보정을 명하는 등의 조치를 취하여야 할 것이며, 그럼에도 불구하고 그와 같은 특정에 미흡함 이 있다면 심판청구를 각하하여야 할 것인바, 확인대상발명이 적법하게 특정되었는지 여부는 특허심판의 적 법요건으로서 당사자의 명확한 주장이 없더라도 의심이 있을 때에는 특허심판원이나 법원이 이를 직권으로 조사하여 밝혀보아야 할 사항이라고 할 것이다.","slides":[{"label":"판시사항","text":"확인대상발명의 특정정도 및 법적취급 대법원 2005. 4. 29. 선고 2003후656 판결"},{"label":"판시사항","text":"[1] 특허발명의 권리범위확인심판을 청구함에 있어 심판청구의 대상이 되는 확인대상발명의 특정정도 판시"},{"label":"판시사항","text":"[2] 확인대상발명이 특허발명과 대비할 수 있을 정도로 구체적으로 특정되어 있지 않은 경우 특허심판원 사항 이 취해야 할 조치 및 확인대상발명의 특정 여부가 특허심판의 적법요건으로서 직권조사 사항인지 여부 (적극)"},{"label":"판결요지","text":"특허발명의 권리범위확인심판을 청구함에 있어 심판청구의 대상이 되는 확인대상발명은 당해 특허발명 과 서로 대비할 수 있을 만큼 구체적으로 특정되어야 하는 것인바, 그 특정을 위하여 대상물의 구체적인 구성 을 전부 기재할 필요는 없다고 하더라도 특허발명의 구성요건에 대응하는 부분의 구체적인 구성을 기재하여야 하며, 그 구체적인 구성의 기재는 특허발명의 구성요건에 대비하여 그 차이점을 판단함에 필요한 정도는 되어야 할 것이고, 만약 확인대상발명이 불명확하여 특허발명과 대비대상이 될 수 있을 정도로 구체적으로 특정되어 있지 않다면, 특허심판원으로서는 요지변경이 되지 아니하는 범위 내에서 확인대상발명의 설명서 및 도면에 대한 보정을 명하는 등의 조치를 취하여야 할 것이며, 그럼에도 불구하고 그와 같은 특정에 미흡함 이 있다면 심판청구를 각하하여야 할 것인바, 확인대상발명이 적법하게 특정되었는지 여부는 특허심판의 적 법요건으로서 당사자의 명확한 주장이 없더라도 의심이 있을 때에는 특허심판원이나 법원이 이를 직권으로 조사하여 밝혀보아야 할 사항이라고 할 것이다."}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명의 특정정도 – 청구원인 특정 대법원 2020. 5. 28. 선고 2017후2291 판결 특허발명의 권리범위 확인심판청구에서 심판청구의 대상이 되는 확인대상 발명의 특정정도 및 확인대상 판시 발명의 설명서에 불명확한 부분이 있거나 설명서의 기재와 일치하지 않는 일부 도면이 있더라도, 설명서 사항 에 기재된 나머지 내용과 도면을 종합적으로 고려하여 확인대상 발명이 특허발명의 권리범위에 속하는지 여부를 판단할 수 있는 경우, 확인대상 발명이 특정된 것으로 보아야 하는지 여부(적극)","answer":"특허권의 권리범위 확인심판을 청구함에 있어 심판청구의 대상이 되는 확인대상 발명은 당해 특허발명 과 서로 대비할 수 있을 만큼 구체적으로 특정되어야 할 뿐만 아니라, 그에 앞서 사회통념상 특허발명의 권리범위에 속하는지를 확인하는 대상으로서 다른 것과 구별될 수 있는 정도로 구체적으로 특정되어야 한 다. 다만, 확인대상 발명의 설명서에 불명확한 부분이 있거나 설명서의 기재와 일치하지 않는 일부 도면이 있 더라도, 확인대상 발명의 설명서에 기재된 나머지 내용과 도면을 종합적으로 고려하여 확인대상 발명이 특허발명의 권리범위에 속하는지 여부를 판단할 수 있는 경우에는 확인대상 발명은 특정된 것으로 보아야 한다","slides":[{"label":"판시사항","text":"확인대상발명의 특정정도 – 청구원인 특정 대법원 2020. 5. 28. 선고 2017후2291 판결 특허발명의 권리범위 확인심판청구에서 심판청구의 대상이 되는 확인대상 발명의 특정정도 및 확인대상 판시 발명의 설명서에 불명확한 부분이 있거나 설명서의 기재와 일치하지 않는 일부 도면이 있더라도, 설명서 사항 에 기재된 나머지 내용과 도면을 종합적으로 고려하여 확인대상 발명이 특허발명의 권리범위에 속하는지 여부를 판단할 수 있는 경우, 확인대상 발명이 특정된 것으로 보아야 하는지 여부(적극)"},{"label":"판결요지","text":"특허권의 권리범위 확인심판을 청구함에 있어 심판청구의 대상이 되는 확인대상 발명은 당해 특허발명 과 서로 대비할 수 있을 만큼 구체적으로 특정되어야 할 뿐만 아니라, 그에 앞서 사회통념상 특허발명의 권리범위에 속하는지를 확인하는 대상으로서 다른 것과 구별될 수 있는 정도로 구체적으로 특정되어야 한 다. 다만, 확인대상 발명의 설명서에 불명확한 부분이 있거나 설명서의 기재와 일치하지 않는 일부 도면이 있 더라도, 확인대상 발명의 설명서에 기재된 나머지 내용과 도면을 종합적으로 고려하여 확인대상 발명이 특허발명의 권리범위에 속하는지 여부를 판단할 수 있는 경우에는 확인대상 발명은 특정된 것으로 보아야 한다"}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명의 특정정도 – 청구취지 특정 대법원 2011. 9. 8. 선고 2010후3356 판결 특허발명의 권리범위확인심판 청구에서 심판청구대상이 되는 확인대상발명의 특정정도 및 확인대상발명의 일부 구성이 불명확하여 다른 것과 구별될 수 있는 정도로 구체적으로 특정되어 있지 않은 경우, 특허심판원이 취해야 할 조치","answer":"특허권의 권리범위확인심판을 청구함에 있어 심판청구의 대상이 되는 확인대상발명은 당해 특허발명과 서로 대비할 수 있을 만큼 구체적으로 특정되어야 할 뿐만 아니라(대법원 2005. 4. 29. 선고 2003후656 , 대법원 2010. 5. 27. 선고 2010후296 판결 등 참조), 그에 앞서 사회통념상 특허발명의 권리범위에 속하는지를 확인하는 대상으로서 다른 것과 구별될 수 있는 정도로 구체적으로 특정되어야 한다. ... 그럼에도 불구하고 그와 같은 특정에 미흡함이 있다면 심판의 심결이 확정되더라도 그 일사부재리의 효력 이 미치는 범위가 명확하다고 할 수 없으므로, 나머지 구성만으로 확인대상발명이 특허발명의 권리범위에 속 하는지 여부를 판단할 수 있는 경우라 하더라도 심판청구를 각하하여야 할 것이다.","slides":[{"label":"판시사항","text":"확인대상발명의 특정정도 – 청구취지 특정 대법원 2011. 9. 8. 선고 2010후3356 판결 특허발명의 권리범위확인심판 청구에서 심판청구대상이 되는 확인대상발명의 특정정도 및 확인대상발명의 일부 구성이 불명확하여 다른 것과 구별될 수 있는 정도로 구체적으로 특정되어 있지 않은 경우, 특허심판원이 취해야 할 조치"},{"label":"판결요지","text":"특허권의 권리범위확인심판을 청구함에 있어 심판청구의 대상이 되는 확인대상발명은 당해 특허발명과 서로 대비할 수 있을 만큼 구체적으로 특정되어야 할 뿐만 아니라(대법원 2005. 4. 29. 선고 2003후656 , 대법원 2010. 5. 27. 선고 2010후296 판결 등 참조), 그에 앞서 사회통념상 특허발명의 권리범위에 속하는지를 확인하는 대상으로서 다른 것과 구별될 수 있는 정도로 구체적으로 특정되어야 한다. ... 그럼에도 불구하고 그와 같은 특정에 미흡함이 있다면 심판의 심결이 확정되더라도 그 일사부재리의 효력 이 미치는 범위가 명확하다고 할 수 없으므로, 나머지 구성만으로 확인대상발명이 특허발명의 권리범위에 속 하는지 여부를 판단할 수 있는 경우라 하더라도 심판청구를 각하하여야 할 것이다."}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명의 특정정도 – 청구취지 특정 대법원 2023. 12. 28. 선고 2021후10725 판결 [2] 특허권의 권리범위 확인심판 청구에서 심판청구의 대상이 되는 확인대상 발명의 특정정도 / 확인대상 발명의 특정 여부를 판단하는 기준 및 확인대상 발명의 설명서에 불명확한 부분이 있거나 설명서의 기재와 일치하지 않는 일부 도면이 있더라도, 설명서에 기재된 나머지 내용과 도면을 종합적으로 고려하여 확인대상 발명이 특허발명의 권리범위에 속하는지 여부를 판단할 수 있는 경우, 확인대상 발명이 특정된 것으로 보아야 하는지 여부(적극)","answer":"특허권의 권리범위 확인심판을 청구할 경우 심판청구의 대상이 되는 확인대상 발명은 당해 특허발명과 서로 대비할 수 있을 만큼 구체적으로 특정되어야 할 뿐만 아니라, 그에 앞서 사회통념상 특허발명의 권리 범위에 속하는지를 확인하는 대상으로서 다른 것과 구별될 수 있는 정도로 구체적으로 특정되어야 한다(대 법원 2011. 9. 8. 선고 2010후3356 판결 등 참조). 확인대상 발명의 특정 여부는 확인대상 발명의 설명 서와 도면을 일체로 파악하고 이를 종합적으로 고려하여 판단해야 하므로, 확인대상 발명의 설명서에 불명 확한 부분이 있거나 설명서의 기재와 일치하지 않는 일부 도면이 있더라도, 확인대상 발명의 설명서에 기재 된 나머지 내용과 도면을 종합적으로 고려하여 확인대상 발명이 특허발명의 권리범위에 속하는지 여부를 판단할 수 있는 경우에는 확인대상 발명은 사회통념상 특허발명의 권리범위에 속하는지를 확인하는 대상으로 서 다른 것과 구별될 수 있는 정도로 특정된 것으로 보아야 한다(대법원 2010. 5. 27. 선고 2010후296 판결, 대법원 2020. 5. 28. 선고 2017후2291 판결 등 참조).","slides":[{"label":"판시사항","text":"확인대상발명의 특정정도 – 청구취지 특정 대법원 2023. 12. 28. 선고 2021후10725 판결"},{"label":"판시사항","text":"[2] 특허권의 권리범위 확인심판 청구에서 심판청구의 대상이 되는 확인대상 발명의 특정정도 / 확인대상 발명의 특정 여부를 판단하는 기준 및 확인대상 발명의 설명서에 불명확한 부분이 있거나 설명서의 기재와 일치하지 않는 일부 도면이 있더라도, 설명서에 기재된 나머지 내용과 도면을 종합적으로 고려하여 확인대상 발명이 특허발명의 권리범위에 속하는지 여부를 판단할 수 있는 경우, 확인대상 발명이 특정된 것으로 보아야 하는지 여부(적극)"},{"label":"판결요지","text":"특허권의 권리범위 확인심판을 청구할 경우 심판청구의 대상이 되는 확인대상 발명은 당해 특허발명과 서로 대비할 수 있을 만큼 구체적으로 특정되어야 할 뿐만 아니라, 그에 앞서 사회통념상 특허발명의 권리 범위에 속하는지를 확인하는 대상으로서 다른 것과 구별될 수 있는 정도로 구체적으로 특정되어야 한다(대 법원 2011. 9. 8. 선고 2010후3356 판결 등 참조). 확인대상 발명의 특정 여부는 확인대상 발명의 설명 서와 도면을 일체로 파악하고 이를 종합적으로 고려하여 판단해야 하므로, 확인대상 발명의 설명서에 불명 확한 부분이 있거나 설명서의 기재와 일치하지 않는 일부 도면이 있더라도, 확인대상 발명의 설명서에 기재 된 나머지 내용과 도면을 종합적으로 고려하여 확인대상 발명이 특허발명의 권리범위에 속하는지 여부를 판단할 수 있는 경우에는 확인대상 발명은 사회통념상 특허발명의 권리범위에 속하는지를 확인하는 대상으로 서 다른 것과 구별될 수 있는 정도로 특정된 것으로 보아야 한다(대법원 2010. 5. 27. 선고 2010후296 판결, 대법원 2020. 5. 28. 선고 2017후2291 판결 등 참조)."}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명의 특정정도 – 대응하지 않는 구성요소 대법원 2025. 5. 15. 선고 2022후10746 판결 판시 확인대상 발명이 특허청구항의 구성요소와 기능이 다른 첨가제를 추가로 포함하더라도, 그 사정만으로 사항 특허권의 효력이 미치는 범위를 특정할 수 없어 권리범위 확정이 불가능하다고 볼 수 있는지 여부 (소극)","answer":"확인대상 발명에 ‘부형제, 결합제, 붕해제, 활택제’가 아닌 첨가제가 추가적으로 포함되더라도, 그러한 첨가제 는 이 사건 제1항 발명의 구성요소인 ‘부형제, 결합제, 붕해제, 활택제’와는 수행하는 기능이 달라 이에 대응 하는 구성요소에 해당하지 않는다. 확인대상 발명이 이 사건 제1항 발명의 위 구성요소에 대응하지 않는 구성 요소(‘부형제, 결합제, 붕해제, 활택제’ 외의 첨가제)를 포함할 수 있다는 사정만으로는 이 사건 제1항 발명 특허권의 효력이 확인대상 발명에 미치는 범위를 구체적으로 확정하는 데에 지장이 없다.","slides":[{"label":"판시사항","text":"확인대상발명의 특정정도 – 대응하지 않는 구성요소 대법원 2025. 5. 15. 선고 2022후10746 판결 판시 확인대상 발명이 특허청구항의 구성요소와 기능이 다른 첨가제를 추가로 포함하더라도, 그 사정만으로 사항 특허권의 효력이 미치는 범위를 특정할 수 없어 권리범위 확정이 불가능하다고 볼 수 있는지 여부 (소극)"},{"label":"판결요지","text":"확인대상 발명에 ‘부형제, 결합제, 붕해제, 활택제’가 아닌 첨가제가 추가적으로 포함되더라도, 그러한 첨가제 는 이 사건 제1항 발명의 구성요소인 ‘부형제, 결합제, 붕해제, 활택제’와는 수행하는 기능이 달라 이에 대응 하는 구성요소에 해당하지 않는다. 확인대상 발명이 이 사건 제1항 발명의 위 구성요소에 대응하지 않는 구성 요소(‘부형제, 결합제, 붕해제, 활택제’ 외의 첨가제)를 포함할 수 있다는 사정만으로는 이 사건 제1항 발명 특허권의 효력이 확인대상 발명에 미치는 범위를 구체적으로 확정하는 데에 지장이 없다."}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명의 설명서 보정 - 요지변경 여부 판단 대법원 2012. 5. 24. 선고 2012후344 판결 판시 고안의 동일성이 유지되는 정도의 심판청구서 보정이 구 실용신안법 제55조 제2항에서 정한 요지의 변경 사항 에 해당하는지 여부(소극)","answer":"그 규정의 취지는 요지의 변경을 쉽게 인정할 경우 심판절차의 지연을 초래하거나 피청구인의 방어권행사 를 곤란케 할 우려가 있다는 데에 있으므로, 그 보정의 정도가 청구인의 고안에 관하여 심판청구서에 첨부된 도면 및 설명서에 표현된 구조의 불명확한 부분을 구체화한 것이거나 처음부터 당연히 있어야 할 구성부분 을 부가한 것에 지나지 아니하여 심판청구의 전체적 취지에 비추어 볼 때 그 고안의 동일성이 유지된다고 인정되는 경우에는 위 규정에서 말하는 요지의 변경에 해당하지 않는다.","slides":[{"label":"판시사항","text":"확인대상발명의 설명서 보정 - 요지변경 여부 판단 대법원 2012. 5. 24. 선고 2012후344 판결 판시 고안의 동일성이 유지되는 정도의 심판청구서 보정이 구 실용신안법 제55조 제2항에서 정한 요지의 변경 사항 에 해당하는지 여부(소극)"},{"label":"판결요지","text":"그 규정의 취지는 요지의 변경을 쉽게 인정할 경우 심판절차의 지연을 초래하거나 피청구인의 방어권행사 를 곤란케 할 우려가 있다는 데에 있으므로, 그 보정의 정도가 청구인의 고안에 관하여 심판청구서에 첨부된 도면 및 설명서에 표현된 구조의 불명확한 부분을 구체화한 것이거나 처음부터 당연히 있어야 할 구성부분 을 부가한 것에 지나지 아니하여 심판청구의 전체적 취지에 비추어 볼 때 그 고안의 동일성이 유지된다고 인정되는 경우에는 위 규정에서 말하는 요지의 변경에 해당하지 않는다."}]},{"section":"특허심판 - 권리범위확인심판","question":"제법특허 vs 확인대상물건 (심판의 적부 및 특정방법) 대법원 2004. 10. 14. 선고 2003후2164 판결 판시 물건을 생산하는 방법의 발명인 경우, 특정한 생산방법에 의하여 생산한 물건을 실시발명으로 특정하여 사항 특허권의 보호범위에 속하는지의 확인을 구할 수 있는지 여부(적극)","answer":"물건을 생산하는 방법의 발명인 경우에는 그 방법에 의하여 생산된 물건에까지 특허권의 효력이 미친다 할 것이어서, 물건을 생산하는 방법의 발명인 경우에는 그 방법에 의하여 생산된 물건에까지 특허권의 효력이 미친다 할 것이어서, 특정한 생산방법에 의하여 생산한 물건을 실시발명으로 특정하여 특허권의 보호범위에 속 하는지 여부의 확인을 구할 수 있다 할 것이다.","slides":[{"label":"판시사항","text":"제법특허 vs 확인대상물건 (심판의 적부 및 특정방법) 대법원 2004. 10. 14. 선고 2003후2164 판결 판시 물건을 생산하는 방법의 발명인 경우, 특정한 생산방법에 의하여 생산한 물건을 실시발명으로 특정하여 사항 특허권의 보호범위에 속하는지의 확인을 구할 수 있는지 여부(적극)"},{"label":"판결요지","text":"물건을 생산하는 방법의 발명인 경우에는 그 방법에 의하여 생산된 물건에까지 특허권의 효력이 미친다 할 것이어서, 물건을 생산하는 방법의 발명인 경우에는 그 방법에 의하여 생산된 물건에까지 특허권의 효력이 미친다 할 것이어서, 특정한 생산방법에 의하여 생산한 물건을 실시발명으로 특정하여 특허권의 보호범위에 속 하는지 여부의 확인을 구할 수 있다 할 것이다."}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명의 특정정도 – 기능적 표현의 기재 대법원 2012. 11. 15. 선고 2011후1494 판결 기능적 표현으로 기재된 확인대상발명의 구성이 특정되었는지를 판단하는 기준","answer":"확인대상발명의 구성이 기능, 효과, 성질 등의 이른바 기능적 표현으로 기재되어 있는 경우에는, 그 발명이 속 하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 확인대상발명의 설명서나 도면 등의 기재와 기술상식을 고려하여 그 구성의 기술적 의미를 명확하게 파악할 수 있을 정도로 기재되어 있지 않다면, 특허발명과 서로 대비할 수 있을 만큼 확인대상발명의 구성이 구체적으로 기재된 것으로 볼 수 없다.","slides":[{"label":"판시사항","text":"확인대상발명의 특정정도 – 기능적 표현의 기재 대법원 2012. 11. 15. 선고 2011후1494 판결 기능적 표현으로 기재된 확인대상발명의 구성이 특정되었는지를 판단하는 기준"},{"label":"판결요지","text":"확인대상발명의 구성이 기능, 효과, 성질 등의 이른바 기능적 표현으로 기재되어 있는 경우에는, 그 발명이 속 하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 확인대상발명의 설명서나 도면 등의 기재와 기술상식을 고려하여 그 구성의 기술적 의미를 명확하게 파악할 수 있을 정도로 기재되어 있지 않다면, 특허발명과 서로 대비할 수 있을 만큼 확인대상발명의 구성이 구체적으로 기재된 것으로 볼 수 없다."}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명의 특정정도 - 간접침해품 대법원 2005. 7. 15. 선고 2003후1109 판결 판시 특허법 제127조 제2호의 간접침해 대상이 되는 ‘방법의 실시에만 사용하는 물건’을 확인대상 발명으로 사항 삼아 권리범위확인심판을 청구할 수 있는지 여부 (적극)","answer":"특허법 제127조 제2호는 특허가 방법의 발명인 때에는 그 방법의 실시에만 사용하는 물건을 생산․양 도․대여 또는 수입하거나 그 물건의 양도 또는 대여의 청약을 하는 행위를 업으로서 하는 경우에 특허권 또는 전용실시권을 침해한 것으로 본다는 취지로 규정하고 있으므로, 특허권자 또는 이해관계인은 그 방법의 실시에만 사용하는 물건과 대비되는 물건을 심판청구의 대상이 되는 발명으로 특정하여 특허권의 보호범위에 속하는지 여부의 확인을 구할 수 있다 할 것이다.","slides":[{"label":"판시사항","text":"확인대상발명의 특정정도 - 간접침해품 대법원 2005. 7. 15. 선고 2003후1109 판결 판시 특허법 제127조 제2호의 간접침해 대상이 되는 ‘방법의 실시에만 사용하는 물건’을 확인대상 발명으로 사항 삼아 권리범위확인심판을 청구할 수 있는지 여부 (적극)"},{"label":"판결요지","text":"특허법 제127조 제2호는 특허가 방법의 발명인 때에는 그 방법의 실시에만 사용하는 물건을 생산․양 도․대여 또는 수입하거나 그 물건의 양도 또는 대여의 청약을 하는 행위를 업으로서 하는 경우에 특허권 또는 전용실시권을 침해한 것으로 본다는 취지로 규정하고 있으므로, 특허권자 또는 이해관계인은 그 방법의 실시에만 사용하는 물건과 대비되는 물건을 심판청구의 대상이 되는 발명으로 특정하여 특허권의 보호범위에 속하는지 여부의 확인을 구할 수 있다 할 것이다."}]},{"section":"특허심판 - 권리범위확인심판","question":"수치한정발명 vs 확인대상발명 대법원 2005. 4. 29. 선고 2003후656 판결 판시 특허발명의 청구범위가 일정한 범위의 수치로 한정한 것을 구성요소의 하나로 하고 있는 경우 확인대상 사항 발명이 특정되었다고 하기 위한 요건","answer":"특허발명의 청구범위가 일정한 범위의 수치로 한정한 것을 구성요소의 하나로 하고 있는 경우에는 그 범위 밖의 수치가 균등한 구성요소에 해당한다는 등의 특별한 사정이 없는 한 특허발명의 청구범위에서 한정한 범 위 밖의 수치를 구성요소로 하는 확인대상발명은 원칙적으로 특허발명의 권리범위에 속하지 아니한다고 할 것이므로(대법원 2001. 8. 21. 선고 99후2372 판결 참조), 확인대상발명이 특정되었다고 하기 위하여 는 확인대상발명이 당해 특허발명에서 수치로 한정하고 있는 구성요소에 대응하는 요소를 포함하고 있는지 여부 및 그 수치는 어떠한지 등이 설명서와 도면 등에 의하여 특정되어야 할 것이다.","slides":[{"label":"판시사항","text":"수치한정발명 vs 확인대상발명 대법원 2005. 4. 29. 선고 2003후656 판결 판시 특허발명의 청구범위가 일정한 범위의 수치로 한정한 것을 구성요소의 하나로 하고 있는 경우 확인대상 사항 발명이 특정되었다고 하기 위한 요건"},{"label":"판결요지","text":"특허발명의 청구범위가 일정한 범위의 수치로 한정한 것을 구성요소의 하나로 하고 있는 경우에는 그 범위 밖의 수치가 균등한 구성요소에 해당한다는 등의 특별한 사정이 없는 한 특허발명의 청구범위에서 한정한 범 위 밖의 수치를 구성요소로 하는 확인대상발명은 원칙적으로 특허발명의 권리범위에 속하지 아니한다고 할 것이므로(대법원 2001. 8. 21. 선고 99후2372 판결 참조), 확인대상발명이 특정되었다고 하기 위하여 는 확인대상발명이 당해 특허발명에서 수치로 한정하고 있는 구성요소에 대응하는 요소를 포함하고 있는지 여부 및 그 수치는 어떠한지 등이 설명서와 도면 등에 의하여 특정되어야 할 것이다."}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명의 특정정도 – 복수/선택적 기재 특허법원 2020. 3. 13. 선고 2019허5478 판결 확인대상발명이 복수라는 것만으로 바로 권리범위 확인심판청구가 위법하다고 볼 수 있는지(소극)","answer":"특허법은 특허권자 전용실시권자 또는 이해관계인은 특허발명의 보호범위를 확인하기 위하여 특허권의 권리범위 확인심판을 청구할 수 있다고 규정하고 있을 뿐(제135조 제1, 2항), 특허권의 권리범위를 확인하기 위한 확인대상발명의 개수를 특별히 제한하고 있지는 않고, 확인대상발명을 복수로 하여 권리범위 확인심판 을 청구하는 것은 결국 두 개의 청구를 병합하는 것인데, 특허법상의 심판절차와 성질이 유사한 일반 행정심판 절차를 규정하고 있는 행정심판법은 관련 청구의 병합을 인정하고 있으며(행정심판법 제37조 참조), 관 련되는 복수의 청구를 하나의 심판절차에서 해결하는 것이 분쟁의 일회적 해결이나 심판경제상 바람직한 점 등을 종합하여 보면, 특별한 사정이 없는 한 확인대상발명이 복수라는 것만으로 바로 권리범위 확인심판청구가 위법하다고 볼 수 없다","slides":[{"label":"판시사항","text":"확인대상발명의 특정정도 – 복수/선택적 기재 특허법원 2020. 3. 13. 선고 2019허5478 판결 확인대상발명이 복수라는 것만으로 바로 권리범위 확인심판청구가 위법하다고 볼 수 있는지(소극)"},{"label":"판결요지","text":"특허법은 특허권자 전용실시권자 또는 이해관계인은 특허발명의 보호범위를 확인하기 위하여 특허권의 권리범위 확인심판을 청구할 수 있다고 규정하고 있을 뿐(제135조 제1, 2항), 특허권의 권리범위를 확인하기 위한 확인대상발명의 개수를 특별히 제한하고 있지는 않고, 확인대상발명을 복수로 하여 권리범위 확인심판 을 청구하는 것은 결국 두 개의 청구를 병합하는 것인데, 특허법상의 심판절차와 성질이 유사한 일반 행정심판 절차를 규정하고 있는 행정심판법은 관련 청구의 병합을 인정하고 있으며(행정심판법 제37조 참조), 관 련되는 복수의 청구를 하나의 심판절차에서 해결하는 것이 분쟁의 일회적 해결이나 심판경제상 바람직한 점 등을 종합하여 보면, 특별한 사정이 없는 한 확인대상발명이 복수라는 것만으로 바로 권리범위 확인심판청구가 위법하다고 볼 수 없다"}]},{"section":"특허심판 - 권리범위확인심판","question":"적극적 권리범위확인심판의 확인대상발명 대법원 2012. 10. 25. 선고 2011후2626 판결 판시 적극적 권리범위확인심판에서 심판청구인이 특정한 확인대상발명과 피심판청구인이 실시하고 있는 발명 사항 사이에 동일성이 인정되지 않는 경우, 확인의 이익이 있는지 여부(소극) 및 이 경우 발명의 동일성의 의미","answer":"심판청구인이 특정한 확인대상발명과 피심판청구인이 실시하고 있는 발명 사이에 동일성이 인정되지 아니 하면, 확인대상발명이 특허발명의 권리범위에 속한다는 심결이 확정된다고 하더라도 그 심결은 심판 청구인이 특정한 확인대상발명에 대하여만 효력을 미칠 뿐 실제 피심판청구인이 실시하고 있는 발명 에 대하여는 아무런 효력이 없으므로, 피심판청구인이 실시하지 않고 있는 발명을 대상으로 한 그와 같은 적극적 권리범위확인 심판청구는 확인의 이익이 없어 부적법하여 각하되어야 한다. 그리고 이 경우 확인대상발명과 피심판청구인이 실시하고 있는 발명의 동일성은 피심판청구인이 확인대상발명을 실시하고 있는지 여부라는 사실확정에 관한 것이므로 이들 발명이 사실적 관점에서 같다고 보이는 경우에 한하여 그 동일성을 인정하여야 한다.","slides":[{"label":"판시사항","text":"적극적 권리범위확인심판의 확인대상발명 대법원 2012. 10. 25. 선고 2011후2626 판결 판시 적극적 권리범위확인심판에서 심판청구인이 특정한 확인대상발명과 피심판청구인이 실시하고 있는 발명 사항 사이에 동일성이 인정되지 않는 경우, 확인의 이익이 있는지 여부(소극) 및 이 경우 발명의 동일성의 의미"},{"label":"판결요지","text":"심판청구인이 특정한 확인대상발명과 피심판청구인이 실시하고 있는 발명 사이에 동일성이 인정되지 아니 하면, 확인대상발명이 특허발명의 권리범위에 속한다는 심결이 확정된다고 하더라도 그 심결은 심판 청구인이 특정한 확인대상발명에 대하여만 효력을 미칠 뿐 실제 피심판청구인이 실시하고 있는 발명 에 대하여는 아무런 효력이 없으므로, 피심판청구인이 실시하지 않고 있는 발명을 대상으로 한 그와 같은 적극적 권리범위확인 심판청구는 확인의 이익이 없어 부적법하여 각하되어야 한다. 그리고 이 경우 확인대상발명과 피심판청구인이 실시하고 있는 발명의 동일성은 피심판청구인이 확인대상발명을 실시하고 있는지 여부라는 사실확정에 관한 것이므로 이들 발명이 사실적 관점에서 같다고 보이는 경우에 한하여 그 동일성을 인정하여야 한다."}]},{"section":"특허심판 - 권리범위확인심판","question":"물건특허의 확인대상발명 대법원 2022. 1. 14. 선고 2019후11541 판결 물건발명의 특허권자가 피심판청구인이 실시한 물건을 제조방법과 관계없이 확인대상 발명으로 특정하 판시 여 특허권의 권리범위에 속하는지 확인을 구할 수 있는지 여부(적극) 및 이때 확인대상 발명의 설명서나 사항 도면에 제조방법을 부가적으로 기재한 경우, 그러한 제조방법으로 제조한 물건만이 심판의 대상인 확인 대상 발명이 되는지 여부(소극)","answer":"물건발명의 특허권은 물건발명과 동일한 구성을 가진 물건이 실시되었다면 제조방법과 관계없이 그 물건에 효력이 미친다. 따라서 물건발명의 특허권자는 피심판청구인이 실시한 물건을 그 제조방법과 관계없이 확인대상 발명으로 특정하여 특허권의 권리범위에 속하는지 확인을 구할 수 있고, 이때 확인대상 발명의 설명 서나 도면에 확인대상 발명의 이해를 돕기 위한 부연 설명으로 그 제조방법을 부가적으로 기재하였다고 하여 그러한 제조방법으로 제조한 물건만이 심판의 대상인 확인대상 발명이 된다고 할 수는 없다.","slides":[{"label":"판시사항","text":"물건특허의 확인대상발명 대법원 2022. 1. 14. 선고 2019후11541 판결 물건발명의 특허권자가 피심판청구인이 실시한 물건을 제조방법과 관계없이 확인대상 발명으로 특정하 판시 여 특허권의 권리범위에 속하는지 확인을 구할 수 있는지 여부(적극) 및 이때 확인대상 발명의 설명서나 사항 도면에 제조방법을 부가적으로 기재한 경우, 그러한 제조방법으로 제조한 물건만이 심판의 대상인 확인 대상 발명이 되는지 여부(소극)"},{"label":"판결요지","text":"물건발명의 특허권은 물건발명과 동일한 구성을 가진 물건이 실시되었다면 제조방법과 관계없이 그 물건에 효력이 미친다. 따라서 물건발명의 특허권자는 피심판청구인이 실시한 물건을 그 제조방법과 관계없이 확인대상 발명으로 특정하여 특허권의 권리범위에 속하는지 확인을 구할 수 있고, 이때 확인대상 발명의 설명 서나 도면에 확인대상 발명의 이해를 돕기 위한 부연 설명으로 그 제조방법을 부가적으로 기재하였다고 하여 그러한 제조방법으로 제조한 물건만이 심판의 대상인 확인대상 발명이 된다고 할 수는 없다."}]},{"section":"특허심판 - 권리범위확인심판","question":"소극적 권리범위확인심판의 확인대상발명 대법원 2023. 1. 12. 선고 2020후11813 판결 판시 소극적 권리범위확인심판 청구에서 심판청구인이 현실적으로 실시하는 기술이 심판청구에서 심판의 대 사항 상으로 삼은 구체적인 발명과 다른 경우의 심판 대상","answer":"권리범위확인심판은 권리의 효력이 미치는 범위를 대상물과의 관계에서 구체적으로 확정하는 것이어 서 특허권 권리범위확인심판 청구의 심판대상은 심판청구인이 그 청구에서 심판의 대상으로 삼은 구체적인 발명이다. 그리고 소극적 권리범위확인심판에서는 심판청구인이 현실적으로 실시하는 기술이 심판청구에 서 심판의 대상으로 삼은 구체적인 발명과 다르다고 하더라도 심판청구인이 특정한 발명이 실시가능성이 없 을 경우 그 청구의 적법 여부가 문제로 될 수 있을 뿐이고, 여전히 심판의 대상은 심판청구인이 특정한 확인 대상발명으로, 이를 기준으로 특허발명과 대비하여 그 권리범위에 속하는지 여부를 판단하여야 한다.","slides":[{"label":"판시사항","text":"소극적 권리범위확인심판의 확인대상발명 대법원 2023. 1. 12. 선고 2020후11813 판결 판시 소극적 권리범위확인심판 청구에서 심판청구인이 현실적으로 실시하는 기술이 심판청구에서 심판의 대 사항 상으로 삼은 구체적인 발명과 다른 경우의 심판 대상"},{"label":"판결요지","text":"권리범위확인심판은 권리의 효력이 미치는 범위를 대상물과의 관계에서 구체적으로 확정하는 것이어 서 특허권 권리범위확인심판 청구의 심판대상은 심판청구인이 그 청구에서 심판의 대상으로 삼은 구체적인 발명이다. 그리고 소극적 권리범위확인심판에서는 심판청구인이 현실적으로 실시하는 기술이 심판청구에 서 심판의 대상으로 삼은 구체적인 발명과 다르다고 하더라도 심판청구인이 특정한 발명이 실시가능성이 없 을 경우 그 청구의 적법 여부가 문제로 될 수 있을 뿐이고, 여전히 심판의 대상은 심판청구인이 특정한 확인 대상발명으로, 이를 기준으로 특허발명과 대비하여 그 권리범위에 속하는지 여부를 판단하여야 한다."}]},{"section":"특허심판 - 권리범위확인심판","question":"소극적 권리범위확인심판의 확인대상발명 (의약품) 대법원 2025. 5. 15. 선고 2022후10746 판결 판시 소극적 권리범위확인심판에서 확인대상 발명을 약사법상 품목허가를 받았거나 받을 가능성이 있는 의약 사항 품으로 한정하여야 하는지 여부 (소극)","answer":"특허법상 소극적 권리범위 확인심판은 약사법상의 품목허가와 제도의 취지가 다르고, 현재 실시하는 것만이 아니라 장래 실시 예정인 것도 심판대상인 확인대상 발명으로 삼을 수 있다. 그러므로 심결 시에 품목허가를 받았거나 받을 가능성이 있는 의약품만을 확인대상 발명으로 삼아야 한다고 볼 수 없고, 그러한 의약품과 동 일한 확인대상 발명의 경우에만 장래 실시할 가능성이 있다고 단정할 수도 없다.","slides":[{"label":"판시사항","text":"소극적 권리범위확인심판의 확인대상발명 (의약품) 대법원 2025. 5. 15. 선고 2022후10746 판결 판시 소극적 권리범위확인심판에서 확인대상 발명을 약사법상 품목허가를 받았거나 받을 가능성이 있는 의약 사항 품으로 한정하여야 하는지 여부 (소극)"},{"label":"판결요지","text":"특허법상 소극적 권리범위 확인심판은 약사법상의 품목허가와 제도의 취지가 다르고, 현재 실시하는 것만이 아니라 장래 실시 예정인 것도 심판대상인 확인대상 발명으로 삼을 수 있다. 그러므로 심결 시에 품목허가를 받았거나 받을 가능성이 있는 의약품만을 확인대상 발명으로 삼아야 한다고 볼 수 없고, 그러한 의약품과 동 일한 확인대상 발명의 경우에만 장래 실시할 가능성이 있다고 단정할 수도 없다."}]},{"section":"특허심판 - 권리범위확인심판","question":"확인대상발명에 대해 다툼이 없는 경우 대법원 2016. 9. 30. 선고 2014후2849 판결 소극적 권리범위확인심판에서 장래 실시 예정인 것을 심판대상으로 삼을 수 있는지 여부(적극) / 당사자 판시 사이에 심판청구인이 장래 실시할 예정이라고 주장하면서 심판대상으로 특정한 확인대상발명이 특허권 사항 의 권리범위에 속하지 않는다는 점에 관하여 다툼이 없는 경우, 확인대상발명을 심판대상으로 하는 소극적 권리범위확인심판이 허용되는지 여부(소극)","answer":"소극적 권리범위확인심판에서는 현재 실시하는 것만이 아니라 장래 실시 예정인 것도 심판대상으로 삼을 수 있다. 그러나 당사자 사이에 심판청구인이 현재 실시하고 있는 기술이 특허권의 권리범위에 속하는지에 관하여만 다툼이 있을 뿐이고, 심판청구인이 장래 실시할 예정이라고 주장하면서 심판대상으로 특정한 확인대상발명이 특허권의 권리범위에 속하지 않는다는 점에 관하여는 아무런 다툼이 없는 경우라면, 그러한 확인 대상발명을 심판대상으로 하는 소극적 권리범위확인심판은 심판청구의 이익이 없어 허용되지 않는다.","slides":[{"label":"판시사항","text":"확인대상발명에 대해 다툼이 없는 경우 대법원 2016. 9. 30. 선고 2014후2849 판결 소극적 권리범위확인심판에서 장래 실시 예정인 것을 심판대상으로 삼을 수 있는지 여부(적극) / 당사자 판시 사이에 심판청구인이 장래 실시할 예정이라고 주장하면서 심판대상으로 특정한 확인대상발명이 특허권 사항 의 권리범위에 속하지 않는다는 점에 관하여 다툼이 없는 경우, 확인대상발명을 심판대상으로 하는 소극적 권리범위확인심판이 허용되는지 여부(소극)"},{"label":"판결요지","text":"소극적 권리범위확인심판에서는 현재 실시하는 것만이 아니라 장래 실시 예정인 것도 심판대상으로 삼을 수 있다. 그러나 당사자 사이에 심판청구인이 현재 실시하고 있는 기술이 특허권의 권리범위에 속하는지에 관하여만 다툼이 있을 뿐이고, 심판청구인이 장래 실시할 예정이라고 주장하면서 심판대상으로 특정한 확인대상발명이 특허권의 권리범위에 속하지 않는다는 점에 관하여는 아무런 다툼이 없는 경우라면, 그러한 확인 대상발명을 심판대상으로 하는 소극적 권리범위확인심판은 심판청구의 이익이 없어 허용되지 않는다."}]},{"section":"특허심판 - 권리범위확인심판","question":"침해소송 계속 중인 확인대상발명 대법원 2018. 2. 8. 선고 2016후328 판결 판시 특허권 침해에 관하여 계속 중인 민사소송에서 특허권의 효력이 미치는 범위를 확정할 수 있는 경우, 위 사항 민사소송과 별개로 청구된 권리범위확인심판의 심판청구의 이익이 부정되는지 여부(소극)","answer":"이와 같은 권리범위확인심판 제도의 성질과 기능, 특허법의 규정내용과 취지 등에 비추어 보면, 침해소송이 계속 중이어서 그 소송에서 특허권의 효력이 미치는 범위를 확정할 수 있다고 하더라도 이를 이유로 침해소송과 별개로 청구된 권리범위확인심판의 심판청구의 이익이 부정된다고 볼 수는 없다.","slides":[{"label":"판시사항","text":"침해소송 계속 중인 확인대상발명 대법원 2018. 2. 8. 선고 2016후328 판결 판시 특허권 침해에 관하여 계속 중인 민사소송에서 특허권의 효력이 미치는 범위를 확정할 수 있는 경우, 위 사항 민사소송과 별개로 청구된 권리범위확인심판의 심판청구의 이익이 부정되는지 여부(소극)"},{"label":"판결요지","text":"이와 같은 권리범위확인심판 제도의 성질과 기능, 특허법의 규정내용과 취지 등에 비추어 보면, 침해소송이 계속 중이어서 그 소송에서 특허권의 효력이 미치는 범위를 확정할 수 있다고 하더라도 이를 이유로 침해소송과 별개로 청구된 권리범위확인심판의 심판청구의 이익이 부정된다고 볼 수는 없다."}]},{"section":"특허심판 - 권리범위확인심판","question":"등록권리간 적극적 권리범위확인심판 대법원 2025. 9. 11. 선고 2024후10436 판결 판시 선등록 특허권자가 후등록 특허권자를 상대로 제기하는 적극적 권리범위확인심판이 적법한지 여부(소극) 사항 및 두 발명이 특허법 제98조의 이용관계에 있는 경우에는 예외적으로 허용되는지 여부 (적극)","answer":"선등록 특허권자가 후등록 특허권자를 상대로 후등록 특허발명을 확인대상 발명으로 삼아 선등록 특허권의 권리범위에 속한다는 확인을 구하는 적극적 권리범위 확인심판청구는, 등록무효절차 이외에서 등록된 권리 의 효력을 부인하는 결과가 되어 확인의 이익이 인정될 수 없으므로 원칙적으로 부적법하다(대법원 2007. 10. 11. 선고 2007후2766 판결, 대법원 2016. 4. 28. 선고 2013후2965 판결 등 참조). 다만 예외적 으로 두 발명이 특허법 제98조에서 규정하는 이용관계에 있어 확인대상 발명의 등록의 효력을 부정하지 않 고 권리범위의 확인을 구할 수 있는 경우에는 권리 대 권리 간 적극적 권리범위 확인심판의 청구가 허용된다 (대법원 2002. 6. 28. 선고 99후2433 판결, 대법원 2016. 4. 28. 선고 2015후161 판결 등 참조).","slides":[{"label":"판시사항","text":"등록권리간 적극적 권리범위확인심판 대법원 2025. 9. 11. 선고 2024후10436 판결 판시 선등록 특허권자가 후등록 특허권자를 상대로 제기하는 적극적 권리범위확인심판이 적법한지 여부(소극) 사항 및 두 발명이 특허법 제98조의 이용관계에 있는 경우에는 예외적으로 허용되는지 여부 (적극)"},{"label":"판결요지","text":"선등록 특허권자가 후등록 특허권자를 상대로 후등록 특허발명을 확인대상 발명으로 삼아 선등록 특허권의 권리범위에 속한다는 확인을 구하는 적극적 권리범위 확인심판청구는, 등록무효절차 이외에서 등록된 권리 의 효력을 부인하는 결과가 되어 확인의 이익이 인정될 수 없으므로 원칙적으로 부적법하다(대법원 2007. 10. 11. 선고 2007후2766 판결, 대법원 2016. 4. 28. 선고 2013후2965 판결 등 참조). 다만 예외적 으로 두 발명이 특허법 제98조에서 규정하는 이용관계에 있어 확인대상 발명의 등록의 효력을 부정하지 않 고 권리범위의 확인을 구할 수 있는 경우에는 권리 대 권리 간 적극적 권리범위 확인심판의 청구가 허용된다 (대법원 2002. 6. 28. 선고 99후2433 판결, 대법원 2016. 4. 28. 선고 2015후161 판결 등 참조)."}]},{"section":"특허심판 - 권리범위확인심판","question":"등록권리간 적극적 권리범위확인심판 대법원 2016. 4. 28. 선고 2013후2965 판결 판시 선등록 특허권자가 후등록 특허권자를 상대로 제기하는 적극적 권리범위확인심판이 적법한지 여부(소극) 사항 및 이러한 법리가 후등록 특허발명의 신규성 인정 여하에 따라 적용 여부가 달라지는지 여부(소극)","answer":"선등록 특허권자가 후등록 특허권자를 상대로 제기하는 적극적 권리범위확인심판은 등록무효절차 이외 에서 등록된 권리의 효력을 부인하는 결과가 되어 부적법하다. 이와 같이 선등록 특허권자가 후등록 특허권자를 상대로 제기하는 적극적 권리범위확인심판이 허용되지 아니하는 이유에 비추어 볼 때 이러한 법리는 후 등록 특허발명의 신규성 인정 여하에 따라 그 적용 여부가 달라지는 것은 아니다.","slides":[{"label":"판시사항","text":"등록권리간 적극적 권리범위확인심판 대법원 2016. 4. 28. 선고 2013후2965 판결 판시 선등록 특허권자가 후등록 특허권자를 상대로 제기하는 적극적 권리범위확인심판이 적법한지 여부(소극) 사항 및 이러한 법리가 후등록 특허발명의 신규성 인정 여하에 따라 적용 여부가 달라지는지 여부(소극)"},{"label":"판결요지","text":"선등록 특허권자가 후등록 특허권자를 상대로 제기하는 적극적 권리범위확인심판은 등록무효절차 이외 에서 등록된 권리의 효력을 부인하는 결과가 되어 부적법하다. 이와 같이 선등록 특허권자가 후등록 특허권자를 상대로 제기하는 적극적 권리범위확인심판이 허용되지 아니하는 이유에 비추어 볼 때 이러한 법리는 후 등록 특허발명의 신규성 인정 여하에 따라 그 적용 여부가 달라지는 것은 아니다."}]},{"section":"특허심판 - 권리범위확인심판","question":"등록권리간 적극적 권리범위확인심판 대법원 2016. 4. 28. 선고 2015후161 판결 판시 두 발명이 특허법 제98조의 이용관계에 해당하지 않는 경우, 후출원 등록발명을 대상으로 한 권리 대 권 사항 리 적극적 권리범위확인심판은 부적법하여 본안이 아니라 각하되어야 하는지 여부 (적극)","answer":"두 발명이 이용관계에 있다고 볼 수 없으므로, 이 사건 권리범위 확인심판 청구는 후출원에 의하여 등록된 발명을 확인대상발명으로 하여 선출원에 의한 등록발명의 권리범위에 속한다는 확인을 구하는 적극적 권리 범위확인심판으로서 부적법하다. 그렇다면 특허심판원으로서는 이 사건 심판청구를 각하하였어야 마땅한 데도 본안에 나아가 이 사건 심판청구를 기각하는 심결에 이른 잘못이 있고, 원심도 이를 이용관계에 해당한다고 보아 본안에 관하여 판단하였으니, 원심판결에는 권리범위 확인심판의 적법요건에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. ","slides":[{"label":"판시사항","text":"등록권리간 적극적 권리범위확인심판 대법원 2016. 4. 28. 선고 2015후161 판결 판시 두 발명이 특허법 제98조의 이용관계에 해당하지 않는 경우, 후출원 등록발명을 대상으로 한 권리 대 권 사항 리 적극적 권리범위확인심판은 부적법하여 본안이 아니라 각하되어야 하는지 여부 (적극)"},{"label":"판결요지","text":"두 발명이 이용관계에 있다고 볼 수 없으므로, 이 사건 권리범위 확인심판 청구는 후출원에 의하여 등록된 발명을 확인대상발명으로 하여 선출원에 의한 등록발명의 권리범위에 속한다는 확인을 구하는 적극적 권리 범위확인심판으로서 부적법하다. 그렇다면 특허심판원으로서는 이 사건 심판청구를 각하하였어야 마땅한 데도 본안에 나아가 이 사건 심판청구를 기각하는 심결에 이른 잘못이 있고, 원심도 이를 이용관계에 해당한다고 보아 본안에 관하여 판단하였으니, 원심판결에는 권리범위 확인심판의 적법요건에 관한 법리를 오해하여 판결에 영향을 미친 잘못이 있다. 6 정정심판 분명하지 않은 기재의 명확화 판단"}]},{"section":"특허심판 - 정정심판","question":"– 청구범위에 기재되어 있지 아니한 사항이 발명의 설 명에 포함되어 있는 경우 대법원 2016. 11. 25. 선고 2014후2184 판결 [1] 구 특허법 제133조의2, 제136조 제3항의 취지 및 특허무효심판절차에서 허용되는 오류 정정의 범위 판시 [2] 발명의 상세한 설명에 기재된 모든 기술적 사상이 특허청구범위에 포함되어야 하는지 여부(소극) 및 사항 특허청구범위에 기재되어 있지 아니한 사항이 발명의 상세한 설명에 포함되어 있는 경우, 발명의 상세한 설명과 특허청구범위가 일치하지 아니하거나 모순이 있는 경우인지 여부(원칙적 소극)","answer":"이와 같은 오류의 정정에는 특허청구범위에 관한 기재 자체가 명료하지 아니한 경우 그 의미를 명확하게 하 든가 기재상의 불비를 해소하는 것 및 발명의 상세한 설명과 특허청구범위가 일치하지 아니하거나 모순이 있 는 경우 이를 통일하여 모순이 없게 하는 것 등이 포함된다고 해석된다. 한편, 특허청구범위는 발명의 상세한 설명에 기재된 기술적 사상의 전부 또는 일부를 특허발명의 보호범위 로 특정한 것이고, 발명의 상세한 설명에 기재된 모든 기술적 사상이 반드시 특허청구범위에 포함되어야 하 는 것은 아니므로, 특별한 사정이 없는 한 특허청구범위에 기재되어 있지 아니한 사항이 발명의 상세한 설명 에 포함되어 있다고 하여 발명의 상세한 설명과 특허청구범위가 일치하지 아니하거나 모순이 있는 경우라고 보기는 어렵다.","slides":[{"label":"판시사항","text":"– 청구범위에 기재되어 있지 아니한 사항이 발명의 설 명에 포함되어 있는 경우 대법원 2016. 11. 25. 선고 2014후2184 판결"},{"label":"판시사항","text":"[1] 구 특허법 제133조의2, 제136조 제3항의 취지 및 특허무효심판절차에서 허용되는 오류 정정의 범위 판시"},{"label":"판시사항","text":"[2] 발명의 상세한 설명에 기재된 모든 기술적 사상이 특허청구범위에 포함되어야 하는지 여부(소극) 및 사항 특허청구범위에 기재되어 있지 아니한 사항이 발명의 상세한 설명에 포함되어 있는 경우, 발명의 상세한 설명과 특허청구범위가 일치하지 아니하거나 모순이 있는 경우인지 여부(원칙적 소극)"},{"label":"판결요지","text":"이와 같은 오류의 정정에는 특허청구범위에 관한 기재 자체가 명료하지 아니한 경우 그 의미를 명확하게 하 든가 기재상의 불비를 해소하는 것 및 발명의 상세한 설명과 특허청구범위가 일치하지 아니하거나 모순이 있 는 경우 이를 통일하여 모순이 없게 하는 것 등이 포함된다고 해석된다. 한편, 특허청구범위는 발명의 상세한 설명에 기재된 기술적 사상의 전부 또는 일부를 특허발명의 보호범위 로 특정한 것이고, 발명의 상세한 설명에 기재된 모든 기술적 사상이 반드시 특허청구범위에 포함되어야 하 는 것은 아니므로, 특별한 사정이 없는 한 특허청구범위에 기재되어 있지 아니한 사항이 발명의 상세한 설명 에 포함되어 있다고 하여 발명의 상세한 설명과 특허청구범위가 일치하지 아니하거나 모순이 있는 경우라고 보기는 어렵다."}]},{"section":"특허심판 - 정정심판","question":"정정의 범위 – 명세서 또는 도면에 기재된 사항의 범위 대법원 2014. 2. 27. 선고 2012후3404 판결 판시 특허법 제136조 제2항의 ‘명세서 또는 도면에 기재된 사항’의 범위 및 그 범위를 넘는 신규사항을 추가하 사항 여 명세서 또는 도면을 정정하는 것이 허용되는지 여부(소극)","answer":"특허발명의 명세서 또는 도면의 정정은 그 명세서 또는 도면에 기재된 사항의 범위 이내에서 할 수 있다(특허법 제136조 제2항). 여기서 ‘명세서 또는 도면에 기재된 사항’이라 함은 거기에 명시적으로 기재되어 있는 것 뿐만 아니라 기재되어 있지는 않지만 출원 시의 기술상식으로 볼 때 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)이면 명시적으로 기재되어 있는 내용 자체로부터 그와 같은 기재가 있는 것과 마찬가지라고 명확하게 이해할 수 있는 사항을 포함하지만, 그러한 사항의 범위를 넘는 신규사항을 추가하여 특허발명의 명세서 또는 도면을 정정하는 것은 허용될 수 없다.","slides":[{"label":"판시사항","text":"정정의 범위 – 명세서 또는 도면에 기재된 사항의 범위 대법원 2014. 2. 27. 선고 2012후3404 판결 판시 특허법 제136조 제2항의 ‘명세서 또는 도면에 기재된 사항’의 범위 및 그 범위를 넘는 신규사항을 추가하 사항 여 명세서 또는 도면을 정정하는 것이 허용되는지 여부(소극)"},{"label":"판결요지","text":"특허발명의 명세서 또는 도면의 정정은 그 명세서 또는 도면에 기재된 사항의 범위 이내에서 할 수 있다(특허법 제136조 제2항). 여기서 ‘명세서 또는 도면에 기재된 사항’이라 함은 거기에 명시적으로 기재되어 있는 것 뿐만 아니라 기재되어 있지는 않지만 출원 시의 기술상식으로 볼 때 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)이면 명시적으로 기재되어 있는 내용 자체로부터 그와 같은 기재가 있는 것과 마찬가지라고 명확하게 이해할 수 있는 사항을 포함하지만, 그러한 사항의 범위를 넘는 신규사항을 추가하여 특허발명의 명세서 또는 도면을 정정하는 것은 허용될 수 없다."}]},{"section":"특허심판 - 정정심판","question":"정정의한계 – 청구범위의실질적확장 변경판단 대법원 2018. 4. 12. 선고 2016후830 판결 구 특허법 제136조 제1항, 제3항에서 정한 특허청구범위의 정정이 특허청구범위를 실질적으로 확장하거 나 변경하는 경우에 해당하는지 판단하는 기준 및 특허청구범위의 정정이 특허청구범위의 실질적인 변경 에 해당하지 않는 경우","answer":"특허청구범위를 실질적으로 확장하거나 변경하는 경우에 해당하는지는 특허청구범위 자체의 형식적인 기재뿐만 아니라 발명의 상세한 설명을 포함하여 명세서와 도면 전체에 의하여 파악되는 특허청구범위의 실질 적인 내용을 대비하여 판단하여야 한다. 만약 특허청구범위의 정정이 특허청구범위의 감축에 해당되고, 그 목적이나 효과에 어떠한 변경이 있다고 할 수 없으며, 발명의 상세한 설명 및 도면에 기재되어 있는 내용을 그대로 반영한 것이어서 제3자에게 예기치 못한 손해를 끼칠 염려가 없는 경우에는, 특허청구범위의 실질적 인 변경에 해당되지 아니한다.","slides":[{"label":"판시사항","text":"정정의한계 – 청구범위의실질적확장 변경판단 대법원 2018. 4. 12. 선고 2016후830 판결 구 특허법 제136조 제1항, 제3항에서 정한 특허청구범위의 정정이 특허청구범위를 실질적으로 확장하거 나 변경하는 경우에 해당하는지 판단하는 기준 및 특허청구범위의 정정이 특허청구범위의 실질적인 변경 에 해당하지 않는 경우"},{"label":"판결요지","text":"특허청구범위를 실질적으로 확장하거나 변경하는 경우에 해당하는지는 특허청구범위 자체의 형식적인 기재뿐만 아니라 발명의 상세한 설명을 포함하여 명세서와 도면 전체에 의하여 파악되는 특허청구범위의 실질 적인 내용을 대비하여 판단하여야 한다. 만약 특허청구범위의 정정이 특허청구범위의 감축에 해당되고, 그 목적이나 효과에 어떠한 변경이 있다고 할 수 없으며, 발명의 상세한 설명 및 도면에 기재되어 있는 내용을 그대로 반영한 것이어서 제3자에게 예기치 못한 손해를 끼칠 염려가 없는 경우에는, 특허청구범위의 실질적 인 변경에 해당되지 아니한다."}]},{"section":"특허심판 - 정정심판","question":"정정의견제출통지서 부여 규정 - 강행규정 대법원 2019. 7. 25. 선고 2018후12004 판결 정정심판이나 그 심결취소소송에서 정정의견제출 통지서를 통하여 심판청구인에게 의견서 제출 기회를 판시 부여한 바 없는 사유를 들어 정정심판청구를 기각하는 심결을 하거나, 심결취소청구를 기각할 수 있는지 사항 여부(소극) / 선행고안에 의하여 고안의 진보성이 부정된다는 취지로 정정심판을 기각한 경우, 특허청장 이 취소소송절차에 이르러 비로소 제출한 자료들을 판단의 근거로 삼을 수 있는지 여부(한정 적극)","answer":"실용신안법 제33조에서 준용하는 특허법 제136조 제6항은 정정심판에서 심판청구인에게 의견서 제출기회를 부여함으로써 정정심판청구에 대한 심사의 적정을 기하고 심사제도의 신용을 유지한다는 공익상의 요구에 기인하는 강행규정이다. 따라서 정정심판이나 그 심결취소소송에서 정정의견제출 통지서를 통하여 심판청구인에게 의견서 제출 기회를 부여한 바 없는 사유를 들어 정정심판청구를 기각하는 심결을 하거나, 심결취소청구를 기각하는 것은 위법하다. 특히 정정심판을 기각하는 이유가 선행고안에 의하여 고안의 진보성이 부정된다는 취지라면 특허청장이 취소소송절차에 이르러 비로소 제출한 자료들은, 선행고안을 보충하여 출원 당시 해당 고안과 동일한 기술분야에 널리 알려진 주지관용기술을 증명하기 위한 것이거나, 정정의견제출 통지서에 기재된 선행고안의 기재 를 보충 또는 뒷받침하는 것에 불과한 경우라고 인정될 때 판단의 근거로 삼을 수 있다","slides":[{"label":"판시사항","text":"정정의견제출통지서 부여 규정 - 강행규정 대법원 2019. 7. 25. 선고 2018후12004 판결 정정심판이나 그 심결취소소송에서 정정의견제출 통지서를 통하여 심판청구인에게 의견서 제출 기회를 판시 부여한 바 없는 사유를 들어 정정심판청구를 기각하는 심결을 하거나, 심결취소청구를 기각할 수 있는지 사항 여부(소극) / 선행고안에 의하여 고안의 진보성이 부정된다는 취지로 정정심판을 기각한 경우, 특허청장 이 취소소송절차에 이르러 비로소 제출한 자료들을 판단의 근거로 삼을 수 있는지 여부(한정 적극)"},{"label":"판결요지","text":"실용신안법 제33조에서 준용하는 특허법 제136조 제6항은 정정심판에서 심판청구인에게 의견서 제출기회를 부여함으로써 정정심판청구에 대한 심사의 적정을 기하고 심사제도의 신용을 유지한다는 공익상의 요구에 기인하는 강행규정이다. 따라서 정정심판이나 그 심결취소소송에서 정정의견제출 통지서를 통하여 심판청구인에게 의견서 제출 기회를 부여한 바 없는 사유를 들어 정정심판청구를 기각하는 심결을 하거나, 심결취소청구를 기각하는 것은 위법하다. 특히 정정심판을 기각하는 이유가 선행고안에 의하여 고안의 진보성이 부정된다는 취지라면 특허청장이 취소소송절차에 이르러 비로소 제출한 자료들은, 선행고안을 보충하여 출원 당시 해당 고안과 동일한 기술분야에 널리 알려진 주지관용기술을 증명하기 위한 것이거나, 정정의견제출 통지서에 기재된 선행고안의 기재 를 보충 또는 뒷받침하는 것에 불과한 경우라고 인정될 때 판단의 근거로 삼을 수 있다"}]},{"section":"특허심판 - 정정심판","question":"정정명세서의 보정 – 요지변경이 아닌 경우 대법원 2013. 2. 28. 선고 2011후3643 판결 정정명세서 등에 관한 보정의 허용 범위","answer":"실질적으로 새로운 정정청구에 해당하는 정정명세서 등의 보정을 허용하게 되면 정정청구의 기간을 제한한 구 특허법의 취지를 몰각시키는 결과가 되고, 정정청구가 받아들여질 때까지 정정명세서 등의 보정서 제출이 무한히 반복되어 행정상의 낭비와 심판절차의 지연이 초래될 우려가 있는 점을 고려할 때, 정정명세서 등에 관한 보정은 당초의 정정사항을 삭제하거나 정정청구의 내용이 실질적으로 동일하게 되는 범위 내에서 경미 한 하자를 고치는 정도에서만 정정청구취지의 요지를 변경하지 않는 것으로서 허용된다고 보아야 한다. 특허무효심판과 동시에 계류 중인 경우","slides":[{"label":"판시사항","text":"정정명세서의 보정 – 요지변경이 아닌 경우 대법원 2013. 2. 28. 선고 2011후3643 판결 정정명세서 등에 관한 보정의 허용 범위"},{"label":"판결요지","text":"실질적으로 새로운 정정청구에 해당하는 정정명세서 등의 보정을 허용하게 되면 정정청구의 기간을 제한한 구 특허법의 취지를 몰각시키는 결과가 되고, 정정청구가 받아들여질 때까지 정정명세서 등의 보정서 제출이 무한히 반복되어 행정상의 낭비와 심판절차의 지연이 초래될 우려가 있는 점을 고려할 때, 정정명세서 등에 관한 보정은 당초의 정정사항을 삭제하거나 정정청구의 내용이 실질적으로 동일하게 되는 범위 내에서 경미 한 하자를 고치는 정도에서만 정정청구취지의 요지를 변경하지 않는 것으로서 허용된다고 보아야 한다. 특허무효심판과 동시에 계류 중인 경우"}]},{"section":"특허심판 - 정정심판","question":"특허무효심판과 동시에 계류 중인 경우 – 심리판단 우선순위 및 대상 대법원 2002. 8. 23. 선고 2001후713 판결 판시 동일한 특허발명에 대하여 특허무효심판과 정정심판이 특허심판원에 동시에 계속중에 있는 경우, 심리 사항 판단의 우선 순위 및 그 판단 대상(=정정심판청구 전 특허발명)","answer":"동일한 특허발명에 대하여 특허무효심판과 정정심판이 특허심판원에 동시에 계속중에 있는 경우에는 정정 심판제도의 취지상 정정심판을 특허무효심판에 우선하여 심리 판단하는 것이 바람직하나, 그렇다고 하여 반드시 정정심판을 먼저 심리 판단하여야 하는 것은 아니고, 또 특허무효심판을 먼저 심리하는 경우에도 그 판단대상은 정정심판청구 전 특허발명이며, 이러한 법리는 특허무효심판과 정정심판의 심결에 대한 취소소송 이 특허법원에 동시에 계속되어 있는 경우에도 적용된다고 볼 것이다.","slides":[{"label":"판시사항","text":"특허무효심판과 동시에 계류 중인 경우 – 심리판단 우선순위 및 대상 대법원 2002. 8. 23. 선고 2001후713 판결 판시 동일한 특허발명에 대하여 특허무효심판과 정정심판이 특허심판원에 동시에 계속중에 있는 경우, 심리 사항 판단의 우선 순위 및 그 판단 대상(=정정심판청구 전 특허발명)"},{"label":"판결요지","text":"동일한 특허발명에 대하여 특허무효심판과 정정심판이 특허심판원에 동시에 계속중에 있는 경우에는 정정 심판제도의 취지상 정정심판을 특허무효심판에 우선하여 심리 판단하는 것이 바람직하나, 그렇다고 하여 반드시 정정심판을 먼저 심리 판단하여야 하는 것은 아니고, 또 특허무효심판을 먼저 심리하는 경우에도 그 판단대상은 정정심판청구 전 특허발명이며, 이러한 법리는 특허무효심판과 정정심판의 심결에 대한 취소소송 이 특허법원에 동시에 계속되어 있는 경우에도 적용된다고 볼 것이다."}]},{"section":"특허심판 - 정정심판","question":"무효심결이 먼저 확정된 경우 대법원 2005. 3. 11. 선고 2003후2294 판결 무효로 된 특허의 정정을 구하는 심판의 적법 여부(소극)","answer":"특허무효심결이 확정되었을 때에는 특허권은 처음부터 존재하지 아니한 것으로 보므로, 무효로 된 특허 의 정정을 구하는 심판은 그 정정의 대상이 없어지게 되어 그 정정을 구할 이익도 없게 된다.","slides":[{"label":"판시사항","text":"무효심결이 먼저 확정된 경우 대법원 2005. 3. 11. 선고 2003후2294 판결 무효로 된 특허의 정정을 구하는 심판의 적법 여부(소극)"},{"label":"판결요지","text":"특허무효심결이 확정되었을 때에는 특허권은 처음부터 존재하지 아니한 것으로 보므로, 무효로 된 특허 의 정정을 구하는 심판은 그 정정의 대상이 없어지게 되어 그 정정을 구할 이익도 없게 된다."}]},{"section":"특허심판 - 정정심판","question":"사실심 변론종결 ‘전’ 정정심결이 확정된 경우 대법원 2020. 1. 22. 선고 2016후2522 전원합의체 판결 판시 특허권자가 정정심판을 청구하여 특허무효심판에 대한 심결취소소송의 사실심 변론종결 전에 특허발명 사항 의 명세서 또는 도면에 대하여 정정을 한다는 심결이 확정된 경우, 사실심 법원의 심리 판단의 대상","answer":"특허법의 관련 규정과 법리에 비추어 보면, 특허의 정정제도는 종전 특허발명과실질적 동일성을 유 지하는 것을 전제로 하는 것으로 정정사항은 정정 후 명세서 등의 내용을 구성하고, 정정심결이 심결취소소송의 사실심 변론종결 전에 이루어진 경우 그와 같이 정정된 명세서 등이 사실심 법원의 심리 판단의 대상이 된다.","slides":[{"label":"판시사항","text":"사실심 변론종결 ‘전’ 정정심결이 확정된 경우 대법원 2020. 1. 22. 선고 2016후2522 전원합의체 판결 판시 특허권자가 정정심판을 청구하여 특허무효심판에 대한 심결취소소송의 사실심 변론종결 전에 특허발명 사항 의 명세서 또는 도면에 대하여 정정을 한다는 심결이 확정된 경우, 사실심 법원의 심리 판단의 대상"},{"label":"판결요지","text":"특허법의 관련 규정과 법리에 비추어 보면, 특허의 정정제도는 종전 특허발명과실질적 동일성을 유 지하는 것을 전제로 하는 것으로 정정사항은 정정 후 명세서 등의 내용을 구성하고, 정정심결이 심결취소소송의 사실심 변론종결 전에 이루어진 경우 그와 같이 정정된 명세서 등이 사실심 법원의 심리 판단의 대상이 된다."}]},{"section":"특허심판 - 정정심판","question":"사실심 변론종결 ‘후’ 정정심결이 확정된 경우 대법원 2020. 1. 22. 선고 2016후2522 전원합의체 판결 특허권자가 정정심판을 청구하여 특허무효심판에 대한 심결취소소송의 사실심 변론종결 이후에 특허발명의 명세서 또는 도면에 대하여 정정을 한다는 심결이 확정된 경우, 정정 전 명세서 등으로 판단한 원심판결에 민사소송법 제451조 제1항 제8호가 규정한 재심사유가 있는지 여부(소극)","answer":"특허권자가 정정심판을 청구하여 특허무효심판에 대한 심결취소소송의 사실심 변론종결 이후에 특허발명의 명세서 또는 도면(이하 ‘명세서 등’이라 한다)에 대하여 정정을 한다는 심결(이하 ‘정정심결’이라 한다)이 확정 되더라도 정정 전 명세서 등으로 판단한 원심판결에 민사소송법 제451조 제1항 제8호가 규정한 재심사유가 있다고 볼 수 없다.","slides":[{"label":"판시사항","text":"사실심 변론종결 ‘후’ 정정심결이 확정된 경우 대법원 2020. 1. 22. 선고 2016후2522 전원합의체 판결 특허권자가 정정심판을 청구하여 특허무효심판에 대한 심결취소소송의 사실심 변론종결 이후에 특허발명의 명세서 또는 도면에 대하여 정정을 한다는 심결이 확정된 경우, 정정 전 명세서 등으로 판단한 원심판결에 민사소송법 제451조 제1항 제8호가 규정한 재심사유가 있는지 여부(소극)"},{"label":"판결요지","text":"특허권자가 정정심판을 청구하여 특허무효심판에 대한 심결취소소송의 사실심 변론종결 이후에 특허발명의 명세서 또는 도면(이하 ‘명세서 등’이라 한다)에 대하여 정정을 한다는 심결(이하 ‘정정심결’이라 한다)이 확정 되더라도 정정 전 명세서 등으로 판단한 원심판결에 민사소송법 제451조 제1항 제8호가 규정한 재심사유가 있다고 볼 수 없다."}]},{"section":"특허심판 - 정정심판","question":"정정확정과 침해죄 대법원 2005. 10. 14. 선고 2005도1262 판결 특허청구범위에 기재불비의 하자가 있어 권리범위를 인정할 수 없었던 특허발명에 대하여 그 특허청구범 판시 위를 정정하는 심결이 확정된 경우, 정정 전에 행하여진 피고인의 제품 제조, 판매행위가 특허권침해죄에 사항 해당하는지 여부를 판단함에 있어 정정 전의 특허청구범위를 침해대상 특허발명으로 삼은 원심의 판단을 수긍한 사례","answer":"헌법 제13조 제1항, 형법 제1조 제1항의 입법 취지 및 특허발명의 특허청구범위는 특허권자가 독점하 여 실시할 수 있는 영역과 제3자가 침해해서는 아니 되는 영역을 객관적으로 획정하여 대외적으로 공시하는 규범적 효력이 있는 점에 비추어 보면, 피고인의 행위가 특허권침해죄에 해당하는지 여부를 판단함에 있어 정정 후의 특허청구범위를 침해대상 특허발명으로 삼는 것이 피고인에게 불리한 결과를 가져오는 경우까 지도 정정의 소급적 효력이 당연히 미친다고 할 수는 없는 법리이고, 그 결과 원심이 정정 전의 특허청구범위를 침해대상 특허발명으로 삼아 피고인이 그 특허발명의 침해죄를 범하였는지 여부를 판단한 것은 정당하고, ...","slides":[{"label":"판시사항","text":"정정확정과 침해죄 대법원 2005. 10. 14. 선고 2005도1262 판결 특허청구범위에 기재불비의 하자가 있어 권리범위를 인정할 수 없었던 특허발명에 대하여 그 특허청구범 판시 위를 정정하는 심결이 확정된 경우, 정정 전에 행하여진 피고인의 제품 제조, 판매행위가 특허권침해죄에 사항 해당하는지 여부를 판단함에 있어 정정 전의 특허청구범위를 침해대상 특허발명으로 삼은 원심의 판단을 수긍한 사례"},{"label":"판결요지","text":"헌법 제13조 제1항, 형법 제1조 제1항의 입법 취지 및 특허발명의 특허청구범위는 특허권자가 독점하 여 실시할 수 있는 영역과 제3자가 침해해서는 아니 되는 영역을 객관적으로 획정하여 대외적으로 공시하는 규범적 효력이 있는 점에 비추어 보면, 피고인의 행위가 특허권침해죄에 해당하는지 여부를 판단함에 있어 정정 후의 특허청구범위를 침해대상 특허발명으로 삼는 것이 피고인에게 불리한 결과를 가져오는 경우까 지도 정정의 소급적 효력이 당연히 미친다고 할 수는 없는 법리이고, 그 결과 원심이 정정 전의 특허청구범위를 침해대상 특허발명으로 삼아 피고인이 그 특허발명의 침해죄를 범하였는지 여부를 판단한 것은 정당하고, ..."}]},{"section":"특허심판 - 정정심판","question":"정정청구에 따른 무효심판의 심리절차 특허법원 2006. 5. 18. 선고 2005허6320 판결 판시 무효심판절차에서 특허발명의 명세서 또는 도면에 대하여 정정을 청구한 경우, 특허발명의 무효 여부에 사항 대한 특허심판원의 판단 대상","answer":"무효심판절차에서 특허발명의 명세서 또는 도면에 대하여 정정을 청구한 경우 특허심판원에서는 그 절차에 서 청구된 정정의 적법 여부를 심리하고, 그 정정이 적법하다면 정정된 명세서 등에 기초한 특허발명의 무효 여부를 판단하며, 그 정정이 부적법하다면 정정 전의 명세서 등에 기초한 특허발명의 무효 여부를 판단하여야 한다.","slides":[{"label":"판시사항","text":"정정청구에 따른 무효심판의 심리절차 특허법원 2006. 5. 18. 선고 2005허6320 판결 판시 무효심판절차에서 특허발명의 명세서 또는 도면에 대하여 정정을 청구한 경우, 특허발명의 무효 여부에 사항 대한 특허심판원의 판단 대상"},{"label":"판결요지","text":"무효심판절차에서 특허발명의 명세서 또는 도면에 대하여 정정을 청구한 경우 특허심판원에서는 그 절차에 서 청구된 정정의 적법 여부를 심리하고, 그 정정이 적법하다면 정정된 명세서 등에 기초한 특허발명의 무효 여부를 판단하며, 그 정정이 부적법하다면 정정 전의 명세서 등에 기초한 특허발명의 무효 여부를 판단하여야 한다."}]},{"section":"특허심판 - 정정심판","question":"정정청구에 따른 무효심판의 심리절차 대법원 2025. 6. 26. 선고 2023후11487 판결 갑 주식회사가 을 주식회사를 상대로 명칭이 ‘혈압 강하용 약제학적 조성물’인 을 회사 특허발명의 등록무효를 구한 사안에서, 위 특허발명에 대한 특허무효심판절차에서 을 회사가 특허발명의 청구범위 제1항 발명에 대하여 한 정정청구가 특허법에 따른 요건을 갖추지 못하여부적법하다고 보아야 하는데도, 이를 적법하다고 본 뒤 정정 후 청구범위를 기준으로 제1항 발명 등에 무효사유가 없다고 본 원심판단에 법리 오해 등의 잘못이 있다고 한 사례","answer":"이러한 사정에 비추어 보면, 이 사건 제1항 발명의 청구범위 중 ‘피마살탄 칼륨염 또는 이의 수화물 30 ㎎’ 부분에 ‘(피마살탄 칼륨염으로 30㎎)’을, ‘암로디핀 베실레이트염 5㎎’ 부분에 ‘(암로디핀으로 5㎎)’을 각 각 추가하는 이 사건 정정청구는 특허법 제136조 제1항에서 정정청구 요건으로 규정하고 있는 ‘분명하지 아니 하게 기재된 사항을 명확하게 하는 경우’ 등에 해당한다고 보기 어렵다. 뿐만 아니라 이 사건 정정청구 전 이 사 건 제1항 발명과 이 사건 정정청구 후 이 사건 제1항 발명은 약리효과인 혈압 강하 효과를 나타내는 피마살탄 칼 륨염 용량과 암로디핀 용량에서 서로 다르게 되고 그로 인해 발명의 효과가 변경될 수 있어서, 이 사건 정정청구 는 ‘청구범위를 실질적으로 변경하는 경우’에 해당할 여지도 있다. 따라서 원심으로서는 정정 후 청구범위가 아니라 정정 전 청구범위를 기준으로 이 사건 제1항 발명 및 그 종속항 발명이거나 의약용도를 제외한 나머지 구성이 동일한 발명인 제4항, 제12항 내지 제14항 발명에 명세서 기재요건 위반, 진보성 부정의 무효사유가 있는지 여부를 판단하였어야 했다.","slides":[{"label":"판시사항","text":"정정청구에 따른 무효심판의 심리절차 대법원 2025. 6. 26. 선고 2023후11487 판결 갑 주식회사가 을 주식회사를 상대로 명칭이 ‘혈압 강하용 약제학적 조성물’인 을 회사 특허발명의 등록무효를 구한 사안에서, 위 특허발명에 대한 특허무효심판절차에서 을 회사가 특허발명의 청구범위 제1항 발명에 대하여 한 정정청구가 특허법에 따른 요건을 갖추지 못하여부적법하다고 보아야 하는데도, 이를 적법하다고 본 뒤 정정 후 청구범위를 기준으로 제1항 발명 등에 무효사유가 없다고 본 원심판단에 법리 오해 등의 잘못이 있다고 한 사례"},{"label":"판결요지","text":"이러한 사정에 비추어 보면, 이 사건 제1항 발명의 청구범위 중 ‘피마살탄 칼륨염 또는 이의 수화물 30 ㎎’ 부분에 ‘(피마살탄 칼륨염으로 30㎎)’을, ‘암로디핀 베실레이트염 5㎎’ 부분에 ‘(암로디핀으로 5㎎)’을 각 각 추가하는 이 사건 정정청구는 특허법 제136조 제1항에서 정정청구 요건으로 규정하고 있는 ‘분명하지 아니 하게 기재된 사항을 명확하게 하는 경우’ 등에 해당한다고 보기 어렵다. 뿐만 아니라 이 사건 정정청구 전 이 사 건 제1항 발명과 이 사건 정정청구 후 이 사건 제1항 발명은 약리효과인 혈압 강하 효과를 나타내는 피마살탄 칼 륨염 용량과 암로디핀 용량에서 서로 다르게 되고 그로 인해 발명의 효과가 변경될 수 있어서, 이 사건 정정청구 는 ‘청구범위를 실질적으로 변경하는 경우’에 해당할 여지도 있다. 따라서 원심으로서는 정정 후 청구범위가 아니라 정정 전 청구범위를 기준으로 이 사건 제1항 발명 및 그 종속항 발명이거나 의약용도를 제외한 나머지 구성이 동일한 발명인 제4항, 제12항 내지 제14항 발명에 명세서 기재요건 위반, 진보성 부정의 무효사유가 있는지 여부를 판단하였어야 했다."}]},{"section":"특허심판 - 정정심판","question":"정정의 확정시기 및 일체성 대법원 2009. 1. 15. 선고 2007후1053 판결 [1] 특허무효심판절차에서 정정청구가 있는 경우, 정정의 확정 시기 및 정정의 허용 여부를 일체로 판단하여야 하는지 여부(적극) 판시 [2] 특허청구범위의 정정을 인정하고 특허청구범위 제1항 내지 제5항의 무효심판청구를 기각한 심결을 사항 취소한 원심판결 중, 특허청구범위 제3항의 특허무효에 관한 부분에 대한 상고만이 이유 있고 정정사항 이 특허청구범위 전체에 걸쳐 있는 사안에서, 정정청구 부분을 포함한 원심판결 전부가 파기되어야 한다 고 한 사례","answer":"특허무효심판절차에서 정정청구가 있는 경우, 정정의 인정 여부는 무효심판절차에 대한 결정절차에서 함 께 심리되는 것이므로, 독립된 정정심판청구의 경우와 달리 정정만이 따로 확정되는 것이 아니라 무효심판 의 심결이 확정되는 때에 함께 확정된다 할 것인바(대법원 2008. 6. 26. 선고 2006후2912 판결 참조), 위에서 본 바와 같이 원심판결 중 이 사건 정정청구 및 이 사건 제1, 2, 4, 5항 발명의 특허무효에 관한 부분에 대한 피고들의 상고는 이유 없다 할 것이나, 원심판결 중 이 사건 제3항 발명의 특허무효에 관 한 부분에 대한 피고들의 상고를 받아들이는 이상, 이와 함께 확정되어야 할 이 사건 정정청구에 관한 부분도 파기를 면할 수 없다. 한편, 특허의 등록무효 여부는 청구항별로 판단하여야 하더라도, 특허무효심판절차에서의 정정청구는 특별한 사정이 없는 한 불가분의 관계에 있어 일체로서 허용 여부를 판단하여야 할 것데, 이 사건 정정청구는 그 정정사항이 이 사건 제1항 내지 제5항 발명 전체에 걸쳐 있으므로,원심판결 중 이 사건 제1, 2, 4, 5항 발명의 특허무효에 관한 부분도 따로 확정되지 못한 채 이 사건 정정청구에 관한 부분 과 함께 파기되어야 할 것이어서, 결국 원심판결 전부가 파기되어야 할 것이다","slides":[{"label":"판시사항","text":"정정의 확정시기 및 일체성 대법원 2009. 1. 15. 선고 2007후1053 판결"},{"label":"판시사항","text":"[1] 특허무효심판절차에서 정정청구가 있는 경우, 정정의 확정 시기 및 정정의 허용 여부를 일체로 판단하여야 하는지 여부(적극) 판시"},{"label":"판시사항","text":"[2] 특허청구범위의 정정을 인정하고 특허청구범위 제1항 내지 제5항의 무효심판청구를 기각한 심결을 사항 취소한 원심판결 중, 특허청구범위 제3항의 특허무효에 관한 부분에 대한 상고만이 이유 있고 정정사항 이 특허청구범위 전체에 걸쳐 있는 사안에서, 정정청구 부분을 포함한 원심판결 전부가 파기되어야 한다 고 한 사례"},{"label":"판결요지","text":"특허무효심판절차에서 정정청구가 있는 경우, 정정의 인정 여부는 무효심판절차에 대한 결정절차에서 함 께 심리되는 것이므로, 독립된 정정심판청구의 경우와 달리 정정만이 따로 확정되는 것이 아니라 무효심판 의 심결이 확정되는 때에 함께 확정된다 할 것인바(대법원 2008. 6. 26. 선고 2006후2912 판결 참조), 위에서 본 바와 같이 원심판결 중 이 사건 정정청구 및 이 사건 제1, 2, 4, 5항 발명의 특허무효에 관한 부분에 대한 피고들의 상고는 이유 없다 할 것이나, 원심판결 중 이 사건 제3항 발명의 특허무효에 관 한 부분에 대한 피고들의 상고를 받아들이는 이상, 이와 함께 확정되어야 할 이 사건 정정청구에 관한 부분도 파기를 면할 수 없다. 한편, 특허의 등록무효 여부는 청구항별로 판단하여야 하더라도, 특허무효심판절차에서의 정정청구는 특별한 사정이 없는 한 불가분의 관계에 있어 일체로서 허용 여부를 판단하여야 할 것데, 이 사건 정정청구는 그 정정사항이 이 사건 제1항 내지 제5항 발명 전체에 걸쳐 있으므로,원심판결 중 이 사건 제1, 2, 4, 5항 발명의 특허무효에 관한 부분도 따로 확정되지 못한 채 이 사건 정정청구에 관한 부분 과 함께 파기되어야 할 것이어서, 결국 원심판결 전부가 파기되어야 할 것이다"}]},{"section":"심결취소소송","question":"공유자 1인의 심결취소소송 원고적격 대법원 2004. 12. 9. 선고 2002후567 판결 판시 상표권의 공유자가 그 상표권의 효력에 관한 심판에서 패소한 경우에 제기할 심결취소소송이 고유필수적 사항 공동소송인지 여부(소극)","answer":"따라서 상표권의 공유자가 그 상표권의 효력에 관한 심판에서 패소한 경우에 제기할 심결취소소송은 공유자 전원이 공동으로 제기하여야만 하는 고유필수적 공동소송이라고 할 수 없고, 공유자의 1인이라도 당해 상표 등록을 무효로 하거나 권리행사를 제한 방해하는 심결이 있는 때에는 그 권리의 소멸을 방지하거나 그 권리 행사방해배제를 위하여 단독으로 그 심결의 취소를 구할 수 있다 할 것이고, 위와 같이 공유자 1인에 의한 심결취소소송의 제기를 인정하더라도 위에서 본 바와 같이 다른 공유자의 이익을 해한다거나 합일확정 의 요청에 반하는 사태가 생긴다고 할 수 없다.","slides":[{"label":"판시사항","text":"공유자 1인의 심결취소소송 원고적격 대법원 2004. 12. 9. 선고 2002후567 판결 판시 상표권의 공유자가 그 상표권의 효력에 관한 심판에서 패소한 경우에 제기할 심결취소소송이 고유필수적 사항 공동소송인지 여부(소극)"},{"label":"판결요지","text":"따라서 상표권의 공유자가 그 상표권의 효력에 관한 심판에서 패소한 경우에 제기할 심결취소소송은 공유자 전원이 공동으로 제기하여야만 하는 고유필수적 공동소송이라고 할 수 없고, 공유자의 1인이라도 당해 상표 등록을 무효로 하거나 권리행사를 제한 방해하는 심결이 있는 때에는 그 권리의 소멸을 방지하거나 그 권리 행사방해배제를 위하여 단독으로 그 심결의 취소를 구할 수 있다 할 것이고, 위와 같이 공유자 1인에 의한 심결취소소송의 제기를 인정하더라도 위에서 본 바와 같이 다른 공유자의 이익을 해한다거나 합일확정 의 요청에 반하는 사태가 생긴다고 할 수 없다."}]},{"section":"심결취소소송","question":"특받권 공유자 1인의 심결취소소송 원고적격 대법원 2024. 12. 26. 선고 2024후10825 판결 판시 특허를 받을 수 있는 권리의 공유자가 특허거절결정 등에 대한 불복심판에서 기각 심결을 받은 경우, 공유 사항 자 중 1인이 단독으로 심결의 취소를 구할 수 있는지 여부(적극)","answer":"특허를 받을 수 있는 권리의 공유자가 특허거절결정 등에 대한 불복심판에서 기각 심결을 받은 경우에 제기 하는 심결취소의 소는 심판청구인인 공유자 모두가 공동으로 제기하여야 하는 고유필수적 공동소송이라고 할 수 없고, 특허를 받을 수 있는 권리의 공유자 중 1인이라도 그 권리를 방해하는 심결이 있는 때에는 권리의 소멸을 방지하기 위해 단독으로 심결의 취소를 구할 수 있다.","slides":[{"label":"판시사항","text":"특받권 공유자 1인의 심결취소소송 원고적격 대법원 2024. 12. 26. 선고 2024후10825 판결 판시 특허를 받을 수 있는 권리의 공유자가 특허거절결정 등에 대한 불복심판에서 기각 심결을 받은 경우, 공유 사항 자 중 1인이 단독으로 심결의 취소를 구할 수 있는지 여부(적극)"},{"label":"판결요지","text":"특허를 받을 수 있는 권리의 공유자가 특허거절결정 등에 대한 불복심판에서 기각 심결을 받은 경우에 제기 하는 심결취소의 소는 심판청구인인 공유자 모두가 공동으로 제기하여야 하는 고유필수적 공동소송이라고 할 수 없고, 특허를 받을 수 있는 권리의 공유자 중 1인이라도 그 권리를 방해하는 심결이 있는 때에는 권리의 소멸을 방지하기 위해 단독으로 심결의 취소를 구할 수 있다."}]},{"section":"심결취소소송","question":"공동심판청구인 중 1인을 피고로 한 소 제기 대법원 2009. 5. 28. 선고 2007후1510 판결 동일한 특허권에 관하여 2인 이상의 자가 공동으로 특허의 무효심판을 청구하는 경우, 그 심판의 법적 성 판시 격(=유사필수적 공동심판) 및 특허권자가 공동심판청구인 중 일부만을 상대로 심결취소소송을 제기한 때 사항 그 심결 중 심결취소소송이 제기되지 않은 나머지 공동심판청구인에 대한 부분만이 제소기간의 도과로 분리 확정되는지 여부(소극)","answer":"동일한 특허권에 관하여 2인 이상의 자가 공동으로 특허의 무효심판을 청구하여 승소한 경우에 그 특허권자 가 제기할 심결취소소송은 심판청구인 전원을 상대로 제기하여야만 하는 고유필수적 공동소송이라고 할 수 없으므로, 고유필수적 공동소송이 아닌 이 사건에서 당사자의 변경을 가져오는 당사자추가신청은 명목이 어떻든 간에 부적법하여 허용될 수 없다. ... 동일한 특허권에 관하여 2인 이상의 자가 공동으로 특허의 무효심판을 청구하는 경우 그 심판은 심판청구인 들 사이에 합일확정을 필요로 하는 이른바 유사필수적 공동심판에 해당한다 할 것이므로, 비록 위 심판사건에서 패소한 원고가 공동심판청구인 중 피고만을 상대로 심결취소소송을 제기하였다 하더라도 그 심결은 피 고와 소외 주식회사에 대하여 모두 확정이 차단된다고 할 것이며, 이 경우 소외 주식회사에 대한 제소기간의 도과로 심결 중 소외 주식회사의 심판청구에 대한 부분만이 그대로 분리 확정되었다고 할 수 없다.","slides":[{"label":"판시사항","text":"공동심판청구인 중 1인을 피고로 한 소 제기 대법원 2009. 5. 28. 선고 2007후1510 판결 동일한 특허권에 관하여 2인 이상의 자가 공동으로 특허의 무효심판을 청구하는 경우, 그 심판의 법적 성 판시 격(=유사필수적 공동심판) 및 특허권자가 공동심판청구인 중 일부만을 상대로 심결취소소송을 제기한 때 사항 그 심결 중 심결취소소송이 제기되지 않은 나머지 공동심판청구인에 대한 부분만이 제소기간의 도과로 분리 확정되는지 여부(소극)"},{"label":"판결요지","text":"동일한 특허권에 관하여 2인 이상의 자가 공동으로 특허의 무효심판을 청구하여 승소한 경우에 그 특허권자 가 제기할 심결취소소송은 심판청구인 전원을 상대로 제기하여야만 하는 고유필수적 공동소송이라고 할 수 없으므로, 고유필수적 공동소송이 아닌 이 사건에서 당사자의 변경을 가져오는 당사자추가신청은 명목이 어떻든 간에 부적법하여 허용될 수 없다. ... 동일한 특허권에 관하여 2인 이상의 자가 공동으로 특허의 무효심판을 청구하는 경우 그 심판은 심판청구인 들 사이에 합일확정을 필요로 하는 이른바 유사필수적 공동심판에 해당한다 할 것이므로, 비록 위 심판사건에서 패소한 원고가 공동심판청구인 중 피고만을 상대로 심결취소소송을 제기하였다 하더라도 그 심결은 피 고와 소외 주식회사에 대하여 모두 확정이 차단된다고 할 것이며, 이 경우 소외 주식회사에 대한 제소기간의 도과로 심결 중 소외 주식회사의 심판청구에 대한 부분만이 그대로 분리 확정되었다고 할 수 없다."}]},{"section":"심결취소소송","question":"심결 후 제소기간 도과 이후출원인변경신고 대법원 2017. 11. 23. 선고 2015후321 판결 특허출원인으로부터 특허를 받을 수 있는 권리를 양수한 특정승계인이 특허출원인변경신고를 하지 않은 판시 상태에서 특허심판원의 거절결정 불복심판 심결에 대하여 취소의 소를 제기한 경우 취소의 소가 적법한 사항 지 여부(소극) 및 이는 특정승계인이 취소의 소를 제기한 후 특허출원인변경신고를 하였으나 그 변경신고 시기가 취소의 소 제기기간이 지난 후인 경우에도 마찬가지인지 여부(적극)","answer":"특허출원인으로부터 특허를 받을 수 있는 권리를 양수한 특정승계인은 특허출원인변경신고를 하지 않은 상 태에서는 그 양수의 효력이 발생하지 않아서 특허심판원의 거절결정 불복심판 심결에 대하여 취소의 소를 제기할 수 있는 당사자 등에 해당하지 아니하므로, 그가 제기한 취소의 소는 부적법하다. 특정승계인이 취소의 소를 제기한 후 특허출원인변경신고를 하였더라도, 그 변경신고 시기가 취소의 소 제기기간이 지난 후라면 제기기간 내에 적법한 취소의 소 제기는 없었던 것이므로, 취소의 소가 부적법하기는 마찬가지이다.","slides":[{"label":"판시사항","text":"심결 후 제소기간 도과 이후출원인변경신고 대법원 2017. 11. 23. 선고 2015후321 판결 특허출원인으로부터 특허를 받을 수 있는 권리를 양수한 특정승계인이 특허출원인변경신고를 하지 않은 판시 상태에서 특허심판원의 거절결정 불복심판 심결에 대하여 취소의 소를 제기한 경우 취소의 소가 적법한 사항 지 여부(소극) 및 이는 특정승계인이 취소의 소를 제기한 후 특허출원인변경신고를 하였으나 그 변경신고 시기가 취소의 소 제기기간이 지난 후인 경우에도 마찬가지인지 여부(적극)"},{"label":"판결요지","text":"특허출원인으로부터 특허를 받을 수 있는 권리를 양수한 특정승계인은 특허출원인변경신고를 하지 않은 상 태에서는 그 양수의 효력이 발생하지 않아서 특허심판원의 거절결정 불복심판 심결에 대하여 취소의 소를 제기할 수 있는 당사자 등에 해당하지 아니하므로, 그가 제기한 취소의 소는 부적법하다. 특정승계인이 취소의 소를 제기한 후 특허출원인변경신고를 하였더라도, 그 변경신고 시기가 취소의 소 제기기간이 지난 후라면 제기기간 내에 적법한 취소의 소 제기는 없었던 것이므로, 취소의 소가 부적법하기는 마찬가지이다."}]},{"section":"심결취소소송","question":"심결취소소송의 소송물 - 기준시점 대법원 2004. 11. 12. 선고 2003후1420 판결 특허심판원심결의 취소소송에서 심결의 위법 여부의 판단 기준","answer":"특허심판원심결의 취소소송에서 심결의 위법 여부는 심결 당시의 법령과 사실상태를 기준으로 판단하여야 하고, 원칙적으로 심결이 있은 이후 비로소 발생한 사실을 고려하여 판단의 근거로 삼을 수는 없는바(대 법원 2002. 4. 12. 선고 99후2211 판결 참조),","slides":[{"label":"판시사항","text":"심결취소소송의 소송물 - 기준시점 대법원 2004. 11. 12. 선고 2003후1420 판결 특허심판원심결의 취소소송에서 심결의 위법 여부의 판단 기준"},{"label":"판결요지","text":"특허심판원심결의 취소소송에서 심결의 위법 여부는 심결 당시의 법령과 사실상태를 기준으로 판단하여야 하고, 원칙적으로 심결이 있은 이후 비로소 발생한 사실을 고려하여 판단의 근거로 삼을 수는 없는바(대 법원 2002. 4. 12. 선고 99후2211 판결 참조),"}]},{"section":"심결취소소송","question":"심결취소소송의 심리원칙 - 변론주의 대법원 2011. 3. 24. 선고 2010후3509 판결 판시 심결취소소송에서 법원이 당사자가 주장하지도 않은 법률요건에 관하여 판단하는 것이 변론주의 원칙에 사항 위배되는지 여부(적극)","answer":"행정소송의 일종인 심결취소소송에 있어서 직권주의가 가미되어 있다고 하더라도 여전히 변론주의를 기본 구조로 하는 이상 심결의 위법을 들어 그 취소를 청구함에 있어서는 직권조사사항을 제외하고는 그 취소 를 구하는 자가 위법사유에 해당하는 구체적 사실을 먼저 주장하여야 하고(대법원 2000. 3. 23. 선고 98두 2768 판결, 대법원 2003. 8. 19. 선고 2001후1655 판결 등 참조), 따라서 법원이 당사자가 주장하지도 아니한 법률요건에 대하여 판단하는 것은 변론주의 원칙에 위배되는 것이다.","slides":[{"label":"판시사항","text":"심결취소소송의 심리원칙 - 변론주의 대법원 2011. 3. 24. 선고 2010후3509 판결 판시 심결취소소송에서 법원이 당사자가 주장하지도 않은 법률요건에 관하여 판단하는 것이 변론주의 원칙에 사항 위배되는지 여부(적극)"},{"label":"판결요지","text":"행정소송의 일종인 심결취소소송에 있어서 직권주의가 가미되어 있다고 하더라도 여전히 변론주의를 기본 구조로 하는 이상 심결의 위법을 들어 그 취소를 청구함에 있어서는 직권조사사항을 제외하고는 그 취소 를 구하는 자가 위법사유에 해당하는 구체적 사실을 먼저 주장하여야 하고(대법원 2000. 3. 23. 선고 98두 2768 판결, 대법원 2003. 8. 19. 선고 2001후1655 판결 등 참조), 따라서 법원이 당사자가 주장하지도 아니한 법률요건에 대하여 판단하는 것은 변론주의 원칙에 위배되는 것이다."}]},{"section":"심결취소소송","question":"심결취소소송의 심리원칙 – 직권조사사항 탐지 의무 대법원 2025. 9. 11. 선고 2024후10436 판결 판시 권리범위확인심판에서 확인의 이익이 있는지 여부에 관하여 의문이 생길 만한 사정이 이미 제출된 자료에 사항 의해 드러난 경우, 법원이 상대방의 지적이 없더라도 이를 직권으로 심리 조사하여야 하는지 여부 (적극)","answer":"권리범위 확인심판에서 확인의 이익 유무는 심판청구의 적법 요건에 관한 것으로서 직권조사사항이므로, 법원은 그 판단의 기초자료인 사실과 증거를 직권으로 탐지할 의무까지는 없다고 하더라도 이미 제출된 자료 들에 의하여 그 확인의 이익이 있는지 의심이 갈 만한 사정이 보인다면, 상대방이 이를 구체적으로 지적하여 다투지 않더라도 이에 관하여 심리 조사할 의무가 있다.","slides":[{"label":"판시사항","text":"심결취소소송의 심리원칙 – 직권조사사항 탐지 의무 대법원 2025. 9. 11. 선고 2024후10436 판결 판시 권리범위확인심판에서 확인의 이익이 있는지 여부에 관하여 의문이 생길 만한 사정이 이미 제출된 자료에 사항 의해 드러난 경우, 법원이 상대방의 지적이 없더라도 이를 직권으로 심리 조사하여야 하는지 여부 (적극)"},{"label":"판결요지","text":"권리범위 확인심판에서 확인의 이익 유무는 심판청구의 적법 요건에 관한 것으로서 직권조사사항이므로, 법원은 그 판단의 기초자료인 사실과 증거를 직권으로 탐지할 의무까지는 없다고 하더라도 이미 제출된 자료 들에 의하여 그 확인의 이익이 있는지 의심이 갈 만한 사정이 보인다면, 상대방이 이를 구체적으로 지적하여 다투지 않더라도 이에 관하여 심리 조사할 의무가 있다."}]},{"section":"심결취소소송","question":"심결취소소송의 심리원칙 – 재판상 자백 대법원 2000. 12. 22. 선고 2000후1542 판결 [1] 행정소송인 심결취소소송에서 자백 또는 의제자백이 인정되는지 여부(적극) 및 자백의 대상","answer":"행정소송인 심결취소소송에서도 원칙적으로 변론주의가 적용되고, 따라서 자백 또는 의제자백도 인정된 다 함은 상고이유에서 지적하는 바와 같으나, 자백의 대상은 사실이고, 이러한 사실에 대한 법적 판단 내 지 평가는 자백의 대상이 되지 아니하는 것이다","slides":[{"label":"판시사항","text":"심결취소소송의 심리원칙 – 재판상 자백 대법원 2000. 12. 22. 선고 2000후1542 판결"},{"label":"판시사항","text":"[1] 행정소송인 심결취소소송에서 자백 또는 의제자백이 인정되는지 여부(적극) 및 자백의 대상"},{"label":"판결요지","text":"행정소송인 심결취소소송에서도 원칙적으로 변론주의가 적용되고, 따라서 자백 또는 의제자백도 인정된 다 함은 상고이유에서 지적하는 바와 같으나, 자백의 대상은 사실이고, 이러한 사실에 대한 법적 판단 내 지 평가는 자백의 대상이 되지 아니하는 것이다"}]},{"section":"심결취소소송","question":"심결취소소송의 심리원칙 - 진보성 및 ‘효과’의 증명책임 대법원 2024. 3. 28. 선고 2021후10343 판결 판시 [4] 결정형 발명의 효과가 선행발명과 질적으로 다르거나 양적으로 현저한 차이가 있는 경우, 진보성이 인 사항 정되는지 여부(적극) / 결정형 발명의 효과의 현저성을 판단하는 방법","answer":"결정형 발명의 효과의 현저성은 그 발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심으로 판단하여야 하는데, 진보성이 부정됨을 무효사유로 한 특허무효심판 및 그에 따른 심결취소소송에서 위와 같은 무효사유에 관한 증명책임은 무효라고 주장하는 당사자에게 있지만, 결정형 발명의 효과가 의심스러울 때에는 특허권자도 출원일 이후에 추가적인 실험 자료를 제출하는 등의 방법으로 그 효과를 구체적으로 주장 증명할 필요가 있다. 이때 추가적인 실험 자료 등은 그 발명의 명세서 기재 내용의 범 위를 넘지 않는 것이어야 한다(대법원 2022. 3. 31. 선고 2018후10923 판결 참조). 심결취소소송의 심리원칙 - 무권리자 출원의 증명책임","slides":[{"label":"판시사항","text":"심결취소소송의 심리원칙 - 진보성 및 ‘효과’의 증명책임 대법원 2024. 3. 28. 선고 2021후10343 판결 판시"},{"label":"판시사항","text":"[4] 결정형 발명의 효과가 선행발명과 질적으로 다르거나 양적으로 현저한 차이가 있는 경우, 진보성이 인 사항 정되는지 여부(적극) / 결정형 발명의 효과의 현저성을 판단하는 방법"},{"label":"판결요지","text":"결정형 발명의 효과의 현저성은 그 발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심으로 판단하여야 하는데, 진보성이 부정됨을 무효사유로 한 특허무효심판 및 그에 따른 심결취소소송에서 위와 같은 무효사유에 관한 증명책임은 무효라고 주장하는 당사자에게 있지만, 결정형 발명의 효과가 의심스러울 때에는 특허권자도 출원일 이후에 추가적인 실험 자료를 제출하는 등의 방법으로 그 효과를 구체적으로 주장 증명할 필요가 있다. 이때 추가적인 실험 자료 등은 그 발명의 명세서 기재 내용의 범 위를 넘지 않는 것이어야 한다(대법원 2022. 3. 31. 선고 2018후10923 판결 참조). 심결취소소송의 심리원칙 - 무권리자 출원의 증명책임"}]},{"section":"심결취소소송","question":"심결취소소송의 심리원칙 - 무권리자 출원의 증명책임 대법원 2022. 11. 17. 선고 2019후11268 판결 판시 특허를 받을 수 있는 권리를 가지지 아니한 사람의 특허출원을 무효사유로 한 특허무효심판 및 그에 따 사항 른 심결취소소송에서 무효사유에 관한 증명책임의 소재(=무효라고 주장하는 당사자)","answer":"무권리자의 출원을 무효사유로 한 특허무효심판 및 그에 따른 심결취소소송에서 위와 같은 무효사유에 관한 증명책임은 무효라고 주장하는 당사자에게 있다.","slides":[{"label":"판시사항","text":"심결취소소송의 심리원칙 - 무권리자 출원의 증명책임 대법원 2022. 11. 17. 선고 2019후11268 판결 판시 특허를 받을 수 있는 권리를 가지지 아니한 사람의 특허출원을 무효사유로 한 특허무효심판 및 그에 따 사항 른 심결취소소송에서 무효사유에 관한 증명책임의 소재(=무효라고 주장하는 당사자)"},{"label":"판결요지","text":"무권리자의 출원을 무효사유로 한 특허무효심판 및 그에 따른 심결취소소송에서 위와 같은 무효사유에 관한 증명책임은 무효라고 주장하는 당사자에게 있다."}]},{"section":"심결취소소송","question":"심결취소소송의 심리범위 – 무제한설 대법원 2002. 6. 25. 선고 2000후1290 판결 심결취소소송의 심리범위","answer":"심판은 특허심판원에서의 행정절차이며 심결은 행정처분에 해당하고, 그에 대한 불복의 소송인 심결취소소송은 항고소송에 해당하여 그 소송물은 심결의 실체적, 절차적 위법성 여부라 할 것이므로 당사자는 심결에 서 판단되지 않은 처분의 위법사유도 심결취소소송단계에서 주장 입증할 수 있고 심결취소소송의 법원은 특 별한 사정이 없는 한 제한 없이 이를 심리 판단하여 판결의 기초로 삼을 수 있는 것이며 이와 같이 본다고 하여 심급의 이익을 해한다거나 당사자에게 예측하지 못한 불의의 손해를 입히는 것이 아니다.","slides":[{"label":"판시사항","text":"심결취소소송의 심리범위 – 무제한설 대법원 2002. 6. 25. 선고 2000후1290 판결 심결취소소송의 심리범위"},{"label":"판결요지","text":"심판은 특허심판원에서의 행정절차이며 심결은 행정처분에 해당하고, 그에 대한 불복의 소송인 심결취소소송은 항고소송에 해당하여 그 소송물은 심결의 실체적, 절차적 위법성 여부라 할 것이므로 당사자는 심결에 서 판단되지 않은 처분의 위법사유도 심결취소소송단계에서 주장 입증할 수 있고 심결취소소송의 법원은 특 별한 사정이 없는 한 제한 없이 이를 심리 판단하여 판결의 기초로 삼을 수 있는 것이며 이와 같이 본다고 하여 심급의 이익을 해한다거나 당사자에게 예측하지 못한 불의의 손해를 입히는 것이 아니다."}]},{"section":"심결취소소송","question":"심결취소소송의 심리범위 – 확인대상발명 미실시 주장 대법원 2009. 5. 28. 선고 2007후4410 판결 판시 특허심판단계에서 하지 않았던 주장이라도 심결취소소송 단계에서 이를 심결의 위법사유로 주장할 수 사항 있다고 한 사례","answer":"원심은 원고가 특허심판단계에서 다른 주장은 하면서 확인대상발명을 실시하고 있지 않다는 주장을 하지 않은 점 등을 들어 이와 같은 주장을 심결취소소송단계에서 하는 것이 금반언 내지 신의칙에 반하여 허용되지 않는다고 보았으나, 특허심판단계에서 소극적으로 하지 않았던 주장을 심결취소소송단계 에서 하였다는 사정만으로 금반언 내지 신의칙에 위반된다고 볼 수 없을 뿐만 아니라, 이를 금반언 내지 신의 칙 위반으로 보는 것은 심결취소소송의 심리범위에 관한 위 법리와 양립될 수 없어서 허용될 수 없다. 각하심결에 대한 심결취소소송의 심리범위","slides":[{"label":"판시사항","text":"심결취소소송의 심리범위 – 확인대상발명 미실시 주장 대법원 2009. 5. 28. 선고 2007후4410 판결 판시 특허심판단계에서 하지 않았던 주장이라도 심결취소소송 단계에서 이를 심결의 위법사유로 주장할 수 사항 있다고 한 사례"},{"label":"판결요지","text":"원심은 원고가 특허심판단계에서 다른 주장은 하면서 확인대상발명을 실시하고 있지 않다는 주장을 하지 않은 점 등을 들어 이와 같은 주장을 심결취소소송단계에서 하는 것이 금반언 내지 신의칙에 반하여 허용되지 않는다고 보았으나, 특허심판단계에서 소극적으로 하지 않았던 주장을 심결취소소송단계 에서 하였다는 사정만으로 금반언 내지 신의칙에 위반된다고 볼 수 없을 뿐만 아니라, 이를 금반언 내지 신의 칙 위반으로 보는 것은 심결취소소송의 심리범위에 관한 위 법리와 양립될 수 없어서 허용될 수 없다. 각하심결에 대한 심결취소소송의 심리범위"}]},{"section":"심결취소소송","question":"각하심결에 대한 심결취소소송의 심리범위 - 청구원인 추가 (일사부재리 위반 사건) 대법원 2020. 4. 9. 선고 2018후11360 판결 판시 일사부재리 원칙 위반을 이유로 등록무효 심판청구를 각하한 심결에 대한 취소소송에서 심판청구인이 심 사항 판절차에서 주장하지 않은 새로운 등록무효 사유를 주장하는 것이 허용되는지 여부(소극)","answer":"일사부재리 원칙 위반을 이유로 등록무효 심판청구를 각하한 심결에 대한 취소소송에서 심결 시를 기준으로 동일 사실과 동일 증거를 제출한 것인지를 심리하여 일사부재리 원칙 위반 여부를 판단하여야 한다. 이때 심판청구인이 심판절차에서 주장하지 않은 새로운 등록무효 사유를 주장하는 것은 허용되지 않는다. 따라서 이러한 새로운 등록무효 사유의 주장을 이유로 각하 심결을 취소할 수 없고, 새로운 등록무효 사유에 대하여 판단할 수도 없다. 각하심결에 대한 심결취소소송의 심리범위","slides":[{"label":"판시사항","text":"각하심결에 대한 심결취소소송의 심리범위 - 청구원인 추가 (일사부재리 위반 사건) 대법원 2020. 4. 9. 선고 2018후11360 판결 판시 일사부재리 원칙 위반을 이유로 등록무효 심판청구를 각하한 심결에 대한 취소소송에서 심판청구인이 심 사항 판절차에서 주장하지 않은 새로운 등록무효 사유를 주장하는 것이 허용되는지 여부(소극)"},{"label":"판결요지","text":"일사부재리 원칙 위반을 이유로 등록무효 심판청구를 각하한 심결에 대한 취소소송에서 심결 시를 기준으로 동일 사실과 동일 증거를 제출한 것인지를 심리하여 일사부재리 원칙 위반 여부를 판단하여야 한다. 이때 심판청구인이 심판절차에서 주장하지 않은 새로운 등록무효 사유를 주장하는 것은 허용되지 않는다. 따라서 이러한 새로운 등록무효 사유의 주장을 이유로 각하 심결을 취소할 수 없고, 새로운 등록무효 사유에 대하여 판단할 수도 없다. 각하심결에 대한 심결취소소송의 심리범위"}]},{"section":"심결취소소송","question":"각하심결에 대한 심결취소소송의 심리범위 - 직권조사사항에 대한 심리 대법원 2023. 12. 28. 선고 2021후10725 판결 판시 심결취소소송의 심리 범위 / 확인대상 발명의 특정 여부가 특허심판의 적법요건으로서 특허심판원이나 사항 법원의 직권조사사항인지 여부(적극)","answer":"확인대상 발명이 적법하게 특정되었는지 여부는 특허심판의 적법요건이므로, 당사자의 명확한 주장이 없더 라도 의심이 있을 때에는 특허심판원이나 법원이 이를 직권으로 조사하여 밝혀야 할 사항이다. 따라서 원심이 이 사건 심결에서 판단되지 않은 사항인 확인대상 발명의 특정 여부를 직권으로 심리 판단 한 것에는 심결취소소송의 심리범위에 관한 법리를 오해하거나 판단을 누락하는 등의 잘못이 없다. 거절결정불복심판 사건 심결취소소송의 심리범위","slides":[{"label":"판시사항","text":"각하심결에 대한 심결취소소송의 심리범위 - 직권조사사항에 대한 심리 대법원 2023. 12. 28. 선고 2021후10725 판결 판시 심결취소소송의 심리 범위 / 확인대상 발명의 특정 여부가 특허심판의 적법요건으로서 특허심판원이나 사항 법원의 직권조사사항인지 여부(적극)"},{"label":"판결요지","text":"확인대상 발명이 적법하게 특정되었는지 여부는 특허심판의 적법요건이므로, 당사자의 명확한 주장이 없더 라도 의심이 있을 때에는 특허심판원이나 법원이 이를 직권으로 조사하여 밝혀야 할 사항이다. 따라서 원심이 이 사건 심결에서 판단되지 않은 사항인 확인대상 발명의 특정 여부를 직권으로 심리 판단 한 것에는 심결취소소송의 심리범위에 관한 법리를 오해하거나 판단을 누락하는 등의 잘못이 없다. 거절결정불복심판 사건 심결취소소송의 심리범위"}]},{"section":"심결취소소송","question":"거절결정불복심판 사건 심결취소소송의 심리범위 - 주지관용기술의 보충 대법원 2013. 9. 26. 선고 2013후1054 판결 [2] 거절결정불복심판청구 기각 심결에 대한 취소소송절차에서 특허청장이 심사 또는 심판단계에서 의견제출의 기회를 부여한 적 없는 새로운 거절이유를 주장할 수 있는지 여부(소극) 및 심결 취소소송절차 판시 에서 특허청장이 새로 주장하는 사유가 예외적으로 허용되는 경우 사항 [3] 통지된 거절이유가 비교대상발명에 의하여 출원발명의 진보성이 부정된다는 취지인 경우, 심결취소소송의 법원이 비교대상발명을 보충하여 주지관용기술의 존재를 증명하기 위한 자료를 진보성을 부정하 는 판단의 근거로 채택하는 것이 새로운 거절이유를 판결의 기초로 삼은 것인지 여부(소극)","answer":"거절결정불복심판청구 기각 심결의 취소소송절차에서도 특허청장은 심사 또는 심판단계에서 의견제출의 기회를 부여한 바 없는 새로운 거절이유를 주장할 수 없다고 보아야 한다. 다만 거절결정불복심판청구 기각 심결의 취소소송절차에서 특허청장이 비로소 주장하는 사유라고 하더라도 심사 또는 심판단계에서 의견제출의 기회를 부여한 거절이유와 주요한 취지가 부합하여 이미 통지된 거절이유를 보충하는 데 지나지 아니하 는 것이면 이를 심결의 당부를 판단하는 근거로 할 수 있다 할 것이다. 특히 이미 통지된 거절이유가 비교대상발명에 의하여 출원발명의 진보성이 부정된다는 취지인 경우에, 위 비교대상발명을 보충하여 특허출원 당시 그 기술분야에 널리 알려진 주지관용기술의 존재를 증명하기 위한 자료는 새로운 공지기술에 관한 것에 해당하지 아니하므로, 심결취소소송의 법원이 이를 진보성을 부정하는 판단의 근거로 채택하였다고 하더라도 이미 통지된 거절이유와 주요한 취지가 부합하지 아니하는 새로운 거 절이유를 판결의 기초로 삼은 것이라고 할 수 없다. 거절결정불복심판 사건 심결취소소송의 심리범위","slides":[{"label":"판시사항","text":"거절결정불복심판 사건 심결취소소송의 심리범위 - 주지관용기술의 보충 대법원 2013. 9. 26. 선고 2013후1054 판결"},{"label":"판시사항","text":"[2] 거절결정불복심판청구 기각 심결에 대한 취소소송절차에서 특허청장이 심사 또는 심판단계에서 의견제출의 기회를 부여한 적 없는 새로운 거절이유를 주장할 수 있는지 여부(소극) 및 심결 취소소송절차 판시 에서 특허청장이 새로 주장하는 사유가 예외적으로 허용되는 경우 사항"},{"label":"판시사항","text":"[3] 통지된 거절이유가 비교대상발명에 의하여 출원발명의 진보성이 부정된다는 취지인 경우, 심결취소소송의 법원이 비교대상발명을 보충하여 주지관용기술의 존재를 증명하기 위한 자료를 진보성을 부정하 는 판단의 근거로 채택하는 것이 새로운 거절이유를 판결의 기초로 삼은 것인지 여부(소극)"},{"label":"판결요지","text":"거절결정불복심판청구 기각 심결의 취소소송절차에서도 특허청장은 심사 또는 심판단계에서 의견제출의 기회를 부여한 바 없는 새로운 거절이유를 주장할 수 없다고 보아야 한다. 다만 거절결정불복심판청구 기각 심결의 취소소송절차에서 특허청장이 비로소 주장하는 사유라고 하더라도 심사 또는 심판단계에서 의견제출의 기회를 부여한 거절이유와 주요한 취지가 부합하여 이미 통지된 거절이유를 보충하는 데 지나지 아니하 는 것이면 이를 심결의 당부를 판단하는 근거로 할 수 있다 할 것이다. 특히 이미 통지된 거절이유가 비교대상발명에 의하여 출원발명의 진보성이 부정된다는 취지인 경우에, 위 비교대상발명을 보충하여 특허출원 당시 그 기술분야에 널리 알려진 주지관용기술의 존재를 증명하기 위한 자료는 새로운 공지기술에 관한 것에 해당하지 아니하므로, 심결취소소송의 법원이 이를 진보성을 부정하는 판단의 근거로 채택하였다고 하더라도 이미 통지된 거절이유와 주요한 취지가 부합하지 아니하는 새로운 거 절이유를 판결의 기초로 삼은 것이라고 할 수 없다. 거절결정불복심판 사건 심결취소소송의 심리범위"}]},{"section":"심결취소소송","question":"거절결정불복심판 사건 심결취소소송의 심리범위 - 주선행발명의 변경 대법원 2019. 10. 31. 선고 2015후2341 판결 판시 거절결정불복심판 또는 심결취소소송에서 특허출원심사 또는 심판단계에서 통지한 거절이유에 기재된 사항 주선행발명을 다른 선행발명으로 변경하는 경우 새로운 거절이유에 해당하는지 여부(원칙적 적극)","answer":"거절결정불복심판 또는 그 심결취소소송에서 특허출원심사 또는 심판단계에서 통지한 거절이유에 기재된 주선행발명을 다른 선행발명으로 변경하는 경우에는, 일반적으로 출원발명과의 공통점 및 차이점의 인정과 그러한 차이점을 극복하여 출원발명을 쉽게 발명할 수 있는지에 대한 판단 내용이 달라지므로, 출원인에게 이에 대해 실질적으로 의견제출의 기회가 주어졌다고 볼 수 있는 등의 특별한 사정이 없는 한 이미 통지된 거 절이유와 주요한 취지가 부합하지 아니하는 새로운 거절이유에 해당한다.","slides":[{"label":"판시사항","text":"거절결정불복심판 사건 심결취소소송의 심리범위 - 주선행발명의 변경 대법원 2019. 10. 31. 선고 2015후2341 판결 판시 거절결정불복심판 또는 심결취소소송에서 특허출원심사 또는 심판단계에서 통지한 거절이유에 기재된 사항 주선행발명을 다른 선행발명으로 변경하는 경우 새로운 거절이유에 해당하는지 여부(원칙적 적극)"},{"label":"판결요지","text":"거절결정불복심판 또는 그 심결취소소송에서 특허출원심사 또는 심판단계에서 통지한 거절이유에 기재된 주선행발명을 다른 선행발명으로 변경하는 경우에는, 일반적으로 출원발명과의 공통점 및 차이점의 인정과 그러한 차이점을 극복하여 출원발명을 쉽게 발명할 수 있는지에 대한 판단 내용이 달라지므로, 출원인에게 이에 대해 실질적으로 의견제출의 기회가 주어졌다고 볼 수 있는 등의 특별한 사정이 없는 한 이미 통지된 거 절이유와 주요한 취지가 부합하지 아니하는 새로운 거절이유에 해당한다."}]},{"section":"심결취소소송","question":"정정심판 사건 심결취소소송의 심리범위 대법원 2019. 7. 25. 선고 2018후12004 판결 정정심판이나 그 심결취소소송에서 정정의견제출 통지서를 통하여 심판청구인에게 의견서 제출 기회를 판시 부여한 바 없는 사유를 들어 정정심판청구를 기각하는 심결을 하거나, 심결취소청구를 기각할 수 있는지 사항 여부(소극) / 선행고안에 의하여 고안의 진보성이 부정된다는 취지로 정정심판을 기각한 경우, 특허청장 이 취소소송절차에 이르러 비로소 제출한 자료들을 판단의 근거로 삼을 수 있는지 여부(한정 적극)","answer":"실용신안법 제33조에서 준용하는 특허법 제136조 제6항은 정정심판에서 심판청구인에게 의견서 제출기회를 부여함으로써 정정심판청구에 대한 심사의 적정을 기하고 심사제도의 신용을 유지한다는 공익상의 요구에 기인하는 강행규정이다. 따라서 정정심판이나 그 심결취소소송에서 정정의견제출 통지서를 통하여 심판청구인에게 의견서 제출 기회를 부여한 바 없는 사유를 들어 정정심판청구를 기각하는 심결을 하거나, 심결취소청구를 기각하는 것은 위법하다 . 특히 정정심판을 기각하는 이유가 선행고안에 의하여 고안의 진보성이 부정된다는 취지라면 특허청장이 취소소송절차에 이르러 비로소 제출한 자료들은, 선행고안을 보충하여 출원 당시 해당 고안과 동일한 기술 분야에 널리 알려진 주지관용기술을 증명하기 위한 것이거나, 정정의견제출 통지서에 기재된 선행고안의 기재를 보충 또는 뒷받침하는 것에 불과한 경우라고 인정될 때 판단의 근거로 삼을 수 있다.","slides":[{"label":"판시사항","text":"정정심판 사건 심결취소소송의 심리범위 대법원 2019. 7. 25. 선고 2018후12004 판결 정정심판이나 그 심결취소소송에서 정정의견제출 통지서를 통하여 심판청구인에게 의견서 제출 기회를 판시 부여한 바 없는 사유를 들어 정정심판청구를 기각하는 심결을 하거나, 심결취소청구를 기각할 수 있는지 사항 여부(소극) / 선행고안에 의하여 고안의 진보성이 부정된다는 취지로 정정심판을 기각한 경우, 특허청장 이 취소소송절차에 이르러 비로소 제출한 자료들을 판단의 근거로 삼을 수 있는지 여부(한정 적극)"},{"label":"판결요지","text":"실용신안법 제33조에서 준용하는 특허법 제136조 제6항은 정정심판에서 심판청구인에게 의견서 제출기회를 부여함으로써 정정심판청구에 대한 심사의 적정을 기하고 심사제도의 신용을 유지한다는 공익상의 요구에 기인하는 강행규정이다. 따라서 정정심판이나 그 심결취소소송에서 정정의견제출 통지서를 통하여 심판청구인에게 의견서 제출 기회를 부여한 바 없는 사유를 들어 정정심판청구를 기각하는 심결을 하거나, 심결취소청구를 기각하는 것은 위법하다 . 특히 정정심판을 기각하는 이유가 선행고안에 의하여 고안의 진보성이 부정된다는 취지라면 특허청장이 취소소송절차에 이르러 비로소 제출한 자료들은, 선행고안을 보충하여 출원 당시 해당 고안과 동일한 기술 분야에 널리 알려진 주지관용기술을 증명하기 위한 것이거나, 정정의견제출 통지서에 기재된 선행고안의 기재를 보충 또는 뒷받침하는 것에 불과한 경우라고 인정될 때 판단의 근거로 삼을 수 있다."}]},{"section":"심결취소소송","question":"심결취소판결의 기속력 – 새로운 증거 대법원 2002. 12. 26. 선고 2001후96 판결 심결취소판결의 특허심판원에 대한 기속력 및 심결취소 후 제출된 새로운 증거의 의미","answer":"심결을 취소하는 판결이 확정된 경우, 그 취소의 기본이 된 이유는 그 사건에 대하여 특허심판원을 기속하는 것인바, 이 경우의 기속력은 취소의 이유가 된 심결의 사실상 및 법률상 판단이 정당하지 않다는 점에 있 어서 발생하는 것이므로, 취소 후의 심리과정에서 새로운 증거가 제출되어 기속적 판단의 기초가 되는 증거 관계에 변동이 생기는 등의 특단의 사정이 없는 한, 특허심판원은 위 확정된 취소판결에서 위법이라고 판단 된 이유와 동일한 이유로 종전의 심결과 동일한 결론의 심결을 할 수 없고, 여기에서 새로운 증거라 함은 적어도 취소된 심결이 행하여진 심판절차 내지는 그 심결의 취소소송에서 채택, 조사되지 않은 것으로서 심결 취소판결의 결론을 번복하기에 족한 증명력을 가지는 증거라고 보아야 할 것이다.","slides":[{"label":"판시사항","text":"심결취소판결의 기속력 – 새로운 증거 대법원 2002. 12. 26. 선고 2001후96 판결 심결취소판결의 특허심판원에 대한 기속력 및 심결취소 후 제출된 새로운 증거의 의미"},{"label":"판결요지","text":"심결을 취소하는 판결이 확정된 경우, 그 취소의 기본이 된 이유는 그 사건에 대하여 특허심판원을 기속하는 것인바, 이 경우의 기속력은 취소의 이유가 된 심결의 사실상 및 법률상 판단이 정당하지 않다는 점에 있 어서 발생하는 것이므로, 취소 후의 심리과정에서 새로운 증거가 제출되어 기속적 판단의 기초가 되는 증거 관계에 변동이 생기는 등의 특단의 사정이 없는 한, 특허심판원은 위 확정된 취소판결에서 위법이라고 판단 된 이유와 동일한 이유로 종전의 심결과 동일한 결론의 심결을 할 수 없고, 여기에서 새로운 증거라 함은 적어도 취소된 심결이 행하여진 심판절차 내지는 그 심결의 취소소송에서 채택, 조사되지 않은 것으로서 심결 취소판결의 결론을 번복하기에 족한 증명력을 가지는 증거라고 보아야 할 것이다."}]},{"section":"심결취소소송","question":"심결취소판결의 기속력 – 정정 청구항의 심결 대법원 2021. 1. 14. 선고 2017후1830 판결 확정된 심결취소판결의 기속력이 미치는 범위","answer":"이 사건 제1항 정정발명뿐만 아니라 그 종속항인 이 사건 제3항 내지 제5항 정정발명에도 모두 걸쳐 있는 것이어서, 이 사건 원심결 중 이 사건 제3항 내지 제5항 정정발명의 특허무효 여부에 관한 부분도 따로 확정되지 못한 채 이 사건 정정청구에 관한 부분과 함께 취소되어야 한다는 이유로 이 사건 제3항 내지 제5항 정정발명에 관한 부분까지 포함하여 이 사건 원심결을 전부 취소하였다. ... 확정된 취소판결은 정정청구가 이 사건 제1항 정정발명뿐만 아니라 이 사건 제3항 내지 제5항 정정발명에 도 모두 걸쳐 있다는 이유로 이 사건 제3항 내지 제5항 정정발명에 관한 부분까지 포함하여 이 사건 원심결을 전부 취소하기는 하였으나, 취소의 기본이 된 이유는 이 사건 제1항 정정발명에 관한 원심결의 위법성 부 분이라고 할 것이다. 따라서 확정된 취소판결의 기속력은 이 사건 제1항 정정발명에 관한 원심결의 사실상 및 법률상 판단이 정당하지 않다는 점에서 발생한다.","slides":[{"label":"판시사항","text":"심결취소판결의 기속력 – 정정 청구항의 심결 대법원 2021. 1. 14. 선고 2017후1830 판결 확정된 심결취소판결의 기속력이 미치는 범위"},{"label":"판결요지","text":"이 사건 제1항 정정발명뿐만 아니라 그 종속항인 이 사건 제3항 내지 제5항 정정발명에도 모두 걸쳐 있는 것이어서, 이 사건 원심결 중 이 사건 제3항 내지 제5항 정정발명의 특허무효 여부에 관한 부분도 따로 확정되지 못한 채 이 사건 정정청구에 관한 부분과 함께 취소되어야 한다는 이유로 이 사건 제3항 내지 제5항 정정발명에 관한 부분까지 포함하여 이 사건 원심결을 전부 취소하였다. ... 확정된 취소판결은 정정청구가 이 사건 제1항 정정발명뿐만 아니라 이 사건 제3항 내지 제5항 정정발명에 도 모두 걸쳐 있다는 이유로 이 사건 제3항 내지 제5항 정정발명에 관한 부분까지 포함하여 이 사건 원심결을 전부 취소하기는 하였으나, 취소의 기본이 된 이유는 이 사건 제1항 정정발명에 관한 원심결의 위법성 부 분이라고 할 것이다. 따라서 확정된 취소판결의 기속력은 이 사건 제1항 정정발명에 관한 원심결의 사실상 및 법률상 판단이 정당하지 않다는 점에서 발생한다."}]},{"section":"심결취소소송","question":"심결취소판결의 기속력 – 재심판 절차 대법원 2010. 2. 11. 선고 2009후2975 판결 특허심판원이 특허법원의 취소판결에 따라 다시 심판을 진행하면서 당사자로 하여금 취소판결의 소송절 판시 차에서 제출되었던 증거를 다시 제출하도록 통지하였으나 그 제출이 없어 실제로 증거를 제출받지 아니 사항한 채 심결을 한 경우, 그러한 사정만으로 곧바로 당사자에게 증거조사 결과에 대한 의견을 제출할 기회를 주지 않았다거나 증거의 제출로 인한 정정청구의 기회를 박탈한 위법이 있다고 할 수 있는지 여부(소극)","answer":"특허심판원이 특허법원의 취소판결에 따라 다시 심판을 진행하면서 당사자로 하여금 취소판결의 소송절차 에서 제출되었던 증거를 다시 제출하도록 통지하였으나 당사자로부터의 증거제출이 없어 이를 실제로 제출 받지 아니한 채 이 사건 심결을 하였더라도, 그러한 사정만으로 곧바로 원고에게 증거조사결과에 대한 의견을 제출할 기회를 주지 않았다거나 증거의 제출로 인한 정정청구의 기회를 박탈한 위법이 있다고 할 수 없다 는 취지로 판단하였음은 정당하고, 상고이유로 주장하는 바와 같은 판결에 영향을 미친 법리오해 등 의 위법이 없다.","slides":[{"label":"판시사항","text":"심결취소판결의 기속력 – 재심판 절차 대법원 2010. 2. 11. 선고 2009후2975 판결 특허심판원이 특허법원의 취소판결에 따라 다시 심판을 진행하면서 당사자로 하여금 취소판결의 소송절 판시 차에서 제출되었던 증거를 다시 제출하도록 통지하였으나 그 제출이 없어 실제로 증거를 제출받지 아니 사항한 채 심결을 한 경우, 그러한 사정만으로 곧바로 당사자에게 증거조사 결과에 대한 의견을 제출할 기회를 주지 않았다거나 증거의 제출로 인한 정정청구의 기회를 박탈한 위법이 있다고 할 수 있는지 여부(소극)"},{"label":"판결요지","text":"특허심판원이 특허법원의 취소판결에 따라 다시 심판을 진행하면서 당사자로 하여금 취소판결의 소송절차 에서 제출되었던 증거를 다시 제출하도록 통지하였으나 당사자로부터의 증거제출이 없어 이를 실제로 제출 받지 아니한 채 이 사건 심결을 하였더라도, 그러한 사정만으로 곧바로 원고에게 증거조사결과에 대한 의견을 제출할 기회를 주지 않았다거나 증거의 제출로 인한 정정청구의 기회를 박탈
