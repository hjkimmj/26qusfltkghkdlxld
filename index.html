실시권을 부여함에 따라 그 실시권자가 사실상 독점적인 지위를 향유 하고 있다는 사정만으로 그러한 계약이 있었다고 보기 어렵다. 그러나 등록하여야만 그 효력이 발생하는 전 용실시권 설정과 달리, 독점적 통상실시권의 허락은 당사자 간 의사의 합치만 있으면 성립되고, 이러한 의사 의 합치는 명시적으로는 물론 묵시적으로도 이루어질 수 있다. ... 제3자가 독점적 통상실시권자를 해한다는 사정을 알면서 법규를 위반하거나 선량한 풍속 또는 사회질서 를 위반하는 등 위법한 행위를 함으로써 이러한 이익을 침해하였다면 이로써 불법행위가 성립한다."}]},{"section":"특허침해 - 특허침해 일반","question":"구성요소 완비의 원칙 대법원 2020. 1. 30. 선고 2017다227516 판결 판시 특허권침해소송의 상대방이 제조하는 제품 또는 사용하는 방법 등이 특허발명의 특허권을 침해한다고 보 사항 기 위한 요건","answer":"특허권침해소송의 상대방이 제조하는 제품 또는 사용하는 방법 등(이하 ‘침해대상제품 등’이라고 한 다)이 특허발명의 특허권을 침해한다고 할 수 있기 위하여는 특허발명의 청구범위에 기재된 각 구성요소 와 그 구성요소 간의 유기적 결합관계가 침해대상제품 등에 그대로 포함되어 있어야 한다. 결합관계를 갖추지 않고 수출되어 조립될 제품의 생산","slides":[{"label":"판시사항","text":"구성요소 완비의 원칙 대법원 2020. 1. 30. 선고 2017다227516 판결 판시 특허권침해소송의 상대방이 제조하는 제품 또는 사용하는 방법 등이 특허발명의 특허권을 침해한다고 보 사항 기 위한 요건"},{"label":"판결요지","text":"특허권침해소송의 상대방이 제조하는 제품 또는 사용하는 방법 등(이하 ‘침해대상제품 등’이라고 한 다)이 특허발명의 특허권을 침해한다고 할 수 있기 위하여는 특허발명의 청구범위에 기재된 각 구성요소 와 그 구성요소 간의 유기적 결합관계가 침해대상제품 등에 그대로 포함되어 있어야 한다. 결합관계를 갖추지 않고 수출되어 조립될 제품의 생산"}]},{"section":"특허침해 - 특허침해 일반","question":"결합관계를 갖추지 않고 수출되어 조립될 제품의 생산 - 물건의 ‘국내 생산’ 여부 대법원 2025. 5. 15. 선고 2025다202970 판결 이른바 ‘특허권의 속지주의 원칙’과 ‘구성요소 완비의 원칙’의 의미 / 국내에서 특허발명의 실시를 위한 부 품 또는 구성 전부가 생산되거나 대부분의 생산단계를 마쳐 주요구성을 모두 갖춘 반제품이 생산되고, 위 판시 와 같은 부품 전체의 생산 또는 반제품의 생산만으로도 특허발명의 각 구성요소가 유기적으로 결합한 일 사항 체로서 가지는 작용효과를 구현할 수 있는 경우, 국내에서 특허발명의 실시제품이 생산된 것과 같이 볼 수 있는지 여부(적극) 및 이러한 경우에 해당하는지는 특허권의 속지주의 원칙과 구성요소 완비의 원칙을 고 려하여 엄격하게 판단하여야 하는지 여부(적극)","answer":"물건의 발명에 관한 특허권자가 물건에 대하여 가지는 독점적인 생산 사용 양도 대여 또는 수입 등의 특허실시에 관한 권리는 특허권이 등록된 국가의 영역 내에서만 효력이 미치고(이른바 ‘특허권의 속지 주의 원칙’), 특허권침해소송의 상대방이 제조하는 물건이 특허권을 침해하는 물건에 해당하려면 특허발명의 청구범위에 기재된 각 구성요소와 그 구성요소 간의 유기적 결합관계가 그 물건에 그대로 포 함되어 있어야 한다(이른바 ‘구성요소 완비의 원칙’). 한편 국내에서 특허발명의 실시를 위한 부품 또는 구성 전부가 생산되거나 대부분의 생산단계를 마쳐 주요구성을 모두 갖춘 반제품이 생산되고, 이것이 하나의 주체에게 수출되어 마지막 단계의 가공 조립이 이루어 질 것이 예정되어 있으며, 그와 같은 가공 조립이 극히 사소하거나 간단하여 위와 같은 부품 전체의 생산 또는 반제품의 생산만으로도 특허발명의 각 구성요소가 유기적으로 결합한 일체로서 가지는 작용효과를 구 현할 수 있는 상태에 이른 경우에는 특허권의 실질적 보호를 위해 국내에서 특허발명의 실시제품이 생산된 것과 같이 볼 수 있다(대법원 2019. 10. 17. 선고 2019다222782, 222799 판결 등 참조). 이러한 경우에 해당하는지는 특허권의 속지주의 원칙과 구성요소 완비의 원칙을 고려하여 엄격하게 판단하여야 한다. 2 균등론","slides":[{"label":"판시사항","text":"결합관계를 갖추지 않고 수출되어 조립될 제품의 생산 - 물건의 ‘국내 생산’ 여부 대법원 2025. 5. 15. 선고 2025다202970 판결 이른바 ‘특허권의 속지주의 원칙’과 ‘구성요소 완비의 원칙’의 의미 / 국내에서 특허발명의 실시를 위한 부 품 또는 구성 전부가 생산되거나 대부분의 생산단계를 마쳐 주요구성을 모두 갖춘 반제품이 생산되고, 위 판시 와 같은 부품 전체의 생산 또는 반제품의 생산만으로도 특허발명의 각 구성요소가 유기적으로 결합한 일 사항 체로서 가지는 작용효과를 구현할 수 있는 경우, 국내에서 특허발명의 실시제품이 생산된 것과 같이 볼 수 있는지 여부(적극) 및 이러한 경우에 해당하는지는 특허권의 속지주의 원칙과 구성요소 완비의 원칙을 고 려하여 엄격하게 판단하여야 하는지 여부(적극)"},{"label":"판결요지","text":"물건의 발명에 관한 특허권자가 물건에 대하여 가지는 독점적인 생산 사용 양도 대여 또는 수입 등의 특허실시에 관한 권리는 특허권이 등록된 국가의 영역 내에서만 효력이 미치고(이른바 ‘특허권의 속지 주의 원칙’), 특허권침해소송의 상대방이 제조하는 물건이 특허권을 침해하는 물건에 해당하려면 특허발명의 청구범위에 기재된 각 구성요소와 그 구성요소 간의 유기적 결합관계가 그 물건에 그대로 포 함되어 있어야 한다(이른바 ‘구성요소 완비의 원칙’). 한편 국내에서 특허발명의 실시를 위한 부품 또는 구성 전부가 생산되거나 대부분의 생산단계를 마쳐 주요구성을 모두 갖춘 반제품이 생산되고, 이것이 하나의 주체에게 수출되어 마지막 단계의 가공 조립이 이루어 질 것이 예정되어 있으며, 그와 같은 가공 조립이 극히 사소하거나 간단하여 위와 같은 부품 전체의 생산 또는 반제품의 생산만으로도 특허발명의 각 구성요소가 유기적으로 결합한 일체로서 가지는 작용효과를 구 현할 수 있는 상태에 이른 경우에는 특허권의 실질적 보호를 위해 국내에서 특허발명의 실시제품이 생산된 것과 같이 볼 수 있다(대법원 2019. 10. 17. 선고 2019다222782, 222799 판결 등 참조). 이러한 경우에 해당하는지는 특허권의 속지주의 원칙과 구성요소 완비의 원칙을 고려하여 엄격하게 판단하여야 한다. 2 균등론"}]},{"section":"특허침해 - 균등론","question":"균등 제1요건 – 과제해결원리의 동일성 대법원 2019. 1. 31. 선고 2017후424 판결 확인대상 발명에 특허발명의 특허청구범위에 기재된 구성 중 변경된 부분이 있는 경우, 확인대상 발명이 특허발명의 특허청구범위에 기재된 구성과 균등한 것으로서 특허발명의 권리범위에 속한다고 볼 수 있는 요건 및 확인대상 발명과 특허발명의 ‘과제 해결원리가 동일’한지를 판단하는 방법 확인대상발명에서 특허발명의 특허청구범위에 기재된 구성 중 변경된 부분이 있는 경우에도, 양 발명 에서 과제의 해결원리가 동일하고, 그러한 변경에 의하더라도 특허발명에서와 실질적으로 동일한 작용효과를 나타내며, 그와 같이 변경하는 것이 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자(이하 ‘통상의 기술자’라고 한다)라면 누구나 용이하게 생각해 낼 수 있는 정도라면, 특별한 사정이 없는 한 확인대상발명은 특허발명의 특허청구범위에 기재된 구성과 균등한 것으로서 여전히 특허발명의 권리범위에 속 한다고 보아야 한다","answer":"확인대상 발명과 특허발명의 ‘과제해결원리가 동일’한지를 가릴 때에는 특허청구범위에 기재된 구성의 일 부를 형식적으로 추출할 것이 아니라, 명세서에 적힌 발명의 상세한 설명의 기재와 출원 당시의 공지기술 등을 참작하여 선행기술과 대비하여 볼 때 특허발명에 특유한 해결수단이 기초하고 있는 기술사상의 핵심이 무엇인가를 실질적으로 탐구하여 판단하여야 한다. ... 이러한 선행기술을 참작하여 특허발명이 기술발전에 기여한 정도에 따라 특허발명의 과제해결원리를 얼마 나 넓게 또는 좁게 파악할지 결정하여야 한다. 다만, 발명의 상세한 설명에 기재되지 않은 공지기술을 근거로 발명의 상세한 설명에서 파악되는 기술사상 의 핵심을 제외한 채 다른 기술사상을 기술사상의 핵심으로 대체하여서는 안 된다.","slides":[{"label":"판시사항","text":"균등 제1요건 – 과제해결원리의 동일성 대법원 2019. 1. 31. 선고 2017후424 판결 확인대상 발명에 특허발명의 특허청구범위에 기재된 구성 중 변경된 부분이 있는 경우, 확인대상 발명이 특허발명의 특허청구범위에 기재된 구성과 균등한 것으로서 특허발명의 권리범위에 속한다고 볼 수 있는 요건 및 확인대상 발명과 특허발명의 ‘과제 해결원리가 동일’한지를 판단하는 방법 확인대상발명에서 특허발명의 특허청구범위에 기재된 구성 중 변경된 부분이 있는 경우에도, 양 발명 에서 과제의 해결원리가 동일하고, 그러한 변경에 의하더라도 특허발명에서와 실질적으로 동일한 작용효과를 나타내며, 그와 같이 변경하는 것이 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자(이하 ‘통상의 기술자’라고 한다)라면 누구나 용이하게 생각해 낼 수 있는 정도라면, 특별한 사정이 없는 한 확인대상발명은 특허발명의 특허청구범위에 기재된 구성과 균등한 것으로서 여전히 특허발명의 권리범위에 속 한다고 보아야 한다"},{"label":"판결요지","text":"확인대상 발명과 특허발명의 ‘과제해결원리가 동일’한지를 가릴 때에는 특허청구범위에 기재된 구성의 일 부를 형식적으로 추출할 것이 아니라, 명세서에 적힌 발명의 상세한 설명의 기재와 출원 당시의 공지기술 등을 참작하여 선행기술과 대비하여 볼 때 특허발명에 특유한 해결수단이 기초하고 있는 기술사상의 핵심이 무엇인가를 실질적으로 탐구하여 판단하여야 한다. ... 이러한 선행기술을 참작하여 특허발명이 기술발전에 기여한 정도에 따라 특허발명의 과제해결원리를 얼마 나 넓게 또는 좁게 파악할지 결정하여야 한다. 다만, 발명의 상세한 설명에 기재되지 않은 공지기술을 근거로 발명의 상세한 설명에서 파악되는 기술사상 의 핵심을 제외한 채 다른 기술사상을 기술사상의 핵심으로 대체하여서는 안 된다."}]},{"section":"특허침해 - 균등론","question":"균등 제1요건 – 과제해결원리의 동일성 대법원 2025. 7. 17. 선고 2023후11340 판결 판시 출원 당시 공지기술과 비교하여 기술발전에 대한 기여도가 크지 않은 발명의 경우, 그 특유한 과제 해결원 사항 리를 청구범위 기재에 근접한 정도로 파악하여야 하는지 여부 (적극)","answer":"위와 같은 이 사건 특허발명의 명세서에 적힌 발명에 관한 설명의 기재와 출원 당시의 공지기술 등을 참작하 면, 이 사건 제1항 발명은 출원 당시 이미 공지된 ‘정수기의 여과부에서 여과되는 물을 정수기의 자가 세정 에 사용하되, 여과부에 구비된 필터 중 일부 필터만을 통과하여 여과된 물을 사용한다.’는 기술사상에다가 세정물질 또는 살균물질을 내부에 포함하는 ‘세정수단’ 구성을 결합한 것이어서 선행기술과의 관계에서 기술 발전에 기여한 정도가 크다고 보기는 어렵다. 따라서 이 사건 제1항 발명에 특유한 과제 해결원리는 청구범위 기재에 근접한 정도로 파악하여야 한다.","slides":[{"label":"판시사항","text":"균등 제1요건 – 과제해결원리의 동일성 대법원 2025. 7. 17. 선고 2023후11340 판결 판시 출원 당시 공지기술과 비교하여 기술발전에 대한 기여도가 크지 않은 발명의 경우, 그 특유한 과제 해결원 사항 리를 청구범위 기재에 근접한 정도로 파악하여야 하는지 여부 (적극)"},{"label":"판결요지","text":"위와 같은 이 사건 특허발명의 명세서에 적힌 발명에 관한 설명의 기재와 출원 당시의 공지기술 등을 참작하 면, 이 사건 제1항 발명은 출원 당시 이미 공지된 ‘정수기의 여과부에서 여과되는 물을 정수기의 자가 세정 에 사용하되, 여과부에 구비된 필터 중 일부 필터만을 통과하여 여과된 물을 사용한다.’는 기술사상에다가 세정물질 또는 살균물질을 내부에 포함하는 ‘세정수단’ 구성을 결합한 것이어서 선행기술과의 관계에서 기술 발전에 기여한 정도가 크다고 보기는 어렵다. 따라서 이 사건 제1항 발명에 특유한 과제 해결원리는 청구범위 기재에 근접한 정도로 파악하여야 한다."}]},{"section":"특허침해 - 균등론","question":"균등 제2요건 – 작용효과의 실질적 동일성 대법원 2019. 1. 31. 선고 2018다267252 판결 발명의 상세한 설명의 기재와 출원 당시의 공지기술 등을 참작하여 파악되는 특허발명에 특유한 해결수 단이 기초하고 있는 기술사상의 핵심이 특허권침해소송의 상대방이 제조 등을 하는 제품 또는 사용하는 방법에서도 구현되어 있는 경우, 작용효과가 실질적으로 동일한지 여부(원칙적 적극) 및 기술사상의 핵심 이 특허발명의 출원 당시에 이미 공지되었거나 그와 다름없는 것에 불과한 경우, 작용효과가 실질적으로 동일한지 판단하는 방법","answer":"작용효과가 실질적으로 동일한지 여부는 선행기술에서 해결되지 않았던 기술과제로서 특허발명이 해결한 과제를 침해제품 등도 해결하는지를 중심으로 판단하여야 한다. 따라서 발명의 상세한 설명의 기재와 출원 당시의 공지기술 등을 참작하여 파악되는 특허발명에 특유한 해결수단이 기초하고 있는 기술사상의 핵심이 침해제품 등에서도 구현되어 있다면 작용효과가 실질적으로 동일하다고 보는 것이 원칙이다. 그러나 위와 같은 기술사상의 핵심이 특허발명의 출원 당시에 이미 공지되었거나 그와 다름없는 것에 불과 한 경우에는 이러한 기술사상의 핵심이 특허발명에 특유하다고 볼 수 없고, 특허발명이 선행기술에서 해결되지 않았던 기술과제를 해결하였다고 말할 수도 없다. 이러한 때에는 특허발명의 기술사상의 핵 심이 침해제품 등에서 구현되어 있는지를 가지고 작용효과가 실질적으로 동일한지 여부를 판단할 수 없고, 균등 여부가 문제되는 구성요소의 개별적 기능이나 역할 등을 비교하여 판단하여야 한다.","slides":[{"label":"판시사항","text":"균등 제2요건 – 작용효과의 실질적 동일성 대법원 2019. 1. 31. 선고 2018다267252 판결 발명의 상세한 설명의 기재와 출원 당시의 공지기술 등을 참작하여 파악되는 특허발명에 특유한 해결수 단이 기초하고 있는 기술사상의 핵심이 특허권침해소송의 상대방이 제조 등을 하는 제품 또는 사용하는 방법에서도 구현되어 있는 경우, 작용효과가 실질적으로 동일한지 여부(원칙적 적극) 및 기술사상의 핵심 이 특허발명의 출원 당시에 이미 공지되었거나 그와 다름없는 것에 불과한 경우, 작용효과가 실질적으로 동일한지 판단하는 방법"},{"label":"판결요지","text":"작용효과가 실질적으로 동일한지 여부는 선행기술에서 해결되지 않았던 기술과제로서 특허발명이 해결한 과제를 침해제품 등도 해결하는지를 중심으로 판단하여야 한다. 따라서 발명의 상세한 설명의 기재와 출원 당시의 공지기술 등을 참작하여 파악되는 특허발명에 특유한 해결수단이 기초하고 있는 기술사상의 핵심이 침해제품 등에서도 구현되어 있다면 작용효과가 실질적으로 동일하다고 보는 것이 원칙이다. 그러나 위와 같은 기술사상의 핵심이 특허발명의 출원 당시에 이미 공지되었거나 그와 다름없는 것에 불과 한 경우에는 이러한 기술사상의 핵심이 특허발명에 특유하다고 볼 수 없고, 특허발명이 선행기술에서 해결되지 않았던 기술과제를 해결하였다고 말할 수도 없다. 이러한 때에는 특허발명의 기술사상의 핵 심이 침해제품 등에서 구현되어 있는지를 가지고 작용효과가 실질적으로 동일한지 여부를 판단할 수 없고, 균등 여부가 문제되는 구성요소의 개별적 기능이나 역할 등을 비교하여 판단하여야 한다."}]},{"section":"특허침해 - 균등론","question":"균등 제1,2요건 – 복수 과제해결원리의 취급 특허법원 2022. 10. 12. 선고 2021허5266 판결 특허발명이 복수의 과제해결원리를 가지는 경우 기술사상의 핵심의 공지 여부 판단","answer":"특허발명이 복수의 과제해결원리를 가지고 있고 그 과제해결원리가 각각 다른 선행기술들에 의해 출원 당시 공지되거나 공지된 것과 다름없다 하더라도, 복수의 과제해결원리의 결합 자체가 공지되거나 통상의 기술자에게 자명한 것이 아니라면 특허발명의 기술사상의 핵심이 모두 공지되었다고 단정하기는 어렵다고 할 것이다. 더욱이 복수의 과제해결원리 중 일부는 공지되었더라도 나머지는 공지된 것으로 볼 수 없고, 균등 여부가 다 퉈지는 구성요소는 공지된 과제해결원리와 무관한 것이라면, 양 발명의 과제해결원리의 동일성 여부를 검토 하지 아니한 채 문제되는 구성요소들의 개별적 기능이나 역할 등의 비교로 나아가서는 아니될 것이다.","slides":[{"label":"판시사항","text":"균등 제1,2요건 – 복수 과제해결원리의 취급 특허법원 2022. 10. 12. 선고 2021허5266 판결 특허발명이 복수의 과제해결원리를 가지는 경우 기술사상의 핵심의 공지 여부 판단"},{"label":"판결요지","text":"특허발명이 복수의 과제해결원리를 가지고 있고 그 과제해결원리가 각각 다른 선행기술들에 의해 출원 당시 공지되거나 공지된 것과 다름없다 하더라도, 복수의 과제해결원리의 결합 자체가 공지되거나 통상의 기술자에게 자명한 것이 아니라면 특허발명의 기술사상의 핵심이 모두 공지되었다고 단정하기는 어렵다고 할 것이다. 더욱이 복수의 과제해결원리 중 일부는 공지되었더라도 나머지는 공지된 것으로 볼 수 없고, 균등 여부가 다 퉈지는 구성요소는 공지된 과제해결원리와 무관한 것이라면, 양 발명의 과제해결원리의 동일성 여부를 검토 하지 아니한 채 문제되는 구성요소들의 개별적 기능이나 역할 등의 비교로 나아가서는 아니될 것이다."}]},{"section":"특허침해 - 균등론","question":"균등 제3요건 – 구성 변경의 용이성 판단시점 대법원 2023. 2. 2. 선고 2022후10210 판결 구성 변경의 용이성 판단에 특허발명의 출원 이후 침해 시까지 공지된 자료를 참작할 수 있는지 여부(적 판시 극) / 권리범위 확인심판에서 확인대상 발명에 특허발명의 청구범위에 기재된 구성 중 변경된 부분이 있 사항 는 경우, 그와 같은 변경이 통상의 기술자라면 누구나 쉽게 생각해 낼 수 있는 정도인지 판단하는 기준 시 점(=심결 시)","answer":"특허의 보호범위가 청구범위에 적혀 있는 사항에 의하여 정하여짐에도(특허법 제97조) 위와 같이 청구 범위의 구성요소와 침해대상제품 등의 대응구성이 문언적으로 동일하지는 않더라도 서로 균등한 관계에 있 는 것으로 평가되는 경우 이를 보호범위에 속하는 것으로 보아 침해를 인정하는 것은, 출원인이 청구범위를 기재하는 데에는 문언상 한계가 있기 마련인데 사소한 변경을 통한 특허침해 회피 시도를 방치하면 특허권 을 실질적으로 보호할 수 없게 되기 때문이다. 위와 같은 균등침해 인정의 취지를 고려하면, 특허발명의 출원 이후 침해 시까지 사이에 공지된 자료라도 구성 변경의 용이성 판단에 이를 참작할 수 있다고 봄이 타당 하다. ... 권리범위 확인심판에서는 확인대상 발명에 특허발명의 청구범위에 기재된 구성 중 변경된 부분이 있는 경우 심결시를 기준으로 하여 특허발명의 출원 이후 공지된 자료까지 참작하여 그와 같은 변경이 통상의 기술자라 면 누구나 쉽게 생각해 낼 수 있는 정도인지를 판단할 수 있다고 봄이 타당하다. 3 간접침해","slides":[{"label":"판시사항","text":"균등 제3요건 – 구성 변경의 용이성 판단시점 대법원 2023. 2. 2. 선고 2022후10210 판결 구성 변경의 용이성 판단에 특허발명의 출원 이후 침해 시까지 공지된 자료를 참작할 수 있는지 여부(적 판시 극) / 권리범위 확인심판에서 확인대상 발명에 특허발명의 청구범위에 기재된 구성 중 변경된 부분이 있 사항 는 경우, 그와 같은 변경이 통상의 기술자라면 누구나 쉽게 생각해 낼 수 있는 정도인지 판단하는 기준 시 점(=심결 시)"},{"label":"판결요지","text":"특허의 보호범위가 청구범위에 적혀 있는 사항에 의하여 정하여짐에도(특허법 제97조) 위와 같이 청구 범위의 구성요소와 침해대상제품 등의 대응구성이 문언적으로 동일하지는 않더라도 서로 균등한 관계에 있 는 것으로 평가되는 경우 이를 보호범위에 속하는 것으로 보아 침해를 인정하는 것은, 출원인이 청구범위를 기재하는 데에는 문언상 한계가 있기 마련인데 사소한 변경을 통한 특허침해 회피 시도를 방치하면 특허권 을 실질적으로 보호할 수 없게 되기 때문이다. 위와 같은 균등침해 인정의 취지를 고려하면, 특허발명의 출원 이후 침해 시까지 사이에 공지된 자료라도 구성 변경의 용이성 판단에 이를 참작할 수 있다고 봄이 타당 하다. ... 권리범위 확인심판에서는 확인대상 발명에 특허발명의 청구범위에 기재된 구성 중 변경된 부분이 있는 경우 심결시를 기준으로 하여 특허발명의 출원 이후 공지된 자료까지 참작하여 그와 같은 변경이 통상의 기술자라 면 누구나 쉽게 생각해 낼 수 있는 정도인지를 판단할 수 있다고 봄이 타당하다. 3 간접침해"}]},{"section":"특허침해 - 간접침해","question":"간접침해 - 전용품 판단 대법원 2009. 9. 10. 선고 2007후3356 판결 판시 간접침해에 관하여 규정하고 있는 특허법 제127조 제1호에서 정한 ‘생산’의 의미와 범위 및 ‘특허 물건의 사항 생산에만 사용하는 물건’에 해당하기 위한 요건","answer":"여기서 말하는 “생산”이란 발명의 구성요소 일부를 결여한 물건을 사용하여 발명의 모든 구성요소를 가진 물건을 새로 만들어내는 모든 행위를 의미하므로, 공업적 생산에 한하지 않고 가공, 조립 등의 행위도 포함된 다고 할 것이다. 나아가 특허 물건의 생산“에만” 사용하는 물건에 해당되기 위하여는 사회통념상 통용되고 승인될 수 있는 경제적, 상업적 내지 실용적인 다른 용도가 없어야 할 것이고, 이와 달리 단순히 특허 물건 이 외의 물건에 사용될 이론적, 실험적 또는 일시적인 사용가능성이 있는 정도에 불과한 경우에는 간접침해의 성립을 부정할 만한 다른 용도가 있다고 할 수 없다.","slides":[{"label":"판시사항","text":"간접침해 - 전용품 판단 대법원 2009. 9. 10. 선고 2007후3356 판결 판시 간접침해에 관하여 규정하고 있는 특허법 제127조 제1호에서 정한 ‘생산’의 의미와 범위 및 ‘특허 물건의 사항 생산에만 사용하는 물건’에 해당하기 위한 요건"},{"label":"판결요지","text":"여기서 말하는 “생산”이란 발명의 구성요소 일부를 결여한 물건을 사용하여 발명의 모든 구성요소를 가진 물건을 새로 만들어내는 모든 행위를 의미하므로, 공업적 생산에 한하지 않고 가공, 조립 등의 행위도 포함된 다고 할 것이다. 나아가 특허 물건의 생산“에만” 사용하는 물건에 해당되기 위하여는 사회통념상 통용되고 승인될 수 있는 경제적, 상업적 내지 실용적인 다른 용도가 없어야 할 것이고, 이와 달리 단순히 특허 물건 이 외의 물건에 사용될 이론적, 실험적 또는 일시적인 사용가능성이 있는 정도에 불과한 경우에는 간접침해의 성립을 부정할 만한 다른 용도가 있다고 할 수 없다."}]},{"section":"특허침해 - 간접침해","question":"전량 수출되어 외국에서 완성되는 반제품의 생산 대법원 2015. 7. 23. 선고 2014다42110 판결 특허법 제127조 제1호의 ‘그 물건의 생산에만 사용하는 물건’에서 말하는 ‘생산’이란 국내에서의 생산을 의미하는지 여부(적극) 및 물건의 생산이 국외에서 일어나고 그 전 단계의 행위가 국내에서 이루어진 경 우, 간접침해가 성립하는지 여부(소극)","answer":"특허권의 속지주의 원칙상 물건의 발명에 관한 특허권자가 그 물건에 대하여 가지는 독점적인 생산 사 용 양도 대여 또는 수입 등의 특허실시에 관한 권리는 특허권이 등록된 국가의 영역 내에서만 그 효력 이 미치는 점을 고려하면, 특허법 제127조 제1호의 ‘그 물건의 생산에만 사용하는 물건’에서 말하는 ‘생산’ 이란 국내에서의 생산을 의미한다고 봄이 타당하다. 따라서 이러한 생산이 국외에서 일어나는 경우에는 그 전 단계의 행위가 국내에서 이루어지더라도 간접침해가 성립할 수 없다.","slides":[{"label":"판시사항","text":"전량 수출되어 외국에서 완성되는 반제품의 생산 대법원 2015. 7. 23. 선고 2014다42110 판결 특허법 제127조 제1호의 ‘그 물건의 생산에만 사용하는 물건’에서 말하는 ‘생산’이란 국내에서의 생산을 의미하는지 여부(적극) 및 물건의 생산이 국외에서 일어나고 그 전 단계의 행위가 국내에서 이루어진 경 우, 간접침해가 성립하는지 여부(소극)"},{"label":"판결요지","text":"특허권의 속지주의 원칙상 물건의 발명에 관한 특허권자가 그 물건에 대하여 가지는 독점적인 생산 사 용 양도 대여 또는 수입 등의 특허실시에 관한 권리는 특허권이 등록된 국가의 영역 내에서만 그 효력 이 미치는 점을 고려하면, 특허법 제127조 제1호의 ‘그 물건의 생산에만 사용하는 물건’에서 말하는 ‘생산’ 이란 국내에서의 생산을 의미한다고 봄이 타당하다. 따라서 이러한 생산이 국외에서 일어나는 경우에는 그 전 단계의 행위가 국내에서 이루어지더라도 간접침해가 성립할 수 없다."}]},{"section":"특허침해 - 간접침해","question":"실시권자의 의뢰로 제작 납품한 전용품 대법원 2019. 2. 28. 선고 2017다290095 판결 방법의 발명에 관한 특허권자로부터 허락을 받은 실시권자가 제3자에게 그 방법의 실시에만 사용하는 물 건의 제작을 의뢰한 다음 이를 공급받아 방법의 발명을 실시하는 경우, 제3자의 위 물건 생산 양도 등의 행위가 특허권의 간접침해에 해당하는지 여부(소극)","answer":"방법발명에 관한 특허권자로부터 허락을 받은 실시권자가 제3자에게 전용품의 제작을 의뢰하여 그로부터 전용품을 공급받아 방법발명을 실시하는 경우에 있어서 그러한 제3자의 전용품 생산 양도 등의 행위는 특허권의 간접침해에 해당한다고 볼 수 없다.","slides":[{"label":"판시사항","text":"실시권자의 의뢰로 제작 납품한 전용품 대법원 2019. 2. 28. 선고 2017다290095 판결 방법의 발명에 관한 특허권자로부터 허락을 받은 실시권자가 제3자에게 그 방법의 실시에만 사용하는 물 건의 제작을 의뢰한 다음 이를 공급받아 방법의 발명을 실시하는 경우, 제3자의 위 물건 생산 양도 등의 행위가 특허권의 간접침해에 해당하는지 여부(소극)"},{"label":"판결요지","text":"방법발명에 관한 특허권자로부터 허락을 받은 실시권자가 제3자에게 전용품의 제작을 의뢰하여 그로부터 전용품을 공급받아 방법발명을 실시하는 경우에 있어서 그러한 제3자의 전용품 생산 양도 등의 행위는 특허권의 간접침해에 해당한다고 볼 수 없다."}]},{"section":"특허침해 - 간접침해","question":"소모부품 생산 등의 간접침해 여부 대법원 2001. 1. 30. 선고 98후2580 판결 특허발명을 채택한 레이저 프린터에 사용되는 소모부품인 (가)호 발명의 감광드럼카트리지가 특허발명 의 물건의 생산에만 사용하는 물건에 해당하여 (가)호 발명이 특허발명의 권리범위를 벗어날 수 없다고 한 사례","answer":"특허발명의 대상이거나 그와 관련된 물건을 사용함에 따라 마모되거나 소진되어 자주 교체해 주어야 하는 소모부품일지라도, 특허발명의 본질적인 구성요소에 해당하고 다른 용도로는 사용되지 아니하며 일 반적으로 널리 쉽게 구할 수 없는 물품으로서 당해 발명에 관한 물건의 구입시에 이미 그러한 교체가 예정 되어 있었고 특허권자측에 의하여 그러한 부품이 따로 제조 판매되고 있다면, 그러한 물건은 특허권에 대한 이른바 간접침해에서 말하는 '특허 물건의 생산에만 사용하는 물건'에 해당하고, 위 '특허 물건의 생 산에만 사용하는 물건'에 해당한다는 점은 특허권자가 주장 입증하여야 한다. 4 이용관계","slides":[{"label":"판시사항","text":"소모부품 생산 등의 간접침해 여부 대법원 2001. 1. 30. 선고 98후2580 판결 특허발명을 채택한 레이저 프린터에 사용되는 소모부품인 (가)호 발명의 감광드럼카트리지가 특허발명 의 물건의 생산에만 사용하는 물건에 해당하여 (가)호 발명이 특허발명의 권리범위를 벗어날 수 없다고 한 사례"},{"label":"판결요지","text":"특허발명의 대상이거나 그와 관련된 물건을 사용함에 따라 마모되거나 소진되어 자주 교체해 주어야 하는 소모부품일지라도, 특허발명의 본질적인 구성요소에 해당하고 다른 용도로는 사용되지 아니하며 일 반적으로 널리 쉽게 구할 수 없는 물품으로서 당해 발명에 관한 물건의 구입시에 이미 그러한 교체가 예정 되어 있었고 특허권자측에 의하여 그러한 부품이 따로 제조 판매되고 있다면, 그러한 물건은 특허권에 대한 이른바 간접침해에서 말하는 '특허 물건의 생산에만 사용하는 물건'에 해당하고, 위 '특허 물건의 생 산에만 사용하는 물건'에 해당한다는 점은 특허권자가 주장 입증하여야 한다. 4 이용관계"}]},{"section":"특허침해 - 이용관계","question":"이용관계 대법원 2015. 5. 14. 선고 2014후2788 판결 판시 확인대상발명이 특허발명을 이용하는 관계가 성립하기 위한 요건 / 이는 특허발명과 균등한 발명을 이용 사항 하는 경우에도 마찬가지인지 여부(적극)","answer":"확인대상발명이 특허발명을 이용하는 관계에 있는 경우에는 특허발명의 권리범위에 속하는 것인데, 이러한 이용관계는 확인대상발명이 특허발명의 구성에 새로운 기술적 요소를 부가하는 것으로서 확인대상발명이 특허발명의 요지를 전부 포함하고 이를 그대로 이용하면서 확인대상발명 내에 특허발명이 발명으로서의 일 체성을 유지하는 경우에 성립하며, 이는 특허발명과 동일한 발명뿐만 아니라 균등한 발명을 이용하는 경우에도 마찬가지이다.","slides":[{"label":"판시사항","text":"이용관계 대법원 2015. 5. 14. 선고 2014후2788 판결 판시 확인대상발명이 특허발명을 이용하는 관계가 성립하기 위한 요건 / 이는 특허발명과 균등한 발명을 이용 사항 하는 경우에도 마찬가지인지 여부(적극)"},{"label":"판결요지","text":"확인대상발명이 특허발명을 이용하는 관계에 있는 경우에는 특허발명의 권리범위에 속하는 것인데, 이러한 이용관계는 확인대상발명이 특허발명의 구성에 새로운 기술적 요소를 부가하는 것으로서 확인대상발명이 특허발명의 요지를 전부 포함하고 이를 그대로 이용하면서 확인대상발명 내에 특허발명이 발명으로서의 일 체성을 유지하는 경우에 성립하며, 이는 특허발명과 동일한 발명뿐만 아니라 균등한 발명을 이용하는 경우에도 마찬가지이다."}]},{"section":"특허침해 - 이용관계","question":"저촉관계 - 후출원 특허발명 실시의 취급 대법원 2021. 3. 18. 선고 2018다253444 전원합의체판결 상표권자가 상표등록출원일 전에 출원ㆍ등록된 타인의 선출원 등록상표와 동일ㆍ유사한 상표를 등록받 아 선출원 등록상표권자의 동의 없이 이를 선출원 등록상표의 지정상품과 동일ㆍ유사한 상품에 사용한 경우, 후출원 등록상표에 대한 등록무효 심결의 확정 여부와 상관없이 선출원 등록상표권에 대한 침해가 성립하는지 여부(적극) / 특허권과실용신안권, 디자인권의 경우에도 같은 법리가 그대로 적용되는지 여부(적극)","answer":"다른 이용 저촉관계와의 형평상 선출원 특허권자 또는 실용신안권자의 동의를 받지 않은 후출원 특허권자의 권리 행사 역시 침해로 보는 것이 타당하고, 이는 특허법 제98조에 대응되는 규정을 가지고 있는 실용신 안권(실용신안법 제25조)에도 그대로 적용된다.","slides":[{"label":"판시사항","text":"저촉관계 - 후출원 특허발명 실시의 취급 대법원 2021. 3. 18. 선고 2018다253444 전원합의체판결 상표권자가 상표등록출원일 전에 출원ㆍ등록된 타인의 선출원 등록상표와 동일ㆍ유사한 상표를 등록받 아 선출원 등록상표권자의 동의 없이 이를 선출원 등록상표의 지정상품과 동일ㆍ유사한 상품에 사용한 경우, 후출원 등록상표에 대한 등록무효 심결의 확정 여부와 상관없이 선출원 등록상표권에 대한 침해가 성립하는지 여부(적극) / 특허권과실용신안권, 디자인권의 경우에도 같은 법리가 그대로 적용되는지 여부(적극)"},{"label":"판결요지","text":"다른 이용 저촉관계와의 형평상 선출원 특허권자 또는 실용신안권자의 동의를 받지 않은 후출원 특허권자의 권리 행사 역시 침해로 보는 것이 타당하고, 이는 특허법 제98조에 대응되는 규정을 가지고 있는 실용신 안권(실용신안법 제25조)에도 그대로 적용된다."}]},{"section":"특허침해 - 생략침해","question":"생략침해 대법원 2025. 5. 15. 선고 2022다265123 판결 대상제품이 청구항에 기재된 구성요소 중 일부만을 갖추고 나머지 구성요소가 결여된 경우, 원칙적으로 특허발명의 보호범위에 속하지 않는지 여부 (적극) / 청구항에 기재된 구성요소 중 일부를 중요하지 않다 는 이유로 무시하여 권리범위를 인정하는 것이 허용되는지 여부 (소극)","answer":"특허발명의 청구항을 복수의 구성요소로 구성한 경우에는, 그 구성요소가 유기적으로 결합한 전체로서의 기술사상을 보호하는 것이지, 각각의 구성요소를 독립하여 보호하는 것은 아니다. 특허권침해소송 상대방의 대상제품 등이 특허발명의 청구항에 기재된 구성요소들 중의 일부만을 갖추고 있고 나머지 구성요소가 없는 경우에는 원칙적으로 그 대상제품 등은 특허발명의 보호범위에 속하지 않는다(대법원 2017. 9. 26. 선고 2014다27425 판결 등 참조). 특허발명의 청구범위에 기재된 모든 구성요소는 중요하므로, 그중 일부를 권리행사의 단계에서 비교적 중요하지 않은 사항이라고 하여 무시하는 것은 사실상 청구범위의 확장적 변경을 사후에 인정하는 것이 되어 허용될 수 없다(대법원 2020. 7. 23. 선고 2019도9547 판결 등 참조). 원심은 판시와 같은 이유로, 이 사건 제1항, 제9항 정정발명의 청구범위에 기재된 ‘냉온정수시스템’, ‘냉온 정수기’는, 물건의 발명인 이 사건 제1항, 제9항 정정발명의 구성요소인데, 피고 제품 2는 온수에 관한 구성을 포함하고 있지 않아, ‘냉온정수시스템’이나 ‘냉온정수기’가 아니므로, 이 사건 제1항, 제9항 정정발명의 특허권을 침해하는 제품이 아니라고 판단하였다. 6 실시자 항변 등","slides":[{"label":"판시사항","text":"생략침해 대법원 2025. 5. 15. 선고 2022다265123 판결 대상제품이 청구항에 기재된 구성요소 중 일부만을 갖추고 나머지 구성요소가 결여된 경우, 원칙적으로 특허발명의 보호범위에 속하지 않는지 여부 (적극) / 청구항에 기재된 구성요소 중 일부를 중요하지 않다 는 이유로 무시하여 권리범위를 인정하는 것이 허용되는지 여부 (소극)"},{"label":"판결요지","text":"특허발명의 청구항을 복수의 구성요소로 구성한 경우에는, 그 구성요소가 유기적으로 결합한 전체로서의 기술사상을 보호하는 것이지, 각각의 구성요소를 독립하여 보호하는 것은 아니다. 특허권침해소송 상대방의 대상제품 등이 특허발명의 청구항에 기재된 구성요소들 중의 일부만을 갖추고 있고 나머지 구성요소가 없는 경우에는 원칙적으로 그 대상제품 등은 특허발명의 보호범위에 속하지 않는다(대법원 2017. 9. 26. 선고 2014다27425 판결 등 참조). 특허발명의 청구범위에 기재된 모든 구성요소는 중요하므로, 그중 일부를 권리행사의 단계에서 비교적 중요하지 않은 사항이라고 하여 무시하는 것은 사실상 청구범위의 확장적 변경을 사후에 인정하는 것이 되어 허용될 수 없다(대법원 2020. 7. 23. 선고 2019도9547 판결 등 참조). 원심은 판시와 같은 이유로, 이 사건 제1항, 제9항 정정발명의 청구범위에 기재된 ‘냉온정수시스템’, ‘냉온 정수기’는, 물건의 발명인 이 사건 제1항, 제9항 정정발명의 구성요소인데, 피고 제품 2는 온수에 관한 구성을 포함하고 있지 않아, ‘냉온정수시스템’이나 ‘냉온정수기’가 아니므로, 이 사건 제1항, 제9항 정정발명의 특허권을 침해하는 제품이 아니라고 판단하였다. 6 실시자 항변 등"}]},{"section":"특허침해 - 실시자 항변 등","question":"권리남용의 항변 – 특허발명의 진보성 흠결 대법원 2012. 1. 19. 선고 2010다95390 전원합의체판결 특허발명에 대한 무효심결 확정 전이라 하더라도 진보성이 부정되어 특허가 무효로 될 것이 명백한 경우, 판시 특허권에 기초한 침해금지 또는 손해배상 등 청구가 권리남용에 해당하는지 여부(원칙적 적극) 및 이 경 사항 우 특허권침해소송 담당 법원은 권리남용 항변의 당부를 판단하기 위한 전제로서 특허발명의 진보성 여부를 심리 판단할 수 있는지 여부(적극)","answer":"특허발명에 대한 무효심결이 확정되기 전이라고 하더라도 특허발명의 진보성이 부정되어 그 특허가 특허무효 심판에 의하여 무효로 될 것임이 명백한 경우에는 그 특허권에 기초한 침해금지 또는 손해배상 등의 청구는 특 별한 사정이 없는 한 권리남용에 해당하여 허용되지 아니한다고 보아야 하고, 특허권침해소송을 담당하는 법원 으로서도 특허권자의 그러한 청구가 권리남용에 해당한다는 항변이 있는 경우 그 당부를 살피기 위한 전제로서 특허발명의 진보성 여부에 대하여 심리 판단할 수 있다고 할 것이다.","slides":[{"label":"판시사항","text":"권리남용의 항변 – 특허발명의 진보성 흠결 대법원 2012. 1. 19. 선고 2010다95390 전원합의체판결 특허발명에 대한 무효심결 확정 전이라 하더라도 진보성이 부정되어 특허가 무효로 될 것이 명백한 경우, 판시 특허권에 기초한 침해금지 또는 손해배상 등 청구가 권리남용에 해당하는지 여부(원칙적 적극) 및 이 경 사항 우 특허권침해소송 담당 법원은 권리남용 항변의 당부를 판단하기 위한 전제로서 특허발명의 진보성 여부를 심리 판단할 수 있는지 여부(적극)"},{"label":"판결요지","text":"특허발명에 대한 무효심결이 확정되기 전이라고 하더라도 특허발명의 진보성이 부정되어 그 특허가 특허무효 심판에 의하여 무효로 될 것임이 명백한 경우에는 그 특허권에 기초한 침해금지 또는 손해배상 등의 청구는 특 별한 사정이 없는 한 권리남용에 해당하여 허용되지 아니한다고 보아야 하고, 특허권침해소송을 담당하는 법원 으로서도 특허권자의 그러한 청구가 권리남용에 해당한다는 항변이 있는 경우 그 당부를 살피기 위한 전제로서 특허발명의 진보성 여부에 대하여 심리 판단할 수 있다고 할 것이다."}]},{"section":"특허침해 - 실시자 항변 등","question":"권리범위 부정의 항변 – 특허발명의 진보성 흠결 (권리범위확인심판 사건) 대법원 2014. 3. 20. 선고 2012후4162 전원합의체 판결 판시 특허법 또는 실용신안법이 규정하고 있는 권리범위확인심판에서 특허발명 또는 등록실용신안의 진보성 사항 여부를 심리 판단할 수 있는지 여부(소극)","answer":"나아가 특허법이 규정하고 있는 권리범위확인심판은 심판청구인이 그 청구에서 심판의 대상으로 삼은 확인대상발명이 특허권의 효력이 미치는 객관적인 범위에 속하는지 여부를 확인하는 목적을 가진 절차이므로, 그 절차에서 특허발명의 진보성 여부까지 판단하는 것은 특허법이 권리범위확인심판 제도를 두고 있는 목적 을 벗어나고 그 제도의 본질에 맞지 않다. 특허법이 심판이라는 동일한 절차 안에 권리범위확인심판과 는 별도로 특허무효심판을 규정하여 특허발명의 진보성 여부가 문제 되는 경우 특허무효심판에서 이에 관하여 심리하여 진보성이 부정되면 그 특허를 무효로 하도록 하고 있음에도 진보성 여부를 권리범위확인심판 에서까지 판단할 수 있게 하는 것은 본래 특허무효심판의 기능에 속하는 것을 권리범위확인심판에 부여함으 로써 특허무효심판의 기능을 상당 부분 약화시킬 우려가 있다는 점에서도 바람직하지 않다. 따라서 권리범 위확인심판에서는 특허발명의 진보성이 부정된다는 이유로 그 권리범위를 부정하여서는 안 된다. 다만 대법원은 특허의 일부 또는 전부가 출원 당시 공지공용의 것인 경우까지 특허청구범위에 기재되어 있 다는 이유만으로 권리범위를 인정하여 독점적 배타적인 실시권을 부여할 수는 없으므로 권리범위확인심판 에서도 특허무효의 심결 유무에 관계없이 그 권리범위를 부정할 수 있다고 보고 있으나, 이러한 법리를 공지공용의 것이 아니라 그 기술분야에서 통상의 지식을 가진 자가 선행기술에 의하여 용이하게 발명할 수 있 는 것뿐이어서 진보성이 부정되는 경우까지 확장할 수는 없다.","slides":[{"label":"판시사항","text":"권리범위 부정의 항변 – 특허발명의 진보성 흠결 (권리범위확인심판 사건) 대법원 2014. 3. 20. 선고 2012후4162 전원합의체 판결 판시 특허법 또는 실용신안법이 규정하고 있는 권리범위확인심판에서 특허발명 또는 등록실용신안의 진보성 사항 여부를 심리 판단할 수 있는지 여부(소극)"},{"label":"판결요지","text":"나아가 특허법이 규정하고 있는 권리범위확인심판은 심판청구인이 그 청구에서 심판의 대상으로 삼은 확인대상발명이 특허권의 효력이 미치는 객관적인 범위에 속하는지 여부를 확인하는 목적을 가진 절차이므로, 그 절차에서 특허발명의 진보성 여부까지 판단하는 것은 특허법이 권리범위확인심판 제도를 두고 있는 목적 을 벗어나고 그 제도의 본질에 맞지 않다. 특허법이 심판이라는 동일한 절차 안에 권리범위확인심판과 는 별도로 특허무효심판을 규정하여 특허발명의 진보성 여부가 문제 되는 경우 특허무효심판에서 이에 관하여 심리하여 진보성이 부정되면 그 특허를 무효로 하도록 하고 있음에도 진보성 여부를 권리범위확인심판 에서까지 판단할 수 있게 하는 것은 본래 특허무효심판의 기능에 속하는 것을 권리범위확인심판에 부여함으 로써 특허무효심판의 기능을 상당 부분 약화시킬 우려가 있다는 점에서도 바람직하지 않다. 따라서 권리범 위확인심판에서는 특허발명의 진보성이 부정된다는 이유로 그 권리범위를 부정하여서는 안 된다. 다만 대법원은 특허의 일부 또는 전부가 출원 당시 공지공용의 것인 경우까지 특허청구범위에 기재되어 있 다는 이유만으로 권리범위를 인정하여 독점적 배타적인 실시권을 부여할 수는 없으므로 권리범위확인심판 에서도 특허무효의 심결 유무에 관계없이 그 권리범위를 부정할 수 있다고 보고 있으나, 이러한 법리를 공지공용의 것이 아니라 그 기술분야에서 통상의 지식을 가진 자가 선행기술에 의하여 용이하게 발명할 수 있 는 것뿐이어서 진보성이 부정되는 경우까지 확장할 수는 없다."}]},{"section":"특허침해 - 실시자 항변 등","question":"자유실시기술 항변 - 침해태양의 구분 여부 대법원 2017. 11. 14. 선고 2016후366 판결 권리범위 확인심판에서 확인대상 발명이 이른바 자유실시기술인 경우 특허발명과 대비할 필요 없이 특허발명의 권리범위에 속하지 않는다고 보아야 하는지 여부(적극) 및 확인대상 발명이 이른바 문언 침해에 해당하는 경우에도 이러한 자유실시기술 법리가 적용되는지 여부(적극)","answer":"자유실시기술 법리의 본질, 기능, 대비하는 대상 등에 비추어 볼 때, 위 법리는 특허권 침해 여부를 판단할 때 일반적으로 적용되는 것으로, 확인대상 발명이 결과적으로 특허발명의 청구범위에 나타난 모든 구성요소와 그 유기적 결합관계를 그대로 가지고 있는 이른바 문언 침해(literal infringement)에 해당하는 경우에도 그 대로 적용된다.","slides":[{"label":"판시사항","text":"자유실시기술 항변 - 침해태양의 구분 여부 대법원 2017. 11. 14. 선고 2016후366 판결 권리범위 확인심판에서 확인대상 발명이 이른바 자유실시기술인 경우 특허발명과 대비할 필요 없이 특허발명의 권리범위에 속하지 않는다고 보아야 하는지 여부(적극) 및 확인대상 발명이 이른바 문언 침해에 해당하는 경우에도 이러한 자유실시기술 법리가 적용되는지 여부(적극)"},{"label":"판결요지","text":"자유실시기술 법리의 본질, 기능, 대비하는 대상 등에 비추어 볼 때, 위 법리는 특허권 침해 여부를 판단할 때 일반적으로 적용되는 것으로, 확인대상 발명이 결과적으로 특허발명의 청구범위에 나타난 모든 구성요소와 그 유기적 결합관계를 그대로 가지고 있는 이른바 문언 침해(literal infringement)에 해당하는 경우에도 그 대로 적용된다."}]},{"section":"특허침해 - 실시자 항변 등","question":"자유실시기술 항변 - 공지예외주장과의 충돌 대법원 2025. 6. 26. 선고 2023후11562 판결 판시 구 특허법 제30조 제1항에서 정한 공지예외 규정을 적용받아 특허를 받은 특허발명의 경우, 확인대상 발 사항 명이 그 특허권의 권리범위에 속하는지 판단할 때 자유실시기술 주장이 허용되는지 여부(소극)","answer":"구 특허법(2011. 12. 2. 법률 제11117호로 개정되기 전의 것) 제30조 제1항에서 정한 공지예외 규정의 문언과 내용, 입법 취지, 자유실시기술 법리의 본질 및 기능 등을 종합하여 보면, 공지예외 규정을 적용받아 특허를 받은 특허발명의 경우 확인대상 발명이 그 특허권의 권리범위에 속하는지를 판단할 때에는 자유실시 기술 주장 즉, ‘발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)이 공지예외 규정의 적용 근거가 된 공지기술로부터 확인대상 발명을 쉽게 실시할 수 있어 확인대상 발명이 특허권의 권리범위에 속하지 않는다’는 주장은 허용되지 않는다고 보아야 한다.","slides":[{"label":"판시사항","text":"자유실시기술 항변 - 공지예외주장과의 충돌 대법원 2025. 6. 26. 선고 2023후11562 판결 판시 구 특허법 제30조 제1항에서 정한 공지예외 규정을 적용받아 특허를 받은 특허발명의 경우, 확인대상 발 사항 명이 그 특허권의 권리범위에 속하는지 판단할 때 자유실시기술 주장이 허용되는지 여부(소극)"},{"label":"판결요지","text":"구 특허법(2011. 12. 2. 법률 제11117호로 개정되기 전의 것) 제30조 제1항에서 정한 공지예외 규정의 문언과 내용, 입법 취지, 자유실시기술 법리의 본질 및 기능 등을 종합하여 보면, 공지예외 규정을 적용받아 특허를 받은 특허발명의 경우 확인대상 발명이 그 특허권의 권리범위에 속하는지를 판단할 때에는 자유실시 기술 주장 즉, ‘발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)이 공지예외 규정의 적용 근거가 된 공지기술로부터 확인대상 발명을 쉽게 실시할 수 있어 확인대상 발명이 특허권의 권리범위에 속하지 않는다’는 주장은 허용되지 않는다고 보아야 한다."}]},{"section":"특허침해 - 실시자 항변 등","question":"자유실시기술 항변의 판단대상 대법원 2008. 7. 10. 선고 2008후64 판결 판시 권리범위확인 심판청구의 대상이 되는 확인대상고안의 진보성을 판단할 경우 등록실용신안의 실용신안 사항 등록 청구범위에 기재된 구성과 대비하는 방법","answer":"권리범위확인 심판청구의 대상이 되는 확인대상고안이 공지의 기술만으로 이루어지거나 그 기술분야에 서 통상의 지식을 가진 자가 공지기술로부터 극히 용이하게 실시할 수 있는지 여부를 판단할 때에는, 확인대상고안을 등록실용신안의 실용신안등록청구범위에 기재된 구성과 대응되는 구성으로 한정하여 파악할 것은 아니고, 심판청구인이 특정한 확인대상고안의 구성 전체를 가지고 그 해당 여부를 판단하여야 한다.","slides":[{"label":"판시사항","text":"자유실시기술 항변의 판단대상 대법원 2008. 7. 10. 선고 2008후64 판결 판시 권리범위확인 심판청구의 대상이 되는 확인대상고안의 진보성을 판단할 경우 등록실용신안의 실용신안 사항 등록 청구범위에 기재된 구성과 대비하는 방법"},{"label":"판결요지","text":"권리범위확인 심판청구의 대상이 되는 확인대상고안이 공지의 기술만으로 이루어지거나 그 기술분야에 서 통상의 지식을 가진 자가 공지기술로부터 극히 용이하게 실시할 수 있는지 여부를 판단할 때에는, 확인대상고안을 등록실용신안의 실용신안등록청구범위에 기재된 구성과 대응되는 구성으로 한정하여 파악할 것은 아니고, 심판청구인이 특정한 확인대상고안의 구성 전체를 가지고 그 해당 여부를 판단하여야 한다."}]},{"section":"특허침해 - 실시자 항변 등","question":"의식적 제외이론 - 청구범위 감축 대법원 2017. 4. 26. 선고 2014후638 판결 특허발명의 출원과정에서 어떤 구성이 청구범위에서 의식적으로 제외된 것인지 판단하는 방법 및 이러한 법리가 청구범위의 감축 없이 의견서 제출 등을 통한 의견진술이 있었던 경우에도 마찬가지로 적용되는 지 여부(적극)","answer":"특허발명의 출원과정에서 어떤 구성이 청구범위에서 의식적으로 제외된 것인지 여부는 명세서뿐만 아니 라 출원에서부터 특허될 때까지 특허청 심사관이 제시한 견해 및 출원인이 출원과정에서 제출한 보정서와 의견서 등에 나타난 출원인의 의도, 보정이유 등을 참작하여 판단하여야 한다. 따라서 출원과정에서 청구범위의 감축이 이루어졌다는 사정만으로 감축 전의 구성과 감축 후의 구성을 비교 하여 그 사이에 존재하는 모든 구성이 청구범위에서 의식적으로 제외되었다고 단정할 것은 아니고, 거절이 유통지에 제시된 선행기술을 회피하기 위한 의도로 그 선행기술에 나타난 구성을 배제하는 감축을 한 경우 등과 같이 보정이유를 포함하여 출원과정에 드러난 여러 사정을 종합하여 볼 때 출원인이 어떤 구성 을 권리범위에서 제외하려는 의사가 존재한다고 볼 수 있을 때에 이를 인정할 수 있다. 그리고 이러한 법리 는 청구범위의 감축 없이 의견서 제출 등을 통한 의견진술이 있었던 경우에도 마찬가지로 적용된다.","slides":[{"label":"판시사항","text":"의식적 제외이론 - 청구범위 감축 대법원 2017. 4. 26. 선고 2014후638 판결 특허발명의 출원과정에서 어떤 구성이 청구범위에서 의식적으로 제외된 것인지 판단하는 방법 및 이러한 법리가 청구범위의 감축 없이 의견서 제출 등을 통한 의견진술이 있었던 경우에도 마찬가지로 적용되는 지 여부(적극)"},{"label":"판결요지","text":"특허발명의 출원과정에서 어떤 구성이 청구범위에서 의식적으로 제외된 것인지 여부는 명세서뿐만 아니 라 출원에서부터 특허될 때까지 특허청 심사관이 제시한 견해 및 출원인이 출원과정에서 제출한 보정서와 의견서 등에 나타난 출원인의 의도, 보정이유 등을 참작하여 판단하여야 한다. 따라서 출원과정에서 청구범위의 감축이 이루어졌다는 사정만으로 감축 전의 구성과 감축 후의 구성을 비교 하여 그 사이에 존재하는 모든 구성이 청구범위에서 의식적으로 제외되었다고 단정할 것은 아니고, 거절이 유통지에 제시된 선행기술을 회피하기 위한 의도로 그 선행기술에 나타난 구성을 배제하는 감축을 한 경우 등과 같이 보정이유를 포함하여 출원과정에 드러난 여러 사정을 종합하여 볼 때 출원인이 어떤 구성 을 권리범위에서 제외하려는 의사가 존재한다고 볼 수 있을 때에 이를 인정할 수 있다. 그리고 이러한 법리 는 청구범위의 감축 없이 의견서 제출 등을 통한 의견진술이 있었던 경우에도 마찬가지로 적용된다."}]},{"section":"특허침해 - 실시자 항변 등","question":"연구 또는 시험을 하기 위한 특허발명의 실시행위 대법원 2025. 5. 15. 선고 2025다202970 판결 [5] 특허권자 등의 독점적 배타적 이익을 불합리하게 훼손하지 않으면서 특허발명을 연구 또는 시험하기 위 해 그 특허발명을 실시하는 경우, 특허법 제96조 제1항 제1호에 따라 특허권의 효력이 미치지 않는지 여부 (적극)","answer":"특허법 제96조 제1항 제1호는 특허권의 효력이 미치지 않는 특허발명 실시의 요건으로 그 실시의 목적이 연구 또는 시험일 것을 정하고 있을 뿐이다. 다만 이는 누구든지 특허발명을 연구 또는 시험하여 그 내용을 확인 검증하고 더욱 개량된 발명을 이어나갈 수 있도록 특허권의 효력을 제한함으로써 특허법이 추구하는 ‘발명의 보호’와 ‘발명의 이용 도모’ 사이에 조화와 균형을 이루기 위한 규정이므로, 위 규정의 적용 여부를 판단할 때에는 업으로서 특허발명을 실시할 권리를 독점하는 특허권자 등의 정당한 이익도 함께 고려할 필요 가 있다. 이와 같은 규정의 문언과 취지 등을 종합하면, 특허권자 등의 독점적 배타적 이익을 불합리하게 훼손하지 않으면서 특허발명을 연구 또는 시험하기 위해 그 특허발명을 실시하는 행위에는 특허법 제96조 제1항 제1 호가 적용되어 특허권의 효력이 미치지 않는다.","slides":[{"label":"판시사항","text":"연구 또는 시험을 하기 위한 특허발명의 실시행위 대법원 2025. 5. 15. 선고 2025다202970 판결"},{"label":"판시사항","text":"[5] 특허권자 등의 독점적 배타적 이익을 불합리하게 훼손하지 않으면서 특허발명을 연구 또는 시험하기 위 해 그 특허발명을 실시하는 경우, 특허법 제96조 제1항 제1호에 따라 특허권의 효력이 미치지 않는지 여부 (적극)"},{"label":"판결요지","text":"특허법 제96조 제1항 제1호는 특허권의 효력이 미치지 않는 특허발명 실시의 요건으로 그 실시의 목적이 연구 또는 시험일 것을 정하고 있을 뿐이다. 다만 이는 누구든지 특허발명을 연구 또는 시험하여 그 내용을 확인 검증하고 더욱 개량된 발명을 이어나갈 수 있도록 특허권의 효력을 제한함으로써 특허법이 추구하는 ‘발명의 보호’와 ‘발명의 이용 도모’ 사이에 조화와 균형을 이루기 위한 규정이므로, 위 규정의 적용 여부를 판단할 때에는 업으로서 특허발명을 실시할 권리를 독점하는 특허권자 등의 정당한 이익도 함께 고려할 필요 가 있다. 이와 같은 규정의 문언과 취지 등을 종합하면, 특허권자 등의 독점적 배타적 이익을 불합리하게 훼손하지 않으면서 특허발명을 연구 또는 시험하기 위해 그 특허발명을 실시하는 행위에는 특허법 제96조 제1항 제1 호가 적용되어 특허권의 효력이 미치지 않는다."}]},{"section":"특허침해 - 실시자 항변 등","question":"권리소진 이론 – 발명을 실질적으로 구현한 제품 대법원 2019. 1. 31. 선고 2017다289903 판결 [1] ‘물건을 생산하는 방법의 발명’을 포함한 ‘방법의 발명’에 대한 특허권자 등이 우리나라에서 특허방법의 사용에 쓰이는 물건을 적법하게 양도한 경우로서 물건이 위 방법의 발명을 실질적으로 구현한 경우, 양수인 등이 그 물건을 이용하여 위 방법의 발명을 실시하는 행위에 대하여 특허권의 효력이 미치는지 여부(소극) [2] 어떤 물건이 ‘물건을 생산하는 방법의 발명’을 포함한 ‘방법의 발명’을 실질적으로 구현한 것인지 판단하 는 기준","answer":"‘물건을 생산하는 방법의 발명’을 포함한 ‘방법의 발명’(이하 통틀어 ‘방법발명’이라고 한다)에 대한 특허권자 등이 우리나라에서 그 특허방법의 사용에 쓰이는 물건을 적법하게 양도한 경우로서 그 물건이 방법발명을 실질적으로 구현한 것이라면, 방법발명의 특허권은 이미 목적을 달성하여 소진되었으므로, 양수인 등이 그 물 건을 이용하여 방법발명을 실시하는 행위에 대하여 특허권의 효력이 미치지 않는다. ... 어떤 물건이 방법발명을 실질적으로 구현한 것인지 여부는 사회통념상 인정되는 그 물건의 본래 용도가 방법발명의 실시뿐이고 다른 용도는 없는지 여부, 그 물건에 방법발명의 특유한 해결수단이 기초하고 있는 기술사상 의 핵심에 해당하는 구성요소가 모두 포함되었는지 여부, 그 물건을 통해서 이루어지는 공정이 방법발명의 전 체 공정에서 차지하는 비중 등 위의 각 요소들을 종합적으로 고려하여 사안에 따라 구체적 개별적으로 판단하여야 한다. 사회통념상 인정되는 물건의 본래 용도가 방법발명의 실시뿐이고 다른 용도는 없다고 하기 위해서는, 그 물건에 사회통념상 통용되고 승인될 수 있는 경제적, 상업적 또는 실용적인 다른 용도가 없어야 한다. 이와 달리 단순히 특허방법 이외의 다른 방법에 사용될 이론적, 실험적 또는 일시적 사용가능성이 있는 정도에 불과한 경우에는 그 용도는 사회통념상 인정되는 그 물건의 본래 용도라고 보기 어렵다. ","slides":[{"label":"판시사항","text":"권리소진 이론 – 발명을 실질적으로 구현한 제품 대법원 2019. 1. 31. 선고 2017다289903 판결"},{"label":"판시사항","text":"[1] ‘물건을 생산하는 방법의 발명’을 포함한 ‘방법의 발명’에 대한 특허권자 등이 우리나라에서 특허방법의 사용에 쓰이는 물건을 적법하게 양도한 경우로서 물건이 위 방법의 발명을 실질적으로 구현한 경우, 양수인 등이 그 물건을 이용하여 위 방법의 발명을 실시하는 행위에 대하여 특허권의 효력이 미치는지 여부(소극)"},{"label":"판시사항","text":"[2] 어떤 물건이 ‘물건을 생산하는 방법의 발명’을 포함한 ‘방법의 발명’을 실질적으로 구현한 것인지 판단하 는 기준"},{"label":"판결요지","text":"‘물건을 생산하는 방법의 발명’을 포함한 ‘방법의 발명’(이하 통틀어 ‘방법발명’이라고 한다)에 대한 특허권자 등이 우리나라에서 그 특허방법의 사용에 쓰이는 물건을 적법하게 양도한 경우로서 그 물건이 방법발명을 실질적으로 구현한 것이라면, 방법발명의 특허권은 이미 목적을 달성하여 소진되었으므로, 양수인 등이 그 물 건을 이용하여 방법발명을 실시하는 행위에 대하여 특허권의 효력이 미치지 않는다. ... 어떤 물건이 방법발명을 실질적으로 구현한 것인지 여부는 사회통념상 인정되는 그 물건의 본래 용도가 방법발명의 실시뿐이고 다른 용도는 없는지 여부, 그 물건에 방법발명의 특유한 해결수단이 기초하고 있는 기술사상 의 핵심에 해당하는 구성요소가 모두 포함되었는지 여부, 그 물건을 통해서 이루어지는 공정이 방법발명의 전 체 공정에서 차지하는 비중 등 위의 각 요소들을 종합적으로 고려하여 사안에 따라 구체적 개별적으로 판단하여야 한다. 사회통념상 인정되는 물건의 본래 용도가 방법발명의 실시뿐이고 다른 용도는 없다고 하기 위해서는, 그 물건에 사회통념상 통용되고 승인될 수 있는 경제적, 상업적 또는 실용적인 다른 용도가 없어야 한다. 이와 달리 단순히 특허방법 이외의 다른 방법에 사용될 이론적, 실험적 또는 일시적 사용가능성이 있는 정도에 불과한 경우에는 그 용도는 사회통념상 인정되는 그 물건의 본래 용도라고 보기 어렵다. 7 특허침해에 대한 조치 – 입증책임의 완화 등 부당 보전처분으로 인한 손해배상책임"}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"부당 보전처분으로 인한 손해배상책임 – 고의 또는 과실 추정의 번복 및 책임 제한 대법원 2023. 6. 1. 선고 2020다242935 판결 압류 가처분 등 보전처분의 집행 후 집행채권자가 본안소송에서 패소 확정된 경우, 보전처분의 집행으로 인하여 채무자가 입은 손해에 대하여 집행채권자에게 고의 또는 과실이 있다고 추정되는지 여부(원칙적 판시 적극) / 채권자가 가압류신청에서 진정한 채권액보다 지나치게 과다한 가액을 주장하여 그 가액대로 가압 사항 류 결정이 된 경우, 본안소송에서 피보전권리가 없는 것으로 확인된 부분의 범위 내에서 채권자의 고의 과실이 추정되는지 여부(적극) / 채권자에게 가압류 집행으로 인하여 채무자가 입은 손해의 전부를 배상 하게 하는 것이 공평의 이념에 반하는 경우, 채권자의 손해배상책임을 제한할 수 있는지 여부(적극)","answer":"보전처분의 집행 후 집행채권자가 본안소송에서 패소 확정되었다면 보전처분의 집행으로 인하여 채무자가 입은 손해에 대하여는 특별한 반증이 없는 한 집행채권자에게 고의 또는 과실이 있다고 추정되고, 따라서 집 행채권자는 보전처분의 부당한 집행으로 인한 손해에 대하여 채무자에게 이를 배상할 책임이 있다 채권자가 가압류신청에서 진정한 채권액보다 지나치게 과다한 가액을 주장하여 그 가액대로 가압류 결정이 된 후 본안소송에서 피보전권리가 없는 것으로 확인된 부분의 범위 내에서는 채권자의 고의 과실이 추정된다. . ... 보전처분과 본안소송에서 판단이 달라진 경위와 대상, 해당 판단 요소들의 사실적 법률적 성격, 판단의 난 이도, 당사자의 인식과 검토 여부 등 관여 정도를 비롯한 여러 사정에 비추어 채권자에게 가압류 집행으로 인 하여 채무자가 입은 손해의 전부를 배상하게 하는 것이 공평의 이념에 반하는 것으로 평가된다면 채권자의 손해배상책임을 제한할 수 있다.","slides":[{"label":"판시사항","text":"부당 보전처분으로 인한 손해배상책임 – 고의 또는 과실 추정의 번복 및 책임 제한 대법원 2023. 6. 1. 선고 2020다242935 판결 압류 가처분 등 보전처분의 집행 후 집행채권자가 본안소송에서 패소 확정된 경우, 보전처분의 집행으로 인하여 채무자가 입은 손해에 대하여 집행채권자에게 고의 또는 과실이 있다고 추정되는지 여부(원칙적 판시 적극) / 채권자가 가압류신청에서 진정한 채권액보다 지나치게 과다한 가액을 주장하여 그 가액대로 가압 사항 류 결정이 된 경우, 본안소송에서 피보전권리가 없는 것으로 확인된 부분의 범위 내에서 채권자의 고의 과실이 추정되는지 여부(적극) / 채권자에게 가압류 집행으로 인하여 채무자가 입은 손해의 전부를 배상 하게 하는 것이 공평의 이념에 반하는 경우, 채권자의 손해배상책임을 제한할 수 있는지 여부(적극)"},{"label":"판결요지","text":"보전처분의 집행 후 집행채권자가 본안소송에서 패소 확정되었다면 보전처분의 집행으로 인하여 채무자가 입은 손해에 대하여는 특별한 반증이 없는 한 집행채권자에게 고의 또는 과실이 있다고 추정되고, 따라서 집 행채권자는 보전처분의 부당한 집행으로 인한 손해에 대하여 채무자에게 이를 배상할 책임이 있다 채권자가 가압류신청에서 진정한 채권액보다 지나치게 과다한 가액을 주장하여 그 가액대로 가압류 결정이 된 후 본안소송에서 피보전권리가 없는 것으로 확인된 부분의 범위 내에서는 채권자의 고의 과실이 추정된다. . ... 보전처분과 본안소송에서 판단이 달라진 경위와 대상, 해당 판단 요소들의 사실적 법률적 성격, 판단의 난 이도, 당사자의 인식과 검토 여부 등 관여 정도를 비롯한 여러 사정에 비추어 채권자에게 가압류 집행으로 인 하여 채무자가 입은 손해의 전부를 배상하게 하는 것이 공평의 이념에 반하는 것으로 평가된다면 채권자의 손해배상책임을 제한할 수 있다."}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"침해대상제품의 구성요소에 대한 재판상 자백 대법원 2022. 1. 27. 선고 2019다277751(본소) 판결 특허침해소송에서 상대방이 제조하는 제품이 어떤 구성요소를 가지고 있는지가 재판상 자백의 대상이 될 수 있는지 여부(적극) 및 그 판단 기준 / 재판상 자백이 성립한 경우, 법원이 이에 배치되는 사실을 증거에 의하여 인정할 수 있는지 여부(소극)","answer":"특허침해소송에서 상대방이 제조하는 제품(이하 ‘침해대상제품’이라 한다)이 어떤 구성요소를 가지고 있 는지는 침해판단의 전제가 되는 주요사실로서 재판상 자백의 대상이 될 수 있다). “침해대상제품 등이 어떤 구성요소를 가지고 있다.”는 표현이 사실에 대한 진술인지, 아니면 그 구성요소가 특허발명의 구성요소와 동일 또는 균등하다는 법적 판단 내지 평가에 관한 진술인지는 당사자 진술의 구체적 내용과 경위, 변론의 진행 경 과 등을 종합적으로 고려하여 판단하여야 한다. 그리고 일단 재판상 자백이 성립하면 그것이 적법하게 취소 되지 않는 한 법원은 이에 구속되므로 법원은 자백과 배치되는 사실을 증거에 의하여 인정할 수 없다.","slides":[{"label":"판시사항","text":"침해대상제품의 구성요소에 대한 재판상 자백 대법원 2022. 1. 27. 선고 2019다277751(본소) 판결 특허침해소송에서 상대방이 제조하는 제품이 어떤 구성요소를 가지고 있는지가 재판상 자백의 대상이 될 수 있는지 여부(적극) 및 그 판단 기준 / 재판상 자백이 성립한 경우, 법원이 이에 배치되는 사실을 증거에 의하여 인정할 수 있는지 여부(소극)"},{"label":"판결요지","text":"특허침해소송에서 상대방이 제조하는 제품(이하 ‘침해대상제품’이라 한다)이 어떤 구성요소를 가지고 있 는지는 침해판단의 전제가 되는 주요사실로서 재판상 자백의 대상이 될 수 있다). “침해대상제품 등이 어떤 구성요소를 가지고 있다.”는 표현이 사실에 대한 진술인지, 아니면 그 구성요소가 특허발명의 구성요소와 동일 또는 균등하다는 법적 판단 내지 평가에 관한 진술인지는 당사자 진술의 구체적 내용과 경위, 변론의 진행 경 과 등을 종합적으로 고려하여 판단하여야 한다. 그리고 일단 재판상 자백이 성립하면 그것이 적법하게 취소 되지 않는 한 법원은 이에 구속되므로 법원은 자백과 배치되는 사실을 증거에 의하여 인정할 수 없다."}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"침해자의 양도행위에 대한 손해액의 산정 대법원 2006. 10. 13. 선고 2005다36830 판결 [1] 구 의장법 제64조 제1항 본문의 ‘단위수량당 이익액’의 의미 [3] 의장권 등의 침해로 인한 손해액의 추정에 관한 구 의장법 제64조 제1항 단서에 의하여 손해배상액을 감액할 수 있는 경우 및 위 단서를 원용하는 침해자가 주장 증명하여야 할 대상","answer":"여기서 말하는 단위수량당 이익액은 침해가 없었다면 의장권자가 판매할 수 있었을 것으로 보이는 의장권자 제품의 단위당 판매가액에서 그 증가되는 제품의 판매를 위하여 추가로 지출하였을 것으로 보이는 제품 단위당 비용을 공제한 금액을 말하는 것이다. ... 침해행위 외의 사유란 침해자의 시장개발 노력 판매망, 침해자의 상표, 광고 선전, 침해제품의 품질의 우수 성 등으로 인하여 의장권의 침해와 무관한 판매수량이 있는 경우를 말하는 것으로서, 의장권을 침해하지 않 으면서 의장권자의 제품과 시장에서 경쟁하는 경합제품이 있다는 사정이나 침해제품에 실용신안권이 실시 되고 있다는 사정 등이 그러한 사유에 포함될 수 있음은 물론이나, 위 단서를 적용하여 손해배상액의 감액을 주장하기 위하여 침해자로서는 그러한 사정으로 인하여 의장권자가 판매할 수 없었던 수량에 의한 금액에 대 해서까지 주장과 입증을 하여야 할 것이다. 손해액의 추정요건","slides":[{"label":"판시사항","text":"침해자의 양도행위에 대한 손해액의 산정 대법원 2006. 10. 13. 선고 2005다36830 판결"},{"label":"판시사항","text":"[1] 구 의장법 제64조 제1항 본문의 ‘단위수량당 이익액’의 의미"},{"label":"판시사항","text":"[3] 의장권 등의 침해로 인한 손해액의 추정에 관한 구 의장법 제64조 제1항 단서에 의하여 손해배상액을 감액할 수 있는 경우 및 위 단서를 원용하는 침해자가 주장 증명하여야 할 대상"},{"label":"판결요지","text":"여기서 말하는 단위수량당 이익액은 침해가 없었다면 의장권자가 판매할 수 있었을 것으로 보이는 의장권자 제품의 단위당 판매가액에서 그 증가되는 제품의 판매를 위하여 추가로 지출하였을 것으로 보이는 제품 단위당 비용을 공제한 금액을 말하는 것이다. ... 침해행위 외의 사유란 침해자의 시장개발 노력 판매망, 침해자의 상표, 광고 선전, 침해제품의 품질의 우수 성 등으로 인하여 의장권의 침해와 무관한 판매수량이 있는 경우를 말하는 것으로서, 의장권을 침해하지 않 으면서 의장권자의 제품과 시장에서 경쟁하는 경합제품이 있다는 사정이나 침해제품에 실용신안권이 실시 되고 있다는 사정 등이 그러한 사유에 포함될 수 있음은 물론이나, 위 단서를 적용하여 손해배상액의 감액을 주장하기 위하여 침해자로서는 그러한 사정으로 인하여 의장권자가 판매할 수 없었던 수량에 의한 금액에 대 해서까지 주장과 입증을 하여야 할 것이다. 손해액의 추정요건"}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"손해액의 추정요건 – 법적성질에 따른 손해의 발생 입증 요부 대법원 2006. 10. 12. 선고 2006다1831 판결 판시 특허권 등의 침해로 인한 손해액의 추정에 관한 특허법 제128조 제4항의 적용에 있어서 손해의 발생에 사항 관한 주장 증명의 정도","answer":"여기서 말하는 이익이란 침해자가 침해행위에 따라 얻게 된 것으로서 그 내용에 특별한 제한은 없으나, 이 규정은 특허권자에게 손해가 발생한 경우에 그 손해액을 평가하는 방법을 정한 것에 불과하여 침해행위에도 불구하고 특허권자에게 손해가 없는 경우에는 적용될 여지가 없으며, 다만 손해의 발생에 관한 주장 입증의 정도에 있어서는 위 규정의 취지에 비추어 경업관계 등으로 인하여 손해 발생의 염려 내지 개연성이 있음 을 주장 입증하는 것으로 족하다고 보아야 할 것이다.","slides":[{"label":"판시사항","text":"손해액의 추정요건 – 법적성질에 따른 손해의 발생 입증 요부 대법원 2006. 10. 12. 선고 2006다1831 판결 판시 특허권 등의 침해로 인한 손해액의 추정에 관한 특허법 제128조 제4항의 적용에 있어서 손해의 발생에 사항 관한 주장 증명의 정도"},{"label":"판결요지","text":"여기서 말하는 이익이란 침해자가 침해행위에 따라 얻게 된 것으로서 그 내용에 특별한 제한은 없으나, 이 규정은 특허권자에게 손해가 발생한 경우에 그 손해액을 평가하는 방법을 정한 것에 불과하여 침해행위에도 불구하고 특허권자에게 손해가 없는 경우에는 적용될 여지가 없으며, 다만 손해의 발생에 관한 주장 입증의 정도에 있어서는 위 규정의 취지에 비추어 경업관계 등으로 인하여 손해 발생의 염려 내지 개연성이 있음 을 주장 입증하는 것으로 족하다고 보아야 할 것이다."}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"손해액의 추정 – 침해자의 이익액 특허법원 2024. 10. 31. 선고 2023나11276 판결 침해자의 이익액을 한계이익 방식으로 산정할 수 있는지 여부 (적극) 및 침해제품의 제조 판매를 위하여 추가로 투입된 비용(변동비)에 대한 직접증거가 없다는 이유만으로, 특허법 제128조 제4항에 따른 침해 자의 이익액(한계이익)을 동종 업계의 통계상 한계이익률에 따라 산정하는 것이 허용되는지 여부 (적극)","answer":"침해자가 침해 제품을 생산한 후 이를 판매하여 이익을 얻게 된 경우 ‘침해자가 그 침해행위로 얻은 이익 액’은 특별한 사정이 없는 이상 침해제품의 총 판매수익에서 침해제품의 제조 판매를 위하여 추가로 투입된 비용을 공제한 한계이익에 의해 산정할 수 있다. 한계이익을 산정하기 위해서는 ‘침해제품의 총 판매수익’ 과 ‘침해제품의 제조 판매를 위하여 추가로 투입된 비용(변동비)’을 증거에 의해 인정한 다음 침해제품의 총 판매수익에서 침해제품의 제조 판매를 위하여 추가로 투입된 비용을 공제하는 방법으로 산정함이 원칙이 다. 다만 ‘침해제품의 제조 판매를 위하여 추가로 투입된 비용’을 직접적인 증거에 의해 산정하기 어렵다는 로 곧바로 특허법 제128조 제4항의 적용이 불가능하다고 속단하여서는 안 되고, 다른 증거와 변론 전체 의 취지를 종합하여 침해자가 실제로 얻은 한계이익이 동종 업계의 신뢰성 있는 통계에 의한 한계이익률을 적용하여 산출되는 것과 유사하거나 이를 초과할 여지가 있다는 점이 인정되는 경우에는, 침해 제품의 판매 수익에 통계에 의한 한계이익률을 곱하는 방법에 의해서도 침해자가 얻은 한계이익을 산정할 수 있다.","slides":[{"label":"판시사항","text":"손해액의 추정 – 침해자의 이익액 특허법원 2024. 10. 31. 선고 2023나11276 판결 침해자의 이익액을 한계이익 방식으로 산정할 수 있는지 여부 (적극) 및 침해제품의 제조 판매를 위하여 추가로 투입된 비용(변동비)에 대한 직접증거가 없다는 이유만으로, 특허법 제128조 제4항에 따른 침해 자의 이익액(한계이익)을 동종 업계의 통계상 한계이익률에 따라 산정하는 것이 허용되는지 여부 (적극)"},{"label":"판결요지","text":"침해자가 침해 제품을 생산한 후 이를 판매하여 이익을 얻게 된 경우 ‘침해자가 그 침해행위로 얻은 이익 액’은 특별한 사정이 없는 이상 침해제품의 총 판매수익에서 침해제품의 제조 판매를 위하여 추가로 투입된 비용을 공제한 한계이익에 의해 산정할 수 있다. 한계이익을 산정하기 위해서는 ‘침해제품의 총 판매수익’ 과 ‘침해제품의 제조 판매를 위하여 추가로 투입된 비용(변동비)’을 증거에 의해 인정한 다음 침해제품의 총 판매수익에서 침해제품의 제조 판매를 위하여 추가로 투입된 비용을 공제하는 방법으로 산정함이 원칙이 다. 다만 ‘침해제품의 제조 판매를 위하여 추가로 투입된 비용’을 직접적인 증거에 의해 산정하기 어렵다는 로 곧바로 특허법 제128조 제4항의 적용이 불가능하다고 속단하여서는 안 되고, 다른 증거와 변론 전체 의 취지를 종합하여 침해자가 실제로 얻은 한계이익이 동종 업계의 신뢰성 있는 통계에 의한 한계이익률을 적용하여 산출되는 것과 유사하거나 이를 초과할 여지가 있다는 점이 인정되는 경우에는, 침해 제품의 판매 수익에 통계에 의한 한계이익률을 곱하는 방법에 의해서도 침해자가 얻은 한계이익을 산정할 수 있다."}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"손해액의 추정 – 침해행위의 기여율 특허법원 2019. 8. 29. 선고 2018나1893 판결 판시 특허법 제128조 제4항의 손해배상액 산정에서 피고 실시제품의 판매이익에 대하여 특허발명의 기여율 사항 이 4%라고 본 사례 ‘침해자가 그 침해행위로 얻은 이익액’은 특별한 사정이 없는 이상 침해제품의 총 판매수익에서 침해제품의 제조 판매를 위하여 추가로 투입된 비용을 공제한 한계이익으로 산정된다.","answer":"한편, 특허발명의 실시 부분이 제품의 전부가 아니라 일부에 그치는 경우이거나 침해자가 침해한 특허기술 외에도 침해자의 자본, 영업능력, 상표, 기업신용, 제품의 품질, 디자인 등의 요소가 침해자의 판매이익의 발 생 및 증가에 기여한 것으로 인정되는 경우, 침해자가 그 물건을 생산 판매함으로써 얻은 이익 전체를 침해행 위에 의한 이익이라고 할 수는 없고, 침해자가 그 물건을 제작 판매함으로써 얻은 전체 이익에 대한 당해 특허권의 침해행위에 관계된 부분의 기여율을 산정하여 그에 따라 침해행위에 의한 이익액을 산출하여야 할 것 이다. 그러한 기여율은 침해자가 얻은 전체 이익에 대한 특허권의 침해에 관계된 부분의 불가결성, 중요성, 가격비율, 양적비율 등을 참작하여 종합적으로 평가할 수밖에 없다. 기여율을 산정함에 있어 특허발명의 실시 외에 침해자의 판매이익의 발생 및 증가에 기여한 요소 및 그와 같 은 요소가 기여한 정도에 관한 입증책임은 침해자에게 있다.","slides":[{"label":"판시사항","text":"손해액의 추정 – 침해행위의 기여율 특허법원 2019. 8. 29. 선고 2018나1893 판결 판시 특허법 제128조 제4항의 손해배상액 산정에서 피고 실시제품의 판매이익에 대하여 특허발명의 기여율 사항 이 4%라고 본 사례 ‘침해자가 그 침해행위로 얻은 이익액’은 특별한 사정이 없는 이상 침해제품의 총 판매수익에서 침해제품의 제조 판매를 위하여 추가로 투입된 비용을 공제한 한계이익으로 산정된다."},{"label":"판결요지","text":"한편, 특허발명의 실시 부분이 제품의 전부가 아니라 일부에 그치는 경우이거나 침해자가 침해한 특허기술 외에도 침해자의 자본, 영업능력, 상표, 기업신용, 제품의 품질, 디자인 등의 요소가 침해자의 판매이익의 발 생 및 증가에 기여한 것으로 인정되는 경우, 침해자가 그 물건을 생산 판매함으로써 얻은 이익 전체를 침해행 위에 의한 이익이라고 할 수는 없고, 침해자가 그 물건을 제작 판매함으로써 얻은 전체 이익에 대한 당해 특허권의 침해행위에 관계된 부분의 기여율을 산정하여 그에 따라 침해행위에 의한 이익액을 산출하여야 할 것 이다. 그러한 기여율은 침해자가 얻은 전체 이익에 대한 특허권의 침해에 관계된 부분의 불가결성, 중요성, 가격비율, 양적비율 등을 참작하여 종합적으로 평가할 수밖에 없다. 기여율을 산정함에 있어 특허발명의 실시 외에 침해자의 판매이익의 발생 및 증가에 기여한 요소 및 그와 같 은 요소가 기여한 정도에 관한 입증책임은 침해자에게 있다."}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"자유심증에 따른 상당 손해액의 인정 대법원 2006. 4. 27. 선고 2003다15006 판결 특허침해로 인한 손해액의 증명이 어려운 경우, 손해액의 산정 방법","answer":"특허침해로 손해가 발생된 것은 인정되나 특허침해의 규모를 알 수 있는 자료가 모두 폐기되어 그 손해액을 입증하기 위하여 필요한 사실을 입증하는 것이 어렵게 된 경우에는 특허법 제128조 제7항을 적용하여 상 당한 손해액을 결정할 수 있고, 이 경우에는 그 기간 동안의 침해자의 자본, 설비 등을 고려하여 평균적인 제조수량이나 판매수량을 가늠하여 이를 기초로 삼을 수 있다고 할 것이며, 특허침해가 이루어진 기간의 일 부에 대해서만 손해액을 입증하기 어려운 경우 반드시 손해액을 입증할 수 있는 기간에 대하여 채택된 손해 액 산정 방법이나 그와 유사한 방법으로만 상당한 손해액을 산정하여야만 하는 것은 아니고, 자유로이 합리 적인 방법을 채택하여 변론 전체의 취지와 증거조사의 결과에 기초하여 상당한 손해액을 산정할 수 있다.","slides":[{"label":"판시사항","text":"자유심증에 따른 상당 손해액의 인정 대법원 2006. 4. 27. 선고 2003다15006 판결 특허침해로 인한 손해액의 증명이 어려운 경우, 손해액의 산정 방법"},{"label":"판결요지","text":"특허침해로 손해가 발생된 것은 인정되나 특허침해의 규모를 알 수 있는 자료가 모두 폐기되어 그 손해액을 입증하기 위하여 필요한 사실을 입증하는 것이 어렵게 된 경우에는 특허법 제128조 제7항을 적용하여 상 당한 손해액을 결정할 수 있고, 이 경우에는 그 기간 동안의 침해자의 자본, 설비 등을 고려하여 평균적인 제조수량이나 판매수량을 가늠하여 이를 기초로 삼을 수 있다고 할 것이며, 특허침해가 이루어진 기간의 일 부에 대해서만 손해액을 입증하기 어려운 경우 반드시 손해액을 입증할 수 있는 기간에 대하여 채택된 손해 액 산정 방법이나 그와 유사한 방법으로만 상당한 손해액을 산정하여야만 하는 것은 아니고, 자유로이 합리 적인 방법을 채택하여 변론 전체의 취지와 증거조사의 결과에 기초하여 상당한 손해액을 산정할 수 있다."}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"자유심증에 따른 상당 손해액의 인정 대법원 2011. 5. 13. 선고 2010다58728 판결 판시 특허권 또는 전용실시권 침해에 관한 소송에서 손해 발생 사실은 인정되나 손해액을 증명하기가 곤란한 사항 경우, 특허법 제128조 제7항에 의한 구체적 손해액 산정 방법","answer":"이는 자유심증주의하에서 손해가 발생된 것은 인정되나 그 손해액을 입증하기 위하여 필요한 사실을 입증하 는 것이 해당 사실의 성질상 극히 곤란한 경우에는 증명도 심증도를 경감함으로써 손해의 공평 타당한 분담 을 지도원리로 하는 손해배상제도의 이상과 기능을 실현하고자 함에 그 취지가 있는 것이지, 법관에게 손해 액의 산정에 관한 자유재량을 부여한 것은 아니므로, 법원이 위와 같은 방법으로 구체적 손해액을 판단함 에 있어서는, 손해액 산정의 근거가 되는 간접사실들의 탐색에 최선의 노력을 다해야 하고, 그와 같이 탐색 해 낸 간접사실들을 합리적으로 평가하여 객관적으로 수긍할 수 있는 손해액을 산정해야 한다.","slides":[{"label":"판시사항","text":"자유심증에 따른 상당 손해액의 인정 대법원 2011. 5. 13. 선고 2010다58728 판결 판시 특허권 또는 전용실시권 침해에 관한 소송에서 손해 발생 사실은 인정되나 손해액을 증명하기가 곤란한 사항 경우, 특허법 제128조 제7항에 의한 구체적 손해액 산정 방법"},{"label":"판결요지","text":"이는 자유심증주의하에서 손해가 발생된 것은 인정되나 그 손해액을 입증하기 위하여 필요한 사실을 입증하 는 것이 해당 사실의 성질상 극히 곤란한 경우에는 증명도 심증도를 경감함으로써 손해의 공평 타당한 분담 을 지도원리로 하는 손해배상제도의 이상과 기능을 실현하고자 함에 그 취지가 있는 것이지, 법관에게 손해 액의 산정에 관한 자유재량을 부여한 것은 아니므로, 법원이 위와 같은 방법으로 구체적 손해액을 판단함 에 있어서는, 손해액 산정의 근거가 되는 간접사실들의 탐색에 최선의 노력을 다해야 하고, 그와 같이 탐색 해 낸 간접사실들을 합리적으로 평가하여 객관적으로 수긍할 수 있는 손해액을 산정해야 한다."}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"‘고의적’ 침해 및 증액배상 적용 여부 특허법원 2024. 10. 31. 선고 2023나11276 판결 구 특허법 부칙 제3조가 증액배상 규정의 적용요건으로서 ‘침해행위가 2019. 7. 9. 이후 최초로 개시될 것’을 요구하는 규정인지 여부 (소극) 및 구 특허법 제128조 제8항의 ‘고의적인 침해행위’에 미필적 고의 가 포함되고, 그 고의는 간접사실에 의하여도 인정할 수 있는지 여부 (적극)","answer":"나. 구 특허법 제128조 제8항에 의한 손해액의 산정 ... 부칙 제3조는 ‘제128조 제8항 및 제9항의 개정규정은 이 법 시행 후 최초로 위반행위가 발생한 경우부터 적용한다.’고 규정하고 있다. 위 부칙 규정은 그 문언만으로 볼 때에는① 구 특허법 제128조 제8, 9항의 시행일인 2019. 7. 9. 이후에 최초 침해행위가 있었던 경우에만 위 증액배상 규정이 적용되는 것으로, 즉 2019. 7. 9. 이전에 침해행위가 있었던 경우라면 위 시행일 이후에 침해행위가 계속되는 경우에도 증액배상 규정이 적용되지 않는 것으로 해석할 여지도 있고, ② 이와 달리 증액배상 규정의 시행이전과 이후에 걸쳐서 침해행위가 있었던 경우에 시행 이전의 침해행위에 대하여는 증액배상 규정이 적용되지 않고 시행 이후 최초 로 발생한 침해행위부터 증액배상 규정이 적용된다는 의미로 해석할 여지도 있다. 그런데 구 특허법 제 128조 제8, 9항의 입법취지 및 부칙 규정의 취지, 부칙 규정의 문언 내용 등을 종합하여 보았을 때, 위 부칙 규정은 위 해석론 ①과 같이 증액배상 규정이 적용되기 위한 침해행위의 성격(최초 침해행위일 것)을 한 정하는 규정이 아니라 위 해석론 ②와 같이 증액배상 규정이 적용되는 침해행위의 범위(시행 이후 최초로 발 생한 침해행위부터 적용)를 한정하는 규정으로 해석함이 타당하므로, 피고의 위 주장은 받아들일 수 없 다. ... 3) 고의적인 침해행위에 해당하는지 여부 가) 고의적인 침해행위의 의미 법원은 타인의 특허권 또는 전용실시권을 침해한 행위가 고의적인 것으로 인정되는 경우에는 특허법 제128조 제1항에도 불구하고 제2항부터 제7항까지의 규정에 따라 손해로 인정된 금액의 3배를 넘지 아니하는 범위에서 배상액을 정할 수 있다(구 특허법 제128조 제8항). 여기서 ‘특허권 또는 전용실시권 을 침해한 행위가 고의적인 것으로 인정되는 경우’라고 함은 침해자가 자신의 행위에 의하여 특허권 또는 전 용실시권 침해라는 결과가 발생하리라는 것을 알면서 침해행위를 하는 경우를 말하고, 여기에는 확정적 고의는 물론 미필적 고의도 포함된다. 그리고 이와 같은 내심의 의사는 이를 인정할 직접적인 증거가 없는 경 우에는 사물의 성질상 고의와 상당한 관련성이 있는 간접사실을 증명하는 방법에 의하여 입증할 수밖에 없 고, 무엇이 상당한 관련성이 있는 간접사실에 해당할 것인가는 사실관계의 연결상태를 논리와 경험칙에 의 하여 합리적으로 판단하여야 할 것이다(대법원 2001. 3. 9. 선고 2000다67020 판결 등 참조).","slides":[{"label":"판시사항","text":"‘고의적’ 침해 및 증액배상 적용 여부 특허법원 2024. 10. 31. 선고 2023나11276 판결 구 특허법 부칙 제3조가 증액배상 규정의 적용요건으로서 ‘침해행위가 2019. 7. 9. 이후 최초로 개시될 것’을 요구하는 규정인지 여부 (소극) 및 구 특허법 제128조 제8항의 ‘고의적인 침해행위’에 미필적 고의 가 포함되고, 그 고의는 간접사실에 의하여도 인정할 수 있는지 여부 (적극)"},{"label":"판결요지","text":"나. 구 특허법 제128조 제8항에 의한 손해액의 산정 ... 부칙 제3조는 ‘제128조 제8항 및 제9항의 개정규정은 이 법 시행 후 최초로 위반행위가 발생한 경우부터 적용한다.’고 규정하고 있다. 위 부칙 규정은 그 문언만으로 볼 때에는① 구 특허법 제128조 제8, 9항의 시행일인 2019. 7. 9. 이후에 최초 침해행위가 있었던 경우에만 위 증액배상 규정이 적용되는 것으로, 즉 2019. 7. 9. 이전에 침해행위가 있었던 경우라면 위 시행일 이후에 침해행위가 계속되는 경우에도 증액배상 규정이 적용되지 않는 것으로 해석할 여지도 있고, ② 이와 달리 증액배상 규정의 시행이전과 이후에 걸쳐서 침해행위가 있었던 경우에 시행 이전의 침해행위에 대하여는 증액배상 규정이 적용되지 않고 시행 이후 최초 로 발생한 침해행위부터 증액배상 규정이 적용된다는 의미로 해석할 여지도 있다. 그런데 구 특허법 제 128조 제8, 9항의 입법취지 및 부칙 규정의 취지, 부칙 규정의 문언 내용 등을 종합하여 보았을 때, 위 부칙 규정은 위 해석론 ①과 같이 증액배상 규정이 적용되기 위한 침해행위의 성격(최초 침해행위일 것)을 한 정하는 규정이 아니라 위 해석론 ②와 같이 증액배상 규정이 적용되는 침해행위의 범위(시행 이후 최초로 발 생한 침해행위부터 적용)를 한정하는 규정으로 해석함이 타당하므로, 피고의 위 주장은 받아들일 수 없 다. ... 3) 고의적인 침해행위에 해당하는지 여부 가) 고의적인 침해행위의 의미 법원은 타인의 특허권 또는 전용실시권을 침해한 행위가 고의적인 것으로 인정되는 경우에는 특허법 제128조 제1항에도 불구하고 제2항부터 제7항까지의 규정에 따라 손해로 인정된 금액의 3배를 넘지 아니하는 범위에서 배상액을 정할 수 있다(구 특허법 제128조 제8항). 여기서 ‘특허권 또는 전용실시권 을 침해한 행위가 고의적인 것으로 인정되는 경우’라고 함은 침해자가 자신의 행위에 의하여 특허권 또는 전 용실시권 침해라는 결과가 발생하리라는 것을 알면서 침해행위를 하는 경우를 말하고, 여기에는 확정적 고의는 물론 미필적 고의도 포함된다. 그리고 이와 같은 내심의 의사는 이를 인정할 직접적인 증거가 없는 경 우에는 사물의 성질상 고의와 상당한 관련성이 있는 간접사실을 증명하는 방법에 의하여 입증할 수밖에 없 고, 무엇이 상당한 관련성이 있는 간접사실에 해당할 것인가는 사실관계의 연결상태를 논리와 경험칙에 의 하여 합리적으로 판단하여야 할 것이다(대법원 2001. 3. 9. 선고 2000다67020 판결 등 참조)."}]},{"section":"특허침해 - 특허침해에 대한 조치 – 입증책임의 완화 등","question":"과실의 추정 및 복멸 대법원 2006. 4. 27. 선고 2003다15006 판결 판시 특허법 제130조의 규정 취지 및 타인의 특허발명을 허락 없이 실시한 자가 과실의 추정을 벗어나기 위하 사항 여 주장 증명하여야 할 사항","answer":"위 규정에도 불구하고 타인의 특허발명을 허락 없이 실시한 자에게 과실이 없다고 하기 위해서는 특허권의 존재를 알지 못하였다는 점을 정당화할 수 있는 사정이 있다거나 자신이 실시하는 기술이 특허발명의 권리범 위에 속하지 않는다고 믿은 점을 정당화할 수 있는 사정이 있다는 것을 주장 입증하여야 할 것이다.","slides":[{"label":"판시사항","text":"과실의 추정 및 복멸 대법원 2006. 4. 27. 선고 2003다15006 판결 판시 특허법 제130조의 규정 취지 및 타인의 특허발명을 허락 없이 실시한 자가 과실의 추정을 벗어나기 위하 사항 여 주장 증명하여야 할 사항"},{"label":"판결요지","text":"위 규정에도 불구하고 타인의 특허발명을 허락 없이 실시한 자에게 과실이 없다고 하기 위해서는 특허권의 존재를 알지 못하였다는 점을 정당화할 수 있는 사정이 있다거나 자신이 실시하는 기술이 특허발명의 권리범 위에 속하지 않는다고 믿은 점을 정당화할 수 있는 사정이 있다는 것을 주장 입증하여야 할 것이다."}]},{"section":"특유쟁점 - 특유발명","question":"의약용도발명의 성립성 및 발명의 설명 기재요건 대법원 2001. 11. 30. 선고 2001후65 판결 [1] 의약의 용도발명에 관한 특허출원 명세서에 있어서 약리효과의 기재 정도 및 최초 명세서에 약리효과 판시 의 시험예의 기재가 없던 것을 추후 보정하는 것이 명세서의 요지를 변경한 것인지 여부(적극) 사항 [2] 의약의 용도발명에 관한 출원발명의 명세서에 개별적 화합물에 대한 약리효과를 확인하는 구체적 실 험결과를 추가하는 보정이 명세서의 요지를 변경한 것에 해당한다고 한 사례","answer":"특히 약리효과의 기재가 요구되는 의약의 용도발명에 있어서는 그 출원 전에 명세서 기재의 약리효과를 나 타내는 약리기전이 명확히 밝혀진 경우와 같은 특별한 사정이 있지 않은 이상 특정 물질에 그와 같은 약리효과가 있다는 것을 약리데이터 등이 나타난 시험예로 기재하거나 또는 이에 대신할 수 있을 정도로 구체적으로 기재하여야만 비로소 발명이 완성되었다고 볼 수 있는 동시에 명세서의 기재요건을 충족하였다고 볼 수 있을 것이며, 이와 같이 시험예의 기재가 필요함에도 불구하고 최초 명세서에 그 기재가 없던 것을 추후 보정에 의하여 보완하는 것은 명세서에 기재된 사항의 범위를 벗어난 것으로서 명세서의 요지를 변경한 것이라 할 것이다.","slides":[{"label":"판시사항","text":"의약용도발명의 성립성 및 발명의 설명 기재요건 대법원 2001. 11. 30. 선고 2001후65 판결"},{"label":"판시사항","text":"[1] 의약의 용도발명에 관한 특허출원 명세서에 있어서 약리효과의 기재 정도 및 최초 명세서에 약리효과 판시 의 시험예의 기재가 없던 것을 추후 보정하는 것이 명세서의 요지를 변경한 것인지 여부(적극) 사항"},{"label":"판시사항","text":"[2] 의약의 용도발명에 관한 출원발명의 명세서에 개별적 화합물에 대한 약리효과를 확인하는 구체적 실 험결과를 추가하는 보정이 명세서의 요지를 변경한 것에 해당한다고 한 사례"},{"label":"판결요지","text":"특히 약리효과의 기재가 요구되는 의약의 용도발명에 있어서는 그 출원 전에 명세서 기재의 약리효과를 나 타내는 약리기전이 명확히 밝혀진 경우와 같은 특별한 사정이 있지 않은 이상 특정 물질에 그와 같은 약리효과가 있다는 것을 약리데이터 등이 나타난 시험예로 기재하거나 또는 이에 대신할 수 있을 정도로 구체적으로 기재하여야만 비로소 발명이 완성되었다고 볼 수 있는 동시에 명세서의 기재요건을 충족하였다고 볼 수 있을 것이며, 이와 같이 시험예의 기재가 필요함에도 불구하고 최초 명세서에 그 기재가 없던 것을 추후 보정에 의하여 보완하는 것은 명세서에 기재된 사항의 범위를 벗어난 것으로서 명세서의 요지를 변경한 것이라 할 것이다."}]},{"section":"특유쟁점 - 특유발명","question":"의약용도발명의 발명의 설명 기재요건 대법원 2015. 4. 23. 선고 2013후730,2015후727 판결 약리효과의 기재가 요구되는 의약의 용도발명에서 특허출원 명세서의 기재 정도","answer":"약리효과의 기재가 요구되는 의약의 용도발명에서는 그 출원 전에 명세서 기재의 약리효과를 나타내는 약리 기전이 명확히 밝혀진 경우와 같은 특별한 사정이 없다면 특정 물질에 그와 같은 약리효과가 있다는 것을 약 리데이터 등이 나타난 시험례로 기재하거나 또는 이에 대신할 수 있을 정도로 구체적으로 기재하여야만 명세 서의 기재요건을 충족하였다고 볼 수 있다 ... 그러나 약리효과의 기재가 요구되는 의약의 용도발명에서 약리데이터 등이 나타난 시험례 또는 이에 대신 할 수 있을 정도의 구체적인 사항의 기재가 필요함에도 최초 명세서에 그 기재가 없었다면, 이를 보완하는 보정은 명세서에 기재된 사항의 범위를 벗어나는 것으로 되어 허용되지 아니하므로, 위와 같은 명세서의 기재 요건 위반은 보정에 의하여 해소될 수 있는 기재불비 사유가 아니다.","slides":[{"label":"판시사항","text":"의약용도발명의 발명의 설명 기재요건 대법원 2015. 4. 23. 선고 2013후730,2015후727 판결 약리효과의 기재가 요구되는 의약의 용도발명에서 특허출원 명세서의 기재 정도"},{"label":"판결요지","text":"약리효과의 기재가 요구되는 의약의 용도발명에서는 그 출원 전에 명세서 기재의 약리효과를 나타내는 약리 기전이 명확히 밝혀진 경우와 같은 특별한 사정이 없다면 특정 물질에 그와 같은 약리효과가 있다는 것을 약 리데이터 등이 나타난 시험례로 기재하거나 또는 이에 대신할 수 있을 정도로 구체적으로 기재하여야만 명세 서의 기재요건을 충족하였다고 볼 수 있다 ... 그러나 약리효과의 기재가 요구되는 의약의 용도발명에서 약리데이터 등이 나타난 시험례 또는 이에 대신 할 수 있을 정도의 구체적인 사항의 기재가 필요함에도 최초 명세서에 그 기재가 없었다면, 이를 보완하는 보정은 명세서에 기재된 사항의 범위를 벗어나는 것으로 되어 허용되지 아니하므로, 위와 같은 명세서의 기재 요건 위반은 보정에 의하여 해소될 수 있는 기재불비 사유가 아니다."}]},{"section":"특유쟁점 - 특유발명","question":"의약용도발명의 청구범위 기재요건 대법원 2009. 1. 30. 선고 2006후3564 판결 판시 특정 물질의 의약용도가 약리기전만으로 기재된 경우에도 특허법 제42조 제4항 제2호에 정한 청구항의 사항 명확성 요건을 충족하는 것으로 볼 수 있는지 여부(한정 적극)","answer":"의약의 용도발명에 있어서는 특정 물질이 가지고 있는 의약의 용도가 발명의 구성요건에 해당하므로, 발명 의 특허청구범위에는 특정 물질의 의약용도를 대상 질병 또는 약효로 명확히 기재하는 것이 원칙이나, 특정 물질의 의약용도가 약리기전만으로 기재되어 있다 하더라도 발명의 상세한 설명 등 명세서의 다른 기재나 기술상식에 의하여 의약으로서의 구체적인 용도를 명확하게 파악할 수 있는 경우에는 특허법 제42조 제4항 제 2호에 정해진 청구항의 명확성 요건을 충족하는 것으로 볼 수 있다.","slides":[{"label":"판시사항","text":"의약용도발명의 청구범위 기재요건 대법원 2009. 1. 30. 선고 2006후3564 판결 판시 특정 물질의 의약용도가 약리기전만으로 기재된 경우에도 특허법 제42조 제4항 제2호에 정한 청구항의 사항 명확성 요건을 충족하는 것으로 볼 수 있는지 여부(한정 적극)"},{"label":"판결요지","text":"의약의 용도발명에 있어서는 특정 물질이 가지고 있는 의약의 용도가 발명의 구성요건에 해당하므로, 발명 의 특허청구범위에는 특정 물질의 의약용도를 대상 질병 또는 약효로 명확히 기재하는 것이 원칙이나, 특정 물질의 의약용도가 약리기전만으로 기재되어 있다 하더라도 발명의 상세한 설명 등 명세서의 다른 기재나 기술상식에 의하여 의약으로서의 구체적인 용도를 명확하게 파악할 수 있는 경우에는 특허법 제42조 제4항 제 2호에 정해진 청구항의 명확성 요건을 충족하는 것으로 볼 수 있다."}]},{"section":"특유쟁점 - 특유발명","question":"의약용도발명의 신규성 특허법원 2020. 2. 7. 선고 2019허4147 판결 판시 임상시험 계획(protocol)의 공개만으로는 그 임상시험에 의한 발명의 신규성 진보성이 부정되지 않는 사항 다고 한 사례","answer":"용도와 관련한 이와 같은 정도의 기재는 단지 그 용도에 효과가 있는지를 장차 확인하겠다는 것에 지나지 않 아 통상의 기술자가 그 용도와 관련한 약리효과를 객관적으로 확인할 수 있을 정도로 구체적으로 개시하고 있는 경우에 해당한다고 할 수 없다.","slides":[{"label":"판시사항","text":"의약용도발명의 신규성 특허법원 2020. 2. 7. 선고 2019허4147 판결 판시 임상시험 계획(protocol)의 공개만으  확인대상발명이 공지기술로 부터 용이하게 실시할 수 있는지를 판단할 때에도 마찬가지로 적용되는지 여부(적극)","answer":"의약이라는 물건의 발명에서 대상 질병 또는 약효와 함께 투여용법과 투여용량을 부가하는 경우에 이 러한 투여용법과 투여용량은 의료행위 그 자체가 아니라 의약이라는 물건이 효능을 온전하게 발휘하도록 하 는 속성을 표현함으로써 의약이라는 물건에 새로운 의미를 부여하는 구성요소가 될 수 있다고 보아야 하고, 이와 같은 투여용법과 투여용량이라는 새로운 의약용도가 부가되어 신규성과 진보성 등의 특허요건을 갖춘 의약에 대해서는 새롭게 특허권이 부여될 수 있다. 이러한 법리는 권리범위확인심판에서 심판청구인이 심판의 대상으로 삼은 확인대상발명이 공지기술로 부터 용이하게 실시할 수 있는지를 판단할 때에도 마찬가지로 적용된다.","slides":[{"label":"판시사항","text":"투여용량 용법의 특허대상성 대법원 2015. 5. 21. 선고 2014후768 전원합의체판결 의약이라는 물건의 발명에서 대상 질병 또는 약효와 함께 투여용법과 투여용량을 부가하는 경우, 투여용 법과 투여용량이 발명의 구성요소인지 여부(적극) 및 투여용법과 투여용량이라는 새로운 의약용도가 부 가되어 신규성과 진보성 등의 특허요건을 갖춘 의약에 대해서 새롭게 특허권이 부여될 수 있는지 여부(적 극) / 이 법리가 권리범위확인심판에서 심판청구인이 심판의 대상으로 삼은 확인대상발명이 공지기술로 부터 용이하게 실시할 수 있는지를 판단할 때에도 마찬가지로 적용되는지 여부(적극)"},{"label":"판결요지","text":"의약이라는 물건의 발명에서 대상 질병 또는 약효와 함께 투여용법과 투여용량을 부가하는 경우에 이 러한 투여용법과 투여용량은 의료행위 그 자체가 아니라 의약이라는 물건이 효능을 온전하게 발휘하도록 하 는 속성을 표현함으로써 의약이라는 물건에 새로운 의미를 부여하는 구성요소가 될 수 있다고 보아야 하고, 이와 같은 투여용법과 투여용량이라는 새로운 의약용도가 부가되어 신규성과 진보성 등의 특허요건을 갖춘 의약에 대해서는 새롭게 특허권이 부여될 수 있다. 이러한 법리는 권리범위확인심판에서 심판청구인이 심판의 대상으로 삼은 확인대상발명이 공지기술로 부터 용이하게 실시할 수 있는지를 판단할 때에도 마찬가지로 적용된다."}]},{"section":"특유쟁점 - 특유발명","question":"투여용량 용법의 진보성 판단 대법원 2017. 8. 29. 선고 2014후2702 판결 특정한 투여용법과 투여용량에 관한 의약용도발명의 진보성이 인정되기 위한 요건","answer":"의약개발 과정에서는 약효증대 및 효율적인 투여방법 등의 기술적 과제를 해결하기 위하여 적절한 투여용법 과 투여용량을 찾아내려는 노력이 통상적으로 행하여지고 있으므로 특정한 투여용법과 투여용량에 관한 용 도발명의 진보성이 부정되지 않기 위해서는 출원 당시의 기술수준이나 공지기술 등에 비추어 그 발명이 속하 는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)이 예측할 수 없는 현저하거나 이질 적인 효과가 인정되어야 한다.","slides":[{"label":"판시사항","text":"투여용량 용법의 진보성 판단 대법원 2017. 8. 29. 선고 2014후2702 판결 특정한 투여용법과 투여용량에 관한 의약용도발명의 진보성이 인정되기 위한 요건"},{"label":"판결요지","text":"의약개발 과정에서는 약효증대 및 효율적인 투여방법 등의 기술적 과제를 해결하기 위하여 적절한 투여용법 과 투여용량을 찾아내려는 노력이 통상적으로 행하여지고 있으므로 특정한 투여용법과 투여용량에 관한 용 도발명의 진보성이 부정되지 않기 위해서는 출원 당시의 기술수준이나 공지기술 등에 비추어 그 발명이 속하 는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)이 예측할 수 없는 현저하거나 이질 적인 효과가 인정되어야 한다."}]},{"section":"특유쟁점 - 특유발명","question":"선택발명의 신규성 – 구체적 개시 대법원 2009. 10. 15. 선고 2008후736,743 판결 선택발명의 신규성을 부정하기 위한 요건","answer":"선행 또는 공지의 발명에 구성요건이 상위개념으로 기재되어 있고 위 상위개념에 포함되는 하위개념 만을 구성요건 중의 전부 또는 일부로 하는 이른바 선택발명의 신규성을 부정하기 위해서는 선행발명이 선택발명을 구성하는 하위개념을 구체적으로 개시하고 있어야 하고, 이에는 선행발명을 기재한 선행문헌에 선택발명에 대한 문언적인 기재가 존재하는 경우 외에도 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자가 선행문헌의 기재 내용과 출원시의 기술 상식에 기초하여 선행문헌으로부터 직접적으로 선택발명의 존 재를 인식할 수 있는 경우도 포함된다.","slides":[{"label":"판시사항","text":"선택발명의 신규성 – 구체적 개시 대법원 2009. 10. 15. 선고 2008후736,743 판결 선택발명의 신규성을 부정하기 위한 요건"},{"label":"판결요지","text":"선행 또는 공지의 발명에 구성요건이 상위개념으로 기재되어 있고 위 상위개념에 포함되는 하위개념 만을 구성요건 중의 전부 또는 일부로 하는 이른바 선택발명의 신규성을 부정하기 위해서는 선행발명이 선택발명을 구성하는 하위개념을 구체적으로 개시하고 있어야 하고, 이에는 선행발명을 기재한 선행문헌에 선택발명에 대한 문언적인 기재가 존재하는 경우 외에도 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자가 선행문헌의 기재 내용과 출원시의 기술 상식에 기초하여 선행문헌으로부터 직접적으로 선택발명의 존 재를 인식할 수 있는 경우도 포함된다."}]},{"section":"특유쟁점 - 특유발명","question":"선택발명의 진보성 및 ‘효과’의 인정 대법원 2021. 4. 8. 선고 2019후10609 판결 [1] 특허발명의 진보성 유무를 판단하는 기준 및 위 판단 기준은 선행 또는 공지의 발명에 기재된 상위개 념에 포함되는 하위개념만을 구성요소의 전부 또는 일부로 하는 특허발명의 진보성을 판단할 때에도 마 찬가지로 적용되는지 여부(적극) [2] 선행발명에 이른바 마쿠쉬(Markush) 형식으로 기재된 화학식과 그 치환기의 범위 내에 이론상 포함 되기는 하나 구체적으로 개시되지 않은 화합물을 청구범위로 하는 특허발명의 경우, 진보성을 판단할 때 구성의 곤란성을 따져 보아야 하는지 여부(적극) 및 그 방법 [3] 특허발명의 진보성을 판단할 때 그 발명이 갖는 특유한 효과도 함께 고려하여야 하는지 여부(적극) / 구성의 곤란성 여부 판단이 불분명한 경우라도 특허발명이 선행발명에 비하여 이질적이거나 양적으로 현 저한 효과를 가지고 있다면 진보성이 부정되지 않는지 여부(적극)","answer":"위와 같은 진보성 판단기준은 선행 또는 공지의 발명에 상위개념이 기재되어 있고 위 상위개념에 포함되는 하 위개념만을 구성요소의 전부 또는 일부로 하는 특허발명의 진보성을 판단할 때에도 마찬가지로 적용되어야 한다. 선행발명에 특허발명의 상위개념이 공지되어 있는 경우에도 구성의 곤란성이 인정되면 진보성이 부정되지 않 는다. 선행발명에 발명을 이루는 구성요소 중 일부를 두 개 이상의 치환기로 하나 이상 선택할 수 있도록 기재 하는 이른바 마쿠쉬(Markush) 형식으로 기재된 화학식과 그 치환기의 범위 내에 이론상 포함되기만 할 뿐 구 체적으로 개시되지 않은 화합물을 청구범위로 하는 특허발명의 경우에도 진보성 판단을 위하여 구성의 곤란 성을 따져보아야 한다. 위와 같은 특허발명의 구성의 곤란성을 판단할 때에는 선행발명에 마쿠쉬 형식 등 으로 기재된 화학식과 그 치환기의 범위 내에 이론상 포함될 수 있는 화합물의 개수, 통상의 기술자가 선행발명에 마쿠쉬 형식 등으로 기재된 화합물 중에서 특정한 화합물이나 특정 치환기를 우선적으로 또는 쉽게 선택 할 사정이나 동기 또는 암시의 유무, 선행발명에 구체적으로 기재된 화합물과 특허발명의 구조적 유사성 등을 종합적으로 고려하여야 한다 ... 발명의 효과가 선행발명에 비하여 현저하다면 구성의 곤란성을 추론하는 유력한 자료가 될 것이다. 나아가 구성의 곤란성 여부의 판단이 불분명한 경우라고 하더라도, 특허발명이 선행발명에 비하여 이질적이거나 양적으로 현저한 효과를 가지고 있다면 진보성이 부정되지 않는다. 효과의 현저성은 특허발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심으로 판단하여야 하고, 만일 그 효과가 의심스러 울 때에는 그 기재내용의 범위를 넘지 않는 한도에서 출원일 이후에 추가적인 실험 자료를 제출하는 등의 방법 으로 그 효과를 구체적으로 주장․증명하는 것이 허용된다.","slides":[{"label":"판시사항","text":"선택발명의 진보성 및 ‘효과’의 인정 대법원 2021. 4. 8. 선고 2019후10609 판결"},{"label":"판시사항","text":"[1] 특허발명의 진보성 유무를 판단하는 기준 및 위 판단 기준은 선행 또는 공지의 발명에 기재된 상위개 념에 포함되는 하위개념만을 구성요소의 전부 또는 일부로 하는 특허발명의 진보성을 판단할 때에도 마 찬가지로 적용되는지 여부(적극)"},{"label":"판시사항","text":"[2] 선행발명에 이른바 마쿠쉬(Markush) 형식으로 기재된 화학식과 그 치환기의 범위 내에 이론상 포함 되기는 하나 구체적으로 개시되지 않은 화합물을 청구범위로 하는 특허발명의 경우, 진보성을 판단할 때 구성의 곤란성을 따져 보아야 하는지 여부(적극) 및 그 방법"},{"label":"판시사항","text":"[3] 특허발명의 진보성을 판단할 때 그 발명이 갖는 특유한 효과도 함께 고려하여야 하는지 여부(적극) / 구성의 곤란성 여부 판단이 불분명한 경우라도 특허발명이 선행발명에 비하여 이질적이거나 양적으로 현 저한 효과를 가지고 있다면 진보성이 부정되지 않는지 여부(적극)"},{"label":"판결요지","text":"위와 같은 진보성 판단기준은 선행 또는 공지의 발명에 상위개념이 기재되어 있고 위 상위개념에 포함되는 하 위개념만을 구성요소의 전부 또는 일부로 하는 특허발명의 진보성을 판단할 때에도 마찬가지로 적용되어야 한다. 선행발명에 특허발명의 상위개념이 공지되어 있는 경우에도 구성의 곤란성이 인정되면 진보성이 부정되지 않 는다. 선행발명에 발명을 이루는 구성요소 중 일부를 두 개 이상의 치환기로 하나 이상 선택할 수 있도록 기재 하는 이른바 마쿠쉬(Markush) 형식으로 기재된 화학식과 그 치환기의 범위 내에 이론상 포함되기만 할 뿐 구 체적으로 개시되지 않은 화합물을 청구범위로 하는 특허발명의 경우에도 진보성 판단을 위하여 구성의 곤란 성을 따져보아야 한다. 위와 같은 특허발명의 구성의 곤란성을 판단할 때에는 선행발명에 마쿠쉬 형식 등 으로 기재된 화학식과 그 치환기의 범위 내에 이론상 포함될 수 있는 화합물의 개수, 통상의 기술자가 선행발명에 마쿠쉬 형식 등으로 기재된 화합물 중에서 특정한 화합물이나 특정 치환기를 우선적으로 또는 쉽게 선택 할 사정이나 동기 또는 암시의 유무, 선행발명에 구체적으로 기재된 화합물과 특허발명의 구조적 유사성 등을 종합적으로 고려하여야 한다 ... 발명의 효과가 선행발명에 비하여 현저하다면 구성의 곤란성을 추론하는 유력한 자료가 될 것이다. 나아가 구성의 곤란성 여부의 판단이 불분명한 경우라고 하더라도, 특허발명이 선행발명에 비하여 이질적이거나 양적으로 현저한 효과를 가지고 있다면 진보성이 부정되지 않는다. 효과의 현저성은 특허발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심으로 판단하여야 하고, 만일 그 효과가 의심스러 울 때에는 그 기재내용의 범위를 넘지 않는 한도에서 출원일 이후에 추가적인 실험 자료를 제출하는 등의 방법 으로 그 효과를 구체적으로 주장․증명하는 것이 허용된다."}]},{"section":"특유쟁점 - 특유발명","question":"수치한정발명의 신규성 대법원 2013. 5. 24. 선고 2011후2015 판결 판시 구성요소의 범위를 수치로써 한정하여 표현한 발명이 그 출원 전에 공지된 발명과 수치한정의 유무 또는 사항 범위에서만 차이가 있는 경우, 발명의 신규성 판단 기준","answer":"구성요소의 범위를 수치로써 한정하여 표현한 발명이 그 출원 전에 공지된 발명과 사이에 수치한정의 유무 또는 범위에서만 차이가 있는 경우에는, 그 한정된 수치범위가 공지된 발명에 구체적으로 개시되어 있거나, 그렇지 않더라도 그러한 수치한정이 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자(이하 ‘통상의 기술자’라고 한다)가 적절히 선택할 수 있는 주지 관용의 수단에 불과하고 이에 따른 새로운 효과도 발생하지 않는다면 그 신규성이 부정된다. 그리고 한정된 수치범위가 공지된 발명에 구체적으로 개시되어 있다는 것에는, 그 수치범위 내의 수치가 공지된 발명을 기재한 선행문헌의 실시 예 등에 나타나 있는 경우 등과 같 이 문언적인 기재가 존재하는 경우 외에도 통상의 기술자가 선행문헌의 기재 내용과 출원 시의 기술상식에 기초하여 선행문헌으로부터 직접적으로 그 수치범위를 인식할 수 있는 경우도 포함된다. 한편 수치한정이 공지된 발명과는 상이한 과제를 달성하기 위한 기술수단으로서의 의의를 가지고 그 효과도 이질적인 경우나 공지된 발명과 비교하여 한정된 수치범위 내외에서 현저한 효과의 차이가 생기는 경우 등에 는, 그 수치범위가 공지된 발명에 구체적으로 개시되어 있다고 할 수 없음은 물론, 그 수치한정이 통상의 기술자가 적절히 선택할 수 있는 주지 관용의 수단에 불과하다고 볼 수도 없다.","slides":[{"label":"판시사항","text":"수치한정발명의 신규성 대법원 2013. 5. 24. 선고 2011후2015 판결 판시 구성요소의 범위를 수치로써 한정하여 표현한 발명이 그 출원 전에 공지된 발명과 수치한정의 유무 또는 사항 범위에서만 차이가 있는 경우, 발명의 신규성 판단 기준"},{"label":"판결요지","text":"구성요소의 범위를 수치로써 한정하여 표현한 발명이 그 출원 전에 공지된 발명과 사이에 수치한정의 유무 또는 범위에서만 차이가 있는 경우에는, 그 한정된 수치범위가 공지된 발명에 구체적으로 개시되어 있거나, 그렇지 않더라도 그러한 수치한정이 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자(이하 ‘통상의 기술자’라고 한다)가 적절히 선택할 수 있는 주지 관용의 수단에 불과하고 이에 따른 새로운 효과도 발생하지 않는다면 그 신규성이 부정된다. 그리고 한정된 수치범위가 공지된 발명에 구체적으로 개시되어 있다는 것에는, 그 수치범위 내의 수치가 공지된 발명을 기재한 선행문헌의 실시 예 등에 나타나 있는 경우 등과 같 이 문언적인 기재가 존재하는 경우 외에도 통상의 기술자가 선행문헌의 기재 내용과 출원 시의 기술상식에 기초하여 선행문헌으로부터 직접적으로 그 수치범위를 인식할 수 있는 경우도 포함된다. 한편 수치한정이 공지된 발명과는 상이한 과제를 달성하기 위한 기술수단으로서의 의의를 가지고 그 효과도 이질적인 경우나 공지된 발명과 비교하여 한정된 수치범위 내외에서 현저한 효과의 차이가 생기는 경우 등에 는, 그 수치범위가 공지된 발명에 구체적으로 개시되어 있다고 할 수 없음은 물론, 그 수치한정이 통상의 기술자가 적절히 선택할 수 있는 주지 관용의 수단에 불과하다고 볼 수도 없다."}]},{"section":"특유쟁점 - 특유발명","question":"수치한정발명의 진보성 대법원 2023. 7. 13. 선고 2022후10180 판결 발명이 공지된 발명의 구성요소의 범위를 수치한정하여 표현한 경우 진보성의 판단 기준","answer":"어떠한 특허발명이 그 출원 전에 공지된 발명이 가지는 구성요소의 범위를 수치로써 한정하여 표현한 경우에 는 그 특허발명에 진보성을 인정할 수 있는 다른 구성요소가 부가되어 있어서 그 특허발명에서의 수치한정 이 보충적인 사항에 불과한 것이 아닌 이상, 그 특허발명이 그 기술분야에서 통상의 지식을 가진 사람(이 하 ‘통상의 기술자’라 한다)이 통상적이고 반복적인 실험을 통하여 적절히 선택할 수 있는 정도의 단순한 수 치한정으로서, 공지된 발명과 비교하여 이질적인 효과나 한정된 수치범위 내외에서 현저한 효과 차이가 생 기지 않는 것이라면 진보성이 부정된다.","slides":[{"label":"판시사항","text":"수치한정발명의 진보성 대법원 2023. 7. 13. 선고 2022후10180 판결 발명이 공지된 발명의 구성요소의 범위를 수치한정하여 표현한 경우 진보성의 판단 기준"},{"label":"판결요지","text":"어떠한 특허발명이 그 출원 전에 공지된 발명이 가지는 구성요소의 범위를 수치로써 한정하여 표현한 경우에 는 그 특허발명에 진보성을 인정할 수 있는 다른 구성요소가 부가되어 있어서 그 특허발명에서의 수치한정 이 보충적인 사항에 불과한 것이 아닌 이상, 그 특허발명이 그 기술분야에서 통상의 지식을 가진 사람(이 하 ‘통상의 기술자’라 한다)이 통상적이고 반복적인 실험을 통하여 적절히 선택할 수 있는 정도의 단순한 수 치한정으로서, 공지된 발명과 비교하여 이질적인 효과나 한정된 수치범위 내외에서 현저한 효과 차이가 생 기지 않는 것이라면 진보성이 부정된다."}]},{"section":"특유쟁점 - 특유발명","question":"수치한정발명의 진보성 – 임계적 의의 요부 대법원 2010. 8. 19. 선고 2008후4998 판결 발명이 공지된 발명의 구성요소의 범위를 수치한정하여 표현한 경우 진보성의 판단 기준","answer":"특허등록된 발명이 그 출원 전에 공지된 발명이 가지는 구성요소의 범위를 수치로써 한정하여 표현한 경우에 있어, 그 특허발명의 과제 및 효과가 공지된 발명의 연장선상에 있고 수치한정의 유무에서만 차이가 있는 경우에는 그 한정된 수치범위 내외에서 현저한 효과의 차이가 생기지 않는다면 그 특허발명은 그 기술분야 에서 통상의 지식을 가진 자(이하 ‘통상의 기술자’라 한다)가 통상적이고 반복적인 실험을 통하여 적절히 선택할 수 있는 정도의 단순한 수치한정에 불과하여 진보성이 부정된다. 다만, 그 특허발명에 진보성을 인정할 수 있는 다른 구성요소가 부가되어 있어서 그 특허발명에서의 수치한 정이 보충적인 사항에 불과하거나, 수치한정을 제외한 양 발명의 구성이 동일하더라도 그 수치한정이 공지 된 발명과는 상이한 과제를 달성하기 위한 기술수단으로서의 의의를 가지고 그 효과도 이질적인 경우라면, 수치한정의 임계적 의의가 없다고 하여 특허발명의 진보성이 부정되지 아니한다.","slides":[{"label":"판시사항","text":"수치한정발명의 진보성 – 임계적 의의 요부 대법원 2010. 8. 19. 선고 2008후4998 판결 발명이 공지된 발명의 구성요소의 범위를 수치한정하여 표현한 경우 진보성의 판단 기준"},{"label":"판결요지","text":"특허등록된 발명이 그 출원 전에 공지된 발명이 가지는 구성요소의 범위를 수치로써 한정하여 표현한 경우에 있어, 그 특허발명의 과제 및 효과가 공지된 발명의 연장선상에 있고 수치한정의 유무에서만 차이가 있는 경우에는 그 한정된 수치범위 내외에서 현저한 효과의 차이가 생기지 않는다면 그 특허발명은 그 기술분야 에서 통상의 지식을 가진 자(이하 ‘통상의 기술자’라 한다)가 통상적이고 반복적인 실험을 통하여 적절히 선택할 수 있는 정도의 단순한 수치한정에 불과하여 진보성이 부정된다. 다만, 그 특허발명에 진보성을 인정할 수 있는 다른 구성요소가 부가되어 있어서 그 특허발명에서의 수치한 정이 보충적인 사항에 불과하거나, 수치한정을 제외한 양 발명의 구성이 동일하더라도 그 수치한정이 공지 된 발명과는 상이한 과제를 달성하기 위한 기술수단으로서의 의의를 가지고 그 효과도 이질적인 경우라면, 수치한정의 임계적 의의가 없다고 하여 특허발명의 진보성이 부정되지 아니한다."}]},{"section":"특유쟁점 - 특유발명","question":"파라미터 발명의 신규성 및 진보성 대법원 2021. 12. 30. 선고 2017후1298 판결 이른바 ‘파라미터 발명’인 특허발명의 신규성과 진보성을 판단하는 기준","answer":"(1) 새롭게 창출한 물리적, 화학적, 생물학적 특성 값을 이용하거나 복수의 변수 사이의 상관관계를 이용하여 발명의 구성요소를 특정한 이른바 ‘파라미터 발명’과 이와 다른 성질 또는 특성 등에 의해 물건 또는 방법을 특정하고 있는 선행발명을 대비할 때, 특허발명의 청구범위에 기재된 성질 또는 특성이 다른 정의 또는 시험 측정방법에 의한 것으로 환산이 가능하여 환산해 본 결과 선행발명의 대응되는 것과 동일하거나 또는 특허발명의 명세서의 상세한 설명에 기재된 실시형태와 선행발명의 구체적 실시 형태가 동일한 경우에는, 달리 특 별한 사정이 없는 한 양 발명은 발명에 대한 기술적인 표현만 달리할 뿐 실질적으로는 동일한 것으로 보아야 할 것이므로, 이러한 특허발명은 신규성이 부정된다. 반면, 위와 같은 방법 등을 통하여 양 발명이 실질적으로 동일하다는 점이 증명되지 않으면, 신규성이 부정된다고 할 수 없다. (2) 파라미터 발명이 공지된 발명과 파라미터에 의해 한정된 구성에서만 차이가 있는 경우, 발명의 명세서 기재 및 출원 당시 통상의 기술자의 기술 수준을 종합하여 보았을 때 파라미터가 공지된 발명과는 상이한 과제 를 해결하기 위한 기술수단으로서의 의의를 가지고, 그로 인해 특유한 효과를 갖는다고 인정되는 경우에는 진보성이 부정되지 않는다. 한편, 파라미터의 도입 자체에 대하여는 위와 같은 기술적 의의를 인정할 수 없더 라도 발명이 새롭게 도입한 파라미터를 수치로 한정하는 형태를 취하고 있는 경우에는, 한정된 수치범위 내 외에서 현저한 효과의 차이가 생기거나, 그 수치한정이 공지된 발명과는 상이한 과제를 달성하기 위한 기술 수단으로서의 의의를 가지고 그 효과도 이질적인 경우라면, 진보성이 부정되지 않는다(.","slides":[{"label":"판시사항","text":"파라미터 발명의 신규성 및 진보성 대법원 2021. 12. 30. 선고 2017후1298 판결 이른바 ‘파라미터 발명’인 특허발명의 신규성과 진보성을 판단하는 기준"},{"label":"판결요지","text":"(1) 새롭게 창출한 물리적, 화학적, 생물학적 특성 값을 이용하거나 복수의 변수 사이의 상관관계를 이용하여 발명의 구성요소를 특정한 이른바 ‘파라미터 발명’과 이와 다른 성질 또는 특성 등에 의해 물건 또는 방법을 특정하고 있는 선행발명을 대비할 때, 특허발명의 청구범위에 기재된 성질 또는 특성이 다른 정의 또는 시험 측정방법에 의한 것으로 환산이 가능하여 환산해 본 결과 선행발명의 대응되는 것과 동일하거나 또는 특허발명의 명세서의 상세한 설명에 기재된 실시형태와 선행발명의 구체적 실시 형태가 동일한 경우에는, 달리 특 별한 사정이 없는 한 양 발명은 발명에 대한 기술적인 표현만 달리할 뿐 실질적으로는 동일한 것으로 보아야 할 것이므로, 이러한 특허발명은 신규성이 부정된다. 반면, 위와 같은 방법 등을 통하여 양 발명이 실질적으로 동일하다는 점이 증명되지 않으면, 신규성이 부정된다고 할 수 없다. (2) 파라미터 발명이 공지된 발명과 파라미터에 의해 한정된 구성에서만 차이가 있는 경우, 발명의 명세서 기재 및 출원 당시 통상의 기술자의 기술 수준을 종합하여 보았을 때 파라미터가 공지된 발명과는 상이한 과제 를 해결하기 위한 기술수단으로서의 의의를 가지고, 그로 인해 특유한 효과를 갖는다고 인정되는 경우에는 진보성이 부정되지 않는다. 한편, 파라미터의 도입 자체에 대하여는 위와 같은 기술적 의의를 인정할 수 없더 라도 발명이 새롭게 도입한 파라미터를 수치로 한정하는 형태를 취하고 있는 경우에는, 한정된 수치범위 내 외에서 현저한 효과의 차이가 생기거나, 그 수치한정이 공지된 발명과는 상이한 과제를 달성하기 위한 기술 수단으로서의 의의를 가지고 그 효과도 이질적인 경우라면, 진보성이 부정되지 않는다(."}]},{"section":"특유쟁점 - 특유발명","question":"파라미터 발명의 실시가능요건 (물건발명) 특허법원 2023. 2. 1. 선고 2020허7760 판결 판시 물건의 발명이 이른바 파라미터 발명에 해당하는 경우, 물건의 발명’에서 발명 ‘실시’의 의미 및 위 조항에 사항 서 정한 기재요건을 충족하는 경우","answer":"위와 같은 법 규정 및 법리는 성질 또는 특성 등에 의해 물(物)을 특정하는 기재를 포함하는 특허발명인 이 른바 파라미터 발명에도 마찬가지로 적용될 것인데, 발명자가 창작하거나 관용 파라미터를 새롭게 구성한 파라미터를 사용한 발명은 선행발명들을 찾기 어려워 신규성과 진보성을 쉽게 인정받을 수 있는 반면 발명가 외에는 파라미터의 기술적 의미를 쉽게 파악할 수 없고, 파라미터의 구현 조건을 맞추기가 쉽지 않아 재현이 어렵다. 따라서 파라미터 발명의 명세서 기재요건은 위와 같은 파라미터 발명의 고유한 특성을 감안하여 통 상의 기술자가 출원 시의 기술 수준으로 보아 과도한 실험이나 특수한 지식을 부가하지 아니하고서도 명세서 의 기재에 의하여 파라미터 발명의 구성과 효과와 관련된 사항을 명확히 이해하고 쉽게 재현할 수 있는지를 중심으로 판단되어야 할 것이다.","slides":[{"label":"판시사항","text":"파라미터 발명의 실시가능요건 (물건발명) 특허법원 2023. 2. 1. 선고 2020허7760 판결 판시 물건의 발명이 이른바 파라미터 발명에 해당하는 경우, 물건의 발명’에서 발명 ‘실시’의 의미 및 위 조항에 사항 서 정한 기재요건을 충족하는 경우"},{"label":"판결요지","text":"위와 같은 법 규정 및 법리는 성질 또는 특성 등에 의해 물(物)을 특정하는 기재를 포함하는 특허발명인 이 른바 파라미터 발명에도 마찬가지로 적용될 것인데, 발명자가 창작하거나 관용 파라미터를 새롭게 구성한 파라미터를 사용한 발명은 선행발명들을 찾기 어려워 신규성과 진보성을 쉽게 인정받을 수 있는 반면 발명가 외에는 파라미터의 기술적 의미를 쉽게 파악할 수 없고, 파라미터의 구현 조건을 맞추기가 쉽지 않아 재현이 어렵다. 따라서 파라미터 발명의 명세서 기재요건은 위와 같은 파라미터 발명의 고유한 특성을 감안하여 통 상의 기술자가 출원 시의 기술 수준으로 보아 과도한 실험이나 특수한 지식을 부가하지 아니하고서도 명세서 의 기재에 의하여 파라미터 발명의 구성과 효과와 관련된 사항을 명확히 이해하고 쉽게 재현할 수 있는지를 중심으로 판단되어야 할 것이다."}]},{"section":"특유쟁점 - 특유발명","question":"파라미터 발명의 실시가능요건 (제법발명) 대법원 2024. 1. 11. 선고 2020후10292 판결 물건을 생산하는 방법의 발명이 이른바 파라미터 발명에 해당하는 경우, 통상의 기술자가 특허출원 당시 판시 의 기술수준으로 보아 과도한 실험이나 특수한 지식을 부가하지 않고서는 발명의 설명에 기재된 사항에 사항 의하여 파라미터로 특정된 생산 방법을 사용할 수 없다면 특허법 제42조 제3항 제1호에서 정한 기재요건 을 충족하지 못한다고 보아야 하는지 여부(적극)","answer":"물건을 생산하는 방법의 발명이 새롭게 창출한 물리적, 화학적, 생물학적 특성값을 이용하거나 복수의 변 수 사이의 상관관계를 이용하여 발명의 구성요소를 특정한 파라미터 발명에 해당하는 경우, 파라미터의 정의나 기술적 의미, 특성값이나 변수의 측정방법 측정 조건 등 파라미터의 확인 수단 등을 고려할 때 통상의 기술자가 특허출원 당시의 기술수준으로 보아 과도한 실험이나 특수한 지식을 부가하지 않고서는 발명의 설명에 기재된 사항에 의하여 파라미터로 특정된 생산 방법을 사용할 수 없다면 특허법 제42조 제3항 제1호 에서 정한 기재요건을 충족하지 못한다고 보아야 한다.","slides":[{"label":"판시사항","text":"파라미터 발명의 실시가능요건 (제법발명) 대법원 2024. 1. 11. 선고 2020후10292 판결 물건을 생산하는 방법의 발명이 이른바 파라미터 발명에 해당하는 경우, 통상의 기술자가 특허출원 당시 판시 의 기술수준으로 보아 과도한 실험이나 특수한 지식을 부가하지 않고서는 발명의 설명에 기재된 사항에 사항 의하여 파라미터로 특정된 생산 방법을 사용할 수 없다면 특허법 제42조 제3항 제1호에서 정한 기재요건 을 충족하지 못한다고 보아야 하는지 여부(적극)"},{"label":"판결요지","text":"물건을 생산하는 방법의 발명이 새롭게 창출한 물리적, 화학적, 생물학적 특성값을 이용하거나 복수의 변 수 사이의 상관관계를 이용하여 발명의 구성요소를 특정한 파라미터 발명에 해당하는 경우, 파라미터의 정의나 기술적 의미, 특성값이나 변수의 측정방법 측정 조건 등 파라미터의 확인 수단 등을 고려할 때 통상의 기술자가 특허출원 당시의 기술수준으로 보아 과도한 실험이나 특수한 지식을 부가하지 않고서는 발명의 설명에 기재된 사항에 의하여 파라미터로 특정된 생산 방법을 사용할 수 없다면 특허법 제42조 제3항 제1호 에서 정한 기재요건을 충족하지 못한다고 보아야 한다."}]},{"section":"특유쟁점 - 특유발명","question":"결정형 발명의 진보성 및 ‘효과’의 인정 대법원 2022. 3. 31. 선고 2018후10923 판결 [2] 의약화합물 분야에서 선행발명에 공지된 화합물과 화학구조는 동일하지만 결정 형태가 다른 특정한 결정형의 화합물을 청구범위로 하는 이른바 결정형 발명의 진보성을 판단하는 경우, 다형체 스크리닝이 통상 행해지는 것이라는 이유만으로 결정형 발명의 구성의 곤란성이 부정된다고 단정할 수 있는지 여부 판시 (소극) / 결정형 발명과 같이 의약화합물 분야에 속하는 발명의 구성의 곤란성을 판단할 때 발명의 효과도 사항 함께 참작하여야 하는지 여부(적극) [3] 결정형 발명의 구성의 곤란성을 판단하는 방법 [4] 결정형 발명의 효과가 선행발명과 질적으로 다르거나 양적으로 현저한 차이가 있는 경우, 진보성이 인 정되는지 여부(적극) / 결정형 발명의 효과의 현저성을 판단하는 방법","answer":"의약화합물의 제제설계(製劑設計)를 위하여 그 화합물이 다양한 결정 형태 즉 결정다형(polymorph)을 가 지는지 등을 검토하는 다형체 스크리닝(polymorph screening)은 통상 행해지는 일이다. 의약화합물 분야 에서 선행발명에 공지된 화합물과 화학구조는 동일하지만 결정 형태가 다른 특정한 결정형의 화합물을 청구 범위로 하는 이른바 결정형 발명의 진보성을 판단할 때에는 이러한 특수성을 고려할 필요가 있다. 하지만 그 것만으로 결정형 발명의 구성의 곤란성이 부정된다고 단정할 수는 없다. 다형체 스크리닝이 통상 행해지는 실험이라는 것과 이를 통해 결정형 발명의 특정한 결정형에 쉽게 도달할 수 있는지는 별개의 문제이기 때문 이다. 한편 결정형 발명과 같이 의약화합물분야에 속하는 발명은 구성만으로 효과의 예측이 쉽지 않으므로 구성의 곤란성을 판단할 때 발명의 효과를 참작할 필요가 있고, 발명의 효과가 선행발명에 비하여 현저하다 면 구성의 곤란성을 추론하는 유력한 자료가 될 수 있다. ... 결정형 발명의 구성의 곤란성을 판단할 때에는, 결정형 발명의 기술적 의의와 특유한 효과, 그 발명에서 청구 한 특정한 결정형의 구조와 제조방법, 선행발명의 내용과 특징, 통상의 기술자의 기술수준과 출원 당시의 통 상적인 다형체 스크리닝 방식 등을 기록에 나타난 자료에 기초하여 파악한 다음, 선행발명 화합물의 결정다 형성이 알려졌거나 예상되었는지, 결정형 발명에서 청구하는 특정한 결정형에 이를 수 있다는 가르침이나 암시, 동기 등이 선행발명이나 선행기술문헌에 나타나 있는지, 결정형 발명의 특정한 결정형이 선행발명 화 합물에 대한 통상적인 다형체 스크리닝을 통해 검토될 수 있는 결정다형의 범위에 포함되는지, 그 특정한 결 정형이 예측할 수 없는 유리한 효과를 가지는지 등을 종합적으로 고려하여, 통상의 기술자가 선행발명으로 부터 결정형 발명의 구성을 쉽게 도출할 수 있는지를 살펴보아야 한다. 결정형 발명의 효과가 선행발명 화합물의 효과와 질적으로 다르거나 양적으로 현저한 차이가 있는 경우에는 진보성이 부정되지 않는다. 결정형 발명의 효과의 현저성은 그 발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심으로 판단하여야 하고, 만일 그 효과가 의심스러울 때에는 그 기재 내용의 범위를 넘지 않는 한도에서 출원일 이후에 추가적인 실험 자료를 제출하는 등의 방법으로 그 효과를 구체적으로 주장 증명하는 것이 허용된다. 2 특유청구항","slides":[{"label":"판시사항","text":"결정형 발명의 진보성 및 ‘효과’의 인정 대법원 2022. 3. 31. 선고 2018후10923 판결"},{"label":"판시사항","text":"[2] 의약화합물 분야에서 선행발명에 공지된 화합물과 화학구조는 동일하지만 결정 형태가 다른 특정한 결정형의 화합물을 청구범위로 하는 이른바 결정형 발명의 진보성을 판단하는 경우, 다형체 스크리닝이 통상 행해지는 것이라는 이유만으로 결정형 발명의 구성의 곤란성이 부정된다고 단정할 수 있는지 여부 판시 (소극) / 결정형 발명과 같이 의약화합물 분야에 속하는 발명의 구성의 곤란성을 판단할 때 발명의 효과도 사항 함께 참작하여야 하는지 여부(적극)"},{"label":"판시사항","text":"[3] 결정형 발명의 구성의 곤란성을 판단하는 방법"},{"label":"판시사항","text":"[4] 결정형 발명의 효과가 선행발명과 질적으로 다르거나 양적으로 현저한 차이가 있는 경우, 진보성이 인 정되는지 여부(적극) / 결정형 발명의 효과의 현저성을 판단하는 방법"},{"label":"판결요지","text":"의약화합물의 제제설계(製劑設計)를 위하여 그 화합물이 다양한 결정 형태 즉 결정다형(polymorph)을 가 지는지 등을 검토하는 다형체 스크리닝(polymorph screening)은 통상 행해지는 일이다. 의약화합물 분야 에서 선행발명에 공지된 화합물과 화학구조는 동일하지만 결정 형태가 다른 특정한 결정형의 화합물을 청구 범위로 하는 이른바 결정형 발명의 진보성을 판단할 때에는 이러한 특수성을 고려할 필요가 있다. 하지만 그 것만으로 결정형 발명의 구성의 곤란성이 부정된다고 단정할 수는 없다. 다형체 스크리닝이 통상 행해지는 실험이라는 것과 이를 통해 결정형 발명의 특정한 결정형에 쉽게 도달할 수 있는지는 별개의 문제이기 때문 이다. 한편 결정형 발명과 같이 의약화합물분야에 속하는 발명은 구성만으로 효과의 예측이 쉽지 않으므로 구성의 곤란성을 판단할 때 발명의 효과를 참작할 필요가 있고, 발명의 효과가 선행발명에 비하여 현저하다 면 구성의 곤란성을 추론하는 유력한 자료가 될 수 있다. ... 결정형 발명의 구성의 곤란성을 판단할 때에는, 결정형 발명의 기술적 의의와 특유한 효과, 그 발명에서 청구 한 특정한 결정형의 구조와 제조방법, 선행발명의 내용과 특징, 통상의 기술자의 기술수준과 출원 당시의 통 상적인 다형체 스크리닝 방식 등을 기록에 나타난 자료에 기초하여 파악한 다음, 선행발명 화합물의 결정다 형성이 알려졌거나 예상되었는지, 결정형 발명에서 청구하는 특정한 결정형에 이를 수 있다는 가르침이나 암시, 동기 등이 선행발명이나 선행기술문헌에 나타나 있는지, 결정형 발명의 특정한 결정형이 선행발명 화 합물에 대한 통상적인 다형체 스크리닝을 통해 검토될 수 있는 결정다형의 범위에 포함되는지, 그 특정한 결 정형이 예측할 수 없는 유리한 효과를 가지는지 등을 종합적으로 고려하여, 통상의 기술자가 선행발명으로 부터 결정형 발명의 구성을 쉽게 도출할 수 있는지를 살펴보아야 한다. 결정형 발명의 효과가 선행발명 화합물의 효과와 질적으로 다르거나 양적으로 현저한 차이가 있는 경우에는 진보성이 부정되지 않는다. 결정형 발명의 효과의 현저성은 그 발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심으로 판단하여야 하고, 만일 그 효과가 의심스러울 때에는 그 기재 내용의 범위를 넘지 않는 한도에서 출원일 이후에 추가적인 실험 자료를 제출하는 등의 방법으로 그 효과를 구체적으로 주장 증명하는 것이 허용된다. 2 특유청구항"}]},{"section":"특유쟁점 - 특유청구항","question":"PBP청구항의 해석 – 등록요건 판단대상 대법원 2015. 1. 22. 선고 2011후927 전원합의체 판결 제조방법이 기재된 물건발명의 특허요건을 판단하면서 제조방법의 기재를 포함하여 특허청구범위의 모 든 기재에 의하여 특정되는 구조나 성질 등을 가지는 물건으로 파악하여 신규성, 진보성 등이 있는지를 살 펴야 하는지 여부(적극)","answer":"제조방법이 기재된 물건발명의 특허요건을 판단함에 있어서 그 기술적 구성을 제조방법 자체로 한정하 여 파악할 것이 아니라 제조방법의 기재를 포함하여 특허청구범위의 모든 기재에 의하여 특정되는 구조나 성 질 등을 가지는 물건으로 파악하여 출원 전에 공지된 선행기술과 비교하여 신규성, 진보성 등이 있는지 여부 를 살펴야 한다.","slides":[{"label":"판시사항","text":"PBP청구항의 해석 – 등록요건 판단대상 대법원 2015. 1. 22. 선고 2011후927 전원합의체 판결 제조방법이 기재된 물건발명의 특허요건을 판단하면서 제조방법의 기재를 포함하여 특허청구범위의 모 든 기재에 의하여 특정되는 구조나 성질 등을 가지는 물건으로 파악하여 신규성, 진보성 등이 있는지를 살 펴야 하는지 여부(적극)"},{"label":"판결요지","text":"제조방법이 기재된 물건발명의 특허요건을 판단함에 있어서 그 기술적 구성을 제조방법 자체로 한정하 여 파악할 것이 아니라 제조방법의 기재를 포함하여 특허청구범위의 모든 기재에 의하여 특정되는 구조나 성 질 등을 가지는 물건으로 파악하여 출원 전에 공지된 선행기술과 비교하여 신규성, 진보성 등이 있는지 여부 를 살펴야 한다."}]},{"section":"특유쟁점 - 특유청구항","question":"PBP청구항의 해석 – 보호범위 해석기준 대법원 2015. 2. 12. 선고 2013후1726 판결 제조방법이 기재된 물건발명에 대한 특허청구범위의 해석방법이 특허침해소송이나 권리범위확인심판 등 특허침해 단계에서 특허발명의 권리범위에 속하는지 판단하면서도 마찬가지로 적용되는지 여부(적극) 및 특허발명의 권리범위를 특허청구범위에 기재된 제조방법의 범위 내로 한정할 수 있는 경우","answer":"제조방법이 기재된 물건발명에 대한 위와 같은 특허청구범위의 해석방법은 특허침해소송이나 권리범위 확인심판 등 특허침해 단계에서 그 특허발명의 권리범위에 속하는지 여부를 판단하면서도 마찬가지로 적용 되어야 할 것이다. 다만 이러한 해석방법에 의하여 도출되는 특허발명의 권리범위가 명세서의 전체적인 기재에 의하여 파악되는 발명의 실체에 비추어 지나치게 넓다는 등의 명백히 불합리한 사정이 있는 경우에는 그 권리범위를 특허청구범위에 기재된 제조방법의 범위 내로 한정할 수 있다.","slides":[{"label":"판시사항","text":"PBP청구항의 해석 – 보호범위 해석기준 대법원 2015. 2. 12. 선고 2013후1726 판결 제조방법이 기재된 물건발명에 대한 특허청구범위의 해석방법이 특허침해소송이나 권리범위확인심판 등 특허침해 단계에서 특허발명의 권리범위에 속하는지 판단하면서도 마찬가지로 적용되는지 여부(적극) 및 특허발명의 권리범위를 특허청구범위에 기재된 제조방법의 범위 내로 한정할 수 있는 경우"},{"label":"판결요지","text":"제조방법이 기재된 물건발명에 대한 위와 같은 특허청구범위의 해석방법은 특허침해소송이나 권리범위 확인심판 등 특허침해 단계에서 그 특허발명의 권리범위에 속하는지 여부를 판단하면서도 마찬가지로 적용 되어야 할 것이다. 다만 이러한 해석방법에 의하여 도출되는 특허발명의 권리범위가 명세서의 전체적인 기재에 의하여 파악되는 발명의 실체에 비추어 지나치게 넓다는 등의 명백히 불합리한 사정이 있는 경우에는 그 권리범위를 특허청구범위에 기재된 제조방법의 범위 내로 한정할 수 있다."}]},{"section":"특유쟁점 - 특유청구항","question":"기능식청구항의 해석 – 등록요건 판단대상 대법원 2009. 7. 23. 선고 2007후4977 판결 판시 특허출원된 발명의 특허청구범위가 기능, 효과, 성질 등의 이른바 기능적 표현으로 기재된 경우, 그 발명 사항 의 내용을 확정하기 위한 해석 방법","answer":"특허청구범위는 특허출원인이 특허발명으로 보호받고자 하는 사항이 기재된 것이므로, 발명의 내용의 확정은 특별한 사정이 없는 한 특허청구범위에 기재된 사항에 의하여야 하고 발명의 상세한 설명이나 도면 등 명세서의 다른 기재에 의하여 특허청구범위를 제한하거나 확장하여 해석하는 것은 허용되지 않으며, 이러한 법리는 특허출원된 발명의 특허청구범위가 통상적인 구조, 방법, 물질 등이 아니라 기능, 효과, 성질 등의 이른바 기능적 표현으로 기재된 경우에도 마찬가지이다. 따라서 특허출원된 발명의 특허청구범위에 기능, 효과, 성질 등에 의하여 발명을 특정하는 기재가 포함되어 있는 경우에는 특허청구범위에 기재된 사항에 의하여 그러한 기능, 효과, 성질 등을 가지는 모든 발명을 의미하는 것으로 해석하는 것이 원칙이나, 다만, 특허청구범위에 기재된 사항은 발명의 상세한 설명이나 도면 등 을 참작하여야 그 기술적 의미를 정확하게 이해할 수 있으므로, 특허청구범위에 기재된 용어가 가지는 특별한 의미가 명세서의 발명의 상세한 설명이나 도면에 정의 또는 설명이 되어 있는 등의 다른 사정이 있는 경우에는 그 용어의 일반적인 의미를 기초로 하면서도 그 용어에 의하여 표현하고자 하는 기술적 의의를 고찰한 다음 용 어의 의미를 객관적, 합리적으로 해석하여 발명의 내용을 확정하여야 한다.","slides":[{"label":"판시사항","text":"기능식청구항의 해석 – 등록요건 판단대상 대법원 2009. 7. 23. 선고 2007후4977 판결 판시 특허출원된 발명의 특허청구범위가 기능, 효과, 성질 등의 이른바 기능적 표현으로 기재된 경우, 그 발명 사항 의 내용을 확정하기 위한 해석 방법"},{"label":"판결요지","text":"특허청구범위는 특허출원인이 특허발명으로 보호받고자 하는 사항이 기재된 것이므로, 발명의 내용의 확정은 특별한 사정이 없는 한 특허청구범위에 기재된 사항에 의하여야 하고 발명의 상세한 설명이나 도면 등 명세서의 다른 기재에 의하여 특허청구범위를 제한하거나 확장하여 해석하는 것은 허용되지 않으며, 이러한 법리는 특허출원된 발명의 특허청구범위가 통상적인 구조, 방법, 물질 등이 아니라 기능, 효과, 성질 등의 이른바 기능적 표현으로 기재된 경우에도 마찬가지이다. 따라서 특허출원된 발명의 특허청구범위에 기능, 효과, 성질 등에 의하여 발명을 특정하는 기재가 포함되어 있는 경우에는 특허청구범위에 기재된 사항에 의하여 그러한 기능, 효과, 성질 등을 가지는 모든 발명을 의미하는 것으로 해석하는 것이 원칙이나, 다만, 특허청구범위에 기재된 사항은 발명의 상세한 설명이나 도면 등 을 참작하여야 그 기술적 의미를 정확하게 이해할 수 있으므로, 특허청구범위에 기재된 용어가 가지는 특별한 의미가 명세서의 발명의 상세한 설명이나 도면에 정의 또는 설명이 되어 있는 등의 다른 사정이 있는 경우에는 그 용어의 일반적인 의미를 기초로 하면서도 그 용어에 의하여 표현하고자 하는 기술적 의의를 고찰한 다음 용 어의 의미를 객관적, 합리적으로 해석하여 발명의 내용을 확정하여야 한다."}]},{"section":"특유쟁점 - 특유청구항","question":"기능식청구항의 해석 – 보호범위 해석기준 대법원 2008. 2. 28. 선고 2005다77350,77367 판결 특허권의 권리범위와 보호범위의 확정 방법 및 특허의 명세서에 기재된 용어의 해석 방법","answer":"특허권의 권리범위 내지 보호범위는 특허출원서에 첨부한 명세서의 특허청구범위에 기재된 사항에 의 하여 정하여지는 것이 원칙이지만, 특허청구범위에 기능, 효과, 성질 등에 의한 물건의 특정을 포함하고 있어 그 용어의 기재만으로 기술적 구성의 구체적 내용을 알 수 없는 경우에는 발명의 상세한 설명이나 도면 등을 참작하여 특허발명의 기술적 구성을 확정하여야 하고, ... 나아가 특허청구범위에 기재된 용어 그대로의 해석 이 명세서의 다른 기재에 비추어 보아 명백히 불합리한 경우에는 출원된 기술사상의 내용과 명세서의 다른 기재 및 출원인의 의사와 제3자에 대한 법적 안정성을 두루 참작하여 정의와 형평에 따라 합리적으로 해석하여야 한다.","slides":[{"label":"판시사항","text":"기능식청구항의 해석 – 보호범위 해석기준 대법원 2008. 2. 28. 선고 2005다77350,77367 판결 특허권의 권리범위와 보호범위의 확정 방법 및 특허의 명세서에 기재된 용어의 해석 방법"},{"label":"판결요지","text":"특허권의 권리범위 내지 보호범위는 특허출원서에 첨부한 명세서의 특허청구범위에 기재된 사항에 의 하여 정하여지는 것이 원칙이지만, 특허청구범위에 기능, 효과, 성질 등에 의한 물건의 특정을 포함하고 있어 그 용어의 기재만으로 기술적 구성의 구체적 내용을 알 수 없는 경우에는 발명의 상세한 설명이나 도면 등을 참작하여 특허발명의 기술적 구성을 확정하여야 하고, ... 나아가 특허청구범위에 기재된 용어 그대로의 해석 이 명세서의 다른 기재에 비추어 보아 명백히 불합리한 경우에는 출원된 기술사상의 내용과 명세서의 다른 기재 및 출원인의 의사와 제3자에 대한 법적 안정성을 두루 참작하여 정의와 형평에 따라 합리적으로 해석하여야 한다."}]},{"section":"특유쟁점 - 특유청구항","question":"기능식청구항의 해석 – 보호범위 해석기준 대법원 2025. 7. 17. 선고 2023후11340 판결 [1] 특허발명의 보호범위를 확정하는 방법 / 청구범위를 문언 그대로 해석하면 명세서의 다른 기재에 비 추어 보아 명백히 불합리한 경우, 특허권의 권리범위를 제한 해석할 수 있는지 여부(적극) / 이는 독립항 과 그 종속항의 권리범위가 동일하게 된다고 하여도 마찬가지인지 여부(적극)","answer":"특허발명의 보호범위는 청구범위에 적혀 있는 사항에 따라 정해지고, 발명에 관한 설명이나 도면 등으로 보호범위를 제한하거나 확장하는 것은 원칙적으로 허용되지 않는다. 그런데 청구범위에 적혀 있는 사항이 통 상적인 구조, 방법, 물질 등이 아니라 기능, 효과, 성질 등의 이른바 기능적 표현으로 되어 있어 그 용어의 기재만으로 기술적 구성의 구체적인 내용을 알 수 없는 경우에는, 그 특허권의 침해 판단이나 권리범위 확인이 문제되는 국면에서 청구범위를 문언 그대로 해석하면 명세서의 다른 기재에 비추어 보아 명백히 불합리할 때 가 있다. 청구범위에 문언적으로 포함된다고 해석되는 것 중 일부가 발명에 관한 설명의 기재에 의하여 뒷받 침되지 않거나, 출원인이 그중 일부를 특허권의 권리범위에서 의식적으로 제외하고 있다고 보이는 경우 등 이 이에 해당한다. 이러한 경우에는 출원된 기술사상의 내용, 명세서의 다른 기재, 출원인의 의사, 제3자에 대한 법적 안정성을 두루 참작하여 특허권의 권리범위를 제한 해석할 수 있다(대법원 2003. 7. 11. 선고 2001후2856 판결, 대법원 2008. 2. 28. 선고 2005다77350,77367 판결, 대법원 2009. 4. 23. 선고 2009후92 판결 등 참조). 이는 독립항과 그 종속항의 권리범위가 동일하게 된다고 하여도 마찬가지이다 (대법원 2008. 7. 10. 선고 2008후57 판결 등 참조). ... 원고는 원출원 발명의 출원 과정에서 거절이유를 극복하기 위해, 원출원 제1항 발명의 ‘세정수단’에는 ‘전기 분해 방식으로 살균물질을 생성하여 세정하는 수단’이 포함되지 않는다는 취지의 의견을 제출하였다. 원출원 발명과 이 사건 특허발명의 출원인은 모두 원고로 동일하다. 이 사건 특허발명은 원출원 발명을 기초로 하는 1세대 분할출원 발명으로부터 분할출원된 발명으로서 원출원 발명의 출원서에 최초로 첨부된 명세서 또는 도면에 기재된 사항의 범위 내에 있는 발명이다. 원고는 원출원 발명에 관한 위와 같은 의견제출 이후 에 이 사건 특허발명을 출원하였다. 이러한 사정을 고려하면, 원출원 발명에 대한 출원경과는 그 후 분할출원된 이 사건 특허발명의 청구범위를 해석할 때에도 참작할 수 있다.","slides":[{"label":"판시사항","text":"기능식청구항의 해석 – 보호범위 해석기준 대법원 2025. 7. 17. 선고 2023후11340 판결"},{"label":"판시사항","text":"[1] 특허발명의 보호범위를 확정하는 방법 / 청구범위를 문언 그대로 해석하면 명세서의 다른 기재에 비 추어 보아 명백히 불합리한 경우, 특허권의 권리범위를 제한 해석할 수 있는지 여부(적극) / 이는 독립항 과 그 종속항의 권리범위가 동일하게 된다고 하여도 마찬가지인지 여부(적극)"},{"label":"판결요지","text":"특허발명의 보호범위는 청구범위에 적혀 있는 사항에 따라 정해지고, 발명에 관한 설명이나 도면 등으로 보호범위를 제한하거나 확장하는 것은 원칙적으로 허용되지 않는다. 그런데 청구범위에 적혀 있는 사항이 통 상적인 구조, 방법, 물질 등이 아니라 기능, 효과, 성질 등의 이른바 기능적 표현으로 되어 있어 그 용어의 기재만으로 기술적 구성의 구체적인 내용을 알 수 없는 경우에는, 그 특허권의 침해 판단이나 권리범위 확인이 문제되는 국면에서 청구범위를 문언 그대로 해석하면 명세서의 다른 기재에 비추어 보아 명백히 불합리할 때 가 있다. 청구범위에 문언적으로 포함된다고 해석되는 것 중 일부가 발명에 관한 설명의 기재에 의하여 뒷받 침되지 않거나, 출원인이 그중 일부를 특허권의 권리범위에서 의식적으로 제외하고 있다고 보이는 경우 등 이 이에 해당한다. 이러한 경우에는 출원된 기술사상의 내용, 명세서의 다른 기재, 출원인의 의사, 제3자에 대한 법적 안정성을 두루 참작하여 특허권의 권리범위를 제한 해석할 수 있다(대법원 2003. 7. 11. 선고 2001후2856 판결, 대법원 2008. 2. 28. 선고 2005다77350,77367 판결, 대법원 2009. 4. 23. 선고 2009후92 판결 등 참조). 이는 독립항과 그 종속항의 권리범위가 동일하게 된다고 하여도 마찬가지이다 (대법원 2008. 7. 10. 선고 2008후57 판결 등 참조). ... 원고는 원출원 발명의 출원 과정에서 거절이유를 극복하기 위해, 원출원 제1항 발명의 ‘세정수단’에는 ‘전기 분해 방식으로 살균물질을 생성하여 세정하는 수단’이 포함되지 않는다는 취지의 의견을 제출하였다. 원출원 발명과 이 사건 특허발명의 출원인은 모두 원고로 동일하다. 이 사건 특허발명은 원출원 발명을 기초로 하는 1세대 분할출원 발명으로부터 분할출원된 발명으로서 원출원 발명의 출원서에 최초로 첨부된 명세서 또는 도면에 기재된 사항의 범위 내에 있는 발명이다. 원고는 원출원 발명에 관한 위와 같은 의견제출 이후 에 이 사건 특허발명을 출원하였다. 이러한 사정을 고려하면, 원출원 발명에 대한 출원경과는 그 후 분할출원된 이 사건 특허발명의 청구범위를 해석할 때에도 참작할 수 있다."}]},{"section":"특유쟁점 - 특유청구항","question":"기능적으로 특정한 독립항 해석 – 종속항과의 관계 대법원 2007. 9. 6. 선고 2005후1486 판결 [1] 특허청구범위가 기능, 효과, 성질 등에 의한 물건의 특정을 포함하는 경우 특허청구범위의 적법한 기 판시 재 방식 사항 [2] 독립항과 이를 한정하는 종속항 등 여러 항으로 이루어진 특허발명 청구항의 경우, 독립항의 기술내용 을 종속항의 기술구성 등으로 제한 해석할 수 있는지 여부(소극)","answer":"특허청구범위가 기능, 효과, 성질 등에 의한 물건의 특정을 포함하는 경우 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자가 발명의 상세한 설명이나 도면 등의 기재와 출원 당시의 기술상식을 고려하여 특허청구범위에 기재된 사항으로부터 특허를 받고자 하는 발명을 명확하게 파악할 수 있다면 그 특허청구범위의 기재는 적법하다고 할 것이다. 그리고 독립항과 이를 한정하는 종속항 등 여러 항으로 이루어진 청구항의 기술내용을 파악함에 있어서 특 별한 사정이 없는 한 광범위하게 규정된 독립항의 기술내용을 독립항보다 구체적으로 한정하고 있는 종속항 의 기술구성이나 발명의 상세한 설명에 나오는 특정의 실시례로 제한하여 해석할 수는 없다고 할 것이다. ","slides":[{"label":"판시사항","text":"기능적으로 특정한 독립항 해석 – 종속항과의 관계 대법원 2007. 9. 6. 선고 2005후1486 판결"},{"label":"판시사항","text":"[1] 특허청구범위가 기능, 효과, 성질 등에 의한 물건의 특정을 포함하는 경우 특허청구범위의 적법한 기 판시 재 방식 사항"},{"label":"판시사항","text":"[2] 독립항과 이를 한정하는 종속항 등 여러 항으로 이루어진 특허발명 청구항의 경우, 독립항의 기술내용 을 종속항의 기술구성 등으로 제한 해석할 수 있는지 여부(소극)"},{"label":"판결요지","text":"특허청구범위가 기능, 효과, 성질 등에 의한 물건의 특정을 포함하는 경우 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자가 발명의 상세한 설명이나 도면 등의 기재와 출원 당시의 기술상식을 고려하여 특허청구범위에 기재된 사항으로부터 특허를 받고자 하는 발명을 명확하게 파악할 수 있다면 그 특허청구범위의 기재는 적법하다고 할 것이다. 그리고 독립항과 이를 한정하는 종속항 등 여러 항으로 이루어진 청구항의 기술내용을 파악함에 있어서 특 별한 사정이 없는 한 광범위하게 규정된 독립항의 기술내용을 독립항보다 구체적으로 한정하고 있는 종속항 의 기술구성이나 발명의 상세한 설명에 나오는 특정의 실시례로 제한하여 해석할 수는 없다고 할 것이다. 3 특허법상 공유"}]},{"section":"특유쟁점 - 특허법상 공유","question":"공유자 1인의 자기실시 및 1기관의 범위 특허법원 2025. 5. 28. 선고 2023나11078 판결 특허권의 공유자가 특허발명을 제3자로 하여금 실시하게 하더라도, 그 실시행위의 전 과정이 공유자의 계산 아래 그 지휘 감독 하에 이루어진 경우 이를 특허법 제99조 제3항의 ‘공유자에 의한 자기실시’로 볼 수 있는지 여부 (적극)","answer":"공유자의 자기실시범위를 너무 넓게 보게 되면 특허법 제99조 제3항과 제4항의 구별이 없어지게 되고, 다른 공유자의 권리를 해칠 우려가 있으므로, 공유자가 특허발명을 직접 실시하지 않고 타인에게 실시하게 하는 경우에는 그 실시행위의 전 과정이 공유자의 계산 아래 그의 지휘 감독 하에 이루어진 것이라면 공유자에 의 한 자기실시로 볼 수 있다.","slides":[{"label":"판시사항","text":"공유자 1인의 자기실시 및 1기관의 범위 특허법원 2025. 5. 28. 선고 2023나11078 판결 특허권의 공유자가 특허발명을 제3자로 하여금 실시하게 하더라도, 그 실시행위의 전 과정이 공유자의 계산 아래 그 지휘 감독 하에 이루어진 경우 이를 특허법 제99조 제3항의 ‘공유자에 의한 자기실시’로 볼 수 있는지 여부 (적극)"},{"label":"판결요지","text":"공유자의 자기실시범위를 너무 넓게 보게 되면 특허법 제99조 제3항과 제4항의 구별이 없어지게 되고, 다른 공유자의 권리를 해칠 우려가 있으므로, 공유자가 특허발명을 직접 실시하지 않고 타인에게 실시하게 하는 경우에는 그 실시행위의 전 과정이 공유자의 계산 아래 그의 지휘 감독 하에 이루어진 것이라면 공유자에 의 한 자기실시로 볼 수 있다."}]},{"section":"특유쟁점 - 특허법상 공유","question":"공유특허권 분할청구 대법원 2014. 8. 20. 선고 2013다41578 판결 판시 특허권의 공유관계에 민법상 공유물분할청구에 관한 규정이 적용되는지 여부(적극) 및 특허권의 성질상 사항 현물분할이 허용되는지 여부(소극) / 디자인권의 경우에도 마찬가지 법리가 적용되는지 여부(적극)","answer":"특허권의 공유자 상호 간에 이해관계가 대립되는 경우 등에 그 공유관계를 해소하기 위한 수단으로서 각 공 유자에게 민법상의 공유물분할청구권을 인정하더라도 공유자 이외의 제3자에 의하여 다른 공유자 지분의 경제적 가치에 위와 같은 변동이 발생한다고 보기 어려워서 위 특허법 제99조 제2항 및 제4항에 반하지 아 니하고, 달리 분할청구를 금지하는 특허법 규정도 없으므로, 특허권의 공유관계에 민법상 공유물분할청구에 관한 규정이 적용될 수 있다. 다만 특허권은 발명실시에 대한 독점권으로서 그 대상은 형체가 없을 뿐만 아니라 각 공유자에게 특허권을 부여하는 방식의 현물분할을 인정하면 하나의 특허권이 사실상 내용이 동일한 복수의 특허권으로 증가하는 부당한 결과를 초래하게 되므로, 특허권의 성질상 그러한 현물분할은 허용되지 아니한다고 봄이 상당하다.","slides":[{"label":"판시사항","text":"공유특허권 분할청구 대법원 2014. 8. 20. 선고 2013다41578 판결 판시 특허권의 공유관계에 민법상 공유물분할청구에 관한 규정이 적용되는지 여부(적극) 및 특허권의 성질상 사항 현물분할이 허용되는지 여부(소극) / 디자인권의 경우에도 마찬가지 법리가 적용되는지 여부(적극)"},{"label":"판결요지","text":"특허권의 공유자 상호 간에 이해관계가 대립되는 경우 등에 그 공유관계를 해소하기 위한 수단으로서 각 공 유자에게 민법상의 공유물분할청구권을 인정하더라도 공유자 이외의 제3자에 의하여 다른 공유자 지분의 경제적 가치에 위와 같은 변동이 발생한다고 보기 어려워서 위 특허법 제99조 제2항 및 제4항에 반하지 아 니하고, 달리 분할청구를 금지하는 특허법 규정도 없으므로, 특허권의 공유관계에 민법상 공유물분할청구에 관한 규정이 적용될 수 있다. 다만 특허권은 발명실시에 대한 독점권으로서 그 대상은 형체가 없을 뿐만 아니라 각 공유자에게 특허권을 부여하는 방식의 현물분할을 인정하면 하나의 특허권이 사실상 내용이 동일한 복수의 특허권으로 증가하는 부당한 결과를 초래하게 되므로, 특허권의 성질상 그러한 현물분할은 허용되지 아니한다고 봄이 상당하다."}]},{"section":"특유쟁점 - 특허법상 공유","question":"공유자 1인의 심결취소소송 원고적격 대법원 2004. 12. 9. 선고 2002후567 판결 판시 상표권의 공유자가 그 상표권의 효력에 관한 심판에서 패소한 경우에 제기할 심결취소소송이 고유필수적 사항 공동소송인지 여부(소극)","answer":"상표권의 공유자가 그 상표권의 효력에 관한 심판에서 패소한 경우에 제기할 심결취소소송은 공유자 전원이 공동으로 제기하여야만 하는 고유필수적 공동소송이라고 할 수 없고, 공유자의 1인이라도 당해 상표등록을 무효로 하거나 권리행사를 제한 방해하는 심결이 있는 때에는 그 권리의 소멸을 방지하거나 그 권리행사방 해배제를 위하여 단독으로 그 심결의 취소를 구할 수 있다 할 것이고, 위와 같이 공유자 1인에 의한 심결 취소소송의 제기를 인정하더라도 위에서 본 바와 같이 다른 공유자의 이익을 해한다거나 합일확정의 요 청에 반하는 사태가 생긴다고 할 수 없다.","slides":[{"label":"판시사항","text":"공유자 1인의 심결취소소송 원고적격 대법원 2004. 12. 9. 선고 2002후567 판결 판시 상표권의 공유자가 그 상표권의 효력에 관한 심판에서 패소한 경우에 제기할 심결취소소송이 고유필수적 사항 공동소송인지 여부(소극)"},{"label":"판결요지","text":"상표권의 공유자가 그 상표권의 효력에 관한 심판에서 패소한 경우에 제기할 심결취소소송은 공유자 전원이 공동으로 제기하여야만 하는 고유필수적 공동소송이라고 할 수 없고, 공유자의 1인이라도 당해 상표등록을 무효로 하거나 권리행사를 제한 방해하는 심결이 있는 때에는 그 권리의 소멸을 방지하거나 그 권리행사방 해배제를 위하여 단독으로 그 심결의 취소를 구할 수 있다 할 것이고, 위와 같이 공유자 1인에 의한 심결 취소소송의 제기를 인정하더라도 위에서 본 바와 같이 다른 공유자의 이익을 해한다거나 합일확정의 요 청에 반하는 사태가 생긴다고 할 수 없다."}]},{"section":"특유쟁점 - 특허법상 공유","question":"특받권 공유자 1인의 심결취소소송 원고적격 대법원 2024. 12. 26. 선고 2024후10825 판결 판시 특허를 받을 수 있는 권리의 공유자가 특허거절결정 등에 대한 불복심판에서 기각 심결을 받은 경우, 공유 사항 자 중 1인이 단독으로 심결의 취소를 구할 수 있는지 여부(적극)","answer":"특허를 받을 수 있는 권리의 공유자가 특허거절결정 등에 대한 불복심판에서 기각 심결을 받은 경우에 제기 하는 심결취소의 소는 심판청구인인 공유자 모두가 공동으로 제기하여야 하는 고유필수적 공동소송이라고
