let caseIndex=0;
let slideIndex=0;
let examMode=false;
let revealed=false;
let filtered=null;
  // 마지막 학습 위치 저장
function saveProgress(){
  localStorage.setItem("patentStudyProgress", JSON.stringify({
    caseIndex: caseIndex,
    slideIndex: slideIndex,
    examMode: examMode,
    revealed: revealed,
    filtered: filtered
  }));
}

// 마지막 학습 위치 불러오기
function loadProgress(){
  const saved = localStorage.getItem("patentStudyProgress");

  if(!saved) return;

  try{
    const data = JSON.parse(saved);

    if(typeof data.caseIndex === "number"){
      caseIndex = data.caseIndex;
    }

    if(typeof data.slideIndex === "number"){
      slideIndex = data.slideIndex;
    }

    if(typeof data.examMode === "boolean"){
      examMode = data.examMode;
    }

    if(typeof data.revealed === "boolean"){
      revealed = data.revealed;
    }

    if(Array.isArray(data.filtered)){
      filtered = data.filtered;
    }

  }catch(e){
    console.log("저장된 학습 위치를 불러오지 못했습니다.", e);
  }
}

const $=id=>document.getElementById(id);
const pool=()=>filtered || CASES.map((_,i)=>i);
const current=()=>CASES[pool()[caseIndex]];

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function titleOf(q){
  const m=q.match(/^(.*?)\s+(?:대법원|특허법원)\s+\d{4}\./);
  if(m) return m[1].trim();
  const x=q.split(/\s+\[\d+\]/)[0];
  return x.trim();
}

function questionSlides(c){
  return c.slides.filter(x=>x.label==="판시사항");
}
function answerSlide(c){
  return c.slides.find(x=>x.label==="판결요지");
}

function questionHTML(c){
  return questionSlides(c).map(s=>{
    return s.text.replace(/^(\[\d+\])/, '<span class="blue">$1</span>');
  }).join("<br><br>");
}

function render(){
  saveProgress();
  
  const p=pool(), c=current();
  $("count").textContent=(caseIndex+1)+" / "+p.length+" 판례";
  $("fill").style.width=((caseIndex+1)/p.length*100)+"%";
  $("num").textContent=caseIndex+1;
  $("section").textContent=c.section || "";
  $("title").textContent=titleOf(c.question);

  if(examMode){
    $("app").classList.add("exam");
    $("content").innerHTML=questionHTML(c);

    const a=answerSlide(c);
    if(revealed && a){
      $("content").innerHTML += '<div class="answer-box"><span class="answer-label">[판결요지]</span>'+esc(a.text)+'</div>';
    }

    $("reveal").style.display=revealed?"none":"flex";
    $("speakQ").style.display="inline-block";
    $("speakA").style.display=revealed?"inline-block":"none";
    $("contentCount").textContent="판시사항 "+questionSlides(c).length+"개";
    $("prev").disabled=caseIndex===0;
    $("next").textContent=(caseIndex===p.length-1)?"완료  ›":"다음  ›";
  }else{
    $("app").classList.remove("exam");
    const slides=c.slides || [];
    if(slideIndex>=slides.length) slideIndex=0;
    const s=slides[slideIndex];

    let t=s.text.replace(/^(\[\d+\])/, '<span class="blue">$1</span>');
    if(s.label==="판결요지") t='<span class="blue">[판결요지]</span> '+t;
    $("content").innerHTML=t;
    $("reveal").style.display="none";
    $("speakQ").style.display=s.label==="판시사항"?"inline-block":"none";
    $("speakA").style.display=s.label==="판결요지"?"inline-block":"none";
    $("contentCount").textContent="내용 "+(slideIndex+1)+" / "+slides.length;
    $("prev").disabled=(caseIndex===0 && slideIndex===0);
    $("next").textContent=(slideIndex===slides.length-1 && caseIndex===p.length-1)?"완료  ›":"다음  ›";
  }
}

function next(){
  stopVoice();
  const p=pool(), c=current();
  if(examMode){
    if(caseIndex<p.length-1){
      caseIndex++; revealed=false; render();
    }else{
      alert("마지막 판례까지 학습했습니다.");
      caseIndex=0; revealed=false; render();
    }
  }else{
    if(slideIndex<(c.slides.length-1)){
      slideIndex++;
    }else if(caseIndex<p.length-1){
      caseIndex++; slideIndex=0;
    }else{
      alert("마지막 판례까지 학습했습니다.");
      caseIndex=0; slideIndex=0;
    }
    render();
  }
  window.scrollTo({top:0,behavior:"smooth"});
}

function prev(){
  stopVoice();
  if(examMode){
    if(caseIndex>0){caseIndex--;revealed=false;render();}
  }else{
    if(slideIndex>0){
      slideIndex--;
    }else if(caseIndex>0){
      caseIndex--;
      slideIndex=CASES[pool()[caseIndex]].slides.length-1;
    }
    render();
  }
  window.scrollTo({top:0,behavior:"smooth"});
}

function resetHome(){
  stopVoice(); caseIndex=0; slideIndex=0; revealed=false; filtered=null; render();
}

function buildFilters(){
  const counts={};
  CASES.forEach(c=>counts[c.section]=(counts[c.section]||0)+1);
  $("allCount").textContent=CASES.length;
  $("filters").innerHTML="";
  Object.entries(counts).forEach(([name,n])=>{
    const b=document.createElement("button");
    b.className="filter";
    b.innerHTML="<span>"+esc(name)+"</span><span>"+n+"</span>";
    b.onclick=()=>{
      filtered=CASES.map((c,i)=>c.section===name?i:null).filter(x=>x!==null);
      caseIndex=0;slideIndex=0;revealed=false;
      $("drawerBg").classList.remove("open");render();
    };
    $("filters").appendChild(b);
  });
}

function voiceForKorean(){
  if(!("speechSynthesis" in window)) return null;
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>/^ko(-|_)/i.test(v.lang)) ||
         vs.find(v=>/korean|한국/i.test(v.name)) || null;
}
function speak(text){
  if(!("speechSynthesis" in window)){
    alert("현재 브라우저에서는 음성 변환을 지원하지 않습니다.");
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/\[\d+\]/g,""));
  u.lang="ko-KR"; u.rate=1.8; u.pitch=1;
  const v=voiceForKorean(); if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function stopVoice(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
}

$("next").onclick=next;
$("prev").onclick=prev;
$("homeBtn").onclick=resetHome;
$("modeBtn").onclick=()=>{
  examMode=!examMode; revealed=false; slideIndex=0;
  $("modeBtn").textContent=examMode?"학습모드":"시험모드";
  $("modeBtn").classList.toggle("exam",examMode);
  render();
};
$("revealBtn").onclick=()=>{revealed=true;render();};
$("sectionBtn").onclick=()=>{$("drawerBg").classList.add("open");buildFilters();};
$("close").onclick=()=>$("drawerBg").classList.remove("open");
$("allFilter").onclick=()=>{filtered=null;caseIndex=0;slideIndex=0;revealed=false;$("drawerBg").classList.remove("open");render();};
$("drawerBg").onclick=e=>{if(e.target===$("drawerBg"))$("drawerBg").classList.remove("open");};

$("speakQ").onclick=()=>{
  speak(questionSlides(current()).map(x=>x.text).join(" "));
};
$("speakA").onclick=()=>{
  const a=answerSlide(current()); if(a)speak(a.text);
};
$("stop").onclick=stopVoice;

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")next();
  if(e.key==="ArrowLeft")prev();
  if(e.key==="Escape")$("drawerBg").classList.remove("open");
});

loadProgress();

if(examMode){
  $("modeBtn").textContent="학습모드";
  $("modeBtn").classList.add("exam");
}else{
  $("modeBtn").textContent="시험모드";
  $("modeBtn").classList.remove("exam");
}
  
render();
</script>
</body>
</html>
