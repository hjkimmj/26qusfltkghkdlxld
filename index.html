<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특허법 판례 암기</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f6fa;color:#16181b}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",
  "Apple SD Gothic Neo",Arial,sans-serif;
  letter-spacing:-.03em;
}
button{font:inherit}
.app{min-height:100vh}
.header{
  width:min(1080px,calc(100% - 42px));
  margin:0 auto;
  padding:52px 0 35px;
  display:flex;
  align-items:center;
  gap:28px;
  border-bottom:1px solid #e7ebef;
}
.home{
  flex:0 0 52px;
  width:52px;height:52px;
  border:0;background:transparent;
  color:#4c535a;cursor:pointer;
  display:grid;place-items:center;
}
.home svg{width:34px;height:34px}
.progress-area{flex:1;min-width:0}
.topline{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;margin-bottom:11px;
}
.count{font-size:14px;color:#58718a}
.actions{display:flex;gap:8px}
.topbtn{
  border:0;border-radius:25px;padding:11px 19px;
  background:#dcecff;color:#0875df;font-weight:700;cursor:pointer;
}
.topbtn.exam{background:#087df5;color:#fff}
.track{height:7px;background:#e9edf2;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:#087df5;border-radius:99px;transition:.2s}

.main{
  width:min(1080px,calc(100% - 42px));
  margin:0 auto;
  padding:45px 0 52px;
}
.case-head{
  display:flex;align-items:center;gap:22px;
  margin-bottom:34px;
}
.num{
  width:64px;height:64px;border-radius:50%;
  background:#087df5;color:#fff;
  display:grid;place-items:center;
  font-size:20px;font-weight:800;flex:none;
}
.section{font-size:14px;color:#698197;margin-bottom:5px}
.title{margin:0;font-size:27px;line-height:1.25;font-weight:800}

.card{
  min-height:300px;
  background:#fff;border-radius:21px;
  box-shadow:0 7px 23px rgba(35,48,63,.10);
  padding:43px 48px;
}
.content{
  font-size:15px;
  line-height:1.85;
  white-space:pre-wrap;
  word-break:keep-all;
}
.blue{color:#087df5;font-weight:800}

.exam-notice{
  display:none;
  margin-bottom:14px;
  color:#087df5;font-size:13px;font-weight:700;
}
.exam .exam-notice{display:block}

.answer-box{
  margin-top:25px;padding-top:23px;
  border-top:1px solid #e6ebf0;
}
.answer-label{color:#087df5;font-weight:800;display:block;margin-bottom:7px}

.voice{
  display:flex;justify-content:flex-end;gap:8px;
  margin-top:12px;
}
.voice button{
  border:1px solid #dce3e9;background:#fff;color:#53687b;
  border-radius:10px;padding:9px 13px;cursor:pointer;font-size:13px;
}
.voice button:hover{background:#f7f9fb}

.reveal{
  display:none;
  justify-content:center;
  margin-top:21px;
}
.reveal button{
  border:0;border-radius:13px;background:#087df5;color:#fff;
  padding:14px 30px;font-weight:800;cursor:pointer;
}

.content-count{
  text-align:center;color:#6f8295;font-size:14px;
  margin:92px 0 33px;
}
.nav{
  display:grid;grid-template-columns:1fr 1fr;gap:22px;
}
.nav button{
  height:70px;border-radius:14px;
  border:1px solid #dce2e8;background:transparent;
  color:#26313b;font-size:17px;font-weight:700;cursor:pointer;
}
.nav .next{background:#087df5;border-color:#087df5;color:#fff}
.nav button:disabled{
  background:transparent;border-color:#e4e8ed;color:#a8afb7;cursor:default;
}
.arrow{font-size:28px;vertical-align:-2px;margin:0 9px}

.drawer-bg{
  display:none;position:fixed;inset:0;
  background:rgba(13,24,36,.28);z-index:50;
}
.drawer-bg.open{display:block}
.drawer{
  position:absolute;right:0;top:0;height:100%;
  width:min(390px,92vw);background:#fff;
  padding:27px;overflow:auto;
  box-shadow:-12px 0 40px rgba(0,0,0,.13);
}
.drawer-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;
}
.drawer h2{margin:0;font-size:21px}
.close{
  width:38px;height:38px;border:0;border-radius:50%;
  background:#f1f4f7;font-size:25px;cursor:pointer;
}
.help{font-size:13px;color:#778796;margin-bottom:15px}
.filter{
  width:100%;padding:16px 4px;
  display:flex;justify-content:space-between;
  border:0;border-bottom:1px solid #e7ebef;
  background:#fff;text-align:left;cursor:pointer;font-size:15px;
}
.filter:hover{background:#fafbfd}
.filter strong{color:#087df5}

@media(max-width:650px){
  .header,.main{width:calc(100% - 28px)}
  .header{padding:28px 0 20px;gap:8px}
  .home{flex-basis:42px;width:42px}
  .home svg{width:30px;height:30px}
  .topbtn{padding:9px 12px}
  .main{padding-top:30px}
  .case-head{gap:15px;margin-bottom:24px}
  .num{width:54px;height:54px;font-size:17px}
  .title{font-size:22px}
  .card{min-height:390px;padding:30px 25px;border-radius:17px}
  .content{font-size:16px;line-height:1.85}
  .voice{justify-content:stretch}
  .voice button{flex:1;padding:9px 5px;font-size:12px}
  .content-count{margin:55px 0 24px}
  .nav{gap:10px}
  .nav button{height:60px;font-size:15px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <button class="home" id="homeBtn" aria-label="처음으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.2v-6.2H9.2V21H4a1 1 0 0 1-1-1v-9.2Z"/>
      </svg>
    </button>
    <div class="progress-area">
      <div class="topline">
        <span class="count" id="count">1 / 182 판례</span>
        <div class="actions">
          <button class="topbtn" id="modeBtn">시험모드</button>
          <button class="topbtn" id="sectionBtn">진도별</button>
        </div>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
  </header>

  <main class="main" id="main">
    <section class="case-head">
      <div class="num" id="num">1</div>
      <div>
        <div class="section" id="section"></div>
        <h1 class="title" id="title"></h1>
      </div>
    </section>

    <div class="exam-notice">시험모드 · 판시사항을 보고 판결요지를 먼저 생각해보세요.</div>

    <section class="card">
      <div class="content" id="content"></div>
    </section>

    <div class="voice">
      <button id="speakQ">🔊 판시사항 읽기</button>
      <button id="speakA" style="display:none">🔊 판결요지 읽기</button>
      <button id="stop">■ 정지</button>
    </div>

    <div class="reveal" id="reveal">
      <button id="revealBtn">판결요지 확인</button>
    </div>

    <div class="content-count" id="contentCount">내용 1 / 1</div>

    <div class="nav">
      <button id="prev"><span class="arrow">‹</span> 이전</button>
      <button class="next" id="next">다음 <span class="arrow">›</span></button>
    </div>
  </main>
</div>

<div class="drawer-bg" id="drawerBg">
  <aside class="drawer">
    <div class="drawer-head">
      <h2>진도별 학습</h2>
      <button class="close" id="close">×</button>
    </div>
    <div class="help">파트를 선택하면 해당 판례부터 학습합니다.</div>
    <button class="filter" id="allFilter"><strong>전체</strong><span id="allCount"></span></button>
    <div id="filters"></div>
  </aside>
</div>

<script>
const CASES = [{"section":"총칙","question":"포괄위임장 제출의 취급 (대리권의 증명) 대법원 2023. 7. 13. 선고 2021두63099 판결 [1] 특허법 제46조에 따른 특허청장 등의 보정명령을 받은 사람이 특허청장 등에게 보정 내용을 증명하는 서류를 제출한 경우, 그 표제 등의 여하를 불문하고 이를 위 보정명령에 대한 의견서 제출로 보아야 하는지 여부(적극) [2] 특허에 관한 절차를 밟는 자가 포괄위임등록 신청을 위해 대리권을 증명하는 서류인 포괄위임장을 특허청장에게 제출한 경우, 포괄위임 대상 사건에 관한 대리권의 서면 증명이 이루어진 것으로 보아야 하는지 여부(적극) 및 이때 이미 출원한 사건의 특허에 관한 절차도 포괄위임의 대상이 되는지 여부(적극)","answer":"특허법 제46조에 따른 특허청장 등의 보정명령을 받은 사람으로부터 특허청장 등에게 보정 내용을 증명하는 서류가 제출되었을 때에는 그 표제 등의 여하를 불문하고 이를 위 보정명령에 대한 의견서 제출로 보아야 한다. ... 이미 출원한 사건의 특허에 관한 절차 또한 포괄위임의 대상이 되고, 포괄위임등록 신청을 위해 대리권을 증명하는 서류인 포괄위임장을 특허청장에게 제출한 이상 포괄위임 대상 사건에 관한 대리권의 서면 증명은 이루어졌다고 볼 수 있다.","slides":[{"label":"판시사항","text":"포괄위임장 제출의 취급 (대리권의 증명) 대법원 2023. 7. 13. 선고 2021두63099 판결"},{"label":"판시사항","text":"[1] 특허법 제46조에 따른 특허청장 등의 보정명령을 받은 사람이 특허청장 등에게 보정 내용을 증명하는 서류를 제출한 경우, 그 표제 등의 여하를 불문하고 이를 위 보정명령에 대한 의견서 제출로 보아야 하는지 여부(적극)"},{"label":"판시사항","text":"[2] 특허에 관한 절차를 밟는 자가 포괄위임등록 신청을 위해 대리권을 증명하는 서류인 포괄위임장을 특허청장에게 제출한 경우, 포괄위임 대상 사건에 관한 대리권의 서면 증명이 이루어진 것으로 보아야 하는지 여부(적극) 및 이때 이미 출원한 사건의 특허에 관한 절차도 포괄위임의 대상이 되는지 여부(적극)"},{"label":"판결요지","text":"특허법 제46조에 따른 특허청장 등의 보정명령을 받은 사람으로부터 특허청장 등에게 보정 내용을 증명하는 서류가 제출되었을 때에는 그 표제 등의 여하를 불문하고 이를 위 보정명령에 대한 의견서 제출로 보아야 한다. ... 이미 출원한 사건의 특허에 관한 절차 또한 포괄위임의 대상이 되고, 포괄위임등록 신청을 위해 대리권을 증명하는 서류인 포괄위임장을 특허청장에게 제출한 이상 포괄위임 대상 사건에 관한 대리권의 서면 증명은 이 루어졌다고 볼 수 있다."}]},{"section":"특허요건 - 발명의 완성","question":"완성된 발명의 의미와 판단 대법원 2019. 1. 17. 선고 2017후523 판결 발명이 완성되었는지 판단하는 방법","answer":"발명이 속하는 분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 반복 실시할 수 있고, 발명이 목적하는 기술적 효과의 달성 가능성을 예상할 수 있을 정도로 구체적, 객관적으로 구성되어 있으면 발명은 완성되었다고 보아야 한다. 발명이 완성되었는지는 청구범위를 기준으로 출원 당시의 기술수준에 따라 발명의 설명에 기재된 발명의 목적, 구성, 작용효과 등을 전체적으로 고려하여 판단하여야 하고, 반드시 발명의 설명 중의 구체적 실시례에 한정되어 인정되는 것은 아니다.","slides":[{"label":"판시사항","text":"완성된 발명의 의미와 판단 대법원 2019. 1. 17. 선고 2017후523 판결 발명이 완성되었는지 판단하는 방법"},{"label":"판결요지","text":"발명이 속하는 분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 반복 실시할 수 있고, 발명이 목적하는 기술적 효과의 달성 가능성을 예상할 수 있을 정도로 구체적, 객관적으로 구성되어 있으면 발명은 완성되었다고 보아야 한다. 발명이 완성되었는지는 청구범위를 기준으로 출원 당시의 기술수준에 따라 발명의 설명에 기재된 발명의 목적, 구성, 작용효과 등을 전체적으로 고려하여 판단하여야 하고, 반드시 발명의 설명 중의 구체적 실시례에 한정되어 인정되는 것은 아니다."}]},{"section":"특허요건 - 산업상 이용가능성","question":"의료행위의 특허성에 대한 제한 - 비치료적 용도를 동시에 가지는 경우 특허법원 2018. 12. 14. 선고 2018허3062 판결 이 사건 출원발명이 산업상 이용가능한 발명인지 여부","answer":"특허법 제29조 제1항은 ‘산업상 이용할 수 있는 발명’으로서 신규성 및 진보성이 부정되지 않는 것은 특허를 받을 수 있다고 하여 산업상 이용가능성을 특허요건의 하나로 규정하는데, 인간을 수술하거나, 치료하거나, 진단하는 방법, 즉 의료행위의 발명은 산업상 이용가능성이 없으므로 특허의 대상이 될 수 없으 며, 인간을 치료하는 방법에는 직접적 치료방법뿐만 아니라 치료를 위한 예비적 처치방법, 건강상태를 유지하기 위한 처치방법, 인체가 질병에 걸릴 가능성을 방지 또는 감소시키는 예방방법 및 간호방 법도 포함된다. 한편 청구항에 의료행위를 적어도 하나의 단계 또는 불가분의 구성요소로 포함하는 방법의 발명은 산업상 이용 가능한 것으로 인정되지 않으며, 인체를 처치하는 방법이 치료 효과와 미용효과 등의 비 치료 효과를 동시에 가지는 경우에 치료 효과와 비치료 효과를 구별 및 분리할 수 없으면 그러한 방법은 치료 방법에 해당하므로 산업상 이용 가능한 것으로 인정되지 않는다. ... 특허권의 대상에서 제외되는 ‘인간을 수술하거나, 치료하거나 진단하는 방법’이 반드시 의료법상 의료인에 의하여 수행되는 것으로만 제한된다고 보기 어렵다. ","slides":[{"label":"판시사항","text":"의료행위의 특허성에 대한 제한 - 비치료적 용도를 동시에 가지는 경우 특허법원 2018. 12. 14. 선고 2018허3062 판결 이 사건 출원발명이 산업상 이용가능한 발명인지 여부"},{"label":"판결요지","text":"특허법 제29조 제1항은 ‘산업상 이용할 수 있는 발명’으로서 신규성 및 진보성이 부정되지 않는 것은 특허를 받을 수 있다고 하여 산업상 이용가능성을 특허요건의 하나로 규정하는데, 인간을 수술하거나, 치료하거나, 진단하는 방법, 즉 의료행위의 발명은 산업상 이용가능성이 없으므로 특허의 대상이 될 수 없으 며, 인간을 치료하는 방법에는 직접적 치료방법뿐만 아니라 치료를 위한 예비적 처치방법, 건강상태를 유지하기 위한 처치방법, 인체가 질병에 걸릴 가능성을 방지 또는 감소시키는 예방방법 및 간호방 법도 포함된다. 한편 청구항에 의료행위를 적어도 하나의 단계 또는 불가분의 구성요소로 포함하는 방법의 발명은 산업상 이용 가능한 것으로 인정되지 않으며, 인체를 처치하는 방법이 치료 효과와 미용효과 등의 비 치료 효과를 동시에 가지는 경우에 치료 효과와 비치료 효과를 구별 및 분리할 수 없으면 그러한 방법은 치료 방법에 해당하므로 산업상 이용 가능한 것으로 인정되지 않는다. ... 특허권의 대상에서 제외되는 ‘인간을 수술하거나, 치료하거나 진단하는 방법’이 반드시 의료법상 의료인에 의하여 수행되는 것으로만 제한된다고 보기 어렵다. "}]},{"section":"특허요건 - 신규성","question":"‘공지 또는 공연실시’의 의미 대법원 2022. 1. 13. 선고 2021후10732 판결 특허법 제29조 제1항 제1호에서 정한 ‘공지되었다’와 ‘공연히 실시되었다’의 의미","answer":"‘공지되었다’고 함은 반드시 불특정다수인에게 인식되었을 필요는 없다 하더라도 적어도 불특정다수인이 인식 할 수 있는 상태에 놓인 것을 의미하고, ‘공연히 실시되었다’고 함은 발명의 내용이 비밀유지약정 등의 제한이 없는 상태에서 양도 등의 방법으로 사용되어 불특정다수인이 인식할 수 있는 상태에 놓인 것을 의미한다.","slides":[{"label":"판시사항","text":"‘공지 또는 공연실시’의 의미 대법원 2022. 1. 13. 선고 2021후10732 판결 특허법 제29조 제1항 제1호에서 정한 ‘공지되었다’와 ‘공연히 실시되었다’의 의미"},{"label":"판결요지","text":"‘공지되었다’고 함은 반드시 불특정다수인에게 인식되었을 필요는 없다 하더라도 적어도 불특정다수인이 인식 할 수 있는 상태에 놓인 것을 의미하고, ‘공연히 실시되었다’고 함은 발명의 내용이 비밀유지약정 등의 제한이 없는 상태에서 양도 등의 방법으로 사용되어 불특정다수인이 인식할 수 있는 상태에 놓인 것을 의미한다."}]},{"section":"특허요건 - 신규성","question":"‘특허출원 전’의 의미 – 증거의 작성시점 관련 대법원 2007. 4. 27. 선고 2006후2660 판결 구 특허법 제29조 제1항 제1호에서 말하는 ‘특허출원 전’의 의미 및 어떤 발명 또는 기술이 특허출원 전에 공지 또는 공연 실시된 것인지를 인정함에 있어 특허출원 후에 작성된 문건들을 기초로 삼을 수 있는지 여부(적극)","answer":"‘특허출원 전’의 의미는 발명의 공지 또는 공연 실시된 시점이 특허출원 전이라는 의미이지 그 공지 또는 공연 실시된 사실을 인정하기 위한 증거가 특허출원 전에 작성된 것을 의미하는 것은 아니므로, 법원은 특허출원 후에 작성된 문건들에 기초하여 어떤 발명 또는 기술이 특허출원 전에 공지 또는 공연 실시된 것인지를 인 정할 수 있다.","slides":[{"label":"판시사항","text":"‘특허출원 전’의 의미 – 증거의 작성시점 관련 대법원 2007. 4. 27. 선고 2006후2660 판결 구 특허법 제29조 제1항 제1호에서 말하는 ‘특허출원 전’의 의미 및 어떤 발명 또는 기술이 특허출원 전에 공지 또는 공연 실시된 것인지를 인정함에 있어 특허출원 후에 작성된 문건들을 기초로 삼을 수 있는지 여부(적극)"},{"label":"판결요지","text":"‘특허출원 전’의 의미는 발명의 공지 또는 공연 실시된 시점이 특허출원 전이라는 의미이지 그 공지 또는 공연 실시된 사실을 인정하기 위한 증거가 특허출원 전에 작성된 것을 의미하는 것은 아니므로, 법원은 특허출원 후에 작성된 문건들에 기초하여 어떤 발명 또는 기술이 특허출원 전에 공지 또는 공연 실시된 것인지를 인 정할 수 있다."}]},{"section":"특허요건 - 신규성","question":"설정등록된 특허문헌의 공지시점 대법원 2009. 12. 24. 선고 2009다72056 판결 구 실용신안법에 따라 설정등록된 실용신안의 공지시점(=설정등록일)","answer":"구 실용신안법에 따라 설정등록된 실용신안은 특별한 사정이 없는 한 제3자가 신청에 의하여 열람 복사를 할 수 있고, 다만 등록공고되지 아니한 출원에 관한 서류 등에 대해 일정한 경우 허가하지 아니할 수 있을 뿐 이므로 설정등록일 이후에는 실용신안은 공지된 것으로 보아야 한다.","slides":[{"label":"판시사항","text":"설정등록된 특허문헌의 공지시점 대법원 2009. 12. 24. 선고 2009다72056 판결 구 실용신안법에 따라 설정등록된 실용신안의 공지시점(=설정등록일)"},{"label":"판결요지","text":"구 실용신안법에 따라 설정등록된 실용신안은 특별한 사정이 없는 한 제3자가 신청에 의하여 열람 복사를 할 수 있고, 다만 등록공고되지 아니한 출원에 관한 서류 등에 대해 일정한 경우 허가하지 아니할 수 있을 뿐 이므로 설정등록일 이후에는 실용신안은 공지된 것으로 보아야 한다."}]},{"section":"특허요건 - 신규성","question":"미완성 발명 등의 공지기술의 지위 대법원 2008. 11. 27. 선고 2006후1957 판결 진보성 판단에 제공되는 선행기술은 반드시 기술 구성 전체가 명확하여야 하는지 여부(소극)","answer":"발명의 신규성 또는 진보성 판단에 제공되는 대비발명은 그 기술적 구성 전체가 명확하게 표현된 것뿐만 아 니라, 미완성 발명 또는 자료의 부족으로 표현이 불충분하거나 일부 내용에 오류가 있다고 하더라도 그 기술 분야에서 통상의 지식을 가진 자가 발명의 출원 당시 기술상식을 참작하여 기술내용을 용이하게 파악할 수 있다면 선행기술이 될 수 있다.","slides":[{"label":"판시사항","text":"미완성 발명 등의 공지기술의 지위 대법원 2008. 11. 27. 선고 2006후1957 판결 진보성 판단에 제공되는 선행기술은 반드시 기술 구성 전체가 명확하여야 하는지 여부(소극)"},{"label":"판결요지","text":"발명의 신규성 또는 진보성 판단에 제공되는 대비발명은 그 기술적 구성 전체가 명확하게 표현된 것뿐만 아 니라, 미완성 발명 또는 자료의 부족으로 표현이 불충분하거나 일부 내용에 오류가 있다고 하더라도 그 기술 분야에서 통상의 지식을 가진 자가 발명의 출원 당시 기술상식을 참작하여 기술내용을 용이하게 파악할 수 있다면 선행기술이 될 수 있다."}]},{"section":"특허요건 - 신규성","question":"발명의 동일성 판단 대법원 2004. 10. 15. 선고 2003후472 판결 신규성에서 정한 ‘동일한 발명’의 판단 기준","answer":"특허법 제29조 제1항의 발명의 동일성 여부의 판단은 특허청구범위에 기재된 양발명의 기술적 구성이 동 일한가 여부에 의하여 판단하되 그 효과도 참작하여야 할 것인바, 기술적 구성에 차이가 있더라도 그 차이가 과제 해결을 위한 구체적 수단에서 주지 관용기술의 부가, 삭제, 변경 등으로 새로운 효과의 발생이 없는 정도의미세한 차이에 불과하다면 양 발명은 서로 동일하다는 법리(대법원 2001.6.1. 선고 98후1013 판결, 2004.3.12. 선고 2002후2778 판결 등 참조) ...","slides":[{"label":"판시사항","text":"발명의 동일성 판단 대법원 2004. 10. 15. 선고 2003후472 판결 신규성에서 정한 ‘동일한 발명’의 판단 기준"},{"label":"판결요지","text":"특허법 제29조 제1항의 발명의 동일성 여부의 판단은 특허청구범위에 기재된 양발명의 기술적 구성이 동 일한가 여부에 의하여 판단하되 그 효과도 참작하여야 할 것인바, 기술적 구성에 차이가 있더라도 그 차이가 과제 해결을 위한 구체적 수단에서 주지 관용기술의 부가, 삭제, 변경 등으로 새로운 효과의 발생이 없는 정도의미세한 차이에 불과하다면 양 발명은 서로 동일하다는 법리(대법원 2001.6.1. 선고 98후1013 판결, 2004.3.12. 선고 2002후2778 판결 등 참조) ..."}]},{"section":"특허요건 - 신규성","question":"물건의 내재된 구조나 속성 대법원 2021. 12. 30. 선고 2017후1304 판결 [1] 특허발명에서 구성요소로 특정된 물건의 구성이나 속성이 선행발명에 명시적으로 개시되어 있지 는 않으나 선행발명에 개시된 물건이 특허발명과 동일한 구성이나 속성을 갖는 경우,특허발명의 신규성이 부정되는지 여부(원칙적 적극) 및 이는 위 발명이 속하는 기술분야에서 통상의 지식을 가진 사 람이 출원 당시 그 구성이나 속성을 인식할 수 없었던 경우에도 마찬가지인지 여부(적극) / 공지된 물 판시사항의 내재된 구성 또는 속성을 파악하기 위하여 출원일 이후 공지된 자료를 증거로 사용할 수 있는지 사항 여부(적극) [2] 선행발명에 개시된 물건이 특허발명과 동일한 구성 또는 속성을 가질 수도 있다는 가능성 또는 개 연성만으로 두 발명을 동일하다고 할 수 있는지 여부(소극) 및 선행발명이 특정 제조방법에 의해 제작 된 물건에 관한 공지된 문헌인 경우,위 제조방법에 따른 결과물이 필연적으로 특허발명과 동일한 구성 또는 속성을 가진다는 점이 증명되어야만 두 발명을 동일하다고 할 수 있는지 여부(적극)","answer":"물건의 발명에서 이와 동일한 발명이 그 출원 전에 공지되었거나 공연히 실시되었음이 인정되면 그 발명의 신규성은 부정된다.특허발명에서 구성요소로 특정된 물건의 구성이나 속성이 선행발명에 명시적으로 개시되어 있지 않은 경우라도 선행발명에 개시된 물건이 특허발명과 동일한 구성이나 속성을 갖는다는 점이 인 정된다면, 이는 선행발명에 내재된 구성 또는 속성으로 볼 수 있다. 이와 같은 경우 특허발명이 해당 구성 또 는 속성으로 인한 물질의 새로운 용도를 특허의 대상으로 한다는 등의 특별한 사정이 없는 한 공지된 물건에 원래부터 존재하였던 내재된 구성 또는 속성을 발견한 것에 불과하므로 신규성이 부정된다. 이는 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 출원 당시에 그 구성이나 속성을 인식할 수 없었던 경우에도 마찬가지이다. 또한 공지된 물건의 내재된 구성 또는 속성을 파악하기 위하여 출원일 이후 공지된 자료를 증거로 사용할 수 있다. 한편, 선행발명에 개시된 물건이 특허발명과 동일한 구성 또는 속성을 가질 수도 있다는 가능성 또는 개연성만으로는 두 발명을 동일하다고 할 수 없고, 필연적으로 그와 같은 구성 또는 속성을 가진다는 점이 증명되어야 한다. 즉, 선행발명이 공지된 물건 그 자체일 경우에는 그 물건과 특허발명의 구성을 대비하여 양 발명이 동일한지 판단할 수 있으나, 선행발명이 특정 제조방법에 의해 제작된 물건에 관한 공지된 문헌인 경우, 선행 발명에 개시된 물건은 선행발명에 개시된 제조방법에 따라 제조된 물건이므로, 선행발명에 개시된 제조방법에 따랐을 경우 우연한 결과일 수도 있는 한 실시례가 위와 같은 구성 또는 속성을 가진다는 점을 넘어 그 결 과물이 필연적으로 해당 구성 또는 속성을 가진다는 점이 증명되어야 선행발명과 특허발명이 동일하다고 할 수 있다. ","slides":[{"label":"판시사항","text":"물건의 내재된 구조나 속성 대법원 2021. 12. 30. 선고 2017후1304 판결"},{"label":"판시사항","text":"[1] 특허발명에서 구성요소로 특정된 물건의 구성이나 속성이 선행발명에 명시적으로 개시되어 있지 는 않으나 선행발명에 개시된 물건이 특허발명과 동일한 구성이나 속성을 갖는 경우,특허발명의 신규성이 부정되는지 여부(원칙적 적극) 및 이는 위 발명이 속하는 기술분야에서 통상의 지식을 가진 사 람이 출원 당시 그 구성이나 속성을 인식할 수 없었던 경우에도 마찬가지인지 여부(적극) / 공지된 물 판시사항의 내재된 구성 또는 속성을 파악하기 위하여 출원일 이후 공지된 자료를 증거로 사용할 수 있는지 사항 여부(적극)"},{"label":"판시사항","text":"[2] 선행발명에 개시된 물건이 특허발명과 동일한 구성 또는 속성을 가질 수도 있다는 가능성 또는 개 연성만으로 두 발명을 동일하다고 할 수 있는지 여부(소극) 및 선행발명이 특정 제조방법에 의해 제작 된 물건에 관한 공지된 문헌인 경우,위 제조방법에 따른 결과물이 필연적으로 특허발명과 동일한 구성 또는 속성을 가진다는 점이 증명되어야만 두 발명을 동일하다고 할 수 있는지 여부(적극)"},{"label":"판결요지","text":"물건의 발명에서 이와 동일한 발명이 그 출원 전에 공지되었거나 공연히 실시되었음이 인정되면 그 발명의 신규성은 부정된다.특허발명에서 구성요소로 특정된 물건의 구성이나 속성이 선행발명에 명시적으로 개시되어 있지 않은 경우라도 선행발명에 개시된 물건이 특허발명과 동일한 구성이나 속성을 갖는다는 점이 인 정된다면, 이는 선행발명에 내재된 구성 또는 속성으로 볼 수 있다. 이와 같은 경우 특허발명이 해당 구성 또 는 속성으로 인한 물질의 새로운 용도를 특허의 대상으로 한다는 등의 특별한 사정이 없는 한 공지된 물건에 원래부터 존재하였던 내재된 구성 또는 속성을 발견한 것에 불과하므로 신규성이 부정된다. 이는 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 출원 당시에 그 구성이나 속성을 인식할 수 없었던 경우에도 마찬가지이다. 또한 공지된 물건의 내재된 구성 또는 속성을 파악하기 위하여 출원일 이후 공지된 자료를 증거로 사용할 수 있다. 한편, 선행발명에 개시된 물건이 특허발명과 동일한 구성 또는 속성을 가질 수도 있다는 가능성 또는 개연성만으로는 두 발명을 동일하다고 할 수 없고, 필연적으로 그와 같은 구성 또는 속성을 가진다는 점이 증명되어야 한다. 즉, 선행발명이 공지된 물건 그 자체일 경우에는 그 물건과 특허발명의 구성을 대비하여 양 발명이 동일한지 판단할 수 있으나, 선행발명이 특정 제조방법에 의해 제작된 물건에 관한 공지된 문헌인 경우, 선행 발명에 개시된 물건은 선행발명에 개시된 제조방법에 따라 제조된 물건이므로, 선행발명에 개시된 제조방법에 따랐을 경우 우연한 결과일 수도 있는 한 실시례가 위와 같은 구성 또는 속성을 가진다는 점을 넘어 그 결 과물이 필연적으로 해당 구성 또는 속성을 가진다는 점이 증명되어야 선행발명과 특허발명이 동일하다고 할 수 있다. "}]},{"section":"특허요건 - 진보성","question":"진보성 판단순서 대법원 2019. 10. 31. 선고 2015후2341 판결 출원발명의 진보성을 판단하는 방법","answer":"출원발명의 진보성을 판단함에 있어서, 먼저 출원발명의 청구범위와 기술사상, 선행발명의 범위와 기술 내용을 확정하고, 출원발명과 가장 가까운 선행발명[이하 ‘주(主) 선행발명’이라고 한다]을 선택한 다음, 출원발명을 주선행발명과 대비하여 공통점과 차이점을 확인하고, 그 발명이 속하는 기술분야에서 통상의 지식 을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 특허출원 당시의 기술수준에 비추어 이와 같은 차이점을 극 복하고 출원발명을 쉽게 발명할 수 있는지를 심리한다.","slides":[{"label":"판시사항","text":"진보성 판단순서 대법원 2019. 10. 31. 선고 2015후2341 판결 출원발명의 진보성을 판단하는 방법"},{"label":"판결요지","text":"출원발명의 진보성을 판단함에 있어서, 먼저 출원발명의 청구범위와 기술사상, 선행발명의 범위와 기술 내용을 확정하고, 출원발명과 가장 가까운 선행발명[이하 ‘주(主) 선행발명’이라고 한다]을 선택한 다음, 출원발명을 주선행발명과 대비하여 공통점과 차이점을 확인하고, 그 발명이 속하는 기술분야에서 통상의 지식 을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 특허출원 당시의 기술수준에 비추어 이와 같은 차이점을 극 복하고 출원발명을 쉽게 발명할 수 있는지를 심리한다."}]},{"section":"특허요건 - 진보성","question":"효과의 현저성 고려 및 인정 대법원 2021. 4. 8. 선고 2019후10609 판결 특허발명의 진보성을 판단할 때 그 발명이 갖는 특유한 효과도 함께 고려하여야 하는지 여부(적극) / 구성의 곤란성 여부 판단이 불분명한 경우라도 특허발명이 선행발명에 비하여 이질적이거나 양적으로 현저한 효과를 가지고 있다면 진보성이 부정되지 않는지 여부(적극)","answer":"발명의 효과가 선행발명에 비하여 현저하다면 구성의 곤란성을 추론하는 유력한 자료가 될 것이다. 나아가 구성의 곤란성 여부의 판단이 불분명한 경우라고 하더라도, 특허발명이 선행발명에 비하여 이질적이거나 양적으로 현저한 효과를 가지고 있다면 진보성이 부정되지 않는다. 효과의 현저성은 특허발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심으로 판단하여야 하고, 만일 그 효과가 의심스러 울 때에는 그 기재내용의 범위를 넘지 않는 한도에서 출원일 이후에 추가적인 실험 자료를 제출하는 등의 방법 으로 그 효과를 구체적으로 주장․증명하는 것이 허용된다.","slides":[{"label":"판시사항","text":"효과의 현저성 고려 및 인정 대법원 2021. 4. 8. 선고 2019후10609 판결 특허발명의 진보성을 판단할 때 그 발명이 갖는 특유한 효과도 함께 고려하여야 하는지 여부(적극) / 구성의 곤란성 여부 판단이 불분명한 경우라도 특허발명이 선행발명에 비하여 이질적이거나 양적으로 현저한 효과를 가지고 있다면 진보성이 부정되지 않는지 여부(적극)"},{"label":"판결요지","text":"발명의 효과가 선행발명에 비하여 현저하다면 구성의 곤란성을 추론하는 유력한 자료가 될 것이다. 나아가 구성의 곤란성 여부의 판단이 불분명한 경우라고 하더라도, 특허발명이 선행발명에 비하여 이질적이거나 양적으로 현저한 효과를 가지고 있다면 진보성이 부정되지 않는다. 효과의 현저성은 특허발명의 명세서에 기재되어 통상의 기술자가 인식하거나 추론할 수 있는 효과를 중심으로 판단하여야 하고, 만일 그 효과가 의심스러 울 때에는 그 기재내용의 범위를 넘지 않는 한도에서 출원일 이후에 추가적인 실험 자료를 제출하는 등의 방법 으로 그 효과를 구체적으로 주장․증명하는 것이 허용된다."}]},{"section":"특허요건 - 진보성","question":"사후적 고찰금지 대법원 2018. 12. 13. 선고 2016후1840 판결 발명의 진보성 유무를 판단하는 방법 / 진보성 판단의 대상이 된 발명의 명세서에 개시되어 있는 기술을 알고 있음을 전제로 하여 사후적으로 통상의 기술자가 쉽게 발명할 수 있는지를 판단할 수 있는 지 여부","answer":"발명의 진보성 유무를 판단할 때에는 적어도 선행기술의 범위와 내용, 진보성 판단의 대상이 된 발명과 선 행기술의 차이와 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)의 기술수준을 증거 등 기록에 나타난 자료에 기초하여 파악할 필요가 있다. 그리고 특허출원 당시의 기술수준 에 비추어 진보성 판단의 대상이 된 발명이 선행기술과 차이가 있더라도, 통상의 기술자가 그러한 차이를 극 복하고 선행기술로부터 쉽게 발명할 수 있는지를 살펴보아야 한다. 이 경우 진보성 판단의 대상이 된 발명의 명세서에 개시되어 있는 기술을 알고 있음을 전제로 사후적으로 통상의 기술자가 쉽게 발명할 수 있는지를 판단해서는 안 된다.","slides":[{"label":"판시사항","text":"사후적 고찰금지 대법원 2018. 12. 13. 선고 2016후1840 판결 발명의 진보성 유무를 판단하는 방법 / 진보성 판단의 대상이 된 발명의 명세서에 개시되어 있는 기술을 알고 있음을 전제로 하여 사후적으로 통상의 기술자가 쉽게 발명할 수 있는지를 판단할 수 있는 지 여부"},{"label":"판결요지","text":"발명의 진보성 유무를 판단할 때에는 적어도 선행기술의 범위와 내용, 진보성 판단의 대상이 된 발명과 선 행기술의 차이와 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)의 기술수준을 증거 등 기록에 나타난 자료에 기초하여 파악할 필요가 있다. 그리고 특허출원 당시의 기술수준 에 비추어 진보성 판단의 대상이 된 발명이 선행기술과 차이가 있더라도, 통상의 기술자가 그러한 차이를 극 복하고 선행기술로부터 쉽게 발명할 수 있는지를 살펴보아야 한다. 이 경우 진보성 판단의 대상이 된 발명의 명세서에 개시되어 있는 기술을 알고 있음을 전제로 사후적으로 통상의 기술자가 쉽게 발명할 수 있는지를 판단해서는 안 된다."}]},{"section":"특허요건 - 진보성","question":"2차적 고려요소 - 상업적 성공, 장기간 미실시 해결 대법원 2008. 5. 29. 선고 2006후3052 판결 판시 특허발명의 제품이 상업적으로 성공하였거나 특허발명의 출원 전에 오랫동안 실시했던 사람이 없었 사항 다는 사정만으로 발명의 진보성을 인정할 수 있는지 여부(소극)","answer":"특허발명의 제품이 상업적으로 성공을 하였거나 특허발명의 출원 전에 오랫동안 실시했던 사람이 없었던 점 등의 사정은 진보성을 인정하는 하나의 자료로 참고할 수 있지만, 이러한 사정만으로 진보성이 인정된다고 할 수는 없고, 특허발명의 진보성에 대한 판단은 우선적으로 명세서에 기재된 내용, 즉 발명의 목적, 구성 및 효과를 토대로 선행 기술에 기하여 당해 기술분야에서 통상의 지식을 가진 자가 이를 용이하게 발명할 수 있 는지 여부에 따라 판단되어야 하는 것이므로 이러한 사정이 있다는 이유만으로 발명의 진보성을 인정할 수 없다.","slides":[{"label":"판시사항","text":"2차적 고려요소 - 상업적 성공, 장기간 미실시 해결 대법원 2008. 5. 29. 선고 2006후3052 판결 판시 특허발명의 제품이 상업적으로 성공하였거나 특허발명의 출원 전에 오랫동안 실시했던 사람이 없었 사항 다는 사정만으로 발명의 진보성을 인정할 수 있는지 여부(소극)"},{"label":"판결요지","text":"특허발명의 제품이 상업적으로 성공을 하였거나 특허발명의 출원 전에 오랫동안 실시했던 사람이 없었던 점 등의 사정은 진보성을 인정하는 하나의 자료로 참고할 수 있지만, 이러한 사정만으로 진보성이 인정된다고 할 수는 없고, 특허발명의 진보성에 대한 판단은 우선적으로 명세서에 기재된 내용, 즉 발명의 목적, 구성 및 효과를 토대로 선행 기술에 기하여 당해 기술분야에서 통상의 지식을 가진 자가 이를 용이하게 발명할 수 있 는지 여부에 따라 판단되어야 하는 것이므로 이러한 사정이 있다는 이유만으로 발명의 진보성을 인정할 수 없다."}]},{"section":"특허요건 - 진보성","question":"결합발명의 진보성 판단 대법원 2010. 9. 9. 선고 2009후1897 판결 판시 특허발명의 특허청구범위에 기재된 청구항이 복수의 구성요소로 되어 있는 경우 진보성의 판단 방법 사항 및 여러 선행기술문헌을 인용하여 특허발명의 진보성을 판단하는 기준","answer":"그 특허발명의 진보성 여부를 판단함에 있어서는 청구항에 기재된 복수의 구성을 분해한 후 각각 분해된 개별 구성요소들이 공지된 것인지 여부만을 따져서는 안 되고, 특유의 과제 해결원리에 기초하여 유기적으로 결합된 전체로서의 구성의 곤란성을 따져 보아야 할 것이며, 이 때 결합된 전체 구성으로서의 발명이 갖는 특 유한 효과도 함께 고려하여야 할 것이다. 그리고 여러 선행기술문헌을 인용하여 특허발명의 진보성을 판단함 에 있어서는 그 인용되는 기술을 조합 또는 결합하면 당해 특허발명에 이를 수 있다는 암시, 동기 등이 선행기술문헌에 제시되어 있거나 그렇지 않더라도 당해 특허발명의 출원 당시의 기술수준, 기술상식, 해당 기술분야 의 기본적 과제, 발전경향, 해당 업계의 요구 등에 비추어 보아 그 기술분야에 통상의 지식을 가진 자(이하 ‘통 상의 기술자’라고 한다)가 용이하게 그와 같은 결합에 이를 수 있다고 인정할 수 있는 경우에는 당해 특허발명 의 진보성은 부정된다고 할 것이다.","slides":[{"label":"판시사항","text":"결합발명의 진보성 판단 대법원 2010. 9. 9. 선고 2009후1897 판결 판시 특허발명의 특허청구범위에 기재된 청구항이 복수의 구성요소로 되어 있는 경우 진보성의 판단 방법 사항 및 여러 선행기술문헌을 인용하여 특허발명의 진보성을 판단하는 기준"},{"label":"판결요지","text":"그 특허발명의 진보성 여부를 판단함에 있어서는 청구항에 기재된 복수의 구성을 분해한 후 각각 분해된 개별 구성요소들이 공지된 것인지 여부만을 따져서는 안 되고, 특유의 과제 해결원리에 기초하여 유기적으로 결합된 전체로서의 구성의 곤란성을 따져 보아야 할 것이며, 이 때 결합된 전체 구성으로서의 발명이 갖는 특 유한 효과도 함께 고려하여야 할 것이다. 그리고 여러 선행기술문헌을 인용하여 특허발명의 진보성을 판단함 에 있어서는 그 인용되는 기술을 조합 또는 결합하면 당해 특허발명에 이를 수 있다는 암시, 동기 등이 선행기술문헌에 제시되어 있거나 그렇지 않더라도 당해 특허발명의 출원 당시의 기술수준, 기술상식, 해당 기술분야 의 기본적 과제, 발전경향, 해당 업계의 요구 등에 비추어 보아 그 기술분야에 통상의 지식을 가진 자(이하 ‘통 상의 기술자’라고 한다)가 용이하게 그와 같은 결합에 이를 수 있다고 인정할 수 있는 경우에는 당해 특허발명 의 진보성은 부정된다고 할 것이다."}]},{"section":"특허요건 - 진보성","question":"결합발명의 진보성 판단 (화학분야) 대법원 2020. 5. 14. 선고 2017후2543 판결 여러 선행기술문헌을 인용하여 특허발명의 진보성을 판단하는 기준","answer":"통상의 기술자에게 VA 모드의 액정조성물에 중합성 화합물을 추가한다는 착상 자체는 이미 공지된 기술사상이어서 별다른 어려움이 없겠지만, 구체적으로 선행발명 4에 개시된 제1, 2 성분에 선행발명 5 에 개시된 제3 성분을 결합할 경우 제 1, 2 성분의 특성을 저해하지 않으면서 제3 성분의 효과가 발휘될 것인 지는 쉽게 예측하기 어려우므로, 그 결합이 쉽다고 단정할 수 없다. ... 원심이 선행기술들의 결합에 의한 효과 예측이 어려운 화학발명의 특성에도 불구하고 양자의 기술분야, 해 결과제 등이 공통된다는 점을 들어 선행발명 4에 선행발명 5를 결합하는 것이 쉽다고 한 것은 다소 부적절하 지만, 결과적으로 선행발명 4, 5를 결합하더라도 이 사건 제1항 정정발명의 진보성이 부정되지 않는다고 한 것은 정당하다.","slides":[{"label":"판시사항","text":"결합발명의 진보성 판단 (화학분야) 대법원 2020. 5. 14. 선고 2017후2543 판결 여러 선행기술문헌을 인용하여 특허발명의 진보성을 판단하는 기준"},{"label":"판결요지","text":"통상의 기술자에게 VA 모드의 액정조성물에 중합성 화합물을 추가한다는 착상 자체는 이미 공지된 기술사상이어서 별다른 어려움이 없겠지만, 구체적으로 선행발명 4에 개시된 제1, 2 성분에 선행발명 5 에 개시된 제3 성분을 결합할 경우 제 1, 2 성분의 특성을 저해하지 않으면서 제3 성분의 효과가 발휘될 것인 지는 쉽게 예측하기 어려우므로, 그 결합이 쉽다고 단정할 수 없다. ... 원심이 선행기술들의 결합에 의한 효과 예측이 어려운 화학발명의 특성에도 불구하고 양자의 기술분야, 해 결과제 등이 공통된다는 점을 들어 선행발명 4에 선행발명 5를 결합하는 것이 쉽다고 한 것은 다소 부적절하 지만, 결과적으로 선행발명 4, 5를 결합하더라도 이 사건 제1항 정정발명의 진보성이 부정되지 않는다고 한 것은 정당하다."}]},{"section":"특허요건 - 진보성","question":"상이한 기술분야의 기술문헌 인용 대법원 2008. 7. 10. 선고 2006후2059 판결 기술분야를 비교하여 비교대상발명을 특허발명의 진보성을 부정하는 선행기술로 삼을 수 있는 경우","answer":"당해 특허발명이 이용되는 산업분야가 비교대상발명의 그것과 다른 경우에는 비교대상발명을 당해 특허발명의 진보성을 부정하는 선행기술로 사용하기 어렵다 하더라도, 문제가 된 비교대상발명의 기술적 구성이 특정 산업분야에만 적용될 수 있는 구성이 아니고 당해 특허발명의 산업분야에서 통상의 지식을 가진 자가 특허발명의 당면한 기술적 문제를 해결하기 위하여 별다른 어려움 없이 이용할 수 있는 구성이라면, 이를 당 해 특허발명의 진보성을 부정하는 선행기술로 삼을 수 있다.","slides":[{"label":"판시사항","text":"상이한 기술분야의 기술문헌 인용 대법원 2008. 7. 10. 선고 2006후2059 판결 기술분야를 비교하여 비교대상발명을 특허발명의 진보성을 부정하는 선행기술로 삼을 수 있는 경우"},{"label":"판결요지","text":"당해 특허발명이 이용되는 산업분야가 비교대상발명의 그것과 다른 경우에는 비교대상발명을 당해 특허발명의 진보성을 부정하는 선행기술로 사용하기 어렵다 하더라도, 문제가 된 비교대상발명의 기술적 구성이 특정 산업분야에만 적용될 수 있는 구성이 아니고 당해 특허발명의 산업분야에서 통상의 지식을 가진 자가 특허발명의 당면한 기술적 문제를 해결하기 위하여 별다른 어려움 없이 이용할 수 있는 구성이라면, 이를 당 해 특허발명의 진보성을 부정하는 선행기술로 삼을 수 있다."}]},{"section":"특허요건 - 선출원주의&확대된 선출원주의","question":"선출원주의상 발명의 동일성 대법원 2009. 9. 24. 선고 2007후2827 판결 [1] 선출원주의 하에서 정한 ‘동일한 발명’의 의미","answer":"전후로 출원된 양 발명이 동일하다고 함은 그 기술적 구성이 전면적으로 일치하는 경우는 물론 그 범위에 차 이가 있을 뿐 부분적으로 일치하는 경우라도 특별한 사정이 없는 한, 양 발명은 동일하고, 비록 양 발명의 구성 에 상이점이 있어도 그 기술분야에 통상의 지식을 가진 자가 보통으로 채용하는 정도의 변경에 지나지 아니하 고 발명의 목적과 작용효과에 특별한 차이를 일으키지 아니하는 경우에는 양 발명은 역시 동일한 발명이다.","slides":[{"label":"판시사항","text":"선출원주의상 발명의 동일성 대법원 2009. 9. 24. 선고 2007후2827 판결"},{"label":"판시사항","text":"[1] 선출원주의 하에서 정한 ‘동일한 발명’의 의미"},{"label":"판결요지","text":"전후로 출원된 양 발명이 동일하다고 함은 그 기술적 구성이 전면적으로 일치하는 경우는 물론 그 범위에 차 이가 있을 뿐 부분적으로 일치하는 경우라도 특별한 사정이 없는 한, 양 발명은 동일하고, 비록 양 발명의 구성 에 상이점이 있어도 그 기술분야에 통상의 지식을 가진 자가 보통으로 채용하는 정도의 변경에 지나지 아니하 고 발명의 목적과 작용효과에 특별한 차이를 일으키지 아니하는 경우에는 양 발명은 역시 동일한 발명이다."}]},{"section":"특허요건 - 선출원주의&확대된 선출원주의","question":"확대된 선출원주의상 발명의 동일성 대법원 2021. 9. 16. 선고 2017후2369 판결 [1] 특허출원한 발명이 그보다 먼저 출원되었으나 나중에 공개된 다른 발명의 특허출원서에 최초로 첨부 판시 된 명세서에 기재된 청구범위나 발명의 설명 또는 도면의 내용과 동일성이 인정되는 경우, 특허를 받을 사항 수 있는지 여부(소극) [2]구 특허법 제29조 제3항에서 말하는 ‘발명의 동일성’을 판단하는 기준","answer":"구 특허법(2006. 3. 3. 법률 제7871호로 개정되기 전의 것, 이하 같다) 제29조 제3항에서 말하는 발명의 동일성은 발명의 진보성과는 구별되는 것으로서 두 발명의 기술적구성이 동일한지 여부에 따르되 발명의 효과도 참작해서 판단해야 한다. 두 발명의 기술적 구성에 차이가 있더라도 그 차이가 과제해결을 위 한 구체적 수단에서 주지관용기술의 부가․삭제․변경 등에 지나지 않아 새로운 효과가 발생하지 않는 정도의미세한 차이가 있을 뿐이라면 두 발명은 서로 실질적으로 동일하다고 할 수 있다. 그러나 두 발명의 기술 적 구성의 차이가 위와 같은 정도를 벗어난다면 설령 그 차이가 그 발명이 속하는 기술분야에서 통상의 지 식을 가진 사람(이하 ‘통상의 기술자’라 한다)이 용이하게 도출할 수 있는 범위 내라고 하더라도 두 발명이 동 일하다고 할 수 없다. ","slides":[{"label":"판시사항","text":"확대된 선출원주의상 발명의 동일성 대법원 2021. 9. 16. 선고 2017후2369 판결"},{"label":"판시사항","text":"[1] 특허출원한 발명이 그보다 먼저 출원되었으나 나중에 공개된 다른 발명의 특허출원서에 최초로 첨부 판시 된 명세서에 기재된 청구범위나 발명의 설명 또는 도면의 내용과 동일성이 인정되는 경우, 특허를 받을 사항 수 있는지 여부(소극)"},{"label":"판시사항","text":"[2]구 특허법 제29조 제3항에서 말하는 ‘발명의 동일성’을 판단하는 기준"},{"label":"판결요지","text":"구 특허법(2006. 3. 3. 법률 제7871호로 개정되기 전의 것, 이하 같다) 제29조 제3항에서 말하는 발명의 동일성은 발명의 진보성과는 구별되는 것으로서 두 발명의 기술적구성이 동일한지 여부에 따르되 발명의 효과도 참작해서 판단해야 한다. 두 발명의 기술적 구성에 차이가 있더라도 그 차이가 과제해결을 위 한 구체적 수단에서 주지관용기술의 부가․삭제․변경 등에 지나지 않아 새로운 효과가 발생하지 않는 정도의미세한 차이가 있을 뿐이라면 두 발명은 서로 실질적으로 동일하다고 할 수 있다. 그러나 두 발명의 기술 적 구성의 차이가 위와 같은 정도를 벗어난다면 설령 그 차이가 그 발명이 속하는 기술분야에서 통상의 지 식을 가진 사람(이하 ‘통상의 기술자’라 한다)이 용이하게 도출할 수 있는 범위 내라고 하더라도 두 발명이 동 일하다고 할 수 없다. 6 특허를 받을 수 있는 자 - 정당한 권리자/무권리자"}]},{"section":"특허요건 - 특허를 받을 수 있는 자 - 정당한 권리자/무권리자","question":"특허를 받을 수 있는 권리를 갖는 자 대법원 2012. 12. 27. 선고 2011다67705,67712 판결 [1] 특허법 제33조 제1항‘발명을 한 자’의 의미 및 화학발명의 경우 발명자인지를 결정하는 기준 판시 [2] 특허를 받을 수 있는 권리를 이전하기로 하는 계약을 묵시적으로도 할 수 있는지 여부(적극) 및 그러 사항한 계약에 따라 특허등록을 공동출원한 경우 출원인이 발명자가 아니라도 등록된 특허권의 공유지분을 가지는지 여부(적극)","answer":"특허법 제33조 제1항 본문은 발명을 한 자 또는 그 승계인은 특허법에서 정하는 바에 의하여 특허를 받을 수 있는 권리를 가진다고 규정하고 있는데, 특허법 제2조 제1호는 ‘발명’이란 자연법칙을 이용한 기술적 사상의 창작으로서 고도한 것을 말한다고 규정하고 있으므로, 특허법 제33조 제1항에서 정하고 있는 ‘발명 을 한 자’는 바로 이러한 발명행위를 한 사람을 가리킨다고 할 것이다. 따라서 발명자(공동발명자를 포함한다)에 해당한다고 하기 위해서는 단순히 발명에 대한 기본적인 과제와 아 이디어만을 제공하였거나 연구자를 일반적으로 관리하고 연구자의 지시로 데이터의 정리와 실험만을 한 경우 또는 자금 설비 등을 제공하여 발명의 완성을 후원 위탁하였을 뿐인 정도 등에 그치지 않고, 발명의 기술적 과 제를 해결하기 위한 구체적인 착상을 새롭게 제시 부가 보완하거나, 실험 등을 통하여 새로운 착상을 구체화 하거나, 발명의 목적 및 효과를 달성하기 위한 구체적인 수단과 방법의 제공 또는 구체적인 조언 지도를 통하 여 발명을 가능하게 한 경우 등과 같이 기술적 사상의 창작행위에 실질적으로 기여하기에 이르러야 한다. 한편 이른바 실험의 과학이라고 하는 화학발명의 경우에는 당해 발명 내용과 기술수준에 따라 차이가 있을 수는 있지만 예측가능성 내지 실현가능성이 현저히 부족하여 실험데이터가 제시된 실험예가 없으면 완성된 발명으로 보기 어려운 경우가 많이 있는데, 그와 같은 경우에는 실제 실험을 통하여 발명을 구체화하 고 완성하는 데 실질적으로 기여하였는지의 관점에서 발명자인지 여부를 결정해야 한다. ... 특허를 받을 수 있는 권리는 발명의 완성과 동시에 발명자에게 원시적으로 귀속되지만, 이는 재산권으로 양 도성을 가지므로 계약 또는 상속 등을 통하여 그 전부 또는 일부 지분을 이전할 수 있고(특허법 제37조 제1 항), 그 권리를 이전하기로 하는 계약은 명시적으로는 물론 묵시적으로도 이루어질 수 있고, 그러한 계약에 따라 특허등록을 공동출원한 경우에는 그 출원인이 발명자가 아니라도 등록된 특허권의 공유지분을 가진다 할 것이다.","slides":[{"label":"판시사항","text":"특허를 받을 수 있는 권리를 갖는 자 대법원 2012. 12. 27. 선고 2011다67705,67712 판결"},{"label":"판시사항","text":"[1] 특허법 제33조 제1항‘발명을 한 자’의 의미 및 화학발명의 경우 발명자인지를 결정하는 기준 판시"},{"label":"판시사항","text":"[2] 특허를 받을 수 있는 권리를 이전하기로 하는 계약을 묵시적으로도 할 수 있는지 여부(적극) 및 그러 사항한 계약에 따라 특허등록을 공동출원한 경우 출원인이 발명자가 아니라도 등록된 특허권의 공유지분을 가지는지 여부(적극)"},{"label":"판결요지","text":"특허법 제33조 제1항 본문은 발명을 한 자 또는 그 승계인은 특허법에서 정하는 바에 의하여 특허를 받을 수 있는 권리를 가진다고 규정하고 있는데, 특허법 제2조 제1호는 ‘발명’이란 자연법칙을 이용한 기술적 사상의 창작으로서 고도한 것을 말한다고 규정하고 있으므로, 특허법 제33조 제1항에서 정하고 있는 ‘발명 을 한 자’는 바로 이러한 발명행위를 한 사람을 가리킨다고 할 것이다. 따라서 발명자(공동발명자를 포함한다)에 해당한다고 하기 위해서는 단순 재(=무효라고 주장하는 당사자)","answer":"무권리자의 출원을 무효사유로 한 특허무효심판 및 그에 따른 심결취소소송에서 위와 같은 무효사유에 관한 증명책임은 무효라고 주장하는 당사자에게 있다.","slides":[{"label":"판시사항","text":"무권리자 출원의 증명책임 대법원 2022. 11. 17. 선고 2019후11268 판결 판시 특허를 받을 수 있는 권리를 가지지 아니한 사람의 특허출원을 무효사유로 한 특허무효심판 및 그에 따 사항 른 심결취소소송에서 무효사유에 관한 증명책임의 소재(=무효라고 주장하는 당사자)"},{"label":"판결요지","text":"무권리자의 출원을 무효사유로 한 특허무효심판 및 그에 따른 심결취소소송에서 위와 같은 무효사유에 관한 증명책임은 무효라고 주장하는 당사자에게 있다."}]},{"section":"특허요건 - 특허를 받을 수 있는 자 - 정당한 권리자/무권리자","question":"타인의 선발명 일부 구성을 변경한 경우 대법원 2011. 9. 29. 선고 2009후2463 판결 발명자가 아닌 사람으로서 특허를 받을 수 있는 권리의 승계인이 아닌 사람이 발명자가 한 발명의 구성 을 일부 변경하여 발명자의 발명과 기술적 구성이 상이하게 되었으나 기술적 사상의 창작에 실질적으로 기여하지 않은 경우, 그 특허등록이 무효인지 여부(적극)","answer":"발명자가 아닌 사람으로서 특허를 받을 수 있는 권리의 승계인이 아닌 사람(이하 ‘무권리자’라 한다)이 발명 자가 한 발명의 구성을 일부 변경함으로써 그 기술적 구성이 발명자가 한 발명과 상이하게 되었다 하더라도, 그 변경이 그 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 보통으로 채용하는 정도의 기술적 구성의 부가 삭제 변경에 지나지 아니하고 그로 인하여 발명의 작용효과에 특별한 차이를 일 으키지 아니하는 등 기술적 사상의 창작에 실질적으로 기여하지 않은 경우에는 그 특허발명은 무권리자의 특허출원에 해당하여 그 등록이 무효라고 할 것이다.","slides":[{"label":"판시사항","text":"타인의 선발명 일부 구성을 변경한 경우 대법원 2011. 9. 29. 선고 2009후2463 판결 발명자가 아닌 사람으로서 특허를 받을 수 있는 권리의 승계인이 아닌 사람이 발명자가 한 발명의 구성 을 일부 변경하여 발명자의 발명과 기술적 구성이 상이하게 되었으나 기술적 사상의 창작에 실질적으로 기여하지 않은 경우, 그 특허등록이 무효인지 여부(적극)"},{"label":"판결요지","text":"발명자가 아닌 사람으로서 특허를 받을 수 있는 권리의 승계인이 아닌 사람(이하 ‘무권리자’라 한다)이 발명 자가 한 발명의 구성을 일부 변경함으로써 그 기술적 구성이 발명자가 한 발명과 상이하게 되었다 하더라도, 그 변경이 그 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라고 한다)이 보통으로 채용하는 정도의 기술적 구성의 부가 삭제 변경에 지나지 아니하고 그로 인하여 발명의 작용효과에 특별한 차이를 일 으키지 아니하는 등 기술적 사상의 창작에 실질적으로 기여하지 않은 경우에는 그 특허발명은 무권리자의 특허출원에 해당하여 그 등록이 무효라고 할 것이다."}]},{"section":"특허요건 - 특허를 받을 수 있는 자 - 정당한 권리자/무권리자","question":"특받권을 양도한 자에 의한 특허권 및 그 양수인 대법원 2020. 5. 14. 선고 2020후10087 판결 [1] 특허출원 전에 특허를 받을 수 있는 권리를 계약에 따라 이전한 양도인이 특허출원을 하여 설정등록이 판시 이루어진 경우, 그 특허권이 특허무효사유에 해당하는 ‘정당한 권리자 아닌 사람’의 특허인지 여부(적극) 사항 [2]특허법 제38조 제1항에서 규정한 ‘제3자’의 의미 및 ‘정당한 권리자 아닌 사람’의 특허로서 특허무효사유가 있는 특허권을 이전받은 양수인이 이에 해당하는지 여부(소극)","answer":"특허출원 전에 특허를 받을 수 있는 권리를 계약에 따라 이전한 양도인은 더 이상 그 권리의 귀속주체가 아니 므로 그러한 양도인이 한 특허출원에 대하여 설정등록이 이루어진 특허권은 특허무효사유에 해당하는 무권리자의 특허이다. 특허출원 전에 이루어진 특허를 받을 수 있는 권리의 승계는 그 승계인이 특허출원을 하여야 제3자에게 대항할 수 있다(특허법 제38조 제1항). 여기서 제3자는 특허를 받을 수 있는 권리에 관하여 승계인의 지위 와 양립할 수 없는 법률상 지위를 취득한 사람에 한한다. 무권리자의 특허로서 특허무효사유가 있는 특허권 을 이전받은 양수인은 특허법 제38조 제1항에서 말하는 제3자에 해당하지 않는다.","slides":[{"label":"판시사항","text":"특받권을 양도한 자에 의한 특허권 및 그 양수인 대법원 2020. 5. 14. 선고 2020후10087 판결"},{"label":"판시사항","text":"[1] 특허출원 전에 특허를 받을 수 있는 권리를 계약에 따라 이전한 양도인이 특허출원을 하여 설정등록이 판시 이루어진 경우, 그 특허권이 특허무효사유에 해당하는 ‘정당한 권리자 아닌 사람’의 특허인지 여부(적극) 사항"},{"label":"판시사항","text":"[2]특허법 제38조 제1항에서 규정한 ‘제3자’의 의미 및 ‘정당한 권리자 아닌 사람’의 특허로서 특허무효사유가 있는 특허권을 이전받은 양수인이 이에 해당하는지 여부(소극)"},{"label":"판결요지","text":"특허출원 전에 특허를 받을 수 있는 권리를 계약에 따라 이전한 양도인은 더 이상 그 권리의 귀속주체가 아니 므로 그러한 양도인이 한 특허출원에 대하여 설정등록이 이루어진 특허권은 특허무효사유에 해당하는 무권리자의 특허이다. 특허출원 전에 이루어진 특허를 받을 수 있는 권리의 승계는 그 승계인이 특허출원을 하여야 제3자에게 대항할 수 있다(특허법 제38조 제1항). 여기서 제3자는 특허를 받을 수 있는 권리에 관하여 승계인의 지위 와 양립할 수 없는 법률상 지위를 취득한 사람에 한한다. 무권리자의 특허로서 특허무효사유가 있는 특허권 을 이전받은 양수인은 특허법 제38조 제1항에서 말하는 제3자에 해당하지 않는다."}]},{"section":"특허요건 - 명세서 기재요건","question":"실시가능 요건 - ‘쉽게 실시’ (물건발명) 대법원 2016. 5. 26. 선고 2014후2061 판결 ‘물건의 발명’에서 발명 ‘실시’의 의미 및 위 조항에서 정한 기재요건을 충족하는 경우","answer":"그런데 ‘물건의 발명’의 경우 그 발명의 ‘실시’라고 함은 그 물건을 생산, 사용하는 등의 행위를 말하므로, 물건의 발명에서 통상의 기술자가 특허출원 당시의 기술수준으로 보아 과도한 실험이나 특수한 지식을 부가 하지 않고서도 발명의 상세한 설명에 기재된 사항에 의하여 물건 자체를 생산하고 이를 사용할 수 있고, 구체적인 실험 등으로 증명이 되어 있지 않더라도 특허출원 당시의 기술수준으로 보아 통상의 기술자가 발명의 효과의 발생을 충분히 예측할 수 있다면, 위 조항에서 정한 기재요건을 충족한다고 볼 수 있다.","slides":[{"label":"판시사항","text":"실시가능 요건 - ‘쉽게 실시’ (물건발명) 대법원 2016. 5. 26. 선고 2014후2061 판결 ‘물건의 발명’에서 발명 ‘실시’의 의미 및 위 조항에서 정한 기재요건을 충족하는 경우"},{"label":"판결요지","text":"그런데 ‘물건의 발명’의 경우 그 발명의 ‘실시’라고 함은 그 물건을 생산, 사용하는 등의 행위를 말하므로, 물건의 발명에서 통상의 기술자가 특허출원 당시의 기술수준으로 보아 과도한 실험이나 특수한 지식을 부가 하지 않고서도 발명의 상세한 설명에 기재된 사항에 의하여 물건 자체를 생산하고 이를 사용할 수 있고, 구체적인 실험 등으로 증명이 되어 있지 않더라도 특허출원 당시의 기술수준으로 보아 통상의 기술자가 발명의 효과의 발생을 충분히 예측할 수 있다면, 위 조항에서 정한 기재요건을 충족한다고 볼 수 있다."}]},{"section":"특허요건 - 명세서 기재요건","question":"실시가능 요건 - ‘쉽게 실시’ (제법발명) 대법원 2024. 1. 11. 선고 2020후10292 판결 물건을 생산하는 방법의 발명에서 발명의 ‘실시’의 의미 및 발명의 설명에 청구범위에 특정된 방법 전체 의 사용 등에 관하여 그 생산 방법을 사용할 수 있을 정도의 명확하고 상세한 기재가 없는 경우, 특허법 제42조 제3항 제1호에서 정한 기재요건을 충족한다고 볼 수 있는지 여부(소극)","answer":"물건을 생산하는 방법의 발명의 경우 그 발명의 '실시'란 물건을 생산하는 방법을 사용하는 등의 행위를 말 하므로, 발명의 설명은 그 생산 방법을 사용할 수 있도록 명확하고 상세하게 기재하여야 하고, 청구범위에 특 정된 방법 전체의 사용 등에 관하여 위와 같은 정도의 기재가 없는 경우에는 특허법 제42조 제3항 제1호에 서 정한 기재요건을 충족한다고 볼 수 없다.","slides":[{"label":"판시사항","text":"실시가능 요건 - ‘쉽게 실시’ (제법발명) 대법원 2024. 1. 11. 선고 2020후10292 판결 물건을 생산하는 방법의 발명에서 발명의 ‘실시’의 의미 및 발명의 설명에 청구범위에 특정된 방법 전체 의 사용 등에 관하여 그 생산 방법을 사용할 수 있을 정도의 명확하고 상세한 기재가 없는 경우, 특허법 제42조 제3항 제1호에서 정한 기재요건을 충족한다고 볼 수 있는지 여부(소극)"},{"label":"판결요지","text":"물건을 생산하는 방법의 발명의 경우 그 발명의 '실시'란 물건을 생산하는 방법을 사용하는 등의 행위를 말 하므로, 발명의 설명은 그 생산 방법을 사용할 수 있도록 명확하고 상세하게 기재하여야 하고, 청구범위에 특 정된 방법 전체의 사용 등에 관하여 위와 같은 정도의 기재가 없는 경우에는 특허법 제42조 제3항 제1호에 서 정한 기재요건을 충족한다고 볼 수 없다."}]},{"section":"특허요건 - 명세서 기재요건","question":"명세서 기재위치에 근거한 공지성 인정여부 대법원 2017. 1. 19. 선고 2013후37 전원합의체 판결 특허발명의 신규성 또는 진보성 판단과 관련하여 특허발명의 구성요소가 출원 전에 공지된 것인지에 관 한 증명책임의 소재 및 공지사실의 증명 방법 / 특허발명의 구성요소가 청구범위의 전제부에 기재되었 거나 명세서에 배경기술 또는 종래기술로 기재되었다는 사정만으로 공지기술로 인정할 수 있는지 여부 (소극) / 청구범위의 전제부에 기재된 구성요소를 출원 전 공지된 것으로 사실상 추정할 수 있는 경우 및 추정이 번복되는 경우 / 이러한 법리가 실용신안의 경우에도 마찬가지로 적용되는지 여부(적극) 특허발명의 신규성 또는 진보성 판단과 관련하여 해당 특허발명의 구성요소가 출원 전에 공지된 것인지 는 사실인정의 문제이고, 그 공지사실에 관한 증명책임은 신규성 또는 진보성이 부정된다고 주장하는 당사 자에게 있다. 따라서 권리자가 자백하거나 법원에 현저한 사실로서 증명을 필요로 하지 않는 경우가 아니라 면, 그 공지사실은 증거에 의하여 증명되어야 하는 것이 원칙이다.","answer":"그리고 청구범위의 전제부 기재는 청구항의 문맥을 매끄럽게 하는 의미에서 발명을 요약하거나 기술분야를 기재하거나 발명이 적용되는 대상물품을 한 정하는 등 그 목적이나 내용이 다양하므로, 어떠한 구성요소가 전제부에 기재되었다는 사정만으로 공지성을 인정할 근거는 되지 못한다. 또한 전제부 기재 구성요소가 명세서에 배경기술 또는 종래기술로 기재될 수도 있는데, 출원인이 명세서에 기재하는 배경기술 또는 종래기술은 출원발명의 기술적 의의를 이해하는 데 도움이 되고 선행기술 조사 및 심사에 유용한 기존의 기술이기 는 하나 출원 전 공지되었음을 요건으로 하는 개념은 아니다. 따라서 명세서에 배경기술 또는 종래기술로 기재되어 있다고 하여 그 자체로 공지기술로 볼 수도 없다. ... 그렇다면 명세서의 전체적인 기재와 출원경과를 종합적으로 고려하여 출원인이 일정한 구성요소는 단순히 배경기술 또는 종래기술인 정도를 넘어서 공지기술이라는 취지로 청구범위의 전제부에 기재하였음을 인정 할 수 있는 경우에만 별도의 증거 없이도 전제부 기재 구성요소를 출원 전 공지된 것이라고 사실상 추정함이 타당하다. 그러나 이러한 추정이 절대적인 것은 아니므로 출원인이 실제로는 출원 당시 아직 공개되지 아니 한 선출원발명이나 출원인의 회사 내부에만 알려져 있었던 기술을 착오로 공지된 것으로 잘못 기재하였음이 밝혀지는 경우와 같이 특별한 사정이 있는 때에는 추정이 번복될 수 있다.","slides":[{"label":"판시사항","text":"명세서 기재위치에 근거한 공지성 인정여부 대법원 2017. 1. 19. 선고 2013후37 전원합의체 판결 특허발명의 신규성 또는 진보성 판단과 관련하여 특허발명의 구성요소가 출원 전에 공지된 것인지에 관 한 증명책임의 소재 및 공지사실의 증명 방법 / 특허발명의 구성요소가 청구범위의 전제부에 기재되었 거나 명세서에 배경기술 또는 종래기술로 기재되었다는 사정만으로 공지기술로 인정할 수 있는지 여부 (소극) / 청구범위의 전제부에 기재된 구성요소를 출원 전 공지된 것으로 사실상 추정할 수 있는 경우 및 추정이 번복되는 경우 / 이러한 법리가 실용신안의 경우에도 마찬가지로 적용되는지 여부(적극) 특허발명의 신규성 또는 진보성 판단과 관련하여 해당 특허발명의 구성요소가 출원 전에 공지된 것인지 는 사실인정의 문제이고, 그 공지사실에 관한 증명책임은 신규성 또는 진보성이 부정된다고 주장하는 당사 자에게 있다. 따라서 권리자가 자백하거나 법원에 현저한 사실로서 증명을 필요로 하지 않는 경우가 아니라 면, 그 공지사실은 증거에 의하여 증명되어야 하는 것이 원칙이다."},{"label":"판결요지","text":"그리고 청구범위의 전제부 기재는 청구항의 문맥을 매끄럽게 하는 의미에서 발명을 요약하거나 기술분야를 기재하거나 발명이 적용되는 대상물품을 한 정하는 등 그 목적이나 내용이 다양하므로, 어떠한 구성요소가 전제부에 기재되었다는 사정만으로 공지성을 인정할 근거는 되지 못한다. 또한 전제부 기재 구성요소가 명세서에 배경기술 또는 종래기술로 기재될 수도 있는데, 출원인이 명세서에 기재하는 배경기술 또는 종래기술은 출원발명의 기술적 의의를 이해하는 데 도움이 되고 선행기술 조사 및 심사에 유용한 기존의 기술이기 는 하나 출원 전 공지되었음을 요건으로 하는 개념은 아니다. 따라서 명세서에 배경기술 또는 종래기술로 기재되어 있다고 하여 그 자체로 공지기술로 볼 수도 없다. ... 그렇다면 명세서의 전체적인 기재와 출원경과를 종합적으로 고려하여 출원인이 일정한 구성요소는 단순히 배경기술 또는 종래기술인 정도를 넘어서 공지기술이라는 취지로 청구범위의 전제부에 기재하였음을 인정 할 수 있는 경우에만 별도의 증거 없이도 전제부 기재 구성요소를 출원 전 공지된 것이라고 사실상 추정함이 타당하다. 그러나 이러한 추정이 절대적인 것은 아니므로 출원인이 실제로는 출원 당시 아직 공개되지 아니 한 선출원발명이나 출원인의 회사 내부에만 알려져 있었던 기술을 착오로 공지된 것으로 잘못 기재하였음이 밝혀지는 경우와 같이 특별한 사정이 있는 때에는 추정이 번복될 수 있다."}]},{"section":"특허요건 - 명세서 기재요건","question":"뒷받침 요건 대법원 2016. 5. 26. 선고 2014후2061 판결 판시 구 특허법 제42조 제4항 제1호가 정한 명세서 기재요건을 충족하는지 판단하는 기준 및 특허청구범위 사항 가 발명의 상세한 설명에 의하여 뒷받침되는 경우","answer":"구 특허법 제42조 제4항 제1호가 정한 명세서 기재요건을 충족하는지는 위 규정 취지에 맞게 특허출원 당시의 기술수준을 기준으로 하여 통상의 기술자의 입장에서 특허청구범위에 기재된 발명과 대응되는 사항이 발명의 상세한 설명에 기재되어 있는지에 의하여 판단하여야 하므로, 특허출원 당시의 기술수준에 비 추어 발명의 상세한 설명에 개시된 내용을 특허청구범위에 기재된 발명의 범위까지 확장 또는 일반화할 수 있다면 특허청구범위는 발명의 상세한 설명에 의하여 뒷받침된다.","slides":[{"label":"판시사항","text":"뒷받침 요건 대법원 2016. 5. 26. 선고 2014후2061 판결 판시 구 특허법 제42조 제4항 제1호가 정한 명세서 기재요건을 충족하는지 판단하는 기준 및 특허청구범위 사항 가 발명의 상세한 설명에 의하여 뒷받침되는 경우"},{"label":"판결요지","text":"구 특허법 제42조 제4항 제1호가 정한 명세서 기재요건을 충족하는지는 위 규정 취지에 맞게 특허출원 당시의 기술수준을 기준으로 하여 통상의 기술자의 입장에서 특허청구범위에 기재된 발명과 대응되는 사항이 발명의 상세한 설명에 기재되어 있는지에 의하여 판단하여야 하므로, 특허출원 당시의 기술수준에 비 추어 발명의 상세한 설명에 개시된 내용을 특허청구범위에 기재된 발명의 범위까지 확장 또는 일반화할 수 있다면 특허청구범위는 발명의 상세한 설명에 의하여 뒷받침된다."}]},{"section":"특허요건 - 명세서 기재요건","question":"뒷받침 요건- ‘쉽게 실시’ 요건과의 구별 대법원 2014. 9. 4. 선고 2012후832 판결 특허법 제42조 제4항 제1호의 규정 취지 및 위 규정이 정한 명세서 기재요건을 충족하는지 판단하는 기준","answer":"특허법 제42조 제4항 제1호가 정한 위와 같은 명세서 기재요건을 충족하는지 여부는, 위 규정 취지에 맞게 특허출원 당시의 기술수준을 기준으로 하여 그 발명이 속하는 기술 분야에서 통상의 지식을 가 진 자(이하 ‘통상의 기술자’라고 한다)의 입장에서 특허청구범위에 기재된 사항과 대응되는 사항이 발명의 상세한 설명에 기재되어 있는지 여부에 의하여 판단하여야 하고, 그 규정 취지를 달리하는 특허법 제42조 제3항 제1호가 정한 것처럼 발명의 상세한 설명에 통상의 기술자가 그 발명을 쉽게 실시할 수 있도록 명확하 고 상세하게 기재되어 있는지 여부에 의하여 판단하여서는 아니 된다.","slides":[{"label":"판시사항","text":"뒷받침 요건- ‘쉽게 실시’ 요건과의 구별 대법원 2014. 9. 4. 선고 2012후832 판결 특허법 제42조 제4항 제1호의 규정 취지 및 위 규정이 정한 명세서 기재요건을 충족하는지 판단하는 기준"},{"label":"판결요지","text":"특허법 제42조 제4항 제1호가 정한 위와 같은 명세서 기재요건을 충족하는지 여부는, 위 규정 취지에 맞게 특허출원 당시의 기술수준을 기준으로 하여 그 발명이 속하는 기술 분야에서 통상의 지식을 가 진 자(이하 ‘통상의 기술자’라고 한다)의 입장에서 특허청구범위에 기재된 사항과 대응되는 사항이 발명의 상세한 설명에 기재되어 있는지 여부에 의하여 판단하여야 하고, 그 규정 취지를 달리하는 특허법 제42조 제3항 제1호가 정한 것처럼 발명의 상세한 설명에 통상의 기술자가 그 발명을 쉽게 실시할 수 있도록 명확하 고 상세하게 기재되어 있는지 여부에 의하여 판단하여서는 아니 된다."}]},{"section":"특허요건 - 명세서 기재요건","question":"명확성 요건 – 발명의 구성을 불명료하게 하는 용어 대법원 2017. 4. 7. 선고 2014후1563 판결 판시 특허출원 시 청구항에 발명의 구성을 불명료하게 표현하는 용어를 기재할 수 있는지 여부(원칙적 소극) 사항 및 발명이 명확하게 적혀 있는지 판단하는 방법","answer":"청구항에는 명확한 기재만이 허용되고, 발명의 구성을 불명료하게 표현하는 용어는 원칙적으로 허용되지 않 는다. 또한 발명이 명확하게 적혀 있는지 여부는 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람이 발명의 설명이나 도면 등의 기재와 출원 당시의 기술상식을 고려하여 청구범위에 기재된 사항으로부터 특허 를 받고자 하는 발명을 명확하게 파악할 수 있는지에 따라 개별적으로 판단하여야 하고, 단순히 청구범위에 사용된 용어만을 기준으로 하여 일률적으로 판단하여서는 안 된다.","slides":[{"label":"판시사항","text":"명확성 요건 – 발명의 구성을 불명료하게 하는 용어 대법원 2017. 4. 7. 선고 2014후1563 판결 판시 특허출원 시 청구항에 발명의 구성을 불명료하게 표현하는 용어를 기재할 수 있는지 여부(원칙적 소극) 사항 및 발명이 명확하게 적혀 있는지 판단하는 방법"},{"label":"판결요지","text":"청구항에는 명확한 기재만이 허용되고, 발명의 구성을 불명료하게 표현하는 용어는 원칙적으로 허용되지 않 는다. 또한 발명이 명확하게 적혀 있는지 여부는 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람이 발명의 설명이나 도면 등의 기재와 출원 당시의 기술상식을 고려하여 청구범위에 기재된 사항으로부터 특허 를 받고자 하는 발명을 명확하게 파악할 수 있는지에 따라 개별적으로 판단하여야 하고, 단순히 청구범위에 사용된 용어만을 기준으로 하여 일률적으로 판단하여서는 안 된다."}]},{"section":"특허요건 - 명세서 기재요건","question":"독립항과 종속항의 구별 대법원 2005. 11. 10. 선고 2004후3546 판결 판시 실용신안의 등록청구범위에 있어서 독립항과 종속항의 구분 기준 및 인용하고 있는 청구항의 구성 일부 사항 를 생략하거나 다른 구성으로 바꾼 청구항을 독립항으로 볼 수 있는지 여부(적극)","answer":"실용신안의 등록청구범위에 있어서 다른 청구항을 인용하지 않는 청구항이 독립항이 되고 다른 독립항이 나 종속항을 인용하여 이를 한정하거나 부가하여 구체화하는 청구항이 종속항이 되는 것이 원칙이지만, 독 립항과 종속항의 구분은 단지 청구항의 문언이 나타내고 있는 기재형식에 의해서만 판단할 것은 아니므로, 인용하고 있는 청구항의 구성 일부를 생략하거나 다른 구성으로 바꾼 청구항은 이를 독립항으로 보아야 할 것이다.","slides":[{"label":"판시사항","text":"독립항과 종속항의 구별 대법원 2005. 11. 10. 선고 2004후3546 판결 판시 실용신안의 등록청구범위에 있어서 독립항과 종속항의 구분 기준 및 인용하고 있는 청구항의 구성 일부 사항 를 생략하거나 다른 구성으로 바꾼 청구항을 독립항으로 볼 수 있는지 여부(적극)"},{"label":"판결요지","text":"실용신안의 등록청구범위에 있어서 다른 청구항을 인용하지 않는 청구항이 독립항이 되고 다른 독립항이 나 종속항을 인용하여 이를 한정하거나 부가하여 구체화하는 청구항이 종속항이 되는 것이 원칙이지만, 독 립항과 종속항의 구분은 단지 청구항의 문언이 나타내고 있는 기재형식에 의해서만 판단할 것은 아니므로, 인용하고 있는 청구항의 구성 일부를 생략하거나 다른 구성으로 바꾼 청구항은 이를 독립항으로 보아야 할 것이다."}]},{"section":"특허요건 - 명세서 기재요건","question":"독립항과 종속항의 해석 대법원 2007. 9. 6. 선고 2005후1486 판결 판시 독립항과 이를 한정하는 종속항 등 여러 항으로 이루어진 특허발명 청구항의 경우, 독립항의 기술내용을 사항 종속항의 기술구성 등으로 제한 해석할 수 있는지 여부(소극)","answer":"독립항과 이를 한정하는 종속항 등 여러 항으로 이루어진 청구항의 기술내용을 파악함에 있어서 특별한 사정 이 없는 한 광범위하게 규정된 독립항의 기술내용을 독립항보다 구체적으로 한정하고 있는 종속항의 기술구성이나 발명의 상세한 설명에 나오는 특정의 실시례로 제한하여 해석할 수는 없다고 할 것이다.","slides":[{"label":"판시사항","text":"독립항과 종속항의 해석 대법원 2007. 9. 6. 선고 2005후1486 판결 판시 독립항과 이를 한정하는 종속항 등 여러 항으로 이루어진 특허발명 청구항의 경우, 독립항의 기술내용을 사항 종속항의 기술구성 등으로 제한 해석할 수 있는지 여부(소극)"},{"label":"판결요지","text":"독립항과 이를 한정하는 종속항 등 여러 항으로 이루어진 청구항의 기술내용을 파악함에 있어서 특별한 사정 이 없는 한 광범위하게 규정된 독립항의 기술내용을 독립항보다 구체적으로 한정하고 있는 종속항의 기술구성이나 발명의 상세한 설명에 나오는 특정의 실시례로 제한하여 해석할 수는 없다고 할 것이다."}]},{"section":"출원제도 - 공지예외주장 제도","question":"의사에 기한 자기공지예외 대법원 2025. 5. 29. 선고 2023후10712 판결 [1] 특허를 받을 수 있는 권리를 가진 자가 특허법 제30조 제1항에서 정한 12개월의 기간 이내에 여러 번의 공개행위를 하고 그중 가장 먼저 공지된 발명에 대해서만 절차에 따라 공지예외 주장을 한 경우, 가 판시 장 먼저 공지된 발명과 동일성이 인정되는 범위에 있는 공지된 나머지 발명들에까지 공지예외의 효과가 사항 미치는지 여부(적극) [2] 특허법 제30조 제1항 제1호의 공지예외 규정이 적용되기 위해서 반드시 자기공지된 발명이 특허출원된 발명과 동일해야 한다거나 자기공지된 발명 그 자체가 특허출원되어야 하는지 여부(소극) 1) ... 이러한 공지예외 규정의 문언과 취지에 비추어 보면, 특허를 받을 수 있는 권리를 가진 자가 특허법 제30조 제1항에서 정한 12개월의 기간 이내에 여러 번의 공개행위를 하고 그중 가장 먼저 공지된 발명에 대 해서만 절차에 따라 공지예외 주장을 하였더라도, 공지된 나머지 발명들이 가장 먼저 공지된 발명과 동일성 이 인정되는 범위에 있다면 공지된 나머지 발명들에까지 공지예외의 효과가 미친다고 보아야 한다.","answer":"2) 한편 특허법 제30조 제1항 제1호의 공지예외 규정은 특허출원된 발명에 대하여 신규성 요건인 특허법 제29조 제1항뿐만 아니라 진보성 요건인 특허법 제29조 제2항을 적용할 때에도 자기공지된 발명이 공지 등이 되지 않은 것으로 본다고 정하고 있다. 그리고 그 규정의 문언상 공지예외의 효과가 미치는 ‘자기공지 된 발명’과 출원의 대상인 ‘특허출원된 발명’을 분명하게 구별하고 있다. 이는 특허출원된 발명이 자기공지 된 발명의 공지 이후 추가적인 연구개발이나 개량 등을 통하여 자기공지되었던 발명과 구성이나 효과에 차이 가 생길 수 있음을 고려한 것이다. 따라서 공지예외 규정이 적용되기 위해서 반드시 자기공지된 발명이 특허출원된 발명과 동일해야 한다거나 자기공지된 발명 그 자체가 특허출원되어야만 한다고 볼 수는 없다.","slides":[{"label":"판시사항","text":"의사에 기한 자기공지예외 대법원 2025. 5. 29. 선고 2023후10712 판결"},{"label":"판시사항","text":"[1] 특허를 받을 수 있는 권리를 가진 자가 특허법 제30조 제1항에서 정한 12개월의 기간 이내에 여러 번의 공개행위를 하고 그중 가장 먼저 공지된 발명에 대해서만 절차에 따라 공지예외 주장을 한 경우, 가 판시 장 먼저 공지된 발명과 동일성이 인정되는 범위에 있는 공지된 나머지 발명들에까지 공지예외의 효과가 사항 미치는지 여부(적극)"},{"label":"판시사항","text":"[2] 특허법 제30조 제1항 제1호의 공지예외 규정이 적용되기 위해서 반드시 자기공지된 발명이 특허출원된 발명과 동일해야 한다거나 자기공지된 발명 그 자체가 특허출원되어야 하는지 여부(소극) 1) ... 이러한 공지예외 규정의 문언과 취지에 비추어 보면, 특허를 받을 수 있는 권리를 가진 자가 특허법 제30조 제1항에서 정한 12개월의 기간 이내에 여러 번의 공개행위를 하고 그중 가장 먼저 공지된 발명에 대 해서만 절차에 따라 공지예외 주장을 하였더라도, 공지된 나머지 발명들이 가장 먼저 공지된 발명과 동일성 이 인정되는 범위에 있다면 공지된 나머지 발명들에까지 공지예외의 효과가 미친다고 보아야 한다."},{"label":"판결요지","text":"2) 한편 특허법 제30조 제1항 제1호의 공지예외 규정은 특허출원된 발명에 대하여 신규성 요건인 특허법 제29조 제1항뿐만 아니라 진보성 요건인 특허법 제29조 제2항을 적용할 때에도 자기공지된 발명이 공지 등이 되지 않은 것으로 본다고 정하고 있다. 그리고 그 규정의 문언상 공지예외의 효과가 미치는 ‘자기공지 된 발명’과 출원의 대상인 ‘특허출원된 발명’을 분명하게 구별하고 있다. 이는 특허출원된 발명이 자기공지 된 발명의 공지 이후 추가적인 연구개발이나 개량 등을 통하여 자기공지되었던 발명과 구성이나 효과에 차이 가 생길 수 있음을 고려한 것이다. 따라서 공지예외 규정이 적용되기 위해서 반드시 자기공지된 발명이 특허출원된 발명과 동일해야 한다거나 자기공지된 발명 그 자체가 특허출원되어야만 한다고 볼 수는 없다."}]},{"section":"출원제도 - 공지예외주장 제도","question":"의사에 기한 자기공지예외 특허법원 2016. 10. 20. 선고 2015허7308 판결 특허법 제30조가 발명자가 자신의 이름으로 발명을 공개한 경우에만 적용되는지 여부(소극)","answer":"특허법 제30조에 의한 발명의 공개는 그 규정대로 특허를 받을 수 있는 권리를 가진 자에 의사에 의한 것이 면 충분하고, 특허를 받을 수 있는 권리를 가진 자가 직접 발명을 공개하거나 자신의 발명임을 밝혀야만 하는 것은 아니다. 나아가 특허를 받을 수 있는 권리를 가진 자가 공지 등의 예외를 적용받고자 출원서에 기재한 공개 발명의 범위는 출원서에 기재된 취지와 증명서류, 거래실정 등을 참작하여 객관적 합리적으로 정해야 하며, 또한 출원서에 기재된 발명 공개 행위의 후속 절차로서 통상적으로 이루어지는 반복 공개 행위는 출원 서에 기재된 발명의 공개 행위의 연장선에 있다고 볼 수 있으므로, 비록 출원서에 기재되어 있지 않거나 증명 서류가 첨부되어 있지 않더라도 당연히 특허법 제30조의 공지 등의 예외 적용을 적용받을 수 있다.","slides":[{"label":"판시사항","text":"의사에 기한 자기공지예외 특허법원 2016. 10. 20. 선고 2015허7308 판결 특허법 제30조가 발명자가 자신의 이름으로 발명을 공개한 경우에만 적용되는지 여부(소극)"},{"label":"판결요지","text":"특허법 제30조에 의한 발명의 공개는 그 규정대로 특허를 받을 수 있는 권리를 가진 자에 의사에 의한 것이 면 충분하고, 특허를 받을 수 있는 권리를 가진 자가 직접 발명을 공개하거나 자신의 발명임을 밝혀야만 하는 것은 아니다. 나아가 특허를 받을 수 있는 권리를 가진 자가 공지 등의 예외를 적용받고자 출원서에 기재한 공개 발명의 범위는 출원서에 기재된 취지와 증명서류, 거래실정 등을 참작하여 객관적 합리적으로 정해야 하며, 또한 출원서에 기재된 발명 공개 행위의 후속 절차로서 통상적으로 이루어지는 반복 공개 행위는 출원 서에 기재된 발명의 공개 행위의 연장선에 있다고 볼 수 있으므로, 비록 출원서에 기재되어 있지 않거나 증명 서류가 첨부되어 있지 않더라도 당연히 특허법 제30조의 공지 등의 예외 적용을 적용받을 수 있다."}]},{"section":"출원제도 - 공지예외주장 제도","question":"의사에 반한 공지예외 특허법원 2021. 8. 20. 선고 2020허4990판결 이 사건 특허발명의 공지가 원고의 의사에 반한 공지로서 신규성 상실의 예외에 해당하는지(소극)","answer":"특허법 제30조 제1항 제2호의 ‘특허를 받을 수 있는 권리를 가진 자의 의사에 반하여 그 발명이 제29 조 제1항 각 호의 어느 하나에 해당하게 된 경우’란 특허를 받을 수 있는 권리를 가진 자의 발명내용이 사 용인 또는 대리인의 고의 또는 과실로 누설되거나 타인이 이를 도용함으로써 일반에게 공표된 경우를 가리키 는 것이므로 위 규정에 의하여 신규성을 주장하는 자는 위와 같이 자기의 의사에 반하여 누설 또는 도용된 사실을 증명할 책임이 있다. ","slides":[{"label":"판시사항","text":"의사에 반한 공지예외 특허법원 2021. 8. 20. 선고 2020허4990판결 이 사건 특허발명의 공지가 원고의 의사에 반한 공지로서 신규성 상실의 예외에 해당하는지(소극)"},{"label":"판결요지","text":"특허법 제30조 제1항 제2호의 ‘특허를 받을 수 있는 권리를 가진 자의 의사에 반하여 그 발명이 제29 조 제1항 각 호의 어느 하나에 해당하게 된 경우’란 특허를 받을 수 있는 권리를 가진 자의 발명내용이 사 용인 또는 대리인의 고의 또는 과실로 누설되거나 타인이 이를 도용함으로써 일반에게 공표된 경우를 가리키 는 것이므로 위 규정에 의하여 신규성을 주장하는 자는 위와 같이 자기의 의사에 반하여 누설 또는 도용된 사실을 증명할 책임이 있다. 2 보정&보정각하 제도"}]},{"section":"출원제도 - 보정&보정각하 제도","question":"보정의 범위 – 신규사항추가 금지 대법원 2007. 2. 8. 선고 2005후3130 판결 특허법 제47조 제2항에서 정한 ‘최초로 첨부된 명세서 또는 도면에 기재된 사항’의 의미","answer":"최초로 첨부된 명세서 또는 도면(이하 ‘최초 명세서 등’이라 한다)에 기재된 사항이란 최초 명세서 등에 명시 적으로 기재되어 있는 사항이거나 또는 명시적인 기재가 없더라도 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자(이하 ‘통상의 기술자’라 한다)라면 출원시의 기술상식에 비추어 보아 보정된 사항이 최초 명세서 등에 기재되어 있는 것과 마찬가지라고 이해할 수 있는 사항이어야 한다.","slides":[{"label":"판시사항","text":"보정의 범위 – 신규사항추가 금지 대법원 2007. 2. 8. 선고 2005후3130 판결 특허법 제47조 제2항에서 정한 ‘최초로 첨부된 명세서 또는 도면에 기재된 사항’의 의미"},{"label":"판결요지","text":"최초로 첨부된 명세서 또는 도면(이하 ‘최초 명세서 등’이라 한다)에 기재된 사항이란 최초 명세서 등에 명시 적으로 기재되어 있는 사항이거나 또는 명시적인 기재가 없더라도 그 발명이 속하는 기술분야에서 통상의 지식을 가진 자(이하 ‘통상의 기술자’라 한다)라면 출원시의 기술상식에 비추어 보아 보정된 사항이 최초 명세서 등에 기재되어 있는 것과 마찬가지라고 이해할 수 있는 사항이어야 한다."}]},{"section":"출원제도 - 보정&보정각하 제도","question":"보정각하 사유 - ‘새로운 거절이유가 발생한 것’ 대법원 2014. 7. 10. 선고 2012후3121 판결 [1] 특허청 심사관이 ‘발명이 명확하고 간결하게 기재되지 아니하여 특허법 제42조 제4항 제2호의 명세 서 기재요건을 구비하지 못한 기재불비가 있다’는 거절이유를 통지함에 따라 보정이 이루어졌는데, 보정 이후 신규성이나 진보성 부정의 거절이유가 발견된 경우, 심사관이 취해야 할 조치 [2] 특허청 심사관이 특허출원의 보정에 대한 각하결정을 한 후 ‘보정 전의 특허출원’에 대하여 거절결정 을 하였고, 그에 대한 불복심판 절차에서 위 보정각하결정 및 거절결정이 적법하다는 이유로 심판청구를 기각하는 특허심판원의 심결이 있었는데 보정각하결정이 위법한 경우, 심결취소소송에서 법원은 그것 만을 이유로 곧바로 심결을 취소하여야 하는지 여부(적극)","answer":"심사관이 ‘발명이 명확하고 간결하게 기재되지 아니하여 특허법 제42조 제4항 제2호의 명세서 기재요건을 구비하지 못한 기재불비가 있다’는 거절이유를 통지함에 따라 이를 해소하기 위한 보정이 이루어졌는데, 그 보정 이후 발명에 대한 심사 결과 신규성이나 진보성 부정의 거절이유가 발견된다고 하더라도, 그러한 거절 는 보정으로 청구항이 신설되거나 실질적으로 신설에 준하는 정도로 변경됨에 따라 비로소 발생한 경우 와 같은 특별한 사정이 없는 한 보정으로 인하여 새롭게 발생한 것이라고 할 수 없으므로, 심사관으로서는 그 보정에 대한 각하결정을 하여서는 아니 되고, 위와 같은 신규성이나 진보성 부정의 거절이유를 출원인에게 통지하여 의견제출 및 보정의 기회를 부여하여야 한다. ... 특허거절결정에 대한 불복심판청구를 기각한 심결의 취소소송에서 법원은 특허거절결정을 유지한 심결 의 위법성 여부를 판단하는 것일 뿐 특허출원에 대하여 직접 특허결정 또는 특허거절결정을 하는 것은 아니 다. 따라서 심사관이 특허출원의 보정에 대한 각하결정을 한 후 ‘보정 전의 특허출원’에 대하여 거절결정을 하였고, 그에 대한 불복심판 절차에서 위 보정각하결정 및 거절결정이 적법하다는 이유로 심판청구를 기각 하는 특허심판원의 심결이 있었던 경우, 그 심결취소소송에서 법원은 위 보정각하결정이 위법하다면 그것만 을 이유로 곧바로 심결을 취소하여야 하는 것이지, 심사관 또는 특허심판원이 하지도 아니한 ‘보정 이후의 특허출원’에 대한 거절결정의 위법성 여부까지 스스로 심리하여 이 역시 위법한 경우에만 심결을 취소할 것은 아니다.","slides":[{"label":"판시사항","text":"보정각하 사유 - ‘새로운 거절이유가 발생한 것’ 대법원 2014. 7. 10. 선고 2012후3121 판결"},{"label":"판시사항","text":"[1] 특허청 심사관이 ‘발명이 명확하고 간결하게 기재되지 아니하여 특허법 제42조 제4항 제2호의 명세 서 기재요건을 구비하지 못한 기재불비가 있다’는 거절이유를 통지함에 따라 보정이 이루어졌는데, 보정 이후 신규성이나 진보성 부정의 거절이유가 발견된 경우, 심사관이 취해야 할 조치"},{"label":"판시사항","text":"[2] 특허청 심사관이 특허출원의 보정에 대한 각하결정을 한 후 ‘보정 전의 특허출원’에 대하여 거절결정 을 하였고, 그에 대한 불복심판 절차에서 위 보정각하결정 및 거절결정이 적법하다는 이유로 심판청구를 기각하는 특허심판원의 심결이 있었는데 보정각하결정이 위법한 경우, 심결취소소송에서 법원은 그것 만을 이유로 곧바로 심결을 취소하여야 하는지 여부(적극)"},{"label":"판결요지","text":"심사관이 ‘발명이 명확하고 간결하게 기재되지 아니하여 특허법 제42조 제4항 제2호의 명세서 기재요건을 구비하지 못한 기재불비가 있다’는 거절이유를 통지함에 따라 이를 해소하기 위한 보정이 이루어졌는데, 그 보정 이후 발명에 대한 심사 결과 신규성이나 진보성 부정의 거절이유가 발견된다고 하더라도, 그러한 거절 는 보정으로 청구항이 신설되거나 실질적으로 신설에 준하는 정도로 변경됨에 따라 비로소 발생한 경우 와 같은 특별한 사정이 없는 한 보정으로 인하여 새롭게 발생한 것이라고 할 수 없으므로, 심사관으로서는 그 보정에 대한 각하결정을 하여서는 아니 되고, 위와 같은 신규성이나 진보성 부정의 거절이유를 출원인에게 통지하여 의견제출 및 보정의 기회를 부여하여야 한다. ... 특허거절결정에 대한 불복심판청구를 기각한 심결의 취소소송에서 법원은 특허거절결정을 유지한 심결 의 위법성 여부를 판단하는 것일 뿐 특허출원에 대하여 직접 특허결정 또는 특허거절결정을 하는 것은 아니 다. 따라서 심사관이 특허출원의 보정에 대한 각하결정을 한 후 ‘보정 전의 특허출원’에 대하여 거절결정을 하였고, 그에 대한 불복심판 절차에서 위 보정각하결정 및 거절결정이 적법하다는 이유로 심판청구를 기각 하는 특허심판원의 심결이 있었던 경우, 그 심결취소소송에서 법원은 위 보정각하결정이 위법하다면 그것만 을 이유로 곧바로 심결을 취소하여야 하는 것이지, 심사관 또는 특허심판원이 하지도 아니한 ‘보정 이후의 특허출원’에 대한 거절결정의 위법성 여부까지 스스로 심리하여 이 역시 위법한 경우에만 심결을 취소할 것은 아니다."}]},{"section":"출원제도 - 보정&보정각하 제도","question":"보정각하 예외 - ‘청구항을 삭제하는 보정’ 대법원 2018. 6. 28. 선고 2014후553 판결 위 규정에서 정한 ‘청구항을 삭제하는 보정에 따라 발생한 새로운 거절이유’에 ‘청구항을 삭제하는 보정을 판시 하면서 그 삭제된 청구항을 직 간접적으로 인용하던 종속항을 보정하는 과정에서, 인용번호를 잘못 변경 사항 하거나, 종속항이 2 이상의 항을 인용하는 경우에 인용되는 항의 번호 사이의 택일적 관계에 대한 기재를 누락함으로써 명세서 기재요건을 충족하지 않은 기재불비가 발생한 경우’가 포함되는지 여부(적극)","answer":"구 특허법 제51조 제1항 본문이 규정하는 청구항을 삭제하는 보정에 따라 발생한 새로운 거절이유에는 단순히 ‘청구항을 삭제하는 보정을 하면서 그 삭제된 청구항을 인용하던 종속항에서 인용번호를 그대로 둠으로 써 명세서 기재요건을 충족하지 않은 기재불비가 발생한 경우’뿐만 아니라, ‘청구항을 삭제하는 보정을 하면 서 그 삭제된 청구항을 직 간접적으로 인용하던 종속항을 보정하는 과정에서, 그 인용번호를 잘못 변경하거 나, 종속항이 2 이상의 항을 인용하는 경우에 인용되는 항의 번호 사이의 택일적 관계에 대한 기재를 누락함으 로써 위와 같은 기재 불비가 발생한 경우’도 포함된다고 보아야 한다.","slides":[{"label":"판시사항","text":"보정각하 예외 - ‘청구항을 삭제하는 보정’ 대법원 2018. 6. 28. 선고 2014후553 판결 위 규정에서 정한 ‘청구항을 삭제하는 보정에 따라 발생한 새로운 거절이유’에 ‘청구항을 삭제하는 보정을 판시 하면서 그 삭제된 청구항을 직 간접적으로 인용하던 종속항을 보정하는 과정에서, 인용번호를 잘못 변경 사항 하거나, 종속항이 2 이상의 항을 인용하는 경우에 인용되는 항의 번호 사이의 택일적 관계에 대한 기재를 누락함으로써 명세서 기재요건을 충족하지 않은 기재불비가 발생한 경우’가 포함되는지 여부(적극)"},{"label":"판결요지","text":"구 특허법 제51조 제1항 본문이 규정하는 청구항을 삭제하는 보정에 따라 발생한 새로운 거절이유에는 단순히 ‘청구항을 삭제하는 보정을 하면서 그 삭제된 청구항을 인용하던 종속항에서 인용번호를 그대로 둠으로 써 명세서 기재요건을 충족하지 않은 기재불비가 발생한 경우’뿐만 아니라, ‘청구항을 삭제하는 보정을 하면 서 그 삭제된 청구항을 직 간접적으로 인용하던 종속항을 보정하는 과정에서, 그 인용번호를 잘못 변경하거 나, 종속항이 2 이상의 항을 인용하는 경우에 인용되는 항의 번호 사이의 택일적 관계에 대한 기재를 누락함으 로써 위와 같은 기재 불비가 발생한 경우’도 포함된다고 보아야 한다."}]},{"section":"출원제도 - 보정&보정각하 제도","question":"보정각하 예외 - ‘청구항을 삭제하는 보정’ 대법원 2018. 7. 12. 선고 2015후2259 판결 판시 청구항을 삭제하는 보정을 하면서 삭제된 청구항과 관련이 없는 부분에서 새롭게 발생한 거절이유가 위 사항 규정에서 정한 ‘청구항을 삭제하는 보정에 따라 발생한 새로운 거절이유’에 포함되는지 여부(소극)","answer":"청구항을 삭제하는 보정을 하였더라도 삭제된 청구항과 관련이 없는 부분에서 새롭게 발생한 거절이유는 심 사관에게 새로운 심사에 따른 업무량을 가중시키고, 심사절차가 지연되는 결과를 가져오게 하는 등 달리 취 급하여야 할 필요가 없으므로 2009년 개정 특허법 제51조 제1항 본문이 규정하는 청구항을 삭제하는 보정 에 따라 발생한 새로운 거절이유에 포함된다고 할 수 없다.","slides":[{"label":"판시사항","text":"보정각하 예외 - ‘청구항을 삭제하는 보정’ 대법원 2018. 7. 12. 선고 2015후2259 판결 판시 청구항을 삭제하는 보정을 하면서 삭제된 청구항과 관련이 없는 부분에서 새롭게 발생한 거절이유가 위 사항 규정에서 정한 ‘청구항을 삭제하는 보정에 따라 발생한 새로운 거절이유’에 포함되는지 여부(소극)"},{"label":"판결요지","text":"청구항을 삭제하는 보정을 하였더라도 삭제된 청구항과 관련이 없는 부분에서 새롭게 발생한 거절이유는 심 사관에게 새로운 심사에 따른 업무량을 가중시키고, 심사절차가 지연되는 결과를 가져오게 하는 등 달리 취 급하여야 할 필요가 없으므로 2009년 개정 특허법 제51조 제1항 본문이 규정하는 청구항을 삭제하는 보정 에 따라 발생한 새로운 거절이유에 포함된다고 할 수 없다."}]},{"section":"출원제도 - 분할출원 제도","question":"분할출원의 공지예외주장 대법원 2022. 8. 31. 선고 2020후11479 판결 판시 둘 이상의 발명을 하나로 한 원특허출원 시에 공지예외주장을 하지 않은 경우, 분할출원에서 공지예외주 사항 장을 하여 원출원일을 기준으로 한 공지예외의 효과를 인정받을 수 있는지 여부(적극)","answer":"공지예외 및 분할출원 관련 규정의 문언과 내용, 각 제도의 취지 등에 비추어 보면, 원출원에서 공지예외주 장을 하지 않았더라도 분할출원에서 적법한 절차를 준수하여 공지예외주장을 하였다면, 원출원이 자기공지 일로부터 12개월 이내에 이루어진 이상 공지예외의 효과를 인정받을 수 있다고 봄이 타당하다. ","slides":[{"label":"판시사항","text":"분할출원의 공지예외주장 대법원 2022. 8. 31. 선고 2020후11479 판결 판시 둘 이상의 발명을 하나로 한 원특허출원 시에 공지예외주장을 하지 않은 경우, 분할출원에서 공지예외주 사항 장을 하여 원출원일을 기준으로 한 공지예외의 효과를 인정받을 수 있는지 여부(적극)"},{"label":"판결요지","text":"공지예외 및 분할출원 관련 규정의 문언과 내용, 각 제도의 취지 등에 비추어 보면, 원출원에서 공지예외주 장을 하지 않았더라도 분할출원에서 적법한 절차를 준수하여 공지예외주장을 하였다면, 원출원이 자기공지 일로부터 12개월 이내에 이루어진 이상 공지예외의 효과를 인정받을 수 있다고 봄이 타당하다. 4 우선권주장 제도"}]},{"section":"출원제도 - 우선권주장 제도","question":"조약우선권주장의 실체적 효력범위 대법원 2021. 2. 25. 선고 2019후10265 판결 ‘공업소유권의 보호를 위한 파리협약’의 당사국에 특허출원을 한 후 동일한 발명을 대한민국에 특허출원 판시 하여 우선권을 주장하는 경우, 진보성 등의 특허요건에 관한 규정을 적용할 때 그 당사국에 출원한 날을 사항 대한민국에 특허출원한 날로 보는지 여부(적극) 및 특허요건 적용의 기준일이 우선권 주장일로 소급하는 발명의 범위 / ‘우선권 주장의 기초가 된 선출원의 최초 명세서 등에 기재된 사항’의 의미","answer":"특허법 제55조 제1항의 국내우선권 규정의 경우와 같이, 2001년 개정 전 특허법 제54조 제1항에 따라 특허요건 적용의 기준일이 우선권 주장일로 소급하는 발명은, 조약우선권 주장을 수반하는 특허출원된 발명 가운데 조약우선권 주장의 기초가 된 특허출원서에 최초로 첨부된 명세서 또는 도면(이하 ‘우선권 주장의 기초가 된 선출원의 최초 명세서 등’이라고 한다)에 기재된 사항의 범위 안에 있는 것으로 한정된다고 봄이 타당하다. 여기서 ‘우선권 주장의 기초가 된 선출원의 최초 명세서 등에 기재된 사항’이란, 우선권 주장의 기초가 된 선출원의 최초 명세서 등에 명시적으로 기재되어 있는 사항이거나 또는 명시적인 기재가 없더라도 그 발명이 속하 는 기술 분야에서 통상의 지식을 가진 사람이라면 우선권 주장일 당시의 기술상식에 비추어 보아 우선권 주장 을 수반하는 특허출원된 발명이 선출원의 최초 명세서 등에 기재되어 있는 것과 마찬가지라고 이해할 수 있는 사항이어야 한다.","slides":[{"label":"판시사항","text":"조약우선권주장의 실체적 효력범위 대법원 2021. 2. 25. 선고 2019후10265 판결 ‘공업소유권의 보호를 위한 파리협약’의 당사국에 특허출원을 한 후 동일한 발명을 대한민국에 특허출원 판시 하여 우선권을 주장하는 경우, 진보성 등의 특허요건에 관한 규정을 적용할 때 그 당사국에 출원한 날을 사항 대한민국에 특허출원한 날로 보는지 여부(적극) 및 특허요건 적용의 기준일이 우선권 주장일로 소급하는 발명의 범위 / ‘우선권 주장의 기초가 된 선출원의 최초 명세서 등에 기재된 사항’의 의미"},{"label":"판결요지","text":"특허법 제55조 제1항의 국내우선권 규정의 경우와 같이, 2001년 개정 전 특허법 제54조 제1항에 따라 특허요건 적용의 기준일이 우선권 주장일로 소급하는 발명은, 조약우선권 주장을 수반하는 특허출원된 발명 가운데 조약우선권 주장의 기초가 된 특허출원서에 최초로 첨부된 명세서 또는 도면(이하 ‘우선권 주장의 기초가 된 선출원의 최초 명세서 등’이라고 한다)에 기재된 사항의 범위 안에 있는 것으로 한정된다고 봄이 타당하다. 여기서 ‘우선권 주장의 기초가 된 선출원의 최초 명세서 등에 기재된 사항’이란, 우선권 주장의 기초가 된 선출원의 최초 명세서 등에 명시적으로 기재되어 있는 사항이거나 또는 명시적인 기재가 없더라도 그 발명이 속하 는 기술 분야에서 통상의 지식을 가진 사람이라면 우선권 주장일 당시의 기술상식에 비추어 보아 우선권 주장 을 수반하는 특허출원된 발명이 선출원의 최초 명세서 등에 기재되어 있는 것과 마찬가지라고 이해할 수 있는 사항이어야 한다."}]},{"section":"출원제도 - 우선권주장 제도","question":"국내우선권주장을 할 수 있는 자 - 특정승계인 대법원 2019. 10. 17. 선고 2017후1274 판결 판시 후출원의 출원인이 후출원 시에 ‘특허를 받을 수 있는 권리’를 승계한 경우, 우선권 주장을 할 수 있는지 사항 여부(적극) 및 이때 선출원에 대하여 특허출원인변경신고를 마쳐야 하는지 여부(소극)","answer":"발명을 한 자 또는 그 승계인은 특허법에서 정하는 바에 의하여 특허를 받을 수 있는 권리를 갖고(특허법 제33조 제1항 본문), 특허를 받을 수 있는 권리는 이전할 수 있으므로(특허법 제37조 제1항), 후출원의 출원인이 후출원 시에 ‘특허를 받을 수 있는 권리’를 승계하였다면 우선권 주장을 할 수 있고, 후출원 시에 선출원에 대하여 특허출원인변경신고를 마쳐야만 하는 것은 아니다. 특허출원 후 특허를 받을 수 있는 권리의 승계는 상속 기타 일반승계의 경우를 제외하고는 특허출원인 변경신고를 하지 아니하면 그 효력이 발생하지 아니한다고 규정한 특허법 제38조 제4항은 특허에 관한 절차에서 참여자와 특허를 등록받을 자를 쉽게 확정함으로써 출원심사의 편의성 및 신속성을 추구하고자 하는 규정으로 우선권주장에 관한 절차에 적용된다고 볼 수 없다. 따라서 후출원의 출원인이 선출원의 출원인과 다르더라도 특허를 받을 수 있는 권리를 승계받았다면 우선권 주장을 할 수 있다고 보아야 한다.","slides":[{"label":"판시사항","text":"국내우선권주장을 할 수 있는 자 - 특정승계인 대법원 2019. 10. 17. 선고 2017후1274 판결 판시 후출원의 출원인이 후출원 시에 ‘특허를 받을 수 있는 권리’를 승계한 경우, 우선권 주장을 할 수 있는지 사항 여부(적극) 및 이때 선출원에 대하여 특허출원인변경신고를 마쳐야 하는지 여부(소극)"},{"label":"판결요지","text":"발명을 한 자 또는 그 승계인은 특허법에서 정하는 바에 의하여 특허를 받을 수 있는 권리를 갖고(특허법 제33조 제1항 본문), 특허를 받을 수 있는 권리는 이전할 수 있으므로(특허법 제37조 제1항), 후출원의 출원인이 후출원 시에 ‘특허를 받을 수 있는 권리’를 승계하였다면 우선권 주장을 할 수 있고, 후출원 시에 선출원에 대하여 특허출원인변경신고를 마쳐야만 하는 것은 아니다. 특허출원 후 특허를 받을 수 있는 권리의 승계는 상속 기타 일반승계의 경우를 제외하고는 특허출원인 변경신고를 하지 아니하면 그 효력이 발생하지 아니한다고 규정한 특허법 제38조 제4항은 특허에 관한 절차에서 참여자와 특허를 등록받을 자를 쉽게 확정함으로써 출원심사의 편의성 및 신속성을 추구하고자 하는 규정으로 우선권주장에 관한 절차에 적용된다고 볼 수 없다. 따라서 후출원의 출원인이 선출원의 출원인과 다르더라도 특허를 받을 수 있는 권리를 승계받았다면 우선권 주장을 할 수 있다고 보아야 한다."}]},{"section":"출원제도 - 우선권주장 제도","question":"국내우선권주장의 실체적 효력범위 대법원 2015. 1. 15. 선고 2012후2999 판결 특허법 제55조 제1항에 따른 우선권 주장을 수반하는 특허출원된 발명 중 같은 조 제3항에 따라 특허요건 적용의 기준일이 우선권 주장일로 소급하는 발명의 범위 / ‘우선권 주장의 기초가 된 선출원의 최초 명세서 또는 도면에 기재된 사항’의 의미","answer":"보정의 경우와 같은 관점에서, 우선권 주장일에 특허출원된 것으로 보아 특허요건을 심사하는 발명의 범위를 제한할 필요가 있다. 따라서 특허법 제55조 제3항에 따라 특허요건 적용의 기준일이 우선권 주장일로 소급하 는 발명은 특허법 제47조 제2항과 마찬가지로 우선권 주장을 수반하는 특허출원된 발명 가운데 우선권 주장 의 기초가 된 선출원의 최초 명세서 등에 기재된 사항의 범위 안에 있는 것으로 한정된다고 봄이 타당하다. 그리고 여기서 ‘우선권 주장의 기초가 된 선출원의 최초 명세서 등에 기재된 사항’이란, 우선권 주장의 기초 가 된 선출원의 최초 명세서 등에 명시적으로 기재되어 있는 사항이거나 또는 명시적인 기재가 없더라도 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)이라면 우선권 주장일 당 시의 기술상식에 비추어 보아 우선권 주장을 수반하는 특허출원된 발명이 선출원의 최초 명세서 등에 기재되어 있는 것과 마찬가지라고 이해할 수 있는 사항이어야 한다.","slides":[{"label":"판시사항","text":"국내우선권주장의 실체적 효력범위 대법원 2015. 1. 15. 선고 2012후2999 판결 특허법 제55조 제1항에 따른 우선권 주장을 수반하는 특허출원된 발명 중 같은 조 제3항에 따라 특허요건 적용의 기준일이 우선권 주장일로 소급하는 발명의 범위 / ‘우선권 주장의 기초가 된 선출원의 최초 명세서 또는 도면에 기재된 사항’의 의미"},{"label":"판결요지","text":"보정의 경우와 같은 관점에서, 우선권 주장일에 특허출원된 것으로 보아 특허요건을 심사하는 발명의 범위를 제한할 필요가 있다. 따라서 특허법 제55조 제3항에 따라 특허요건 적용의 기준일이 우선권 주장일로 소급하 는 발명은 특허법 제47조 제2항과 마찬가지로 우선권 주장을 수반하는 특허출원된 발명 가운데 우선권 주장 의 기초가 된 선출원의 최초 명세서 등에 기재된 사항의 범위 안에 있는 것으로 한정된다고 봄이 타당하다. 그리고 여기서 ‘우선권 주장의 기초가 된 선출원의 최초 명세서 등에 기재된 사항’이란, 우선권 주장의 기초 가 된 선출원의 최초 명세서 등에 명시적으로 기재되어 있는 사항이거나 또는 명시적인 기재가 없더라도 그 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한다)이라면 우선권 주장일 당 시의 기술상식에 비추어 보아 우선권 주장을 수반하는 특허출원된 발명이 선출원의 최초 명세서 등에 기재되어 있는 것과 마찬가지라고 이해할 수 있는 사항이어야 한다."}]},{"section":"출원제도 - 우선권주장 제도","question":"우선권주장불인정에 따른 거절이유통지 대법원 2011. 9. 8. 선고 2009후2371 판결 출원발명에 대하여 우선권주장의 불인정을 거절이유로 들어 특허거절결정을 하면서 우선권주장이 인정 되지 않는다는 취지 및 그 이유가 포함된 거절이유를 통지하지 않는 것이 위법한지 여부(적극) 및 거절이 유 통지에 우선권주장 불인정에 관한 이유가 포함되어 있었는지 판단하는 기준","answer":"출원발명에 대하여 우선권주장의 불인정으로 인하여 거절이유가 생긴 경우에는 우선권주장의 불인정은 거 절이유의 일부를 구성하는 것이므로, 우선권주장이 인정되지 아니한다는 취지 및 그 이유가 포함된 거절이 유를 통지하지 않은 채 우선권주장의 불인정으로 인하여 생긴 거절이유를 들어 특허거절결정을 하는 것은 위 법 제63조 본문에 위반되어 위법하다. 그리고 거절이유 통지에 위와 같은 우선권주장 불인정에 관한 이유가 포함되어 있었는지 여부는 출원인에게 실질적으로 의견서 제출 및 보정의 기회를 부여하였다고 볼 수 있을 정도로 그 취지와 이유가 명시되었는지 의 관점에서 판단되어야 한다.","slides":[{"label":"판시사항","text":"우선권주장불인정에 따른 거절이유통지 대법원 2011. 9. 8. 선고 2009후2371 판결 출원발명에 대하여 우선권주장의 불인정을 거절이유로 들어 특허거절결정을 하면서 우선권주장이 인정 되지 않는다는 취지 및 그 이유가 포함된 거절이유를 통지하지 않는 것이 위법한지 여부(적극) 및 거절이 유 통지에 우선권주장 불인정에 관한 이유가 포함되어 있었는지 판단하는 기준"},{"label":"판결요지","text":"출원발명에 대하여 우선권주장의 불인정으로 인하여 거절이유가 생긴 경우에는 우선권주장의 불인정은 거 절이유의 일부를 구성하는 것이므로, 우선권주장이 인정되지 아니한다는 취지 및 그 이유가 포함된 거절이 유를 통지하지 않은 채 우선권주장의 불인정으로 인하여 생긴 거절이유를 들어 특허거절결정을 하는 것은 위 법 제63조 본문에 위반되어 위법하다. 그리고 거절이유 통지에 위와 같은 우선권주장 불인정에 관한 이유가 포함되어 있었는지 여부는 출원인에게 실질적으로 의견서 제출 및 보정의 기회를 부여하였다고 볼 수 있을 정도로 그 취지와 이유가 명시되었는지 의 관점에서 판단되어야 한다."}]},{"section":"특허권 - 특허권 이전","question":"원인없는 특허권 등의 이전등록 대법원 2024. 11. 14. 선고 2023도11044 판결 판시 [1] 상표권이 양수인에게 이전되기 위한 요건 / 상표권자 이외의 제3자가 정당한 권원 없이 상표권의 효 사항 력범위에 속하는 행위를 한 경우, 이는 상표권의 침해행위에 해당하는지 여부(적극) 1) 상표권이 양수인에게 이전되기 위해서는 상표권자와 양수인 사이에 상표권을 이전할 것을 목적으로 하는 합의와 상표법 제96조 제1항 제1호에 따른 등록이 있어야 한다. 한편 상표법 제230조는 상표권 또 는 전용사용권의 침해행위를 한 자를 처벌하도록 규정하고 있는바, 상표권자 이외의 제3자는 정당한 권원 없이 상표권의 효력범위에 속하는 행위를 해서는 안 되고, 이를 위반하는 행위는 상표권의 침해 행위에 해당한다.","answer":"... 3) 이러한 사실관계를 앞서 본 법리에 비추어 살펴본다. 양도를 원인으로 한 이 사건 등록상표권의 이전 등록이 2018. 1. 25. 피고인 앞으로 마쳐졌으나 피해 회사와 피고인 사이에 이 사건 등록상표권을 이전할 것 을 목적으로 하는 합의가 없었으므로 피고인이 피해 회사로부터 위 상표권을 적법하게 이전받았다고 할 수 없 다. 따라서 피고인은 이 사건 등록상표의 상표권자가 아니므로, 피고인이 이 사건 등록상표를 지정상품인 게 스트하우스 서비스제공업 등에 사용한 것은 정당한 권원 없이 이 사건 등록상표권의 효력범위에 속하는 행 위를 한 것으로서 이 사건 등록상표권의 침해행위에 해당한다.","slides":[{"label":"판시사항","text":"원인없는 특허권 등의 이전등록 대법원 2024. 11. 14. 선고 2023도11044 판결 판시"},{"label":"판시사항","text":"[1] 상표권이 양수인에게 이전되기 위한 요건 / 상표권자 이외의 제3자가 정당한 권원 없이 상표권의 효 사항 력범위에 속하는 행위를 한 경우, 이는 상표권의 침해행위에 해당하는지 여부(적극) 1) 상표권이 양수인에게 이전되기 위해서는 상표권자와 양수인 사이에 상표권을 이전할 것을 목적으로 하는 합의와 상표법 제96조 제1항 제1호에 따른 등록이 있어야 한다. 한편 상표법 제230조는 상표권 또 는 전용사용권의 침해행위를 한 자를 처벌하도록 규정하고 있는바, 상표권자 이외의 제3자는 정당한 권원 없이 상표권의 효력범위에 속하는 행위를 해서는 안 되고, 이를 위반하는 행위는 상표권의 침해 행위에 해당한다."},{"label":"판결요지","text":"... 3) 이러한 사실관계를 앞서 본 법리에 비추어 살펴본다. 양도를 원인으로 한 이 사건 등록상표권의 이전 등록이 2018. 1. 25. 피고인 앞으로 마쳐졌으나 피해 회사와 피고인 사이에 이 사건 등록상표권을 이전할 것 을 목적으로 하는 합의가 없었으므로 피고인이 피해 회사로부터 위 상표권을 적법하게 이전받았다고 할 수 없 다. 따라서 피고인은 이 사건 등록상표의 상표권자가 아니므로, 피고인이 이 사건 등록상표를 지정상품인 게 스트하우스 서비스제공업 등에 사용한 것은 정당한 권원 없이 이 사건 등록상표권의 효력범위에 속하는 행 위를 한 것으로서 이 사건 등록상표권의 침해행위에 해당한다."}]},{"section":"특허권 - 등 (병합) 판결","question":"허가 등의 대상 의약품 대법원 2024. 7. 25. 선고 2021후11070 판결 [2] 구 특허법 시행령 제7조 제1호에서 정한 ‘약효를 나타내는 활성부분’의 의미 및 그 자체로는 활성을 가 판시 지지 않는 부분이 기존에 품목허가된 의약품의 ‘약효를 나타내는 활성부분’에 결합되어 의약품의 효능 효 사항 과의 정도에 영향을 미치는 경우, 그 결합물 전체를 위 시행령 조항에서 말하는 ‘약효를 나타내는 활성부 분’이라고 볼 수 있는지 여부(소극)","answer":"허가 등에 따른 특허권의 존속기간의 연장제도를 규정한 특허법 제89조 제1항과 이 사건 시행령 조항의 전 반적인 체계와 취지 목적, 이 사건 시행령 조항의 규정형식과 내용, 관련 약사법령 등을 종합하면, 이 사건 시행령 조항에서 ‘약효를 나타내는 활성부분’은 ‘의약품의 유효성분 중 활성을 가지면서 내재된 약리작용에 의하여 의약품 품목허가상의 효능 효과를 나타내는 부분’을 의미한다. 한편 그 자체로는 활성을 가지지 않는 부분이 기존에 품목허가된 의약품의 ‘약효를 나타내는 활성부분’에 결합되어 의약품의 효능 효과의 정도에 영향을 미치더라도 이는 의약품의 효능 효과로서의 ‘약효’를 나타내는 부분이 아니므로, 이러한 부분이 ‘약효 를 나타내는 활성부분’에 결합되어 있다는 사정만으로 그 결합물 전체를 이 사건 시행령 조항에서 말하는 ‘약 효를 나타내는 활성부분’이라고 볼 수는 없다. ... 5) 의약품 품목허가 등을 위하여 필요한 유효성 안전성 등의 시험으로 인하여 장기간이 소요되는 발명에 한 하여 이를 구제하도록 정하고 있는 특허권 존속기간 연장 제도의 취지 및 목적에 비추어 보아도, 기존에 품목 허가된 의약품의 공지된 활성부분이 발현하는 효능 효과의 정도에 영향을 미치기 위하여 그 자체로는 활성 을 가지지 않는 부분을 부가한 의약품 발명은 특허권 존속기간 연장 대상이 되는 발명이라고 보기 어렵다.","slides":[{"label":"판시사항","text":"허가 등의 대상 의약품 대법원 2024. 7. 25. 선고 2021후11070 판결"},{"label":"판시사항","text":"[2] 구 특허법 시행령 제7조 제1호에서 정한 ‘약효를 나타내는 활성부분’의 의미 및 그 자체로는 활성을 가 판시 지지 않는 부분이 기존에 품목허가된 의약품의 ‘약효를 나타내는 활성부분’에 결합되어 의약품의 효능 효 사항 과의 정도에 영향을 미치는 경우, 그 결합물 전체를 위 시행령 조항에서 말하는 ‘약효를 나타내는 활성부 분’이라고 볼 수 있는지 여부(소극)"},{"label":"판결요지","text":"허가 등에 따른 특허권의 존속기간의 연장제도를 규정한 특허법 제89조 제1항과 이 사건 시행령 조항의 전 반적인 체계와 취지 목적, 이 사건 시행령 조항의 규정형식과 내용, 관련 약사법령 등을 종합하면, 이 사건 시행령 조항에서 ‘약효를 나타내는 활성부분’은 ‘의약품의 유효성분 중 활성을 가지면서 내재된 약리작용에 의하여 의약품 품목허가상의 효능 효과를 나타내는 부분’을 의미한다. 한편 그 자체로는 활성을 가지지 않는 부분이 기존에 품목허가된 의약품의 ‘약효를 나타내는 활성부분’에 결합되어 의약품의 효능 효과의 정도에 영향을 미치더라도 이는 의약품의 효능 효과로서의 ‘약효’를 나타내는 부분이 아니므로, 이러한 부분이 ‘약효 를 나타내는 활성부분’에 결합되어 있다는 사정만으로 그 결합물 전체를 이 사건 시행령 조항에서 말하는 ‘약 효를 나타내는 활성부분’이라고 볼 수는 없다. ... 5) 의약품 품목허가 등을 위하여 필요한 유효성 안전성 등의 시험으로 인하여 장기간이 소요되는 발명에 한 하여 이를 구제하도록 정하고 있는 특허권 존속기간 연장 제도의 취지 및 목적에 비추어 보아도, 기존에 품목 허가된 의약품의 공지된 활성부분이 발현하는 효능 효과의 정도에 영향을 미치기 위하여 그 자체로는 활성 을 가지지 않는 부분을 부가한 의약품 발명은 특허권 존속기간 연장 대상이 되는 발명이라고 보기 어렵다."}]},{"section":"특허권 - 등 (병합) 판결","question":"존속기간이 연장된 의약품 특허의 효력범위 대법원 2019. 1. 17. 선고 2017다245798 판결 존속기간이 연장된 의약품 특허권의 효력이 미치는 범위를 판단하는 기준 및 특허권자가 약사법에 따라 품목허가를 받은 의약품과 특허침해소송에서 상대방이 생산 등을 한 의약품이 약학적으로 허용 가능한 염 등에서 차이가 있으나 통상의 기술자가 쉽게 이를 선택할 수 있는 정도에 불과하고, 인체에 흡수되는 유효성분의 약리작용에 의해 나타나는 치료효과나 용도가 실질적으로 동일한 경우, 존속기간이 연장된 특허권의 효력이 상대방이 생산 등을 한 의약품에 미치는지 여부(적극)","answer":"존속기간이 연장된 의약품 특허권의 효력이 미치는 범위는 특허발명을 실시하기 위하여 약사법에 따라 품목 허가를 받은 의약품과 특정 질병에 대한 치료효과를 나타낼 것으로 기대되는 특정한 유효성분, 치료효과 및 용도가 동일한지 여부를 중심으로 판단해야 한다. 특허권자가 약사법에 따라 품목허가를 받은 의약품과 특허침해소송에서 상대방이 생산 등을 한 의약품(이하 ‘침해제품’이라 한다)이 약학적으로 허용 가능한 염 등에서 차이가 있더라도 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한 다)이라면 쉽게 이를 선택할 수 있는 정도에 불과하고, 인체에 흡수되는 유효성분의 약리작용에 의해 나타나 는 치료효과나 용도가 실질적으로 동일하다면 존속기간이 연장된 특허권의 효력이 침해제품에 미치는 것으 로 보아야 한다. 2 실시권 제도","slides":[{"label":"판시사항","text":"존속기간이 연장된 의약품 특허의 효력범위 대법원 2019. 1. 17. 선고 2017다245798 판결 존속기간이 연장된 의약품 특허권의 효력이 미치는 범위를 판단하는 기준 및 특허권자가 약사법에 따라 품목허가를 받은 의약품과 특허침해소송에서 상대방이 생산 등을 한 의약품이 약학적으로 허용 가능한 염 등에서 차이가 있으나 통상의 기술자가 쉽게 이를 선택할 수 있는 정도에 불과하고, 인체에 흡수되는 유효성분의 약리작용에 의해 나타나는 치료효과나 용도가 실질적으로 동일한 경우, 존속기간이 연장된 특허권의 효력이 상대방이 생산 등을 한 의약품에 미치는지 여부(적극)"},{"label":"판결요지","text":"존속기간이 연장된 의약품 특허권의 효력이 미치는 범위는 특허발명을 실시하기 위하여 약사법에 따라 품목 허가를 받은 의약품과 특정 질병에 대한 치료효과를 나타낼 것으로 기대되는 특정한 유효성분, 치료효과 및 용도가 동일한지 여부를 중심으로 판단해야 한다. 특허권자가 약사법에 따라 품목허가를 받은 의약품과 특허침해소송에서 상대방이 생산 등을 한 의약품(이하 ‘침해제품’이라 한다)이 약학적으로 허용 가능한 염 등에서 차이가 있더라도 발명이 속하는 기술분야에서 통상의 지식을 가진 사람(이하 ‘통상의 기술자’라 한 다)이라면 쉽게 이를 선택할 수 있는 정도에 불과하고, 인체에 흡수되는 유효성분의 약리작용에 의해 나타나 는 치료효과나 용도가 실질적으로 동일하다면 존속기간이 연장된 특허권의 효력이 침해제품에 미치는 것으 로 보아야 한다. 2 실시권 제도"}]},{"section":"특허권 - 실시권 제도","question":"전용실시권의 실시범위 제한을 등록하지 않은 경우 대법원 2013. 1. 24. 선고 2011도4645 판결 판시 전용실시권 설정계약상 제한을 등록하지 않은 경우, 그 제한을 위반하여 특허발명을 실시한 전용실시권 사항 자에게 특허법 위반죄가 성립하는지 여부(소극)","answer":"설정계약으로 전용실시권의 범위에 관하여 특별한 제한을 두고도 이를 등록하지 않으면 그 효력이 발생하지 않는 것이므로, 전용실시권자가 등록되어 있지 않은 제한을 넘어 특허발명을 실시하더라도, 특허권자에 대 하여 채무불이행 책임을 지게 됨은 별론으로 하고 특허권 침해가 성립하는 것은 아니다.","slides":[{"label":"판시사항","text":"전용실시권의 실시범위 제한을 등록하지 않은 경우 대법원 2013. 1. 24. 선고 2011도4645 판결 판시 전용실시권 설정계약상 제한을 등록하지 않은 경우, 그 제한을 위반하여 특허발명을 실시한 전용실시권 사항 자에게 특허법 위반죄가 성립하는지 여부(소극)"},{"label":"판결요지","text":"설정계약으로 전용실시권의 범위에 관하여 특별한 제한을 두고도
